  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ll=\"#EDEFEC\" opacity=\"0.329352679\" x=\"0\" y=\"59.3779904\" width=\"47.0595238\" height=\"27.2440191\" rx=\"7\"><\u002Frect>\n                                            <rect id=\"Rectangle-47\" fill=\"#0F1211\" x=\"23.8809524\" y=\"67.7607656\" width=\"5.61904762\" height=\"11.8755981\" rx=\"2.8\"><\u002Frect>\n                                            <rect id=\"Rectangle-48\" fill=\"#0F1211\" transform=\"translate(50.929976, 77.989290) rotate(-75.000000) translate(-50.929976, -77.989290) \" x=\"33.3704525\" y=\"68.558668\" width=\"35.1190476\" height=\"18.861244\" rx=\"9.43062201\"><\u002Frect>\n                                            <rect id=\"Rectangle-48\" fill=\"#6FCB92\" transform=\"translate(55.654021, 78.402022) rotate(-75.000000) translate(-55.654021, -78.402022) \" x=\"38.0944967\" y=\"68.9714001\" width=\"35.1190476\" height=\"18.861244\" rx=\"9.43062201\"><\u002Frect>\n                                            <rect id=\"Rectangle-46\" fill=\"#EDEFEC\" opacity=\"0.329352679\" x=\"58\" y=\"59\" width=\"47.0595238\" height=\"27.2440191\" rx=\"7\"><\u002Frect>\n                                            <rect id=\"Rectangle-47\" fill=\"#0F1211\" x=\"81\" y=\"68\" width=\"5.61904762\" height=\"11.8755981\" rx=\"2.8\"><\u002Frect>\n                                            <path d=\"M50.2393595,110.143165 C50.2393595,117.322867 56.0596578,123.143165 63.2393595,123.143165 C70.4190613,123.143165 76.2393595,117.322867 76.2393595,110.143165\" id=\"Oval-26\" stroke=\"#0F1211\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(63.239360, 116.643165) rotate(-15.000000) translate(-63.239360, -116.643165) \"><\u002Fpath>\n                                        <\u002Fg><\u002Fsvg>Alejandro Velázquez<\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:22px;font-size:15px;\">\n      <a href=\"index.html#work\" style=\"color:#A2ACA5;text-decoration:none;\">Work<\u002Fa>\n      <a href=\"about.html\" style=\"color:#A2ACA5;text-decoration:none;\">About<\u002Fa>\n      <a href=\"cv/cv.pdf\" style=\"color:#A2ACA5;text-decoration:none;\">CV<\u002Fa>\n      <a href=\"https://api.whatsapp.com/send/?phone=447950452927&amp;text&amp;type=phone_number&amp;app_absent=0\" style=\"color:#A2ACA5;text-decoration:none;\">WhatsApp<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\" class=\"wrap\" style=\"max-width:1160px;margin:0 auto;padding:0 32px;\">\n\n  <section style=\"max-width:700px;padding:110px 0 72px 0;\">\n    <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:14px;letter-spacing:.1em;color:#6FCB92;margin-bottom:20px;\">03 — CASE STUDY<\u002Fdiv>\n    <h1 style=\"font-size:clamp(38px,7.5vw,60px);font-weight:600;letter-spacing:-0.02em;line-height:1.05;margin:0 0 32px 0;\">Design systems at Yapily<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.6;color:#EDEFEC;margin:0;text-wrap:pretty;\">Custard, Mark and Yapily UI — three design systems on one shared token layer, and the governance model that decided what got into them. I designed the first versions of the systems and built the governance jointly with the frontend lead.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Three systems, one token layer<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">We ran three design systems instead of one, and that was deliberate. A single system would have forced three very different surfaces into one set of compromises, and whichever surface was least like the others would have come off worst.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">Three separate Figma libraries sat on top of a shared token library. Tokens were maintained as Figma variables and mirrored in code, with the component library documented in Storybook. Same primitives, different components — and that split is what made three systems cheaper than one compromised system, rather than three times the work.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding-top:48px;\">\n    <div class=\"cols\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;\">\n      <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:24px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 12px 0;\">Custard — hosted pages<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">White-label, and minimal by design. Customers themed it themselves — logo, typeface, and brand colours applied mainly to buttons and links, with a choice of light, dark or system-matched appearance. Everything else stayed locked. When customers control the surface, the system's job is to expose as little as possible while still reading as their product.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:24px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 12px 0;\">Mark — website<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Restyled annually with distinctive, playful work — larger heading spacing, more expressive layout. Coupling it to the product systems would have meant every marketing refresh rippling into production tooling. Separated, it moved at its own pace.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:24px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 12px 0;\">Yapily UI — tools<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Dense by nature — analytics and data-heavy pages where vertical rhythm is tight and information density is the point. Its atoms and molecules were built for that.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <figure style=\"margin:56px 0 0 0;\">\n    <div style=\"border:1px solid rgba(237,239,236,.09);border-radius:12px;padding:40px 32px;display:flex;justify-content:center;\">\n      <svg font-family=\"Geist, -apple-system, BlinkMacSystemFont, sans-serif\" xmlns=\"http://www.w3.org/2000/svg\" width=\"680\" height=\"320\" sc-camel-view-box=\"0 0 680 320\" role=\"img\" style=\"width:100%;max-width:680px;height:auto;display:block;\">\n        <title>Three design systems on a shared token layer<\u002Ftitle>\n        <desc>A shared token layer held as Figma variables and mirrored in code feeds three separate design systems: hosted white-label pages, the website, and internal tools. Changes to shared tokens required approval from both the frontend lead and the design lead. Each system owns its own atoms, molecules and templates.<\u002Fdesc>\n        <defs>\n          <marker id=\"arrowA\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#79837C\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n        <g>\n          <rect x=\"40\" y=\"40\" width=\"600\" height=\"76\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(237,239,236,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"340\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"central\">Shared token layer<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"340\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Figma variables, mirrored in code<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"340\" y=\"104\" text-anchor=\"middle\" dominant-baseline=\"central\">Changes gated by both leads<\u002Ftext>\n        <\u002Fg>\n        <line x1=\"125\" y1=\"122\" x2=\"125\" y2=\"149\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowA)\"><\u002Fline>\n        <line x1=\"340\" y1=\"122\" x2=\"340\" y2=\"149\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowA)\"><\u002Fline>\n        <line x1=\"555\" y1=\"122\" x2=\"555\" y2=\"149\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowA)\"><\u002Fline>\n        <g>\n          <rect x=\"40\" y=\"155\" width=\"170\" height=\"110\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(111, 203, 146,.10)\" stroke=\"rgba(111, 203, 146,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"125\" y=\"179\" text-anchor=\"middle\" dominant-baseline=\"central\">Custard<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"125\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\">Hosted pages, white-label<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"125\" y=\"225\" text-anchor=\"middle\" dominant-baseline=\"central\">Logo, font, colours<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"125\" y=\"245\" text-anchor=\"middle\" dominant-baseline=\"central\">Light/dark/system<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"255\" y=\"155\" width=\"170\" height=\"110\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(111, 203, 146,.10)\" stroke=\"rgba(111, 203, 146,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"340\" y=\"179\" text-anchor=\"middle\" dominant-baseline=\"central\">Mark<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"340\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\">Website, expressive<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"340\" y=\"225\" text-anchor=\"middle\" dominant-baseline=\"central\">Annual restyle<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"340\" y=\"245\" text-anchor=\"middle\" dominant-baseline=\"central\">Light only<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"470\" y=\"155\" width=\"170\" height=\"110\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(111, 203, 146,.10)\" stroke=\"rgba(111, 203, 146,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"555\" y=\"179\" text-anchor=\"middle\" dominant-baseline=\"central\">Yapily UI<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"555\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\">Tools, data-heavy<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"555\" y=\"225\" text-anchor=\"middle\" dominant-baseline=\"central\">Analytics surfaces<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"555\" y=\"245\" text-anchor=\"middle\" dominant-baseline=\"central\">Dark mode<\u002Ftext>\n        <\u002Fg>\n        <text font-size=\"12.5\" fill=\"#79837C\" x=\"340\" y=\"293\" text-anchor=\"middle\">Separate Figma libraries — each owns its atoms, molecules and templates<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <figcaption style=\"max-width:700px;font-size:14px;line-height:1.55;color:#79837C;margin-top:16px;\">Shared tokens were governed more tightly than components, and correctly so: a shared-token change lands on all three systems at once. Those changes required approval from both the frontend lead and the design lead, and in practice happened rarely — effectively only during rebrand work.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <section style=\"max-width:700px;padding-top:96px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Three tiers, and a rule about deleting<\u002Fh2>\n    <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The token layer is structured rather than flat, which is what let three systems share it without any of them inheriting decisions they didn’t want.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.65;margin-bottom:24px;\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:baseline;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:13px;letter-spacing:.1em;color:#79837C;\">01<\u002Fdiv>\n        <div><span style=\"color:#EDEFEC;\">Primitives<\u002Fspan> <span style=\"color:#A2ACA5;\">— the raw values. Sixteen colours, one type scale, one spacing base. Nothing in this tier knows what it is for.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:baseline;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:13px;letter-spacing:.1em;color:#79837C;\">02<\u002Fdiv>\n        <div><span style=\"color:#EDEFEC;\">Semantic aliases<\u002Fspan> <span style=\"color:#A2ACA5;\">— what a primitive means in context: surface, border, text-muted, action, destructive. This is the tier components reference.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:baseline;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:13px;letter-spacing:.1em;color:#79837C;\">03<\u002Fdiv>\n        <div><span style=\"color:#EDEFEC;\">System-specific<\u002Fspan> <span style=\"color:#A2ACA5;\">— the values only one system needs. Custard’s themable brand slots, Mark’s gradients, Yapily UI’s dense-data greys.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">The governing rule was about removal, not addition: a token that resolves to the same value as an existing one gets deleted, not aliased. Two names for one value is how a system ends up with forty-six hard-coded colours, which is where we started. The consolidation took that to sixteen primitives and eleven semantic aliases.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding-top:80px;\">\n    <div style=\"max-width:700px;margin:0 0 40px 0;\">\n      <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">What we deliberately didn’t share<\u002Fh2>\n      <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">The exclusions did more work than the inclusions. Each of these was proposed as a shared token at some point and rejected for a reason specific to who uses the surface and for how long.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"cols\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;\">\n      <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:20px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 10px 0;\">Mark’s lime<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Right on a marketing page someone looks at for ninety seconds. Wrong in a tool an operations person has open for six hours — at that duration a saturated accent stops being energetic and starts being fatiguing.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:20px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 10px 0;\">Yapily UI’s eight greys<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Dense data needs eight steps to separate row, header, hover, selected, disabled and three borders. Marketing needs three. Pushing eight onto Mark would have handed it a precision it has no use for.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:20px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 10px 0;\">Mark’s gradients<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Expressive headings and gradient fills belong on a site that gets restyled annually. Letting them into the shared tier would have made flat console surfaces a matter of restraint rather than a matter of what exists.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:80px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Custard shares components and inherits no brand<\u002Fh2>\n    <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">Custard is the odd one out, and the architectural claim of the whole system. It takes atoms, molecules and layout from the shared library, and takes no brand values at all — every brand slot is empty until a customer fills it. Yapily’s own colours are a preset in that layer, not a default underneath it.<\u002Fp>\n    <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">Which is why the Hosted Pages configurator works. A customer sets four values and every screen in the flow re-themes, because there was never a Yapily colour buried in a component to override. Building it the other way — a branded system with customer overrides layered on — is how white-label products end up with a logo that changes and a button that doesn’t.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:80px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Accessibility encoded in the tokens<\u002Fh2>\n    <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">Status colours are defined as pairs, not single values. Each status has a saturated accent for bars, icons and borders, and a darkened partner for text — because the accent that reads correctly as a 6px bar fails 4.5:1 as 13px type on its own tint. Naming them as a pair means a designer can’t pick the wrong one by reaching for the obvious value.<\u002Fp>\n    <p style=\"max-width:700px;font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">Dark mode works the same way. Deep teal is the primary action colour in light mode and fails on black, so mint is the dark-mode primary — declared in the token layer rather than left as a judgement call per component. Both decisions move accessibility from something checked at the end to something you have to work to get wrong.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding-top:96px;\">\n    <div style=\"max-width:700px;margin:0 0 40px 0;\">\n      <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Inside Yapily UI<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">A working reference for all three systems — palettes, semantic tokens, type, spacing, elevation and components.<\u002Fp>\n    <\u002Fdiv>\n    <figure style=\"margin:0;\">\n      <a href=\"embeds/design-system-reference.html\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;border:1px solid rgba(237,239,236,.16);border-radius:12px;overflow:hidden;background:#fff;\">\n        <img src=\"7bd3eaf4-c5e2-4a99-8c4a-08f8ea528643\" alt=\"The design system reference — the Button section, with live variants and their token specs\" loading=\"lazy\" style=\"display:block;width:100%;height:auto;\">\n      <\u002Fa>\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:20px;\">\n        <p style=\"max-width:560px;font-size:14px;line-height:1.55;color:#79837C;margin:0;text-wrap:pretty;\">A working reference for all three systems — Yapily UI, Custard and Mark — as live markup with their token specs. Switch between them in the header.<\u002Fp>\n        <a href=\"embeds/design-system-reference.html\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid #6FCB92;border-radius:2px;font-size:16px;color:#EDEFEC;text-decoration:none;\">Open the interactive reference <span style=\"color:#6FCB92;\">↗<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section style=\"padding-top:96px;\">\n    <div style=\"max-width:700px;margin:0 0 40px 0;\">\n      <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Mark in action<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">The marketing site is where the expressive tier earns its keep — the gradient headings, the lime accent and the wide type scale that were deliberately kept out of the shared layer.<\u002Fp>\n    <\u002Fdiv>\n    <figure style=\"margin:0;\">\n      <a href=\"embeds/yapily-homepage-mark.html\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;border:1px solid rgba(237,239,236,.16);border-radius:12px;overflow:hidden;background:#002323;\">\n        <img src=\"ac7279ab-57c6-4b5f-b59e-d8ae37677065\" alt=\"The yapily.com homepage rebuilt from Mark — dark teal ground, a gradient heading reading Open banking platform for frictionless finance, a lime primary button and a customer logo row\" loading=\"lazy\" style=\"display:block;width:100%;height:auto;\">\n      <\u002Fa>\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:20px;\">\n        <p style=\"max-width:560px;font-size:14px;line-height:1.55;color:#79837C;margin:0;text-wrap:pretty;\">The homepage rebuilt from Mark components rather than screenshotted — same tokens, same buttons and cards as the Mark tab in the reference.<\u002Fp>\n        <a href=\"embeds/yapily-homepage-mark.html\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid #6FCB92;border-radius:2px;font-size:16px;color:#EDEFEC;text-decoration:none;\">Open the homepage <span style=\"color:#6FCB92;\">↗<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:96px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Contribution and governance<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">The gate was evidence rather than seniority.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:820px;padding-top:36px;\">\n    <div style=\"display:flex;flex-direction:column;\">\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(237,239,236,.09);\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:15px;color:#79837C;padding-top:2px;\">01<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Proposal<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Anyone could propose a component; in practice proposals came from design and frontend. The proposer produced a simple mockup — enough to evaluate, not a finished spec.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(237,239,236,.09);\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:15px;color:#79837C;padding-top:2px;\">02<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Validation<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">The component was tested for usability and accessibility before it was eligible for review — a mix of guerrilla testing and external platforms: Maze for unmoderated usability, Testbirds for broader usability and accessibility coverage.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(237,239,236,.09);\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:15px;color:#79837C;padding-top:2px;\">03<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Documentation<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">The proposer wrote the component up with its use cases. Defining where a component <em>shouldn't<\u002Fem> be used mattered as much as where it should.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(237,239,236,.09);\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:15px;color:#79837C;padding-top:2px;\">04<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Review<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Ad-hoc meetings with the frontend team and other designers. Bringing frontend in at proposal stage rather than at handoff surfaced implementation cost while the design was still cheap to change.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(237,239,236,.09);\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:15px;color:#79837C;padding-top:2px;\">05<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Approval<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Two stages — design-side first approval, then a group decision with the frontend team.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(237,239,236,.09);border-bottom:1px solid rgba(237,239,236,.09);\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:15px;color:#79837C;padding-top:2px;\">06<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Adoption<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Approved components entered the shared library.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <figure style=\"margin:56px 0 0 0;\">\n    <div style=\"border:1px solid rgba(237,239,236,.09);border-radius:12px;padding:40px 32px;display:flex;justify-content:center;\">\n      <svg font-family=\"Geist, -apple-system, BlinkMacSystemFont, sans-serif\" xmlns=\"http://www.w3.org/2000/svg\" width=\"680\" height=\"300\" sc-camel-view-box=\"0 0 680 300\" role=\"img\" style=\"width:100%;max-width:680px;height:auto;display:block;\">\n        <title>Component contribution and governance flow<\u002Ftitle>\n        <desc>A seven-step flow: propose a mockup, validate through usability and accessibility testing, document use cases, review in an ad-hoc meeting with frontend and designers, design lead first approval, then a group decision with the frontend team, then publish to the component library.<\u002Fdesc>\n        <defs>\n          <marker id=\"arrowB\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#79837C\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n        <g>\n          <rect x=\"40\" y=\"50\" width=\"170\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(111, 203, 146,.10)\" stroke=\"rgba(111, 203, 146,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"125\" y=\"68\" text-anchor=\"middle\" dominant-baseline=\"central\">Propose<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"125\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Simple mockup<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"255\" y=\"50\" width=\"170\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(111, 203, 146,.10)\" stroke=\"rgba(111, 203, 146,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"340\" y=\"68\" text-anchor=\"middle\" dominant-baseline=\"central\">Validate<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"340\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Usability + a11y<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"470\" y=\"50\" width=\"170\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(111, 203, 146,.10)\" stroke=\"rgba(111, 203, 146,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"555\" y=\"68\" text-anchor=\"middle\" dominant-baseline=\"central\">Document<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"555\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Use cases defined<\u002Ftext>\n        <\u002Fg>\n        <line x1=\"216\" y1=\"78\" x2=\"249\" y2=\"78\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <line x1=\"431\" y1=\"78\" x2=\"464\" y2=\"78\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <path d=\"M555 112 L555 143 L104 143 L104 174\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fpath>\n        <g>\n          <rect x=\"39\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(237,239,236,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"104\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Review<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"104\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">Ad-hoc meeting<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"196\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(237,239,236,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"261\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Design gate<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"261\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">First approval<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"353\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(237,239,236,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"418\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Group gate<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"418\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">With FE team<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"510\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(237,239,236,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#EDEFEC\" x=\"575\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Publish<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#A2ACA5\" x=\"575\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">To the library<\u002Ftext>\n        <\u002Fg>\n        <line x1=\"175\" y1=\"208\" x2=\"190\" y2=\"208\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <line x1=\"332\" y1=\"208\" x2=\"347\" y2=\"208\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <line x1=\"489\" y1=\"208\" x2=\"504\" y2=\"208\" fill=\"none\" stroke=\"rgba(237,239,236,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <text font-size=\"12.5\" fill=\"#79837C\" x=\"40\" y=\"268\">Green: proposer's work — Grey: collective gate and outcome<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Ffigure>\n\n  <section style=\"padding-top:80px;\">\n    <div style=\"border:1px solid rgba(111, 203, 146,.35);padding:56px 48px;\">\n      <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 24px 0;\">Where validation sat<\u002Fh2>\n      <p style=\"max-width:700px;font-size:18px;line-height:1.65;color:#EDEFEC;margin:0;text-wrap:pretty;\">Validation sat <em>before<\u002Fem> review, not after. That single ordering decision changed what review meetings were about — teams debated evidence rather than taste, and the discussion moved faster because there was less to be subjective about.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:80px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Reach<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">Components from these systems were used across the marketing website and its landing pages, demo tools, internal tools, hosted pages, and customer-facing tools.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:64px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Versioning and deprecation<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">We never formalised versioning or deprecation. What I'd put in place now: semantic versioning, so someone has to consciously decide whether a change is breaking; deprecate rather than delete, with the replacement and migration path named; a changelog written for humans; Figma and code versioned in step so designers can tell what's actually in production; and release notes pushed to Slack rather than a wiki nobody opens.<\u002Fp>\n  <\u002Fsection>\n\n  <footer style=\"max-width:700px;padding:120px 0 96px 0;\">\n    <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:36px;display:flex;gap:18px;flex-wrap:wrap;font-size:16px;\">\n      <a href=\"index.html\">← Back to work<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"mailto:aleuxuk@gmail.com\">aleuxuk@gmail.com<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"https://www.linkedin.com/in/velazquezalejandro/\">LinkedIn<\u002Fa>\n    <\u002Fdiv>\n
