<p>03 — CASE STUDY</p>
<h1>Design systems at Yapily</h1>
<p>Custard, Mark and Yapily UI — three design systems on one shared token layer, and the governance model that decided what got into them. I designed the first versions of the systems and built the governance jointly with the frontend lead.</p>
<h2>Three systems, one token layer</h2>
<p>We ran three design systems instead of one, and that was deliberate. A single system would have forced three very different surfaces into one set of compromises, and whichever surface was least like the others would have come off worst.</p>
<p>Three separate Figma libraries sat on top of a shared token library. Tokens were maintained as Figma variables and mirrored in code, with the component library documented in Storybook. Same primitives, different components — and that split is what made three systems cheaper than one compromised system, rather than three times the work.</p>
<h3>Custard — hosted pages</h3>
<p>White-label, and minimal by design. Customers themed it themselves — logo, typeface, and brand colours applied mainly to buttons and links, with a choice of light, dark or system-matched appearance. Everything else stayed locked. When customers control the surface, the system's job is to expose as little as possible while still reading as their product.</p>
<h3>Mark — website</h3>
<p>Restyled annually with distinctive, playful work — larger heading spacing, more expressive layout. Coupling it to the product systems would have meant every marketing refresh rippling into production tooling. Separated, it moved at its own pace.</p>
<h3>Yapily UI — tools</h3>
<p>Dense by nature — analytics and data-heavy pages where vertical rhythm is tight and information density is the point. Its atoms and molecules were built for that.</p>
<p>Three design systems on a shared token layer</p>
<p>A shared token layer held as Figma variables and mirrored in code feeds three separate design systems: hosted white-label pages, the website, and internal tools. Changes to shared tokens required approval from both the frontend lead and the design lead. Each system owns its own atoms, molecules and templates.</p>

<p>Separate Figma libraries — each owns its atoms, molecules and templates</p>
<p>Shared tokens were governed more tightly than components, and correctly so: a shared-token change lands on all three systems at once. Those changes required approval from both the frontend lead and the design lead, and in practice happened rarely — effectively only during rebrand work.</p>

<h2>Contribution and governance</h2>
<p>The gate was evidence rather than seniority.</p>
<p>01</p>
<h3>Proposal</h3>
<p>Anyone could propose a component; in practice proposals came from design and frontend. The proposer produced a simple mockup — enough to evaluate, not a finished spec.</p>
<p>02</p>
<h3>Validation</h3>
<p>The component was tested for usability and accessibility before it was eligible for review — a mix of guerrilla testing and external platforms: Maze for unmoderated usability, Testbirds for broader usability and accessibility coverage.</p>
<p>03</p>
<h3>Documentation</h3>
<p>The proposer wrote the component up with its use cases. Defining where a component</p>
<p>shouldn't</p>
<p>be used mattered as much as where it should.</p>
<p>04</p>
<h3>Review</h3>
<p>Ad-hoc meetings with the frontend team and other designers. Bringing frontend in at proposal stage rather than at handoff surfaced implementation cost while the design was still cheap to change.</p>
<p>05</p>
<h3>Approval</h3>
<p>Two stages — design-side first approval, then a group decision with the frontend team.</p>
<p>06</p>
<h3>Adoption</h3>
<p>Approved components entered the shared library.</p>
<p>Component contribution and governance flow</p>
<p>A seven-step flow: propose a mockup, validate through usability and accessibility testing, document use cases, review in an ad-hoc meeting with frontend and designers, design lead first approval, then a group decision with the frontend team, then publish to the component library.</p>
<p>Propose</p>
<p>Simple mockup</p>
<p>Validate</p>
<p>Usability + a11y</p>
<p>Document</p>
<p>Use cases defined</p>
<p>Review</p>
<p>Ad-hoc meeting</p>
<p>Design gate</p>
<p>First approval</p>
<p>Group gate</p>
<p>With FE team</p>
<p>Publish</p>
<p>To the library</p>
<p>Gold: proposer's work — Grey: collective gate and outcome</p>
<h2>Where validation sat</h2>
<p>Validation sat</p>
<p>before</p>
<p>review, not after. That single ordering decision changed what review meetings were about — teams debated evidence rather than taste, and the discussion moved faster because there was less to be subjective about.</p>
<h2>Reach</h2>
<p>Components from these systems were used across the marketing website and its landing pages, demo tools, internal tools, hosted pages, and customer-facing tools.</p>
<h2>Versioning and deprecation</h2>
<p>We never formalised versioning or deprecation. What I'd put in place now: semantic versioning, so someone has to consciously decide whether a change is breaking; deprecate rather than delete, with the replacement and migration path named; a changelog written for humans; Figma and code versioned in step so designers can tell what's actually in production; and release notes pushed to Slack rather than a wiki nobody opens.</p>

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an

    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // replies.

    // computed from the URL and stays 'https://…' even when the document

        UUID_SHAPE.test(d.__bundler_page) &&

style=\"color:#AAB3AF;text-decoration:none;\">Contact<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\" class=\"wrap\" style=\"max-width:1160px;margin:0 auto;padding:0 32px;\">\n\n  <section style=\"max-width:700px;padding:110px 0 72px 0;\">\n    <div style=\"font-family:'Geist Mono',monospace;font-size:14px;letter-spacing:.1em;color:#C9A86A;margin-bottom:20px;\">03 — CASE STUDY<\u002Fdiv>\n    <h1 style=\"font-size:clamp(38px,7.5vw,60px);font-weight:500;letter-spacing:-0.035em;line-height:1.05;margin:0 0 32px 0;\">Design systems at Yapily<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.6;color:#F4F6F5;margin:0;text-wrap:pretty;\">Custard, Mark and Yapily UI — three design systems on one shared token layer, and the governance model that decided what got into them. I designed the first versions of the systems and built the governance jointly with the frontend lead.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:500;letter-spacing:-0.025em;margin:0 0 20px 0;\">Three systems, one token layer<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#AAB3AF;margin:0 0 18px 0;text-wrap:pretty;\">We ran three design systems instead of one, and that was deliberate. A single system would have forced three very different surfaces into one set of compromises, and whichever surface was least like the others would have come off worst.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#AAB3AF;margin:0;text-wrap:pretty;\">Three separate Figma libraries sat on top of a shared token library. Tokens were maintained as Figma variables and mirrored in code, with the component library documented in Storybook. Same primitives, different components — and that split is what made three systems cheaper than one compromised system, rather than three times the work.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"padding-top:48px;\">\n    <div class=\"cols\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;\">\n      <div style=\"border-top:1px solid rgba(244,246,245,.14);padding-top:24px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 12px 0;\">Custard — hosted pages<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">White-label, and minimal by design. Customers themed it themselves — logo, typeface, and brand colours applied mainly to buttons and links, with a choice of light, dark or system-matched appearance. Everything else stayed locked. When customers control the surface, the system's job is to expose as little as possible while still reading as their product.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(244,246,245,.14);padding-top:24px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 12px 0;\">Mark — website<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">Restyled annually with distinctive, playful work — larger heading spacing, more expressive layout. Coupling it to the product systems would have meant every marketing refresh rippling into production tooling. Separated, it moved at its own pace.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(244,246,245,.14);padding-top:24px;\">\n        <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 12px 0;\">Yapily UI — tools<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">Dense by nature — analytics and data-heavy pages where vertical rhythm is tight and information density is the point. Its atoms and molecules were built for that.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <figure style=\"margin:56px 0 0 0;\">\n    <div style=\"border:1px solid rgba(244,246,245,.09);border-radius:12px;padding:40px 32px;display:flex;justify-content:center;\">\n      <svg font-family=\"Geist, -apple-system, BlinkMacSystemFont, sans-serif\" xmlns=\"http://www.w3.org/2000/svg\" width=\"680\" height=\"320\" sc-camel-view-box=\"0 0 680 320\" role=\"img\" style=\"width:100%;max-width:680px;height:auto;display:block;\">\n        <title>Three design systems on a shared token layer<\u002Ftitle>\n        <desc>A shared token layer held as Figma variables and mirrored in code feeds three separate design systems: hosted white-label pages, the website, and internal tools. Changes to shared tokens required approval from both the frontend lead and the design lead. Each system owns its own atoms, molecules and templates.<\u002Fdesc>\n        <defs>\n          <marker id=\"arrowA\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#7d8683\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n        <g>\n          <rect x=\"40\" y=\"40\" width=\"600\" height=\"76\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(244,246,245,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"340\" y=\"64\" text-anchor=\"middle\" dominant-baseline=\"central\">Shared token layer<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"340\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Figma variables, mirrored in code<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"340\" y=\"104\" text-anchor=\"middle\" dominant-baseline=\"central\">Changes gated by both leads<\u002Ftext>\n        <\u002Fg>\n        <line x1=\"125\" y1=\"122\" x2=\"125\" y2=\"149\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowA)\"><\u002Fline>\n        <line x1=\"340\" y1=\"122\" x2=\"340\" y2=\"149\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowA)\"><\u002Fline>\n        <line x1=\"555\" y1=\"122\" x2=\"555\" y2=\"149\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowA)\"><\u002Fline>\n        <g>\n          <rect x=\"40\" y=\"155\" width=\"170\" height=\"110\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(201,168,106,.10)\" stroke=\"rgba(201,168,106,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"125\" y=\"179\" text-anchor=\"middle\" dominant-baseline=\"central\">Custard<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"125\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\">Hosted pages, white-label<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"125\" y=\"225\" text-anchor=\"middle\" dominant-baseline=\"central\">Logo, font, colours<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"125\" y=\"245\" text-anchor=\"middle\" dominant-baseline=\"central\">Light/dark/system<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"255\" y=\"155\" width=\"170\" height=\"110\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(201,168,106,.10)\" stroke=\"rgba(201,168,106,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"340\" y=\"179\" text-anchor=\"middle\" dominant-baseline=\"central\">Mark<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"340\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\">Website, expressive<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"340\" y=\"225\" text-anchor=\"middle\" dominant-baseline=\"central\">Annual restyle<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"340\" y=\"245\" text-anchor=\"middle\" dominant-baseline=\"central\">Light only<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"470\" y=\"155\" width=\"170\" height=\"110\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(201,168,106,.10)\" stroke=\"rgba(201,168,106,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"555\" y=\"179\" text-anchor=\"middle\" dominant-baseline=\"central\">Yapily UI<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"555\" y=\"205\" text-anchor=\"middle\" dominant-baseline=\"central\">Tools, data-heavy<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"555\" y=\"225\" text-anchor=\"middle\" dominant-baseline=\"central\">Analytics surfaces<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"555\" y=\"245\" text-anchor=\"middle\" dominant-baseline=\"central\">Dark mode<\u002Ftext>\n        <\u002Fg>\n        <text font-size=\"12.5\" fill=\"#7d8683\" x=\"340\" y=\"293\" text-anchor=\"middle\">Separate Figma libraries — each owns its atoms, molecules and templates<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <figcaption style=\"max-width:700px;font-size:14px;line-height:1.55;color:#7d8683;margin-top:16px;\">Shared tokens were governed more tightly than components, and correctly so: a shared-token change lands on all three systems at once. Those changes required approval from both the frontend lead and the design lead, and in practice happened rarely — effectively only during rebrand work.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <section style=\"padding-top:96px;\">\n    <div style=\"max-width:700px;margin:0 0 40px 0;\">\n      <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:500;letter-spacing:-0.025em;margin:0 0 20px 0;\">Inside Yapily UI<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.65;color:#AAB3AF;margin:0;text-wrap:pretty;\">Pages from the library documentation — tokens, anatomy, states and spacing. Every component was documented this way so a decision only had to be made once. Click any panel to open it full size.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;\">\n\n      <a href=\"images/yapily-ui-typography-tokens.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"e206697b-8be0-45a9-89b6-4c52e2b8f977\" alt=\"Typography documentation: Inter font family, root tokens table and text styles\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">TOKENS<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Typography — family, root tokens, and the full style scale<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-colour-palette.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"6b9b0a81-984c-4a46-bb6b-fa03424912b8\" alt=\"Colour documentation: brand dark green, text colours and neutral greys with hex values\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">TOKENS<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Colour — brand, text and neutral ramps with usage rules<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-logo-placement.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"f8ce4a38-b3a6-46f7-a177-541a9f3f3d18\" alt=\"Logo placement rules with minimum and maximum sizes across desktop and mobile\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">BRANDING<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Customer logo — size bounds and placement at both resolutions<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-bank-list-anatomy.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;padding:20px;box-sizing:border-box;\">\n          <img src=\"0ea13e99-396d-4f7d-a81c-159e8005e71d\" alt=\"Bank list row anatomy with numbered callouts for list, label and radio\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:contain;object-position:center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">ANATOMY<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Bank list — parts, dependencies and what each one inherits<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-text-input-spec.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"37ed56c5-825a-4d86-851a-3b1f3410a80f\" alt=\"Text input documentation: guidance, Figma variants, anatomy and spacing\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">COMPONENT<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Text inputs — guidance, variants, anatomy and spacing<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-search-states.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"dfb020ca-88d4-4e35-aab4-372ad44059e4\" alt=\"Search component in default, pressed, focused, filled and disabled states\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">COMPONENT<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Search — five states across three widths<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-checkbox-radio-states.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"d26484cb-80b3-4d43-892b-7e6773a3ede1\" alt=\"Checkbox and radio component states with anatomy specifications\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">COMPONENT<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Checkboxes and radios — every state, with and without helper text<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-button-footer-variants.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"a8c4e73a-97c4-4356-a022-7c565aaadd6b\" alt=\"Button footer component matrix across mobile and desktop, AIS and PIS, UK and EU\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">COMPONENT<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Button footer — twelve variants of consent copy, device and region<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-notifications.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"c92b4741-a26a-44f7-9d17-f1f26be17dd8\" alt=\"Inline notification variants shown in context on a bank login screen\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">COMPONENT<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Notifications — inline errors, documented in context<\u002Fdiv>\n      <\u002Fa>\n\n      <a href=\"images/yapily-ui-toasts.webp\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-decoration:none;color:inherit;\">\n        <div style=\"background:#FFFFFF;border:1px solid rgba(244,246,245,.09);border-radius:10px;height:260px;overflow:hidden;\">\n          <img src=\"b7ef55ff-c85d-4901-9eea-a0822eb8aa82\" alt=\"Toast component: purpose, message guidance, placement rules and four variants\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;object-position:top center;display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.08em;color:#C9A86A;margin:14px 0 6px 0;\">COMPONENT<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.5;color:#AAB3AF;\">Toasts — success, information, warning and error, plus placement<\u002Fdiv>\n      <\u002Fa>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:96px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:500;letter-spacing:-0.025em;margin:0 0 20px 0;\">Contribution and governance<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#AAB3AF;margin:0;text-wrap:pretty;\">The gate was evidence rather than seniority.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:820px;padding-top:36px;\">\n    <div style=\"display:flex;flex-direction:column;\">\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(244,246,245,.09);\">\n        <div style=\"font-family:'Geist Mono',monospace;font-size:15px;color:#C9A86A;padding-top:2px;\">01<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Proposal<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">Anyone could propose a component; in practice proposals came from design and frontend. The proposer produced a simple mockup — enough to evaluate, not a finished spec.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(244,246,245,.09);\">\n        <div style=\"font-family:'Geist Mono',monospace;font-size:15px;color:#C9A86A;padding-top:2px;\">02<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Validation<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">The component was tested for usability and accessibility before it was eligible for review — a mix of guerrilla testing and external platforms: Maze for unmoderated usability, Testbirds for broader usability and accessibility coverage.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(244,246,245,.09);\">\n        <div style=\"font-family:'Geist Mono',monospace;font-size:15px;color:#C9A86A;padding-top:2px;\">03<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Documentation<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">The proposer wrote the component up with its use cases. Defining where a component <em>shouldn't<\u002Fem> be used mattered as much as where it should.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(244,246,245,.09);\">\n        <div style=\"font-family:'Geist Mono',monospace;font-size:15px;color:#C9A86A;padding-top:2px;\">04<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Review<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">Ad-hoc meetings with the frontend team and other designers. Bringing frontend in at proposal stage rather than at handoff surfaced implementation cost while the design was still cheap to change.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(244,246,245,.09);\">\n        <div style=\"font-family:'Geist Mono',monospace;font-size:15px;color:#C9A86A;padding-top:2px;\">05<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Approval<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">Two stages — design-side first approval, then a group decision with the frontend team.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding:24px 0;border-top:1px solid rgba(244,246,245,.09);border-bottom:1px solid rgba(244,246,245,.09);\">\n        <div style=\"font-family:'Geist Mono',monospace;font-size:15px;color:#C9A86A;padding-top:2px;\">06<\u002Fdiv>\n        <div>\n          <h3 style=\"font-size:19px;font-weight:500;letter-spacing:-0.02em;margin:0 0 8px 0;\">Adoption<\u002Fh3>\n          <p style=\"font-size:17px;line-height:1.6;color:#AAB3AF;margin:0;text-wrap:pretty;\">Approved components entered the shared library.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <figure style=\"margin:56px 0 0 0;\">\n    <div style=\"border:1px solid rgba(244,246,245,.09);border-radius:12px;padding:40px 32px;display:flex;justify-content:center;\">\n      <svg font-family=\"Geist, -apple-system, BlinkMacSystemFont, sans-serif\" xmlns=\"http://www.w3.org/2000/svg\" width=\"680\" height=\"300\" sc-camel-view-box=\"0 0 680 300\" role=\"img\" style=\"width:100%;max-width:680px;height:auto;display:block;\">\n        <title>Component contribution and governance flow<\u002Ftitle>\n        <desc>A seven-step flow: propose a mockup, validate through usability and accessibility testing, document use cases, review in an ad-hoc meeting with frontend and designers, design lead first approval, then a group decision with the frontend team, then publish to the component library.<\u002Fdesc>\n        <defs>\n          <marker id=\"arrowB\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\">\n            <path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"#7d8683\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n        <g>\n          <rect x=\"40\" y=\"50\" width=\"170\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(201,168,106,.10)\" stroke=\"rgba(201,168,106,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"125\" y=\"68\" text-anchor=\"middle\" dominant-baseline=\"central\">Propose<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"125\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Simple mockup<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"255\" y=\"50\" width=\"170\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(201,168,106,.10)\" stroke=\"rgba(201,168,106,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"340\" y=\"68\" text-anchor=\"middle\" dominant-baseline=\"central\">Validate<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"340\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Usability + a11y<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"470\" y=\"50\" width=\"170\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"rgba(201,168,106,.10)\" stroke=\"rgba(201,168,106,.5)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"555\" y=\"68\" text-anchor=\"middle\" dominant-baseline=\"central\">Document<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"555\" y=\"86\" text-anchor=\"middle\" dominant-baseline=\"central\">Use cases defined<\u002Ftext>\n        <\u002Fg>\n        <line x1=\"216\" y1=\"78\" x2=\"249\" y2=\"78\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <line x1=\"431\" y1=\"78\" x2=\"464\" y2=\"78\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <path d=\"M555 112 L555 143 L104 143 L104 174\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fpath>\n        <g>\n          <rect x=\"39\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(244,246,245,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"104\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Review<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"104\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">Ad-hoc meeting<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"196\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(244,246,245,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"261\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Design gate<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"261\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">First approval<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"353\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(244,246,245,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"418\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Group gate<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"418\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">With FE team<\u002Ftext>\n        <\u002Fg>\n        <g>\n          <rect x=\"510\" y=\"180\" width=\"130\" height=\"56\" rx=\"8\" stroke-width=\"1\" fill=\"none\" stroke=\"rgba(244,246,245,.2)\"><\u002Frect>\n          <text font-size=\"14\" font-weight=\"500\" fill=\"#F4F6F5\" x=\"575\" y=\"198\" text-anchor=\"middle\" dominant-baseline=\"central\">Publish<\u002Ftext>\n          <text font-size=\"12.5\" fill=\"#AAB3AF\" x=\"575\" y=\"216\" text-anchor=\"middle\" dominant-baseline=\"central\">To the library<\u002Ftext>\n        <\u002Fg>\n        <line x1=\"175\" y1=\"208\" x2=\"190\" y2=\"208\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <line x1=\"332\" y1=\"208\" x2=\"347\" y2=\"208\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <line x1=\"489\" y1=\"208\" x2=\"504\" y2=\"208\" fill=\"none\" stroke=\"rgba(244,246,245,.3)\" stroke-width=\"1.25\" marker-end=\"url(#arrowB)\"><\u002Fline>\n        <text font-size=\"12.5\" fill=\"#7d8683\" x=\"40\" y=\"268\">Gold: proposer's work — Grey: collective gate and outcome<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Ffigure>\n\n  <section style=\"padding-top:80px;\">\n    <div style=\"border:1px solid rgba(201,168,106,.35);padding:56px 48px;\">\n      <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:500;letter-spacing:-0.025em;margin:0 0 24px 0;\">Where validation sat<\u002Fh2>\n      <p style=\"max-width:700px;font-size:18px;line-height:1.65;color:#F4F6F5;margin:0;text-wrap:pretty;\">Validation sat <em>before<\u002Fem> review, not after. That single ordering decision changed what review meetings were about — teams debated evidence rather than taste, and the discussion moved faster because there was less to be subjective about.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:80px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:500;letter-spacing:-0.025em;margin:0 0 20px 0;\">Reach<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#AAB3AF;margin:0;text-wrap:pretty;\">Components from these systems were used across the marketing website and its landing pages, demo tools, internal tools, hosted pages, and customer-facing tools.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding-top:64px;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:500;letter-spacing:-0.025em;margin:0 0 20px 0;\">Versioning and deprecation<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#AAB3AF;margin:0;text-wrap:pretty;\">We never formalised versioning or deprecation. What I'd put in place now: semantic versioning, so someone has to consciously decide whether a change is breaking; deprecate rather than delete, with the replacement and migration path named; a changelog written for humans; Figma and code versioned in step so designers can tell what's actually in production; and release notes pushed to Slack rather than a wiki nobody opens.<\u002Fp>\n  <\u002Fsection>\n\n  <footer style=\"max-width:700px;padding:120px 0 96px 0;\">\n    <div style=\"border-top:1px solid rgba(244,246,245,.14);padding-top:36px;display:flex;gap:18px;flex-wrap:wrap;font-size:16px;\">\n      <a href=\"index.html\">← Back to work<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"mailto:aleuxuk@gmail.com\">aleuxuk@gmail.com<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"https://www.linkedin.com/in/velazquezalejandro/\">LinkedIn<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
