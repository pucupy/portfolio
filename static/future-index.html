<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0F1211">
<link rel="preload" href="fonts/schibsted-grotesk.ttf" as="font" type="font/ttf" crossorigin>
<style>@font-face{font-family:'Schibsted Grotesk';src:url('fonts/schibsted-grotesk.ttf') format('truetype-variations'),url('fonts/schibsted-grotesk.ttf') format('truetype');font-weight:400 700;font-style:normal;font-display:swap}</style>
<title>Thanks: Alejandro Velazquez</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<style>
  html { color-scheme: dark; }
  body { margin:0; background:#0F1211; color:#EDEFEC; font-family:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#EDEFEC; text-decoration:underline; text-decoration-color:rgba(111,203,146,.5); text-underline-offset:4px; text-decoration-thickness:1px; }
  a:hover { text-decoration-color:#6FCB92; }
  a:focus-visible { outline:2px solid #6FCB92; outline-offset:3px; border-radius:2px; }
  ::selection { background:#6FCB92; color:#0F1211; }
  @media (max-width:600px){ .wrap{ padding-left:20px !important; padding-right:20px !important; } }

  @keyframes eyel{0%,25%{transform:translate(0,0)}26%,50%,75%{transform:translate(0,-10px)}100%{transform:translate(0,0)}}
  @keyframes eyer{0%,25%{transform:translate(0,0)}26%,50%,75%{transform:translate(0,5px)}100%{transform:translate(0,0)}}
  @keyframes bob{0%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}100%{transform:translateY(0) rotate(-1.5deg)}}
  @keyframes steam{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
  #lefte{animation:eyel 5s ease infinite}
  #righte{animation:eyer 5s ease infinite}
  #head{animation:bob 6s ease-in-out infinite}
  #hot1,#hot2,#hot3{stroke-dasharray:14 10;stroke-opacity:.4;animation:steam 2.4s linear infinite}
  #hot2{animation-delay:-.8s}
  #hot3{animation-delay:-1.6s}
  @media (prefers-reduced-motion:reduce){#lefte,#righte,#head,#hot1,#hot2,#hot3{animation:none}#hot1,#hot2,#hot3{stroke-dasharray:none}}
</style>
</head>
<body>
<div aria-hidden="true" style="position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;justify-content:center;">
    <div style="width:100%;max-width:1224px;height:100%;border-left:1px solid rgba(237,239,236,.06);border-right:1px solid rgba(237,239,236,.06);"></div>
  </div>

    <div style="flex:1 1 380px;min-width:0;">
      <p style="font-size:14px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#6FCB92;margin:0 0 24px 0;">Not looking right now</p>
      <h1 style="font-size:clamp(38px,7vw,62px);font-weight:600;letter-spacing:-0.02em;line-height:1.05;margin:0 0 28px 0;text-wrap:pretty;">I already found a position, thanks</h1>
      <p style="font-size:18px;line-height:1.6;color:#A2ACA5;margin:0 0 20px 0;max-width:34em;text-wrap:pretty;">Thank you to everyone who read the work, replied, passed it on or took the time for a conversation. It mattered, and it worked.</p>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:36px;">
        <a href="mailto:aleuxuk@gmail.com" style="display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:16px;border:1px solid rgba(237,239,236,.22);color:#EDEFEC;font-size:16px;font-weight:500;text-decoration:none;" style-hover="border-color:rgba(111,203,146,.6)">aleuxuk@gmail.com</a>
        <button type="button" data-copy="aleuxuk@gmail.com" aria-label="Copy email address to clipboard" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:16px;border:1px solid rgba(237,239,236,.22);background:transparent;color:#A2ACA5;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:color .18s ease,border-color .18s ease;" style-hover="color:#EDEFEC;border-color:rgba(237,239,236,.4)">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;flex:none;">
            <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
            <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"></path>
          </svg>
          <span>Copy</span>
        </button>
      </div>
      <p aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0;"></p>
    </div>

    <div style="flex:0 1 300px;display:flex;justify-content:center;">

          <rect id="lefte" fill="#0F1211" x="2.80952381" y="41.215311" width="36.5238095" height="8.38277512" rx="1.4"></rect>
          <rect id="righte" fill="#0F1211" x="58.297619" y="41.215311" width="36.5238095" height="8.38277512" rx="1.4"></rect>
          <rect fill="#EDEFEC" opacity="0.329352679" x="0" y="59.3779904" width="47.0595238" height="27.2440191" rx="7"></rect>
          <rect fill="#0F1211" x="23.8809524" y="67.7607656" width="5.61904762" height="11.8755981" rx="2.8"></rect>
          <rect fill="#0F1211" transform="translate(50.929976, 77.989290) rotate(-75.000000) translate(-50.929976, -77.989290) " x="33.3704525" y="68.558668" width="35.1190476" height="18.861244" rx="9.43062201"></rect>
          <rect fill="#6FCB92" transform="translate(55.654021, 78.402022) rotate(-75.000000) translate(-55.654021, -78.402022) " x="38.0944967" y="68.9714001" width="35.1190476" height="18.861244" rx="9.43062201"></rect>
          <rect fill="#EDEFEC" opacity="0.329352679" x="58" y="59" width="47.0595238" height="27.2440191" rx="7"></rect>
          <rect fill="#0F1211" x="81" y="68" width="5.61904762" height="11.8755981" rx="2.8"></rect>
          <path d="M50.2393595,110.143165 C50.2393595,117.322867 56.0596578,123.143165 63.2393595,123.143165 C70.4190613,123.143165 76.2393595,117.322867 76.2393595,110.143165" stroke="#0F1211" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(63.239360, 116.643165) rotate(-15.000000) translate(-63.239360, -116.643165) "></path>
        </g>
        <g transform="translate(126,108)">
          <path d="M4,4 h26 a4,4 0 0 1 4,4 v20 a10,10 0 0 1 -10,10 h-14 a10,10 0 0 1 -10,-10 v-20 a4,4 0 0 1 4,-4 z" fill="none" stroke="#EDEFEC" stroke-opacity=".5" stroke-width="3"></path>
          <path d="M34,10 h6 a7,7 0 0 1 0,14 h-6" fill="none" stroke="#EDEFEC" stroke-opacity=".5" stroke-width="3"></path>
          <path id="hot1" d="M9,-4 c0,-6 6,-6 6,-12" fill="none" stroke="#6FCB92" stroke-width="3" stroke-linecap="round"></path>
          <path id="hot2" d="M17,-4 c0,-6 6,-6 6,-12" fill="none" stroke="#6FCB92" stroke-width="3" stroke-linecap="round"></path>
          <path id="hot3" d="M25,-4 c0,-6 6,-6 6,-12" fill="none" stroke="#6FCB92" stroke-width="3" stroke-linecap="round"></path>
        </g>
      </svg>
    </div>

  </div>
</main>

</body>
</html>
