  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ndro Velázquez\" style=\"display:block;width:auto;height:30px;flex:none\">\n\n<g>\n                                            <path d=\"M106.761905,61.1022421 C107.438325,60.8883196 108.143812,60.7751196 108.869048,60.7751196 C113.911933,60.7751196 118,66.248385 118,73 C118,79.751615 113.911933,85.2248804 108.869048,85.2248804 C108.143812,85.2248804 107.438325,85.1116804 106.761905,84.8977579 L106.761905,104.7 C106.761905,127.50936 88.2712649,146 65.4619048,146 L51.8357143,146 C29.0263541,146 10.5357143,127.50936 10.5357143,104.7 L10.5357143,41.3 C10.5357143,18.4906398 29.0263541,4.19001149e-15 51.8357143,0 L65.4619048,0 C88.2712649,-4.19001149e-15 106.761905,18.4906398 106.761905,41.3 L106.761905,61.1022421 Z\" id=\"Combined-Shape\" fill=\"#6FCB92\"><\u002Fpath>\n                                            <rect id=\"fmLefte\" fill=\"#0F1211\" x=\"2.80952381\" y=\"41.215311\" width=\"36.5238095\" height=\"8.38277512\" rx=\"1.4\"><\u002Frect>\n                                            <rect id=\"fmRighte\" fill=\"#0F1211\" x=\"58.297619\" y=\"41.215311\" width=\"36.5238095\" height=\"8.38277512\" rx=\"1.4\"><\u002Frect>\n                                            <rect id=\"Rectangle-46\" fill=\"#EDEFEC\" opacity=\"0.329352679\" x=\"0\" y=\"59.3779904\" width=\"47.0595238\" height=\"27.2440191\" rx=\"7\"><\u002Frect>\n                                            <rect id=\"Rectangle-47\" fill=\"#0F1211\" x=\"23.8809524\" y=\"67.7607656\" width=\"5.61904762\" height=\"11.8755981\" rx=\"2.8\"><\u002Frect>\n                                            <rect id=\"Rectangle-48\" fill=\"#0F1211\" transform=\"translate(50.929976, 77.989290) rotate(-75.000000) translate(-50.929976, -77.989290) \" x=\"33.3704525\" y=\"68.558668\" width=\"35.1190476\" height=\"18.861244\" rx=\"9.43062201\"><\u002Frect>\n                                            <rect id=\"Rectangle-48\" fill=\"#6FCB92\" transform=\"translate(55.654021, 78.402022) rotate(-75.000000) translate(-55.654021, -78.402022) \" x=\"38.0944967\" y=\"68.9714001\" width=\"35.1190476\" height=\"18.861244\" rx=\"9.43062201\"><\u002Frect>\n                                            <rect id=\"Rectangle-46\" fill=\"#EDEFEC\" opacity=\"0.329352679\" x=\"58\" y=\"59\" width=\"47.0595238\" height=\"27.2440191\" rx=\"7\"><\u002Frect>\n                                            <rect id=\"Rectangle-47\" fill=\"#0F1211\" x=\"81\" y=\"68\" width=\"5.61904762\" height=\"11.8755981\" rx=\"2.8\"><\u002Frect>\n                                            <path d=\"M50.2393595,110.143165 C50.2393595,117.322867 56.0596578,123.143165 63.2393595,123.143165 C70.4190613,123.143165 76.2393595,117.322867 76.2393595,110.143165\" id=\"Oval-26\" stroke=\"#0F1211\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" transform=\"translate(63.239360, 116.643165) rotate(-15.000000) translate(-63.239360, -116.643165) \"><\u002Fpath>\n                                        <\u002Fg><\u002Fsvg>Alejandro Velázquez<\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:22px;font-size:15px;\">\n      <a href=\"index.html#work\" style=\"color:#A2ACA5;text-decoration:none;\">Work<\u002Fa>\n      <a href=\"about.html\" style=\"color:#A2ACA5;text-decoration:none;\">About<\u002Fa>\n      <a href=\"cv/Alejandro-Velazquez-CV.pdf\" style=\"color:#A2ACA5;text-decoration:none;\">CV<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\" class=\"wrap\" style=\"position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 56px;\">\n\n  <section style=\"max-width:700px;padding:110px 0 56px 0;\">\n    <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-weight:500;font-size:14px;letter-spacing:.1em;color:#6FCB92;margin-bottom:20px;\">03 — CASE STUDY<\u002Fdiv>\n    <h1 style=\"font-size:clamp(38px,7.5vw,60px);font-weight:600;letter-spacing:-0.02em;line-height:1.05;margin:0 0 32px 0;\">Making a changing company easier to understand and harder to confuse with competitors<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.65;color:#EDEFEC;margin:0 0 24px 0;text-wrap:pretty;\">Yapily changed how it explained itself five times between 2020 and 2026. Each change needed more than a new headline: the website had to say what customers could buy, how the products fitted together, and why Yapily was not the company next to it in the search results.<\u002Fp>\n    <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:40px 0 0 0;\">\n    <div style=\"border:1px solid rgba(237,239,236,.14);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:18px;\">\n      <h2 style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:13px;font-weight:500;letter-spacing:.1em;color:#6FCB92;margin:0;\">AT A GLANCE<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:baseline;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#79837C;\">PERIOD<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#A2ACA5;text-wrap:pretty;\">2020 to present<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:baseline;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#79837C;\">WORKING WITH<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#A2ACA5;text-wrap:pretty;\">Marketing, sales, senior leadership, two external branding agencies, frontend<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:baseline;\">\n        <div style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#79837C;\">SCOPE<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.55;color:#A2ACA5;text-wrap:pretty;\">Positioning workshops, competitor analysis, concepts, wireframes, agency direction, frontend collaboration, design-system governance and brand rollout<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"star-heading\" style=\"max-width:700px;padding:44px 0 0 0;\">\n    <h2 id=\"star-heading\" style=\"position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;\">Summary<\u002Fh2>\n    <div style=\"padding:26px 0;border-top:1px solid rgba(237,239,236,.10);\">\n      <h3 style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#6FCB92;margin:0 0 12px 0;\">SITUATION<\u002Fh3>\n      <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">Yapily changed how it explained itself five times between 2020 and 2026 — from an API-first, deliberately invisible infrastructure provider, through clearer products around the API, open banking infrastructure and open finance, to an open banking platform for frictionless finance. Competitor analysis showed a category problem: many open banking websites looked and sounded the same, making it difficult to distinguish providers or understand where one product ended and another began. At the same time the existing CMS was expensive and difficult to operate, and publishing had become unnecessarily slow.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:26px 0;border-top:1px solid rgba(237,239,236,.10);\">\n      <h3 style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#6FCB92;margin:0 0 12px 0;\">TASK<\u002Fh3>\n      <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0;text-wrap:pretty;\">The mandate came from the CEO, and success was defined commercially rather than in design terms: launch the new website before the company's funding announcement. That fixed the date, and everything else — the positioning work, the information architecture, the agency relationship, the design system and the CMS migration — was subordinate to hitting it. I held creative direction and design leadership across all of it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:26px 0;border-top:1px solid rgba(237,239,236,.10);\">\n      <h3 style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#6FCB92;margin:0 0 12px 0;\">ACTIONS<\u002Fh3>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;\">\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Shaped positioning through workshops with Marketing, Sales and senior leadership, supported by competitor analysis.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Designed the first concepts and visual directions, and produced the wireframes.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Created dedicated product sections, giving customers a clearer view of the offering and the site a stronger information architecture.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Managed the relationships with two external branding agencies, who produced the final visual designs, while retaining responsibility for direction, system and implementation quality.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Built and governed Mark, the website design system — deliberately separate from the product systems, sharing foundational tokens but keeping its own components, so marketing refreshes would not ripple into production tooling.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Worked with Yapily's frontend team to translate the final agency designs into a live system on a new platform.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"padding:26px 0;border-top:1px solid rgba(237,239,236,.10);border-bottom:1px solid rgba(237,239,236,.10);\">\n      <h3 style=\"font-family:'Schibsted Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;color:#6FCB92;margin:0 0 12px 0;\">RESULT<\u002Fh3>\n      <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;\">\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>The site launched ahead of the funding announcement it was timed against, which is how success was defined.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>The rebuild produced more than fifty templates in under two months, which was only possible because the component system already existed.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>Migration from an expensive, difficult CMS improved publishing speed and ease of use across thousands of links, landing pages and articles, and gave Marketing more independence.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>A clearer product architecture helped customers understand the offering.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>A visual identity designed to stand apart in a category where competitor websites looked increasingly interchangeable.<\u002Fli>\n          <li style=\"font-size:17px;line-height:1.65;color:#A2ACA5;text-wrap:pretty;padding-left:20px;position:relative;\"><span aria-hidden=\"true\" style=\"position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:rgba(111,203,146,.55);\"><\u002Fspan>The brand was extended beyond the website into sales, marketing and company collateral, with the team.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section style=\"padding:0 0 24px 0;\">\n    <div class=\"cols\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;\">\n      <figure style=\"margin:0;\">\n        <div style=\"background:#F4F6F5;border:1px solid rgba(237,239,236,.09);border-radius:12px;overflow:hidden;\"><img src=\"87c8d8ee-08ef-4412-a9a5-dc92f504a115\" alt=\"Yapily website in 2020: black headline reading Open Banking API connectivity beside a yellow block with floating spheres\" loading=\"lazy\" style=\"display:block;width:100%;height:auto;\"><\u002Fdiv>\n        <figcaption style=\"font-size:14px;line-height:1.5;color:#79837C;margin-top:12px;\">2020 — 2021 · Open Banking API connectivity<\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;\">\n        <div style=\"background:#F4F6F5;border:1px solid rgba(237,239,236,.09);border-radius:12px;overflow:hidden;\"><img src=\"057dbcb2-2d87-4db3-9d74-201e0ef43abe\" alt=\"Yapily website in 2023: dark green hero reading Power your product innovation with open banking above a mint green statistics band\" loading=\"lazy\" style=\"display:block;width:100%;height:auto;\"><\u002Fdiv>\n        <figcaption style=\"font-size:14px;line-height:1.5;color:#79837C;margin-top:12px;\">2023 — 2024 · Power your product innovation<\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;\">\n        <div style=\"background:#F4F6F5;border:1px solid rgba(237,239,236,.09);border-radius:12px;overflow:hidden;\"><img src=\"cc4db917-157e-40ca-9fa0-821cf43942e6\" alt=\"Yapily website in 2025: dark green hero reading Open banking platform for frictionless finance with a row of customer logos beneath\" loading=\"lazy\" style=\"display:block;width:100%;height:auto;\"><\u002Fdiv>\n        <figcaption style=\"font-size:14px;line-height:1.5;color:#79837C;margin-top:12px;\">2025 — 2026 · Platform for frictionless finance<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n    <p style=\"max-width:900px;font-size:15px;line-height:1.6;color:#79837C;margin:24px 0 0 0;text-wrap:pretty;\">Each version was right for the stage Yapily was at.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Positioning changed five times<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">Yapily's explanation of itself moved as the company and the category matured:<\u002Fp>\n    <div style=\"max-width:700px;display:flex;flex-direction:column;gap:12px;margin:0 0 18px 0;\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">An API-first and deliberately invisible infrastructure provider.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">A company with clearer products around the API.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Open banking infrastructure.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Open finance.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">An open banking platform for frictionless finance.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">At the same time the existing CMS was expensive and difficult to operate. Publishing and maintaining a growing library of pages, resources and links had become unnecessarily slow.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">The category had converged<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">Positioning was shaped through workshops with Marketing, Sales and senior leadership, supported by competitor analysis.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The analysis revealed a category problem: many open banking websites looked and sounded the same. It was difficult to distinguish providers or understand where one product ended and another began.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">Creating dedicated product sections helped customers understand the offering more clearly and gave the site a stronger information architecture.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">My role<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The agencies produced the final visual designs. I remained responsible for the direction, the system and implementation quality.<\u002Fp>\n    <div style=\"max-width:700px;display:flex;flex-direction:column;gap:12px;margin:0 0 18px 0;\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Designing the first concepts and visual directions.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Producing the wireframes.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Managing relationships with external branding agencies.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Keeping strategic and creative decisions aligned with internal stakeholders.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Working with the frontend team to translate final agency designs into a live product.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Managing the website’s design and component system.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Mark, the website design system<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The website needed a more expressive system than the customer tools. Mark allowed larger typography, richer layouts, campaign visuals, animation and distinctive brand moments without pushing those decisions into dense product interfaces.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">It shared foundational tokens where appropriate but kept its own components and expressive behaviours. Coupling it to the product systems would have meant every marketing refresh rippling into production tooling.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The same system supported the website, campaign and resource content, sales presentations and tailored demos.<\u002Fp>\n    <p style=\"font-size:16px;line-height:1.6;margin:0;\"><a href=\"design-systems-np.html\">The three systems in detail →<\u002Fa><\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Build and launch<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The final agency designs were translated into production with Yapily's frontend team, on a platform that was easier to use and faster to publish through.<\u002Fp>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The platform supported thousands of links, landing pages and blog posts while giving Marketing more independence. The 2025 rebuild produced more than fifty templates in under two months, which was only possible because the component system already existed.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Outcome<\u002Fh2>\n    <div style=\"max-width:700px;display:flex;flex-direction:column;gap:12px;margin:0 0 18px 0;\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Faster and easier publishing.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">A more maintainable component-led website.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Clearer product architecture and customer understanding.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">A visual identity designed to stand apart from increasingly similar competitors.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;\"><span style=\"color:#6FCB92;\">—<\u002Fspan><p style=\"font-size:17px;line-height:1.6;color:#A2ACA5;margin:0;text-wrap:pretty;\">Extending the brand beyond the website into sales, marketing and company collateral with my team.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;line-height:1.6;color:#79837C;margin:8px 0 0 0;text-wrap:pretty;\">Commercial pipeline and enquiry data are confidential and are not published here.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <h2 style=\"font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-0.014em;margin:0 0 20px 0;\">Reflection<\u002Fh2>\n    <p style=\"font-size:17px;line-height:1.65;color:#A2ACA5;margin:0 0 18px 0;text-wrap:pretty;\">The hardest part was maintaining coherence while the company's positioning kept moving. A website cannot solve unclear strategy, but it exposes it. The strongest work came from using the site architecture and product pages to force clearer decisions about what Yapily offered and how the parts related.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"max-width:700px;padding:80px 0 0 0;\">\n    <div style=\"display:flex;gap:18px;flex-wrap:wrap;font-size:16px;\">\n      <a href=\"console.html\">← Console<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"headbox.html\">HeadBox →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width:700px;padding:120px 0 96px 0;\">\n    <div style=\"border-top:1px solid rgba(237,239,236,.14);padding-top:36px;display:flex;gap:18px;flex-wrap:wrap;font-size:16px;\">\n      <a href=\"index.html\">← All work<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"mailto:aleuxuk@gmail.com\">aleuxuk@gmail.com<\u002Fa>\n      <span style=\"color:#4a5250;\">·<\u002Fspan>\n      <a href=\"https://www.linkedin.com/in/velazquezalejandro/\">LinkedIn<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"padding-top:20px;font-size:14px;color:#79837C;\">Last updated August 2026<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fmain>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
