    host.addEventListener("pointermove", this.onFieldMove);
    host.addEventListener("pointerleave", this.onFieldLeave);
    const tick = (now) => {
      this.raf = requestAnimationFrame(tick);
      ptr.on += (ptr.target - ptr.on) * 0.12;
      draw(now);
    };
    this.raf = requestAnimationFrame(tick);
  }
}
