<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This portfolio has moved · Alejandro Velazquez</title>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#0F1211">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1211'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%236FCB92'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Schibsted+Grotesk:wght@400..600&display=swap">
<style>
  :root { --bg:#0F1211; --ink:#EDEFEC; --muted:#9AA39E; --line:rgba(237,239,236,.12); --accent:#6FCB92; }
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center;
    background:var(--bg); color:var(--ink);
    font-family:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    background-image:radial-gradient(rgba(111,203,146,.16) 1px, transparent 1.2px);
    background-size:22px 22px;
    background-position:center;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 70% 60% at 30% 50%, transparent 0%, var(--bg) 75%);
  }
  main { position:relative; width:100%; max-width:760px; margin:0 auto; padding:64px 48px; }
  .kick {
    font-family:'Bricolage Grotesque',sans-serif; font-size:13px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); margin:0 0 28px;
  }
  h1 {
    font-family:'Bricolage Grotesque',sans-serif; font-weight:600;
    font-size:clamp(40px,7vw,68px); line-height:1.02; letter-spacing:-.025em;
    margin:0 0 24px; text-wrap:balance;
  }
  p { font-size:19px; line-height:1.55; color:var(--muted); margin:0 0 40px; max-width:34em; }
  .contact { border-top:1px solid var(--line); padding-top:28px; }
  .label { font-size:14px; color:var(--muted); margin:0 0 8px; }
  a.mail {
    font-family:'Bricolage Grotesque',sans-serif; font-size:clamp(20px,3.4vw,26px); font-weight:500;
    color:var(--ink); text-decoration:none; overflow-wrap:anywhere;
    background-image:linear-gradient(rgba(111,203,146,.5),rgba(111,203,146,.5));
    background-repeat:no-repeat; background-position:0 100%; background-size:100% 1px;
    transition:background-image .2s ease;
  }
  a.mail:hover, a.mail:focus-visible { background-image:linear-gradient(var(--accent),var(--accent)); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:2px; }
  ::selection { background:var(--accent); color:var(--bg); }
  @media (max-width:600px){ main { padding:48px 20px; } p { font-size:17px; } }
</style>
</head>
<body>
<main>
  <p class="kick">Alejandro Velazquez · Lead Product Designer</p>
  <h1>This portfolio has moved.</h1>
  <p>The work that used to live here isn't available at this address any more. If you'd like to see it, or you're getting in touch about a role, email me and I'll send you the link.</p>
  <div class="contact">
    <p class="label">Email</p>
    <a class="mail" href="mailto:aleuxuk@gmail.com">aleuxuk@gmail.com</a>
  </div>
</main>
</body>
</html>
