<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Geist, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t4 d4">
  <title id="t4">The Console, 2026 beta</title>
  <desc id="d4">The organisation becomes the container. Teams, billing, KYB and analytics sit at organisation level. Applications hold sub-applications, each with its own compliance state. Hosted Pages is self-serve with a sandbox, and product scopes are gated by KYB and billing rather than by support.</desc>

  <defs>
    <marker id="arw4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#6E7671"></path>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#0B0D0D"></rect>

  <text x="48" y="54" fill="#C9A86A" font-size="12.5" letter-spacing="2.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2026 · BETA</text>
  <text x="48" y="94" fill="#F4F6F5" font-size="25" font-weight="600">The organisation becomes the container. The application stops being the whole model.</text>

  
  <rect x="48" y="128" width="1104" height="238" rx="12" fill="#101312" stroke="#C9A86A" stroke-opacity="0.45"></rect>
  <text x="76" y="162" fill="#C9A86A" font-size="11.5" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ORGANISATION — THE CONTAINER</text>
  <text x="1124" y="162" fill="#6E7671" font-size="12.5" text-anchor="end">multiple organisations per customer, for operating across regions</text>

  <rect x="76" y="182" width="238" height="72" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="195" y="212" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Teams &amp; roles</text>
  <text x="195" y="232" fill="#6E7671" font-size="12.5" text-anchor="middle">owner · admin · billing · dev</text>

  <rect x="336" y="182" width="238" height="72" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="455" y="212" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Billing</text>
  <text x="455" y="232" fill="#6E7671" font-size="12.5" text-anchor="middle">self-serve, plan and invoices</text>

  <rect x="596" y="182" width="238" height="72" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="715" y="212" fill="#F4F6F5" font-size="14.5" text-anchor="middle">KYB compliance</text>
  <text x="715" y="232" fill="#6E7671" font-size="12.5" text-anchor="middle">online, queued, with renewal</text>

  <rect x="856" y="182" width="238" height="72" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="975" y="212" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Analytics</text>
  <text x="975" y="232" fill="#6E7671" font-size="12.5" text-anchor="middle">funnel · banks · sessions</text>

  
  <rect x="336" y="278" width="498" height="34" rx="17" fill="none" stroke="#C9A86A" stroke-opacity="0.45"></rect>
  <text x="585" y="300" fill="#C9A86A" font-size="13.5" text-anchor="middle">Product scopes gated by KYB and billing — not by a support ticket</text>
  <line x1="455" y1="256" x2="455" y2="274" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw4)"></line>
  <line x1="715" y1="256" x2="715" y2="274" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw4)"></line>

  <text x="76" y="344" fill="#6E7671" font-size="13">Everything above used to be a person: a CSM exporting a report, a PM enabling a flag, a scheduled compliance call.</text>

  <line x1="600" y1="366" x2="600" y2="396" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw4)"></line>

  
  <rect x="48" y="404" width="1104" height="150" rx="12" fill="#101312" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="76" y="436" fill="#9AA39F" font-size="11.5" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">APPLICATIONS</text>

  <rect x="76" y="454" width="238" height="76" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="195" y="484" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Application</text>
  <text x="195" y="504" fill="#6E7671" font-size="12.5" text-anchor="middle">credentials · scopes · markets</text>

  <rect x="336" y="454" width="278" height="76" rx="8" fill="#141716" stroke="#C9A86A" stroke-opacity="0.4"></rect>
  <text x="475" y="478" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Sub-applications</text>
  <text x="475" y="498" fill="#6E7671" font-size="12.5" text-anchor="middle">sub-merchants or regional entities,</text>
  <text x="475" y="516" fill="#6E7671" font-size="12.5" text-anchor="middle">each with its own KYB state</text>

  <rect x="636" y="454" width="238" height="76" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="755" y="484" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Hosted Pages</text>
  <text x="755" y="504" fill="#6E7671" font-size="12.5" text-anchor="middle">self-serve branding</text>

  <rect x="896" y="454" width="198" height="76" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="995" y="484" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Sandbox</text>
  <text x="995" y="504" fill="#6E7671" font-size="12.5" text-anchor="middle">→ production</text>

  <line x1="322" y1="492" x2="330" y2="492" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw4)"></line>
  <line x1="874" y1="492" x2="890" y2="492" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw4)"></line>

  <text x="48" y="592" fill="#9AA39F" font-size="13.5">Compliance stops being a property of the customer and becomes a property of every entity the customer operates.</text>
  <text x="48" y="616" fill="#6E7671" font-size="13">Institution coverage is a filter, not a question for a human. Both licensing models are asked about at step one of onboarding.</text>
</svg>