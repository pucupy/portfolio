<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img">
<title>Component contribution and governance flow</title>
<desc>A seven-step flow: propose a mockup, validate through usability and accessibility testing, document use cases, review in an ad-hoc meeting with frontend and designers, design lead first approval, then a group decision with the frontend team, then publish to the component library.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<g class="gold">
<rect x="40" y="50" width="170" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="125" y="68" text-anchor="middle" dominant-baseline="central">Propose</text>
<text class="ts" x="125" y="86" text-anchor="middle" dominant-baseline="central">Simple mockup</text>
</g>

<g class="gold">
<rect x="255" y="50" width="170" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">Validate</text>
<text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">Usability + a11y</text>
</g>

<g class="gold">
<rect x="470" y="50" width="170" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="555" y="68" text-anchor="middle" dominant-baseline="central">Document</text>
<text class="ts" x="555" y="86" text-anchor="middle" dominant-baseline="central">Use cases defined</text>
</g>

<line x1="216" y1="78" x2="249" y2="78" class="arr" marker-end="url(#arrow)"></line>
<line x1="431" y1="78" x2="464" y2="78" class="arr" marker-end="url(#arrow)"></line>
<path d="M555 112 L555 143 L104 143 L104 174" class="arr" marker-end="url(#arrow)"></path>

<g class="neutral">
<rect x="39" y="180" width="130" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="104" y="198" text-anchor="middle" dominant-baseline="central">Review</text>
<text class="ts" x="104" y="216" text-anchor="middle" dominant-baseline="central">Ad-hoc meeting</text>
</g>

<g class="neutral">
<rect x="196" y="180" width="130" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="261" y="198" text-anchor="middle" dominant-baseline="central">Design gate</text>
<text class="ts" x="261" y="216" text-anchor="middle" dominant-baseline="central">First approval</text>
</g>

<g class="neutral">
<rect x="353" y="180" width="130" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="418" y="198" text-anchor="middle" dominant-baseline="central">Group gate</text>
<text class="ts" x="418" y="216" text-anchor="middle" dominant-baseline="central">With FE team</text>
</g>

<g class="neutral">
<rect x="510" y="180" width="130" height="56" rx="8" stroke-width="0.5"></rect>
<text class="th" x="575" y="198" text-anchor="middle" dominant-baseline="central">Publish</text>
<text class="ts" x="575" y="216" text-anchor="middle" dominant-baseline="central">To the library</text>
</g>

<line x1="175" y1="208" x2="190" y2="208" class="arr" marker-end="url(#arrow)"></line>
<line x1="332" y1="208" x2="347" y2="208" class="arr" marker-end="url(#arrow)"></line>
<line x1="489" y1="208" x2="504" y2="208" class="arr" marker-end="url(#arrow)"></line>

<text class="ts legend" x="40" y="268">Gold: proposer&#39;s work — Grey: collective gate and outcome</text>
</svg>