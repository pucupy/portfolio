<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img">
<title>Three design systems on a shared token layer</title>
<desc>A shared token layer held as Figma variables and mirrored in code feeds three separate design systems: hosted white-label pages, the website, and internal tools. Changes to shared tokens required approval from both the frontend lead and the design lead. Each system owns its own atoms, molecules and templates.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</marker>
</defs>

<g class="neutral">
<rect x="40" y="40" width="600" height="76" rx="8" stroke-width="0.5"></rect>
<text class="th" x="340" y="64" text-anchor="middle" dominant-baseline="central">Shared token layer</text>
<text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">Figma variables, mirrored in code</text>
<text class="ts" x="340" y="104" text-anchor="middle" dominant-baseline="central">Changes gated by both leads</text>
</g>

<line x1="125" y1="122" x2="125" y2="149" class="arr" marker-end="url(#arrow)"></line>
<line x1="340" y1="122" x2="340" y2="149" class="arr" marker-end="url(#arrow)"></line>
<line x1="555" y1="122" x2="555" y2="149" class="arr" marker-end="url(#arrow)"></line>

<g class="gold">
<rect x="40" y="155" width="170" height="110" rx="8" stroke-width="0.5"></rect>
<text class="th" x="125" y="179" text-anchor="middle" dominant-baseline="central">Hosted pages</text>
<text class="ts" x="125" y="205" text-anchor="middle" dominant-baseline="central">White-label, minimal</text>
<text class="ts" x="125" y="225" text-anchor="middle" dominant-baseline="central">Logo, font, colours</text>
<text class="ts" x="125" y="245" text-anchor="middle" dominant-baseline="central">Light/dark/system</text>
</g>

<g class="gold">
<rect x="255" y="155" width="170" height="110" rx="8" stroke-width="0.5"></rect>
<text class="th" x="340" y="179" text-anchor="middle" dominant-baseline="central">Website</text>
<text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">Playful, expressive</text>
<text class="ts" x="340" y="225" text-anchor="middle" dominant-baseline="central">Annual restyle</text>
<text class="ts" x="340" y="245" text-anchor="middle" dominant-baseline="central">Light only</text>
</g>

<g class="gold">
<rect x="470" y="155" width="170" height="110" rx="8" stroke-width="0.5"></rect>
<text class="th" x="555" y="179" text-anchor="middle" dominant-baseline="central">Tools</text>
<text class="ts" x="555" y="205" text-anchor="middle" dominant-baseline="central">Dense, data-heavy</text>
<text class="ts" x="555" y="225" text-anchor="middle" dominant-baseline="central">Analytics surfaces</text>
<text class="ts" x="555" y="245" text-anchor="middle" dominant-baseline="central">Dark mode</text>
</g>

<text class="ts caption" x="340" y="293" text-anchor="middle">Separate Figma libraries — each owns its atoms, molecules and templates</text>
</svg>