<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1150" width="2200" height="1150" role="img" aria-labelledby="title desc">
  

  <title id="title">The personal health budget payment chain before automation</title>
  <desc id="desc">Service map showing money flowing from clinical commissioning groups to My Support Money quarterly, to customer accounts monthly, and on to care agencies, while invoices, receipts and bank statements travel back on weekly and quarterly cycles, ending in a manual audit sent to the commissioning group on a spreadsheet by email.</desc>


  
    
  

  <defs>
    
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#79837C"></path>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6FCB92"></path>
    </marker>
  </defs>

  <rect fill="#0F1211" x="0" y="0" width="2200" height="1150"></rect>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text font-size="42" font-weight="600" letter-spacing="-0.75" fill="#EDEFEC" x="80" y="104">Before: four clocks, one reconciliation</text>
    <text font-size="22" font-weight="400" fill="#A2ACA5" x="80" y="146">Personal health budget payments, 2017. Every step below was done by hand.</text>
    <text font-weight="400" x="80" y="180" font-size="19" fill="#79837C">209 clinical commissioning groups then managed most of the NHS commissioning budget. My Support Broker worked with five of them. CCGs were abolished in 2022.</text>
  </g>
  <line stroke="#333937" stroke-width="1" x1="80" y1="228" x2="2120" y2="228"></line>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text font-size="15" font-weight="600" letter-spacing="1.5" fill="#6FCB92" x="80" y="298">MONEY OUT</text>
    <text font-size="15" font-weight="600" letter-spacing="1.5" fill="#6FCB92" x="80" y="742">EVIDENCE BACK</text>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <rect fill="#1A1E1C" stroke="#333937" stroke-width="1" x="880" y="312" width="300" height="58" rx="4"></rect>
    <text font-size="18" font-weight="400" x="904" y="347" fill="#A2ACA5">My Support Broker</text>
    <path stroke="#3d4442" stroke-width="1" stroke-dasharray="4 5" fill="none" d="M1030,370 L1030,406"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="1216" y="341">01</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1216" y="368">The support plan is agreed</text>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <rect fill="#1A1E1C" stroke="#333937" stroke-width="1" x="80" y="406" width="260" height="112" rx="4"></rect>
    <text font-size="24" font-weight="600" letter-spacing="-0.29" fill="#EDEFEC" x="104" y="456">CCG finance</text>
    <text font-size="18" font-weight="400" fill="#A2ACA5" x="104" y="486">The commissioning budget</text>

    <rect fill="#1A1E1C" stroke="#333937" stroke-width="1" x="460" y="406" width="300" height="112" rx="4"></rect>
    <text font-size="24" font-weight="600" letter-spacing="-0.29" fill="#EDEFEC" x="484" y="456">My Support Money</text>
    <text font-size="18" font-weight="400" fill="#A2ACA5" x="484" y="486">Budget delivery account</text>

    <rect fill="#1A1E1C" stroke="#333937" stroke-width="1" x="880" y="406" width="300" height="112" rx="4"></rect>
    <text font-size="24" font-weight="600" letter-spacing="-0.29" fill="#EDEFEC" x="904" y="456">Customer account</text>
    <text font-size="18" font-weight="400" fill="#A2ACA5" x="904" y="486">Nominated, or segregated</text>

    <rect fill="#1A1E1C" stroke="#333937" stroke-width="1" x="1300" y="406" width="260" height="112" rx="4"></rect>
    <text font-size="24" font-weight="600" letter-spacing="-0.29" fill="#EDEFEC" x="1324" y="456">Care agency</text>
    <text font-size="18" font-weight="400" fill="#A2ACA5" x="1324" y="486">Or independent carer</text>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <path stroke="#79837C" stroke-width="1.5" fill="none" d="M340,462 L452,462" marker-end="url(#ah)"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="352" y="428">02</text>
    <text font-size="14" font-weight="600" letter-spacing="1.26" fill="#79837C" x="352" y="504">QUARTERLY</text>

    <path stroke="#79837C" stroke-width="1.5" fill="none" d="M760,462 L872,462" marker-end="url(#ah)"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="772" y="428">03</text>
    <text font-size="14" font-weight="600" letter-spacing="1.26" fill="#79837C" x="772" y="504">MONTHLY</text>

    <path stroke="#79837C" stroke-width="1.5" fill="none" d="M1180,462 L1292,462" marker-end="url(#ah)"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="1192" y="428">05</text>
    <text font-size="14" font-weight="600" letter-spacing="1.26" fill="#79837C" x="1192" y="504">ON REQUEST</text>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="80" y="566">02 · Invoices go up through the portal; the commissioning group pays the budget delivery account.</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="80" y="596">03 · Money moves on to the customer’s own account, or one operated on their behalf.</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="80" y="626">05 · The relative — or the operator — pays the care agency.</text>
    <text font-size="19" font-weight="400" x="80" y="668" fill="#EDEFEC">Money was held back pending the audit, so customers chased the operator for it.</text>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <path stroke="#3d4442" stroke-width="1" stroke-dasharray="4 5" fill="none" d="M210,700 L210,790"></path>
    <path stroke="#3d4442" stroke-width="1" stroke-dasharray="4 5" fill="none" d="M610,700 L610,790"></path>
    <path stroke="#3d4442" stroke-width="1" stroke-dasharray="4 5" fill="none" d="M1030,700 L1030,790"></path>
    <path stroke="#3d4442" stroke-width="1" stroke-dasharray="4 5" fill="none" d="M1430,700 L1430,790"></path>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <line stroke="#333937" stroke-width="1" x1="210" y1="806" x2="1430" y2="806"></line>

    <path stroke="#6FCB92" stroke-width="1.5" fill="none" d="M1420,806 L1046,806" marker-end="url(#ahg)"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="1200" y="778">04</text>
    <text font-size="14" font-weight="600" letter-spacing="1.26" fill="#79837C" x="1200" y="840">WEEKLY</text>

    <path stroke="#6FCB92" stroke-width="1.5" fill="none" d="M1014,806 L626,806" marker-end="url(#ahg)"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="790" y="778">06</text>
    <text font-size="14" font-weight="600" letter-spacing="1.26" fill="#79837C" x="790" y="840">QUARTERLY</text>

    <path stroke="#6FCB92" stroke-width="1.5" fill="none" d="M594,806 L226,806" marker-end="url(#ahg)"></path>
    <text font-size="15" font-weight="600" fill="#6FCB92" x="372" y="778">07</text>
    <text font-size="14" font-weight="600" letter-spacing="1.26" fill="#79837C" x="372" y="840">QUARTERLY</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="80" y="900">04 · The agency invoices the customer weekly.</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="80" y="930">06 · The relative returns receipts for cash, invoices for transfers, and bank statements.</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="80" y="960">07 · The operator validates all of it against the support plan, then audits back to the commissioning group —</text>
    <text font-size="19" font-weight="400" x="80" y="990" fill="#EDEFEC">     on a spreadsheet, attached to an email.</text>
  </g>

  
  <line stroke="#333937" stroke-width="1" x1="80" y1="1042" x2="1560" y2="1042"></line>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <text font-size="24" font-weight="500" letter-spacing="-0.29" fill="#EDEFEC" x="80" y="1090">Quarterly in, monthly out, weekly invoiced, quarterly evidenced.</text>
    <text font-weight="400" fill="#A2ACA5" x="80" y="1122" font-size="19">The mismatch between those four cycles is the problem. Not the screens.</text>
  </g>

  
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif">
    <rect fill="#161918" stroke="#333937" stroke-width="1" x="1640" y="286" width="480" height="704" rx="4"></rect>
    <text font-size="26" font-weight="600" letter-spacing="-0.36" fill="#EDEFEC" x="1680" y="346">Where it broke</text>
    <line stroke="#333937" stroke-width="1" x1="1680" y1="374" x2="2080" y2="374"></line>

    <circle cx="1686" cy="422" r="3" fill="#6FCB92"></circle>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="428">A new bank account opened</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="454">for every single customer.</text>

    <circle cx="1686" cy="512" r="3" fill="#6FCB92"></circle>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="518">Invoices and receipts arrived</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="544">late, or not at all.</text>

    <circle cx="1686" cy="602" r="3" fill="#6FCB92"></circle>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="608">Care agencies waited to</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="634">be paid.</text>

    <circle cx="1686" cy="692" r="3" fill="#6FCB92"></circle>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="698">Audit and reconciliation</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="724">were done by hand.</text>

    <circle cx="1686" cy="782" r="3" fill="#6FCB92"></circle>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="788">Relatives had little time or</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="814">patience for the admin —</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="840">and were already caring.</text>

    <circle cx="1686" cy="898" r="3" fill="#6FCB92"></circle>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="904">Chasing money was stressful</text>
    <text font-size="19" font-weight="400" fill="#A2ACA5" x="1706" y="930">on both sides of the call.</text>
  </g>
</svg>