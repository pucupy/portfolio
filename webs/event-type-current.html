  <main style="margin:0 auto;max-width:1200px;padding:20px;min-height:100vh;overflow:hidden;display:block;position:relative">
    <div style="margin-top:104px;margin-bottom:64px">
      <section>
        <div style="display:inline-grid;grid-template-columns:20% 70%;grid-gap:80px;grid-row-gap:20px;width:100%;align-content:center;padding:20px 0">
          <div style="border-right:1px solid #ccc;padding:40px;font-size:14px">
            <div style="margin-bottom:40px"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Type of event</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Location</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Date</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Number of guests</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Format</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Must haves &amp; Extras</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">Budget</em></p></div>
            <div style="margin-bottom:40px;opacity:0.3"><p style="margin:0 0 20px 0"><em style="font-weight:700;font-style:normal">What's your event</em></p></div>
          </div>
          <div>
            <h2 style="font-size:32px;margin:0 0 20px 0;font-family:'Montserrat',serif;font-weight:700;color:#2f2f2f">Type of event </h2>
            <p style="margin:0 0 20px 0">What sort of event are you planning?</p>
            <div style="display:inline-grid;grid-template-columns:48% 48%;grid-gap:20px;grid-row-gap:20px;width:100%;align-content:center;padding:20px 0">
              <sc-for list="{{ types }}" as="t" hint-placeholder-count="10">
                <label style="display:block;position:relative;padding-left:35px;margin-bottom:40px;cursor:pointer;font-size:20px;font-weight:400;color:#2f2f2f;user-select:none" onClick="{{ t.select }}">
                  <sc-if value="{{ t.img }}"><img src="{{ t.img }}" alt="" style="width:100%;border-radius:5px;display:block" /></sc-if>
                  <br />
                  {{ t.label }}
                  <span style="position:absolute;top:0;left:0;height:25px;width:25px;border-radius:50%;background-color:{{ t.bg }}">
                    <span style="position:absolute;left:9px;top:5px;width:5px;height:10px;border:solid white;border-width:0 3px 3px 0;transform:rotate(45deg);display:{{ t.tick }}"></span>
                  </span>
                </label>
              </sc-for>
            </div>
            <div>
              <a href="#" style="border:1px solid #2A9FD8;border-radius:5px;display:inline-block;padding:10px;text-align:center;cursor:pointer">+ More types</a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <nav style="width:100%;position:fixed;bottom:0;left:0;background:rgba(255,255,255,0.7);border-top:1px solid #f1eae1;z-index:1000;box-shadow:rgb(219,219,219) 0px 2px 4px 1px;text-align:right">

    </div>
  </nav>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { selected: null };
  renderVals() {
    const defs = [
      ["Conference", "img/conference.jpg"],
      ["Private party", "img/privateparty.jpg"],
      ["Launch event", "img/launch.jpg"],
      ["Screening", "img/screening.jpg"],
      ["Private dinner", "img/dinner.jpg"],
      ["Workshop", "img/workshop.jpg"],
      ["Drinks reception", "img/drinks.jpg"],
      ["Team away day", "img/teamaway.jpg"],
      ["Meeting", "img/meeting.jpg"],
      ["Recording", "img/studio.jpg"]
    ];
    return {
      types: defs.map(([label, img], i) => ({
        label, img,
        bg: this.state.selected === i ? "#2A9FD8" : "#eee",
        tick: this.state.selected === i ? "block" : "none",
        select: () => this.setState({ selected: i })
      }))
    };
  }
}

</script>
