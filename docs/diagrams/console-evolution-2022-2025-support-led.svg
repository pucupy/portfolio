  <text x="1062" y="300" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Hundreds of banks</text>

  <line x1="236" y1="294" x2="271" y2="294" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw3)"></line>
  <line x1="467" y1="294" x2="502" y2="294" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw3)"></line>
  <line x1="698" y1="294" x2="733" y2="294" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw3)"></line>
