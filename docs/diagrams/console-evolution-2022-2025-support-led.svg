  <rect x="279" y="390" width="180" height="72" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="369" y="432" fill="#F4F6F5" font-size="14.5" text-anchor="middle">App creation</text>

  <rect x="510" y="390" width="180" height="72" rx="8" fill="none" stroke="#F4F6F5" stroke-opacity="0.14" stroke-dasharray="5 5"></rect>
  <text x="600" y="420" fill="#6E7671" font-size="14.5" text-anchor="middle">No certificate</text>
  <text x="600" y="440" fill="#6E7671" font-size="14.5" text-anchor="middle">management</text>

  <rect x="741" y="390" width="180" height="72" rx="8" fill="none" stroke="#F4F6F5" stroke-opacity="0.14" stroke-dasharray="5 5"></rect>
  <text x="831" y="420" fill="#6E7671" font-size="14.5" text-anchor="middle">No bank</text>
  <text x="831" y="440" fill="#6E7671" font-size="14.5" text-anchor="middle">registration</text>

  <rect x="972" y="390" width="180" height="72" rx="8" fill="#141716" stroke="#6FCB92" stroke-opacity="0.4"></rect>
  <text x="1062" y="432" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Thousands of banks</text>

  <line x1="236" y1="426" x2="271" y2="426" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw3)"></line>
  <path d="M467 426 L960 426" fill="none" stroke="#6E7671" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#arw3)"></path>

  
  <line x1="48" y1="500" x2="1152" y2="500" stroke="#F4F6F5" stroke-opacity="0.14"></line>
  <text x="48" y="534" fill="#6FCB92" font-size="11.5" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SUPPORT-LED</text>

  <rect x="200" y="516" width="290" height="34" rx="17" fill="none" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="345" y="538" fill="#9AA39F" font-size="13.5" text-anchor="middle">Hosted Pages configuration</text>

  <rect x="506" y="516" width="290" height="34" rx="17" fill="none" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="651" y="538" fill="#9AA39F" font-size="13.5" text-anchor="middle">Product scopes enabled</text>

  <text x="48" y="582" fill="#6E7671" font-size="13.5">Each of these is a ticket, a support person and an engineer — per customer, per request, for work that was never engineering work.</text>
</svg>