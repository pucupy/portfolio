<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="Geist, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t3 d3">
  <title id="t3">The Console, 2022 to 2025</title>
  <desc id="d3">Guidance improves but ends at a sales form. Hosted Pages configuration and scope enablement are handled by support. Both licensing paths otherwise unchanged.</desc>

  <defs>
    <marker id="arw3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#6E7671"></path>
    </marker>
    <marker id="arw3g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#6FCB92"></path>
    </marker>
  </defs>

  <rect width="1200" height="610" fill="#0B0D0D"></rect>

  <text x="48" y="54" fill="#6FCB92" font-size="12.5" letter-spacing="2.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2022–2025 · REBRANDED, NOT REBUILT</text>
  <text x="48" y="94" fill="#F4F6F5" font-size="25" font-weight="600">Self-service that stops one step short of self-service.</text>

  
  <rect x="48" y="126" width="1104" height="72" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="76" y="158" fill="#F4F6F5" font-size="14.5">Get started guide · tutorials</text>
  <line x1="330" y1="162" x2="382" y2="162" stroke="#6FCB92" stroke-width="1.4" marker-end="url(#arw3g)"></line>
  <text x="396" y="158" fill="#6FCB92" font-size="14.5">Sales form</text>
  <text x="76" y="182" fill="#6E7671" font-size="13">The one place the product could have carried a customer through, and it hands them to a person.</text>

  
  <text x="48" y="242" fill="#9AA39F" font-size="11.5" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DIRECT — OWN LICENCE</text>

