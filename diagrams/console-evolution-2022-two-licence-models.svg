  <text x="138" y="357" fill="#C9A86A" font-size="14.5" text-anchor="middle">licence</text>

  <rect x="279" y="304" width="180" height="78" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="369" y="349" fill="#F4F6F5" font-size="14.5" text-anchor="middle">App creation</text>

