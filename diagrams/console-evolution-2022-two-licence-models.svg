  <text x="600" y="195" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Certificate</text>
  <text x="600" y="215" fill="#F4F6F5" font-size="14.5" text-anchor="middle">management</text>

  <rect x="741" y="162" width="180" height="78" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="831" y="195" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Bank</text>
  <text x="831" y="215" fill="#F4F6F5" font-size="14.5" text-anchor="middle">registrations</text>

  <rect x="972" y="162" width="180" height="78" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="1062" y="195" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Hundreds of</text>
  <text x="1062" y="215" fill="#F4F6F5" font-size="14.5" text-anchor="middle">banks</text>

  <line x1="236" y1="201" x2="271" y2="201" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw2)"></line>
  <line x1="467" y1="201" x2="502" y2="201" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw2)"></line>
  <line x1="698" y1="201" x2="733" y2="201" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw2)"></line>
  <line x1="929" y1="201" x2="964" y2="201" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw2)"></line>

  
  <text x="48" y="288" fill="#C9A86A" font-size="11.5" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NEW — YAPILY CONNECT</text>

  <rect x="48" y="304" width="180" height="78" rx="8" fill="#141716" stroke="#C9A86A" stroke-opacity="0.55"></rect>
