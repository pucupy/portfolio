<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" font-family="Geist, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t2 d2">
  <title id="t2">The Console, 2022</title>
  <desc id="d2">A second licensing model arrives. Customers on Yapily&#39;s licence skip certificate management and bank registration entirely and reach thousands of banks. The application is still the only container.</desc>

  <defs>
    <marker id="arw2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#6E7671"></path>
    </marker>
  </defs>

  <rect width="1200" height="530" fill="#0B0D0D"></rect>

