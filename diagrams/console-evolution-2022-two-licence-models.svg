  <text x="48" y="94" fill="#F4F6F5" font-size="25" font-weight="600">Two customer types. One container, retrofitted.</text>

  
  <text x="48" y="146" fill="#9AA39F" font-size="11.5" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DIRECT — OWN LICENCE</text>

  <rect x="48" y="162" width="180" height="78" rx="8" fill="#141716" stroke="#C9A86A" stroke-opacity="0.55"></rect>
  <text x="138" y="195" fill="#C9A86A" font-size="14.5" text-anchor="middle">Customer&#39;s own</text>
  <text x="138" y="215" fill="#C9A86A" font-size="14.5" text-anchor="middle">licence</text>

  <rect x="279" y="162" width="180" height="78" rx="8" fill="#141716" stroke="#F4F6F5" stroke-opacity="0.16"></rect>
  <text x="369" y="207" fill="#F4F6F5" font-size="14.5" text-anchor="middle">App creation</text>

