  <text x="600" y="337" fill="#6E7671" font-size="14.5" text-anchor="middle">No certificate</text>
  <text x="600" y="357" fill="#6E7671" font-size="14.5" text-anchor="middle">management</text>

  <rect x="741" y="304" width="180" height="78" rx="8" fill="none" stroke="#F4F6F5" stroke-opacity="0.14" stroke-dasharray="5 5"></rect>
  <text x="831" y="337" fill="#6E7671" font-size="14.5" text-anchor="middle">No bank</text>
  <text x="831" y="357" fill="#6E7671" font-size="14.5" text-anchor="middle">registration</text>

  <rect x="972" y="304" width="180" height="78" rx="8" fill="#141716" stroke="#C9A86A" stroke-opacity="0.4"></rect>
  <text x="1062" y="337" fill="#F4F6F5" font-size="14.5" text-anchor="middle">Thousands of</text>
  <text x="1062" y="357" fill="#F4F6F5" font-size="14.5" text-anchor="middle">banks</text>

  <line x1="236" y1="343" x2="271" y2="343" stroke="#6E7671" stroke-width="1.4" marker-end="url(#arw2)"></line>
  <path d="M467 343 L960 343" fill="none" stroke="#6E7671" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#arw2)"></path>

  
  <path d="M279 404 L279 414 L1152 414 L1152 404" fill="none" stroke="#F4F6F5" stroke-opacity="0.22" stroke-width="1.2"></path>
  <text x="715" y="436" fill="#9AA39F" font-size="13.5" text-anchor="middle">Still one container: the application. A second customer type fitted into a shape built for the first.</text>

  
  <line x1="48" y1="466" x2="1152" y2="466" stroke="#F4F6F5" stroke-opacity="0.14"></line>
  <text x="48" y="500" fill="#C9A86A" font-size="11.5" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ANALYTICS</text>
  <text x="180" y="501" fill="#9AA39F" font-size="14">API logs only — unchanged</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#9AA39F">
