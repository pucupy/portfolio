<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 398" role="img" aria-labelledby="ab-title ab-desc" preserveAspectRatio="xMidYMid meet">
<title id="ab-title">Hosted Pages: the authentication branch</title>
<desc id="ab-desc">After consent the flow splits four ways — decoupled QR, browser redirect, embedded login, or no Yapily screen at all — each with its own sub-variants, before converging on a result screen and returning to the merchant.</desc>
<defs>
  <marker id="ab-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </marker>
</defs>

<g class="d">

<rect class="head-fill" x="240" y="30" width="200" height="44" rx="8" stroke-width="0.5"></rect>
<text class="head-txt" x="340" y="52" text-anchor="middle" dominant-baseline="central">Redirecting to bank</text>

<path class="arr" d="M340 76 V92 H112 V106" marker-end="url(#ab-arrow)"></path>
<path class="arr" d="M340 76 V92 H265 V106" marker-end="url(#ab-arrow)"></path>
<path class="arr" d="M340 76 V92 H418 V106" marker-end="url(#ab-arrow)"></path>
<path class="arr" d="M340 76 V92 H571 V106" marker-end="url(#ab-arrow)"></path>

<rect class="gold-fill" x="45" y="110" width="135" height="56" rx="8" stroke-width="0.5"></rect>
<text class="ttl" x="112" y="128" text-anchor="middle" dominant-baseline="central">Decoupled (QR)</text>
<text class="sub" x="112" y="148" text-anchor="middle" dominant-baseline="central">Can be hidden</text>

<rect class="gold-fill" x="198" y="110" width="135" height="56" rx="8" stroke-width="0.5"></rect>
<text class="ttl" x="265" y="128" text-anchor="middle" dominant-baseline="central">Redirect</text>
<text class="sub" x="265" y="148" text-anchor="middle" dominant-baseline="central">Browser handoff</text>

<rect class="gold-fill" x="351" y="110" width="135" height="56" rx="8" stroke-width="0.5"></rect>
<text class="ttl" x="418" y="128" text-anchor="middle" dominant-baseline="central">Embedded</text>
<text class="sub" x="418" y="148" text-anchor="middle" dominant-baseline="central">In-page login</text>

<rect class="neu-fill" x="504" y="110" width="135" height="56" rx="8" stroke-width="0.5"></rect>
<text class="ttlN" x="571" y="128" text-anchor="middle" dominant-baseline="central">No auth screen</text>
<text class="subN" x="571" y="148" text-anchor="middle" dominant-baseline="central">Skips to bank</text>

<rect class="neu-fill" x="45" y="182" width="135" height="100" rx="8" stroke-width="0.5"></rect>
<text class="item" x="59" y="204" dominant-baseline="central">Scan on mobile</text>
<text class="item" x="59" y="226" dominant-baseline="central">Mobile web</text>
<text class="item" x="59" y="248" dominant-baseline="central">App-to-app</text>
<text class="item" x="59" y="270" dominant-baseline="central">Desktop path</text>

<rect class="neu-fill" x="198" y="182" width="135" height="100" rx="8" stroke-width="0.5"></rect>
<text class="item" x="212" y="204" dominant-baseline="central">Payments EU</text>
<text class="item" x="212" y="226" dominant-baseline="central">Extra info req.</text>
<text class="item" x="212" y="248" dominant-baseline="central">Payments UK</text>
<text class="item" x="212" y="270" dominant-baseline="central">Data</text>

<rect class="neu-fill" x="351" y="182" width="135" height="100" rx="8" stroke-width="0.5"></rect>
<text class="item" x="365" y="204" dominant-baseline="central">Single SCA</text>
<text class="item" x="365" y="226" dominant-baseline="central">SMS code</text>
<text class="item" x="365" y="248" dominant-baseline="central">Other methods</text>
<text class="item" x="365" y="270" dominant-baseline="central">Multi SCA</text>

<rect class="neu-fill" x="504" y="182" width="135" height="100" rx="8" stroke-width="0.5"></rect>
<text class="item" x="518" y="204" dominant-baseline="central">Lithuania</text>
<text class="item" x="518" y="226" dominant-baseline="central">Netherlands</text>
<text class="item" x="518" y="248" dominant-baseline="central">Sweden</text>
<text class="item" x="518" y="270" dominant-baseline="central">Bank&#39;s own flow</text>

<rect class="dash" x="45" y="302" width="594" height="76" rx="12" stroke-width="0.5"></rect>
<text class="note" x="61" y="324" dominant-baseline="central">All four converge on the result screen</text>
<text class="note" x="61" y="348" dominant-baseline="central">Payments or data, success or failed, UK or EU wording — then back to the merchant</text>

</g>
</svg>