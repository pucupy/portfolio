<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Geist, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">The Dashboard, 2020</title>
  <desc id="d1">One licensing model. Customers with their own licence create an application, manage certificates, register banks and enable hundreds of institutions. The application is the main container. Analytics are API logs only.</desc>

