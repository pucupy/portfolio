<body>
<x-dc>
<helmet>
  <title>Almanac prototype v3 · Proposed</title>

  <link rel="stylesheet" href="Almanac v3 Theme.css">

</helmet>
<div style="height:100vh;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans, ui-sans-serif, system-ui, sans-serif)">

      <span style="color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ stepName }}</span>
      <button onClick="{{ next }}" title="Next (Alt →)" style="height:24px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:#d4d4d4;font-size:12px;cursor:pointer" style-hover="background:#262626">→</button>
      <div style="flex:1"></div>
      <button onClick="{{ toPlatform }}" style="height:24px;padding:0 10px;border:1px solid {{ ppBorder }};border-radius:4px;background:{{ ppBg }};color:{{ ppFg }};font-size:12px;cursor:pointer" style-hover="background:#262626">Platform portal</button>
      <div style="display:flex;background:#262626;border-radius:6px;padding:2px;gap:2px;flex-shrink:0" role="group" aria-label="Device">

            </sc-for>
          </div>
          <sc-if value="{{ showOrient }}">
            <div style="display:flex;background:#262626;border-radius:6px;padding:2px;gap:2px;flex-shrink:0" role="group" aria-label="Orientation">
              <sc-for list="{{ orientOpts }}" as="o" hint-placeholder-count="2">
                <button onClick="{{ o.onClick }}" aria-pressed="{{ o.pressed }}" aria-label="{{ o.label }}" title="{{ o.label }}" style="display:flex;align-items:center;justify-content:center;width:30px;height:24px;padding:0;border:0;border-radius:4px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.icon }}</button>
              </sc-for>
            </div>
          </sc-if>
      <button onClick="{{ expand }}" style="height:24px;padding:0 10px;border:1px solid #3a3a3a;border-radius:4px;background:transparent;color:#f5f5f5;font-size:12px;cursor:pointer" style-hover="background:#262626">Show controls</button>
      <button onClick="{{ hide }}" title="Hide (Alt H)" style="height:24px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:#a3a3a3;font-size:12px;cursor:pointer" style-hover="background:#262626">Hide</button>
    </div>
  </sc-if>
  <sc-if value="{{ showFull }}">

            <option value="v1">v1 As built</option>
            <option value="v2">v2 Proposed</option>
            <option value="v3">v3 Proposed</option>
          </select>
        </div>
        <button onClick="{{ openDrawer }}" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid #3a3a3a;background:#262626;color:#f5f5f5;font-size:12px;cursor:pointer;flex-shrink:0" style-hover="background:#303030">All screens</button>
        <button onClick="{{ toPlatform }}" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid {{ ppBorder }};background:{{ ppBg }};color:{{ ppFg }};font-size:12px;cursor:pointer;flex-shrink:0" style-hover="background:#303030">Platform portal</button>

            </sc-for>
          </div>
          <sc-if value="{{ showOrient }}">
            <div style="display:flex;background:#262626;border-radius:6px;padding:2px;gap:2px;flex-shrink:0" role="group" aria-label="Orientation">
              <sc-for list="{{ orientOpts }}" as="o" hint-placeholder-count="2">
                <button onClick="{{ o.onClick }}" aria-pressed="{{ o.pressed }}" aria-label="{{ o.label }}" title="{{ o.label }}" style="display:flex;align-items:center;justify-content:center;width:30px;height:24px;padding:0;border:0;border-radius:4px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.icon }}</button>

            </div>
          </sc-if>
        <div style="width:1px;height:20px;background:#333;flex-shrink:0"></div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="color:#a3a3a3;font-size:12px">Viewing as</span>

            </sc-for>
          </div>
          <span style="color:#a3a3a3;font-size:12px">User</span>
          <div style="display:flex;background:#262626;border-radius:6px;padding:2px;gap:2px">
            <sc-for list="{{ userOpts }}" as="o" hint-placeholder-count="2">
              <button onClick="{{ o.onClick }}" style="height:24px;padding:0 10px;border:0;border-radius:4px;font-size:12px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="flex:1;min-width:16px"></div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <button onClick="{{ prev }}" title="Previous (Alt ←)" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid #3a3a3a;background:#262626;color:#f5f5f5;font-size:12px;cursor:pointer">← Prev</button>
          <span style="font-size:12px;color:#d4d4d4;min-width:110px;text-align:center;font-variant-numeric:tabular-nums">{{ stepLabel }}</span>
          <button onClick="{{ next }}" title="Next (Alt →)" style="height:28px;padding:0 10px;border-radius:6px;border:0;background:#2f45d0;color:#fff;font-size:12px;cursor:pointer">Next →</button>
        </div>
        <div style="width:1px;height:20px;background:#333;flex-shrink:0"></div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span style="color:#a3a3a3;font-size:12px">State</span>
          <select value="{{ state }}" onChange="{{ onState }}" aria-label="Screen state" style="background:#262626;color:#f5f5f5;border:1px solid #3a3a3a;border-radius:6px;height:28px;padding:0 6px;font-size:12px;max-width:180px">
            <sc-for list="{{ stateOpts }}" as="s" hint-placeholder-count="2">
              <option value="{{ s }}">{{ s }}</option>
            </sc-for>
          </select>
          <button onClick="{{ toggleDark }}" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid #3a3a3a;background:#262626;color:#f5f5f5;font-size:12px;cursor:pointer">{{ themeLabel }}</button>
          <button onClick="{{ collapse }}" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid #3a3a3a;background:#262626;color:#f5f5f5;font-size:12px;cursor:pointer">Minimise</button>
          <button onClick="{{ hide }}" title="Hide (Alt H)" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid #3a3a3a;background:#262626;color:#f5f5f5;font-size:12px;cursor:pointer">Hide</button>
        </div>
      </div>
      <div style="display:flex;gap:4px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:thin">
        <sc-for list="{{ rail }}" as="r" hint-placeholder-count="14">
          <button onClick="{{ r.onClick }}" style="display:flex;align-items:center;gap:6px;flex-shrink:0;height:26px;padding:0 10px 0 4px;border-radius:13px;border:1px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }};font-size:12px;cursor:pointer;white-space:nowrap">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:9px;background:{{ r.numBg }};font-size:10px;font-variant-numeric:tabular-nums">{{ r.n }}</span>{{ r.label }}
          </button>
        </sc-for>
      </div>
    </div>

  <sc-if value="{{ showDevice }}">
    <div style="flex:1;min-height:0;overflow:auto;background:#2a2a2a;display:flex;justify-content:center;align-items:flex-start;padding:24px">
      <div style="flex-shrink:0;width:{{ deviceW }};height:{{ deviceH }};border-radius:{{ deviceR }};border:10px solid #0e0e0e;background:#0e0e0e;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);overflow:hidden">
        <iframe src="Almanac%20Prototype%20v3.dc.html?frame=1" title="{{ deviceTitle }}" style="display:block;width:100%;height:100%;border:0;background:#ffffff"></iframe>
      </div>
    </div>
  </sc-if>
  <div style="flex:1;min-height:0;position:relative;overflow:auto;display:{{ inlineDisplay }}">
    <sc-if value="{{ isSite }}">
      <dc-import name="Proto Site v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ isWizard }}">
      <dc-import name="Proto Buyer Wizard v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ isWizardV2 }}">
      <dc-import name="Proto Buyer Wizard v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ isShell }}">

        <sc-if value="{{ hasSection }}">
          <x-import component-from-global-scope="AlmanacDesignSystem_94f443.PageHeader" dc-props="{{ sectionHeader }}" hint-size="100%,112px"></x-import>
        </sc-if>
        <sc-if value="{{ isSpApps }}">
          <dc-import name="Proto Supplier Apps v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isSpVer }}">
          <dc-import name="Proto Supplier Verification v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isSpCust }}">
          <dc-import name="Proto Supplier Customers v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isSpMoney }}">
          <dc-import name="Proto Supplier Money v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isBp }}">
          <dc-import name="Proto Buyer Portal v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,600px"></dc-import>
        </sc-if>
        <sc-if value="{{ isPp }}">
          <dc-import name="Proto Platform v3" screen="{{ screen }}" state="{{ state }}" go="{{ go }}" ctx="{{ ctx }}" set-ctx="{{ setCtx }}" hint-size="100%,400px"></dc-import>
        </sc-if>
        <sc-if value="{{ isNa }}">
          <x-import component-from-global-scope="AlmanacDesignSystem_94f443.PageHeader" title="{{ naTitle }}" hint-size="100%,72px"></x-import>
          <div style="padding:28px 24px 24px">
            <x-import component-from-global-scope="AlmanacDesignSystem_94f443.Empty" title="Not in this prototype" description="This page exists in the product but is not part of the v1 prototype journeys." hint-size="100%,200px"></x-import>
          </div>
        </sc-if>
      </x-import>
      <sc-if value="{{ showTabBar }}">
        <nav aria-label="Main" style="position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(26,26,26,.3)">
          <sc-for list="{{ tabItems }}" as="tb" hint-placeholder-count="5">
            <button type="button" onClick="{{ tb.onClick }}" aria-current="{{ tb.current }}" aria-label="{{ tb.label }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;padding:6px 0;border:0;border-radius:12px;background:transparent;color:{{ tb.fg }};font:500 12px/1.1 'Work Sans',system-ui,sans-serif;cursor:pointer;min-width:0">
              <span style="display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;background:{{ tb.pill }};transition:background-color 200ms cubic-bezier(.2,.8,.2,1)">{{ tb.icon }}</span>
              <span style="max-width:100%;white-space:nowrap;overflow:hidden;text-align:center">{{ tb.short }}</span>
            </button>
          </sc-for>
        </nav>
      </sc-if>
      <sc-if value="{{ moreOpen }}">
        <div style="position:fixed;inset:0;z-index:45">
          <button type="button" aria-label="Close menu" onClick="{{ closeMore }}" style="position:absolute;inset:0;border:0;background:rgba(26,26,26,.4);cursor:pointer"></button>
          <div role="dialog" aria-modal="true" aria-label="More" style="position:absolute;left:0;right:0;bottom:0;max-height:80vh;overflow:auto;background:var(--card);border-radius:19.2px 19.2px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:almSheetUp 300ms cubic-bezier(.4,0,.2,1) both">
            <div style="width:36px;height:4px;border-radius:2px;background:var(--border);margin:4px auto 12px"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 8px">
              <span style="font-size:16px;font-weight:600">More</span>

              </sc-for>
            </div>
            <div style="margin-top:12px;padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px">
              <span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:32px;height:32px;border-radius:16px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0">{{ meInitial }}</span><span style="font-size:14px;font-weight:500">{{ meName }}</span></span>
              <sc-if value="{{ poweredInSheet }}"><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);white-space:nowrap">Powered by<img src="assets/almanac-wordmark-v3.svg" alt="Almanac" width="78" height="11" style="display:block;height:11px;width:auto"></span></sc-if>
            </div>
          </div>
        </div>
      </sc-if>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ showRestore }}">
    <button onClick="{{ show }}" style="position:fixed;left:12px;bottom:12px;z-index:60;height:28px;padding:0 12px;border-radius:14px;border:0;background:#161616;color:#f5f5f5;font-size:12px;cursor:pointer;opacity:.85;box-shadow:var(--shadow-sm)">Show prototype controls (Alt H)</button>
  </sc-if>
  <sc-if value="{{ drawerOpen }}">
    <div style="position:fixed;inset:0;z-index:70;display:flex">
      <div style="width:380px;max-width:90vw;height:100%;background:var(--card);border-right:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)">
          <div style="display:flex;flex-direction:column;gap:2px">
            <span style="font-size:16px;font-weight:600">All screens</span>
            <span style="font-size:12px;color:var(--muted-foreground)">{{ drawerCount }}</span>
          </div>
          <button onClick="{{ closeDrawer }}" style="border:0;background:transparent;color:var(--muted-foreground);font-size:13px;cursor:pointer">Close</button>
        </div>
        <div style="padding:12px 20px;border-bottom:1px solid var(--border)">
          <input value="{{ query }}" onChange="{{ onQuery }}" placeholder="Search screens and states…" class="alm-input" style="width:100%;box-sizing:border-box;height:32px;padding:0 10px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--background);color:var(--foreground);font-size:14px">
        </div>
        <div style="flex:1;overflow-y:auto;padding:8px 12px 24px">
          <sc-for list="{{ drawerGroups }}" as="g" hint-placeholder-count="3">
            <div style="padding:14px 8px 6px;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);font-weight:600">{{ g.title }}</div>
            <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
              <div style="padding:8px;border-radius:var(--radius-md);background:{{ it.bg }}">
                <div style="font-size:14px;font-weight:500;margin-bottom:6px">{{ it.label }}</div>
                <div style="display:flex;flex-wrap:wrap;gap:4px">
                  <sc-for list="{{ it.states }}" as="st" hint-placeholder-count="2">
                    <button onClick="{{ st.onClick }}" style="height:22px;padding:0 8px;border-radius:var(--radius-sm);border:1px solid {{ st.border }};background:{{ st.bg }};color:{{ st.fg }};font-size:12px;cursor:pointer">{{ st.label }}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </sc-for>
        </div>
      </div>
      <button onClick="{{ closeDrawer }}" aria-label="Close" style="flex:1;border:0;background:var(--overlay-scrim);cursor:pointer"></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const A = 'Supplier portal', B = 'Buyer portal', C = 'Platform portal';
const SCREENS = [
