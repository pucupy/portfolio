<!-- @dsCard group="Brand" viewport="700x170" subtitle="Underline warms to full gold; text colour never moves" name="Link states" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--ground);padding:24px;font-family:var(--font-sans);font-size:17px;display:flex;flex-direction:column;gap:16px;">
  <span style="color:var(--ink-1);text-decoration:underline;text-decoration-color:var(--gold-underline);text-underline-offset:4px;text-decoration-thickness:1px;">Resting — .55 gold underline</span>
  <span style="color:var(--ink-1);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;text-decoration-thickness:1px;">Hover — full gold underline</span>
  <span style="color:var(--ink-1);outline:2px solid var(--gold);outline-offset:3px;border-radius:var(--radius-focus);width:max-content;">Focus-visible — 2px gold ring</span>
  <span style="font-size:var(--type-meta);color:var(--ink-3);"><span style="background:var(--gold);color:var(--ground);">::selection is gold on ground</span></span>
</div>
