<!-- @dsCard group="Colors" viewport="700x170" subtitle="Four ink tones, brightest to separator-only" name="Ink tones" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--ground);padding:22px;display:flex;flex-direction:column;gap:10px;font-family:var(--font-sans);font-size:17px;">
  <div style="color:var(--ink-1);">--ink-1 #EDEFEC — headings, leads, link text</div>
  <div style="color:var(--ink-2);">--ink-2 #A2ACA5 — body copy, nav links</div>
  <div style="color:var(--ink-3);">--ink-3 #79837C — date qualifiers, italic notes</div>
  <div style="color:var(--ink-4);">--ink-4 #4a5250 — · separators only, never text</div>
</div>
