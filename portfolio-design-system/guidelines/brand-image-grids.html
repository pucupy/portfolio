<!-- @dsCard group="Brand" viewport="700x200" subtitle="One / two / three-up, collapsing to a single column at 600px" name="Image arrangements" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--ground);padding:22px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);">
  <div style="height:44px;background:var(--rule-strong);border-radius:var(--radius-image);"></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--grid-gap-image);"><div style="height:40px;background:var(--rule-strong);border-radius:var(--radius-image);"></div><div style="height:40px;background:var(--rule-strong);border-radius:var(--radius-image);"></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--grid-gap-image);"><div style="height:36px;background:var(--rule-strong);border-radius:var(--radius-image);"></div><div style="height:36px;background:var(--rule-strong);border-radius:var(--radius-image);"></div><div style="height:36px;background:var(--rule-strong);border-radius:var(--radius-image);"></div></div>
  <div>heights 560 / 520 / 460 / 420 / 400 / 380 / 340 · gap 20px</div>
</div>
