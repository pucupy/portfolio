<!-- @dsCard group="Type" viewport="700x200" subtitle="Lead 18, body 17, note 14 italic" name="Body" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--ground);padding:24px;font-family:var(--font-sans);display:flex;flex-direction:column;gap:12px;">
  <p style="margin:0;font-size:var(--type-lead);line-height:var(--leading-body-long);color:var(--ink-1);">Standfirst at 18px in the brightest ink — one paragraph, never more.</p>
  <p style="margin:0;font-size:var(--type-body);line-height:var(--leading-body);color:var(--ink-2);">Body copy at 17px on 1.6, second ink tone, always inside the 700px measure with text-wrap: pretty.</p>
  <p style="margin:0;font-size:var(--type-meta);line-height:var(--leading-note);color:var(--ink-3);font-style:italic;">Italic 14px notes carry caveats — NDA, unresolved permissions.</p>
</div>
