<!-- @dsCard group="Components" viewport="700x220" subtitle="Hairline StatGrid and gold OutcomesCallout border" name="stats card" -->
<link rel="stylesheet" href="../../styles.css">
<div style="background:var(--ground);padding:28px;display:flex;flex-direction:column;gap:20px;">
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-strong);border:var(--border-strong);">
    <div style="background:var(--ground);padding:20px;"><div style="font-size:var(--type-h3-small);font-weight:500;color:var(--ink-1);margin-bottom:6px;">AA</div><div style="font-size:var(--type-ui);color:var(--ink-2);">Contrast, every flow</div></div>
    <div style="background:var(--ground);padding:20px;"><div style="font-size:var(--type-h3-small);font-weight:500;color:var(--ink-1);margin-bottom:6px;">17</div><div style="font-size:var(--type-ui);color:var(--ink-2);">Languages supported</div></div>
    <div style="background:var(--ground);padding:20px;"><div style="font-size:var(--type-h3-small);font-weight:500;color:var(--ink-1);margin-bottom:6px;">0</div><div style="font-size:var(--type-ui);color:var(--ink-2);">Shadows in the system</div></div>
  </div>
  <div style="border:1px solid var(--gold-border);padding:20px 24px;">
    <div style="font-size:var(--type-h2-mid);font-weight:500;letter-spacing:var(--tracking-h2-mid);color:var(--ink-1);">Outcomes</div>
  </div>
</div>
