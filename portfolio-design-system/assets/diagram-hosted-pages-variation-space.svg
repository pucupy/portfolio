<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 432" role="img" aria-labelledby="vs-title vs-desc" preserveAspectRatio="xMidYMid meet">
<title id="vs-title">Hosted Pages: the decision points that multiply</title>
<desc id="vs-desc">Five branching decisions — licence model, whether the institution is preselected, product, market, and whether the consent sheet is shown — multiply out across the desktop flow, alongside five exception paths that sit outside the grid.</desc>

<g class="d">

<rect class="gold-fill" x="50" y="16" width="10" height="10" rx="2" stroke-width="0.5"></rect>
<text class="note" x="66" y="25">Set by the customer&#39;s integration</text>
<rect class="neu-fill" x="320" y="16" width="10" height="10" rx="2" stroke-width="0.5"></rect>
<text class="note" x="336" y="25">Set by product and market</text>

<text class="lbl" x="50" y="66" dominant-baseline="central">Licence model</text>
<rect class="gold-fill" x="214" y="44" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="opt" x="289" y="66" text-anchor="middle" dominant-baseline="central">Direct licence</text>
<rect class="gold-fill" x="374" y="44" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="opt" x="449" y="66" text-anchor="middle" dominant-baseline="central">Yapily Connect</text>
<rect class="bare" x="546" y="44" width="84" height="44" rx="8" stroke-width="0.5"></rect>
<text class="mul" x="588" y="66" text-anchor="middle" dominant-baseline="central">×2</text>

<text class="lbl" x="50" y="124" dominant-baseline="central">Institution ID</text>
<rect class="gold-fill" x="214" y="102" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="opt" x="289" y="124" text-anchor="middle" dominant-baseline="central">Preselected</text>
<rect class="gold-fill" x="374" y="102" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="opt" x="449" y="124" text-anchor="middle" dominant-baseline="central">Bank selection</text>
<rect class="bare" x="546" y="102" width="84" height="44" rx="8" stroke-width="0.5"></rect>
<text class="mul" x="588" y="124" text-anchor="middle" dominant-baseline="central">×2</text>

<text class="lbl" x="50" y="182" dominant-baseline="central">Product</text>
<rect class="neu-fill" x="214" y="160" width="98" height="44" rx="8" stroke-width="0.5"></rect>
<text class="neu" x="263" y="182" text-anchor="middle" dominant-baseline="central">Payments</text>
<rect class="neu-fill" x="320" y="160" width="98" height="44" rx="8" stroke-width="0.5"></rect>
<text class="neu" x="369" y="182" text-anchor="middle" dominant-baseline="central">Data</text>
<rect class="neu-fill" x="426" y="160" width="98" height="44" rx="8" stroke-width="0.5"></rect>
<text class="neu" x="475" y="182" text-anchor="middle" dominant-baseline="central">cVRP (UK)</text>
<rect class="bare" x="546" y="160" width="84" height="44" rx="8" stroke-width="0.5"></rect>
<text class="mul" x="588" y="182" text-anchor="middle" dominant-baseline="central">×3</text>

<text class="lbl" x="50" y="240" dominant-baseline="central">Market</text>
<rect class="neu-fill" x="214" y="218" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="neu" x="289" y="240" text-anchor="middle" dominant-baseline="central">UK</text>
<rect class="neu-fill" x="374" y="218" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="neu" x="449" y="240" text-anchor="middle" dominant-baseline="central">EU</text>
<rect class="bare" x="546" y="218" width="84" height="44" rx="8" stroke-width="0.5"></rect>
<text class="mul" x="588" y="240" text-anchor="middle" dominant-baseline="central">×2</text>

<text class="lbl" x="50" y="298" dominant-baseline="central">Consent sheet</text>
<rect class="gold-fill" x="214" y="276" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="opt" x="289" y="298" text-anchor="middle" dominant-baseline="central">Shown</text>
<rect class="gold-fill" x="374" y="276" width="150" height="44" rx="8" stroke-width="0.5"></rect>
<text class="opt" x="449" y="298" text-anchor="middle" dominant-baseline="central">Hidden</text>
<rect class="bare" x="546" y="276" width="84" height="44" rx="8" stroke-width="0.5"></rect>
<text class="mul" x="588" y="298" text-anchor="middle" dominant-baseline="central">×2</text>

<rect class="dash" x="50" y="344" width="580" height="68" rx="12" stroke-width="0.5"></rect>
<text class="note" x="66" y="366" dominant-baseline="central">Exception paths outside the grid</text>
<text class="note" x="66" y="388" dominant-baseline="central">Link expiry · Bank not found · Preselected skips all screens · UK agent, data only · cVRP without bank button</text>

</g>
</svg>