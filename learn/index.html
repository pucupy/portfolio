link to another site should never look like a button.", "kind": "default", "source": "Kalbag"}, {"rule": "Use a top bar for a few stable sections and a left sidebar for apps with many or growing sections.", "why": "Websites put primary navigation in the header and applications down the left. Left navigation scales and scans well, at the cost of a lower content-to-chrome ratio.", "kind": "principle", "source": "Uxcel; Laubheimer, NN/g"}, {"rule": "Allow one tier of dropdown at most; use a mega menu or hub page for more.", "why": "A plain dropdown frustrates at two tiers, and long thin hover flyouts need precise mouse paths. One participant took six attempts to reach a link.", "kind": "principle", "source": "Laubheimer and Cardello, NN/g"}, {"rule": "Open menus and mega menus on click, close on Escape and outside click, and keep them keyboard navigable.", "why": "Hover fails on touch and keyboard. If hover is kept for mouse users, everyone who can't hover must still reach every destination.", "kind": "default", "source": "Budiu, NN/g"}, {"rule": "On touch, never split a menu trigger into a text link and an arrow.", "why": "Two small targets behave unpredictably. A tap opens the menu, and the first item inside links to the landing page, labelled 'View all', never 'Home'.", "kind": "technique", "source": "Budiu, NN/g"}, {"rule": "Show the current location in every menu with two cues, such as colour plus position.", "why": "NN/g calls a missing 'you are here' cue the commonest menu mistake, and designers underrate how subtle their own cues are. Mark the current page with aria-current.", "kind": "principle", "source": "Laubheimer, NN/g"}, {"rule": "Put the logo top left, linking home, and add a text Home link too.", "why": "Top-left logos were found in a fraction of a second, centred ones in a second or more (indicative). Less technical people often don't know the logo is a link.", "kind": "evidence", "source": "Pernice and Loranger, NN/g"}, {"rule": "Avoid sticky menus; fix the long page instead.", "why": "They cover content, worsen at zoom and on small screens, and show-hide-on-scroll toggles by accident. If one is unavoidable, keep it small, opaque and still, and never let it hide focused elements.", "kind": "default", "source": ""}], "sourcesDiffer": ["Sticky headers: brain says avoid them; NN/g and Uxcel suggest sticky or partly sticky menus on long pages. Default: not sticky; on genuinely long pages a slim bar that doesn't hide and reappear, following NN/g's size and contrast advice.", "Hover mega menus: brain opens them on click; Nielsen and Li accept hover with a 0.5s intent delay and full timings. Default: click; if hover is kept for mouse users, apply all the timings.", "Hamburger for primary navigation on phones: brain uses it only for secondary items in apps; Kaplan (NN/g) treats it as viable for mobile websites. Default: on mobile websites with more than four top-level categories, a labelled top-left hamburger is acceptable, backed by in-page links and a footer.", "Fixed caps on top-level items: some sources cap navigation at 5 or 7. Default: no fixed count; group by scent and tree-test."], "tryIt": "Open a product you work on at desktop width and list every navigation structure on one page. Check that top-level categories are visible, the current location is marked twice, and every menu opens on click and works with the keyboard.", "quiz": [{"q": "A marketing site with eight top-level sections puts them all behind a hamburger on desktop to look cleaner. What is the main risk?", "options": ["The hamburger icon won't be recognised by most people", "People use the navigation less, find it later and take longer on tasks", "Search engines can't crawl links inside a hamburger", "It breaks the one-tier dropdown rule"], "answer": 1, "explain": "NN/g found desktop hamburgers were used far less and tasks took at least 39% longer. Recognition of the icon is no longer the main problem; hiding is."}, {"q": "On a touch screen, a menu label opens a landing page when tapped on its text and a submenu when tapped on its arrow. What should you do?", "options": ["Make the arrow larger so it meets target size", "Use first tap to open and second tap to navigate", "Show the submenu on hover with a delay", "Make a tap open the menu and put a 'View all' link to the landing page first inside it"], "answer": 3, "explain": "A split trigger gives two small, unpredictable targets. One tap opens the menu, and the first item links to the landing page. 'First tap opens, second navigates' is a weaker fallback."}, {"q": "A section needs three tiers of links in the header. Which pattern fits best?", "options": ["A mega menu, opened on click, or a hub page", "A cascading dropdown with flyouts for each tier", "A hover dropdown with a 0.5s intent delay", "A sticky header that shows every tier at once"], "answer": 0, "explain": "A plain dropdown should hold one tier only. Two or three tiers call for a mega menu or a routing page, and brain opens these on click."}]}, {"id": "m05-l2", "title": "URLs, pagination and wayfinding", "neuron": "navigation-and-ia", "intro": "People arrive anywhere, share links and press Back. URLs, page titles, breadcrumbs and pagination tell them where they are and let them return. Treat these as part of the design, not plumbing.", "points": [{"rule": "Let the URL reflect state: filters, tabs, pagination and expanded panels.", "why": "Deep-linking state means share, refresh and Back and Forward all work.", "kind": "default", "source": ""}, {"rule": "Default to pagination over infinite scroll; use 'Load more' as the compromise and keep infinite scroll for feeds.", "why": "Pagination keeps people in control, lets them find things again and reach the footer. Restore scroll position on Back and Forward.", "kind": "default", "source": ""}, {"rule": "When truncating pagination, always show first, last and current page, plus previous and next.", "why": "'Page 3 of 10' tells people where they are. Data-heavy lists also get a page-size choice and a go-to-page field.", "kind": "technique", "source": "Uxcel"}, {"rule": "Make 'Show more' state position, such as 'Viewing 40 of 333'.", "why": "Hide the button at the end and show the total. Infinite loading, where it stays, needs a persistent count.", "kind": "technique", "source": "Moran, NN/g"}, {"rule": "Avoid infinite scroll when people seek one item, compare far-apart items or use assistive technology.", "why": "It also fails people on slow connections and can hide content from search engines. If a feed stays, use the ARIA feed role.", "kind": "caution", "source": "Neusesser, NN/g"}, {"rule": "Plan readable URLs whose folders mirror the hierarchy, and never mask them.", "why": "Lowercase, hyphens, one trailing-slash policy, short but descriptive. People read URLs as a trust signal, and an unwritten scheme goes patchy.", "kind": "technique", "source": "Martin; Haines"}, {"rule": "Write page titles most specific first: page, section, service.", "why": "Front-loaded titles help people tell parked tabs apart, since only 2–3 words show per tab. The title always reflects the current context.", "kind": "technique", "source": "Moran and Nielsen, NN/g"}, {"rule": "Use breadcrumbs from three levels deep, with the current page last and unlinked.", "why": "They show where a page sits, not browsing history. Show one canonical trail, include real pages only, never wrap, and on mobile use a single 'Back to [parent]' link.", "kind": "principle", "source": "Uxcel; Laubheimer, NN/g"}, {"rule": "Make deep links survive login and land on the promised content.", "why": "Sending people to the home page after sign-in shows as heavy drop-off at step two.", "kind": "principle", "source": "Laubheimer, NN/g"}, {"rule": "From a detail page reached via a list, offer previous and next with position, and keep the list's state on Back.", "why": "'4 of 32' orients people, and Back should return to the list with filters, sort and page intact.", "kind": "technique", "source": "Calvo"}], "sourcesDiffer": ["Pagination and fairness: brain defaults to pagination; Martin cites a directory that didn't paginate so later pages wouldn't bury candidates with fewer resources. Default: paginate, but when sort order reflects advantage, check who lands on page 5 and consider a neutral order.", "Overlay URLs: one source says a modal changes neither URL nor history; another gives content overlays their own URL. Default: short decision modals get no URL; drawers showing a viewable object get one; reading content gets a real page.", "Current page in breadcrumbs: Helios ends with it unlinked; Paste omits it. Default: last and unlinked.", "Table of contents on mobile: brain says collapsible; NN/g found many people never noticed a collapsible sticky list. Default: an in-body list that doesn't stick, or headings as accordions."], "tryIt": "Pick a filtered list in your product, apply two filters and go to page 3, then copy the URL into a new window and press Back from a detail page. Note every piece of state that was lost.", "quiz": [{"q": "A team wants infinite scroll on a 2,000-item catalogue where people usually hunt for one specific product. What is the best default?", "options": ["Infinite scroll with a loading spinner", "Infinite scroll with page markers inside the list", "Pagination, keeping page and filters in the URL", "A single page that loads all 2,000 items"], "answer": 2, "explain": "Very large catalogues keep pagination, and infinite scroll fails when people seek one item. Putting state in the URL lets them share, refresh and return."}, {"q": "Someone clicks an emailed link to an invoice, is asked to sign in, and lands on the dashboard. What should change?", "options": ["After sign-in, take them straight to the invoice the link promised", "Add a banner on the dashboard pointing to invoices", "Remove the sign-in step for emailed links", "Send a second email once they've signed in"], "answer": 0, "explain": "Deep links must survive login. Landing on the home page instead shows up as heavy drop-off at the second step."}, {"q": "Which breadcrumb follows the guidance?", "options": ["A trail of the pages the person visited this session", "Several trails, one for each parent the page belongs to", "A trail that wraps to two lines on mobile so nothing is cut", "One canonical trail of real pages, ending with the current page unlinked"], "answer": 3, "explain": "Breadcrumbs show where a page sits, not history. Show one primary path even on polyhierarchical sites, skip groupings with no page, and never wrap."}]}, {"id": "m05-l3", "title": "Platform and app navigation", "neuron": "app-navigation", "intro": "Apps navigate within platform rules that people already know. iOS, Android and macOS differ in back behaviour, tab bars and menus. Keep one visual language, and let navigation, controls and gestures behave like the OS.", "points": [{"rule": "Look like your product, behave like the OS: adapt navigation, system controls and gestures per platform.", "why": "iOS keeps a history stack per tab while Android has one back stack. Never suppress iOS swipe-back, and don't carry action sheets to Android or a FAB to iOS without reason.", "kind": "principle", "source": "Dean"}, {"rule": "Use a tab bar for 3 to 5 top-level destinations that people switch between often.", "why": "Use a drawer for more than 5 or rarely used ones, accepting that hidden means less found. Each tab has an icon and a label; avoid a More tab.", "kind": "principle", "source": "Apple HIG; mobile-design"}, {"rule": "Tab bars navigate and never act; put actions in a toolbar.", "why": "Keep the tab bar visible everywhere except under a modal. Never hide or disable a tab; open it and explain why it's empty.", "kind": "principle", "source": "Apple HIG"}, {"rule": "On Android, choose navigation by window size: bar when compact, rail when medium or expanded.", "why": "Under 600dp a navigation bar for 3 to 5 destinations; 600dp and up a rail, with a drawer for 5 or more. This is a paraphrase of Material 3, so check against its docs.", "kind": "technique", "source": "ehmo, after Material 3"}, {"rule": "Return each tab to the exact screen and scroll position left.", "why": "Persist the selected tab, scroll positions, drafts and the recent stack across interruptions, but not dialogs, temporary states or stale data.", "kind": "principle", "source": "mobile-design"}, {"rule": "Make deep links build the whole stack, so Back goes to Home rather than out of the app.", "why": "A link to something that no longer exists lands on a fallback with a message, never a blank screen. A link mid-session pushes on top, or asks before replacing.", "kind": "technique", "source": "mobile-design"}, {"rule": "Avoid drill-down menus on mobile websites; choose subnavigation by the number of subcategories.", "why": "The in-menu Back is confused with the browser Back, which closes the whole menu. Under about 6 subcategories use accordions; 6–15 a section menu; more than 15 landing pages.", "kind": "caution", "source": "Budiu, NN/g"}, {"rule": "Keep the Back button's destination label.", "why": "Some apps dropped it for a bare arrow and now behave inconsistently. A labelled 'Back to X' tells people where they will go.", "kind": "principle", "source": "Budiu, NN/g"}, {"rule": "Keep controls out of system gesture zones and give every gesture a non-gesture alternative.", "why": "Avoid about the bottom 20dp and 24dp at side edges on Android. Long press is never the only route to a feature, and swipe-to-dismiss is undoable or confirmed.", "kind": "caution", "source": "ehmo"}, {"rule": "Don't carry phone patterns to large screens.", "why": "Mobile-first sites on desktop got less navigation use (54% against 77% on mobile; indicative). Same features and content everywhere, UI designed for each device.", "kind": "evidence", "source": "Budiu and Pernice, NN/g"}], "sourcesDiffer": ["Icon rail or peek for a collapsed sidebar: one source rejects an icon rail and peeks the real sidebar; another offers a 56 to 72px rail as opt-in. Default: icon-only rails only for daily-use tools by the person's choice; prefer a peek."], "tryIt": "Open your app, go two screens deep in one tab, switch tabs and come back. Then open a deep link from outside the app and press Back. Note whether position and stack behave as the platform expects.", "quiz": [{"q": "An iOS app puts a 'New post' action in the tab bar alongside four destinations. What is the issue?", "options": ["Tab bars should hold at most three items", "Tab bars navigate and never act; the action belongs in a toolbar", "The action needs a badge to stand out", "It should be hidden until the person has posted once"], "answer": 1, "explain": "Apple's guidance is that tab bars only navigate. Actions go in a toolbar, and tabs are never hidden or disabled."}, {"q": "A user taps a push notification for a product, views it, then presses Back and leaves the app entirely. What fix fits the guidance?", "options": ["Disable the Back gesture on deep-linked screens", "Show a dialog asking whether they really want to leave", "Open the product in an in-app browser", "Build the stack so the product opens with Home underneath"], "answer": 3, "explain": "Deep links build the whole stack, so Back goes to Home rather than out of the app. Intercepting Back with 'are you sure?' is only for unsaved input."}, {"q": "A mobile website has 12 subcategories under each main category. Which subnavigation is recommended?", "options": ["A section menu styled unlike the main menu", "A drill-down menu with an in-menu Back link", "Accordions inside the global menu", "A scrolling tab bar of all 12"], "answer": 0, "explain": "About 6–15 subcategories suit a section menu that looks different from the main menu. Drill-down menus are confused with browser Back, and accordions suit fewer than about 6."}]}, {"id": "m05-l4", "title": "Information architecture and labels", "neuron": "information-architecture", "intro": "Navigation can only be as good as the structure and labels beneath it. Settle how content is grouped, ordered and named before choosing a navigation pattern. Organise around people's tasks and words, not the organisation.", "points": [{"rule": "Settle the IA before choosing the navigation pattern.", "why": "Each pattern limits depth, so choosing it first forces a redesign or squashes content. Push back on 'design the nav' when there is no structure under it.", "kind": "principle", "source": "Cardello, NN/g; Spencer"}, {"rule": "Organise by task or topic, not by audience, department or format.", "why": "Audience splits add a self-sorting step and fail people who fit several groups or none; department sections follow Conway's law. Task-based intranet IAs survived reorganisations better (indicative).", "kind": "principle", "source": "Martin; McCloskey, NN/g"}, {"rule": "Split each level on one dimension, and use the others as filters or cross-links.", "why": "'Recipes', 'Dinner' and 'Summer' side by side mix type, meal and season, leaving a salad recipe with no obvious home.", "kind": "principle", "source": "Loranger and Dykes, NN/g"}, {"rule": "Choose an organising scheme on purpose: location, alphabet, time, category or hierarchy.", "why": "Alphabet finds known items, so it rarely belongs at the top level. Grouping is not ordering: categories still need an order, which is a separate decision.", "kind": "technique", "source": "Wurman via Martin"}, {"rule": "Ban catch-all labels such as 'Resources', 'Other' or 'Miscellaneous'.", "why": "They signal an unsolved classification problem and fill up like a junk drawer. Labels should be clear, specific, inclusive and consistent.", "kind": "caution", "source": "Martin"}, {"rule": "Keep verbs, slogans, branded names and 'I want to…' out of category labels.", "why": "'Engage' or 'Partner' hides what's inside, and process or brand names mean nothing to outsiders. Task verbs are fine only when they name the task.", "kind": "caution", "source": "Laubheimer, NN/g"}, {"rule": "Treat the three-click and seven-item rules as myths.", "why": "No study supports either. Effort is the sum of each step's difficulty, so five quick, confident clicks beat three uncertain ones. Let card sorting settle the number of categories.", "kind": "evidence", "source": "Laubheimer and Nielsen, NN/g"}, {"rule": "Prefer broad and shallow; fix a long flat list by grouping with subheads before adding levels.", "why": "Flag content 4 or more levels deep. In a 32-item menu items get missed, so group first and add a level only when one level is too long.", "kind": "principle", "source": "Uxcel; Whitenton, NN/g"}, {"rule": "Cross-list an item under a second parent only when evidence shows people split between the two.", "why": "Use a consistent divide in a card sort or tree test. Items cross-listed almost everywhere are a warning sign, and breadcrumbs still show one canonical path.", "kind": "principle", "source": "Laubheimer, NN/g"}, {"rule": "Use progressive disclosure with two levels, not three, and one route to each hidden option.", "why": "Everything frequently needed goes up front, behind a control whose label says what lies behind it. Beyond one secondary level people get lost; several routes undo the simplification.", "kind": "principle", "source": "Nielsen, NN/g"}], "sourcesDiffer": ["Depth: Dean caps primary content at 3 levels but says wide, flat structures are harder than moderate depth with clear labels; Uxcel says broad and shallow beats narrow and deep. Default: broad and shallow, and tree-test when one level gets long enough to need scanning.", "Parallel label syntax: Uxcel says labels match in syntax; NN/g found forcing one form produced vague catch-alls. Default: aim for parallel form, and break it whenever forcing it makes a label vague.", "Disabled until ready: one source keeps a Join button inactive until a code is entered; brain never pre-disables a primary action. Default: responsive enabling is fine for tools that depend on a selection, not for the action that completes a task."], "tryIt": "List your product's top-level navigation labels and test each against the label rules: catch-alls, verbs or slogans, mixed dimensions, audience or department splits. Rewrite the worst two and note what each should hold.", "quiz": [{"q": "A university site's top level reads 'Students', 'Staff', 'Alumni', 'Partners'. What is the main problem?", "options": ["The labels are not in parallel syntax", "There are too few top-level items", "Audience splits make people self-sort and fail those who fit several groups or none", "Audience labels should be ordered alphabetically"], "answer": 2, "explain": "Audience-based top levels add a sorting step, fail people in several groups and duplicate content. Organise by shared tasks instead."}, {"q": "A stakeholder insists every page be reachable in three clicks, which would squeeze 40 items into one menu. How should you respond?", "options": ["Agree, because the three-click rule reduces drop-off", "Explain the rule is a myth; clear, confident steps matter more than the count", "Split the menu into five dropdowns of eight", "Add a 'Quick links' list to the home page"], "answer": 1, "explain": "No study supports the three-click rule. Effort is the sum of each step's difficulty, so more quick, confident clicks can beat fewer uncertain ones."}, {"q": "Your settings have a basic screen, an 'Advanced' panel, and inside that an 'Expert' panel. What does the guidance suggest?", "options": ["Add links to Expert from several places so it is easy to find", "Keep three levels, as each serves a distinct audience", "Move everything onto one long screen", "Simplify to two levels, grouping advanced options logically so people check one place"], "answer": 3, "explain": "Beyond one secondary level people get lost. Simplify first, then group advanced options so there is one place to look, with one route to each."}]}, {"id": "m05-l5", "title": "Findability and search interfaces", "neuron": "books-interaction-and-ia", "intro": "A structure is only good if people can find things in it, and taste can't tell you that. Test structure and labels separately from the interface, then design search to support the loop of searching, scanning and refining.", "points": [{"rule": "Card sorts generate structure; tree tests evaluate it, before visual design.", "why": "Card-sort groupings vary between people, so treat them as raw material. A common sequence is usability-test the current site, card-sort, then tree-test candidate hierarchies.", "kind": "technique", "source": "Tankala, NN/g"}, {"rule": "Read low success with high directness as a labelling or placement problem.", "why": "It means people confidently went to the wrong place. Fix by relabelling, moving, splitting or merging, then retest with the same tasks.", "kind": "technique", "source": "Sharon"}, {"rule": "Find out whether the IA or the UI is at fault by running at least one of each test type.", "why": "Tree tests and closed card sorts test labels and structure; click and usability tests show whether navigation gets noticed. If the sort succeeds and the click test fails, the layout is the problem.", "kind": "principle", "source": "Cardello, NN/g"}, {"rule": "Treat first clicks as a strong predictor of success.", "why": "People whose first click is on the right path succeed about 87% of the time against 46% when it's wrong (indicative). Decide the best and acceptable first clicks before seeing results.", "kind": "evidence", "source": "Sharon"}, {"rule": "Judge tree-test results against your own baseline; critical tasks should exceed 90%.", "why": "Across 98 tree tests the median task success was 62% (indicative). Compare only tasks at similar depth.", "kind": "evidence", "source": "Albert and Tullis via Laubheimer, NN/g"}, {"rule": "Don't rely on search to rescue weak navigation.", "why": "People can't search for what they don't know exists. In one set of tests about 70% started with a link and 30% with search (indicative).", "kind": "caution", "source": "Bank and Cao; UX Myths"}, {"rule": "Default search to everything and offer filters afterwards, not a scope picker before.", "why": "Pickers beside the box go unnoticed. Show results at once, with aids such as suggestions and categories beside them, never instead.", "kind": "principle", "source": "Hearst"}, {"rule": "Invest in ranking and keep the query visible and editable.", "why": "The top result took about 40–85% of clicks, and about half of sessions involve reformulation (indicative). People pick the first hit or rephrase rather than scan.", "kind": "evidence", "source": "Hearst"}, {"rule": "Use orthogonal facets with counts, and let people remove one facet without starting over.", "why": "Counts avoid zero-result paths, and a removable crumb per facet keeps refinement cheap. Parametric 'set every dropdown then submit' forms produce dead ends.", "kind": "technique", "source": "Hearst"}, {"rule": "Map users' commonest words to your terms in search and support re-finding.", "why": "Two people choose the same term only about 10–20% of the time, and about 40% of result clicks in one study were on pages seen before (indicative). Offer recent searches and history.", "kind": "evidence", "source": "Hearst; Furnas"}], "sourcesDiffer": ["Tree-test sample size: Sharon's figures (about 250 per tree when comparing) are for tight margins; Laubheimer says about 50 per tree detects large differences. Card sorts need about 15 to 30 participants (indicative)."], "tryIt": "Write five core tasks for your product without using the target labels' words, then run a quick tree test or first-click test with a handful of colleagues. Note where first clicks scatter and which labels drew confident wrong answers.", "quiz": [{"q": "In a tree test, most people go straight to 'Billing' to change their address, without backtracking, and fail. What does this suggest?", "options": ["A labelling or placement problem: people are confidently going to the wrong place", "The tree is too deep and needs flattening", "The sample size is too small to conclude anything", "People need a search box to find the task"], "answer": 0, "explain": "Low success with high directness means people confidently chose the wrong place. Relabel or move the item, then retest with the same tasks."}, {"q": "A closed card sort shows people agree on the groupings, but in a click test on the real screen they miss the navigation. Where is the problem?", "options": ["In the labels, which need renaming", "In the taxonomy, which needs another level", "In the layout or interface, not the IA", "In the sample, which was not representative"], "answer": 2, "explain": "When the card sort succeeds and the click test fails, the labels and structure are fine and the layout is the problem."}, {"q": "A team plans a dropdown beside the search box asking people to choose a section before they search. What is better?", "options": ["Make the dropdown required so results are more precise", "Search everything by default and offer filters with counts on the results", "Replace results with category suggestions until a section is picked", "Ask for Boolean operators to narrow the search"], "answer": 1, "explain": "Scope pickers before searching go unnoticed. Default to everything and offer refinements afterwards, with facet counts to avoid dead ends."}]}]}, {"id": "m06", "title": "Data, screens and components", "summary": "How to design tables, filters, search, charts, dashboards, components, icons and diagrams that people can scan, trust and act on.", "neurons": ["data", "charts-and-dashboards", "components-and-systems", "icons", "diagrams"], "lessons": [{"id": "m06-l1", "title": "Tables and data grids", "neuron": "data", "intro": "Tables are where people scan, compare and act on records, so small choices about alignment, density and empty values decide whether they can find things in seconds. Start by knowing what each column holds and what people do with the rows.", "points": [{"rule": "Left-align text, right-align quantities, and align each header to match its column.", "why": "Right-align quantities people compare and anything with decimals, including money. Identifiers, phone numbers, postcodes and dates can sit left, and cells or headers are never centred or justified.", "kind": "principle", "source": "Andrew Coyle; Helios; Paste"}, {"rule": "Give every column a data type, and let the type set alignment, sorting and filtering.", "why": "In Uber Base, numbers and times are right-aligned and monospaced and open range or date filters; categories open a checklist; ordinal values sort by their defined order, not the alphabet; free text is found through search.", "kind": "technique", "source": "Uber Base"}, {"rule": "Use plain rows with light dividers by default, not zebra stripes.", "why": "Stripes clash with hover, selected, focused and disabled states, which can add up to five background levels. Keep stripes for very wide, dense tables and test every state on both stripe colours.", "kind": "principle", "source": "Pencil & Paper"}, {"rule": "Pick row density from a known scale, and make density a separate setting from text truncation.", "why": "Coyle uses 40px comfortable and 32px compact; Uxcel uses 40, 48 and 56px and calls 32px too cramped, and its scale suits touch. Keeping density apart from full-text preview lets experts get dense rows without losing long values.", "kind": "technique", "source": "Andrew Coyle; Uxcel; commercetools"}, {"rule": "Never scroll a wide table sideways on a phone; use stacked rows or a rotating table.", "why": "Stacked rows put the primary field and status on line one and two key values on line two. When rows must be compared, fix the row identifiers and let one selector choose which single column shows beside them.", "kind": "principle", "source": "Winter, UX Collective"}, {"rule": "Use one empty-value component everywhere, and keep 0 for real zeros.", "why": "Unknown is not zero, so a missing value never shows as 0, null or a mix of blanks and N/A. Paste separates not yet available, a real zero and not applicable, and the empty text should be something a screen reader announces.", "kind": "principle", "source": "Calvo; arla6ka; Paste"}, {"rule": "Use a data grid, not a plain table, once cells hold links, selection or actions.", "why": "Fifty rows with four actions each means 200 Tab presses in a plain table. A data grid is one tab stop with arrow-key navigation, and Enter switches into the cell's controls.", "kind": "principle", "source": "Paste; Helios; Salesforce Lightning"}, {"rule": "Keep bulk-select checkboxes visible, and show a bulk-action bar with the count once a row is selected.", "why": "Hover-revealed checkboxes fail on touch and hide that bulk actions exist. Selection persists across pages and filters; the header checkbox selects only the current page and shows an indeterminate state.", "kind": "principle", "source": "Uxcel; Helios; Nguyen and Rafalowicz"}, {"rule": "Use pagination with visible totals rather than infinite scroll.", "why": "Infinite scroll breaks bookmarking, footer access and returning to an earlier position, while pages give a natural stopping point. Show totals such as '1 to 50 of 1,240', and disable rather than hide Previous on the first page.", "kind": "default", "source": "UI-Patterns; Checklist Design"}, {"rule": "Nest rows only when the child rows help finish the task, and keep it to one level.", "why": "One level is good, two is the maximum and three or more means redesign. A parent with no children says so and offers a next step rather than opening onto a blank area.", "kind": "caution", "source": "Bamgbelu"}], "sourcesDiffer": ["Pencil & Paper reveals row checkboxes on hover; Uxcel keeps them visible; default: visible, since hover fails on touch.", "Uber Base stripes every data table; brain prefers light dividers; default: dividers, with stripes only for very wide, dense tables.", "UI-Patterns sorts ascending on first click; Uber Base sorts descending first; default: ascending first for text and dates, descending first for quantities, with one rule across the product.", "Suipe and Checklist Design allow horizontal scroll for short, wide tables on phones; brain never scrolls sideways; default: stacked rows, or the rotating table when rows must be compared."], "tryIt": "Take one table in your product and give every column a declared data type. Then check its alignment, sort behaviour, empty values and phone layout against that type.", "quiz": [{"q": "On a phone, people need to compare delivery dates across 40 orders in an eight-column table. What should you design?", "options": ["Horizontal scroll with a frozen first column", "A rotating table: fixed order identifiers with a selector that chooses which one column shows", "The full table at a smaller font size", "One card per order with every field listed"], "answer": 1, "explain": "Brain never scrolls a wide table sideways on a phone. When rows must be compared, the rotating table keeps the identifiers fixed and shows one chosen attribute down many rows."}, {"q": "A table has an invoice ID column and an amount column with decimals. How should they align?", "options": ["Both right-aligned, because both contain digits", "Both centred for balance", "IDs right-aligned and amounts left-aligned", "IDs left-aligned and amounts right-aligned"], "answer": 3, "explain": "Quantities people compare and anything with decimals are right-aligned. Identifiers are numbers but not quantities, so they sit left."}, {"q": "Some rows have no forecast yet, and the team shows 0 in those cells. What is the better approach?", "options": ["Keep 0 so the column total still works", "Use one consistent empty-value component and keep 0 for real zeros", "Leave some cells blank and type N/A in others", "Hide rows that have no forecast"], "answer": 1, "explain": "Unknown is not zero. A 0 claims a real zero, so missing values need one consistent empty-value treatment that a screen reader can announce."}]}, {"id": "m06-l2", "title": "Filters and search", "neuron": "data", "intro": "People rarely find things with one filter or one perfect query. They combine several filters, reword searches and give up when results vanish. Design filters that stay still while people use them, and search that never leaves them at a dead end.", "points": [{"rule": "Design for several filters at once, because relevant results usually take four or five.", "why": "In Friedman's testing people rarely applied one filter. Applying on every click makes them scroll back and reopen the same menu again and again.", "kind": "evidence", "source": "Vitaly Friedman"}, {"rule": "Choose how filters apply: live for small, fast lists; per filter or batch Apply for large or slow data.", "why": "Live suits small, low-stakes lists. Per-filter updates let people tick several values undisturbed, and one global Apply with the match count suits very large data or slow systems.", "kind": "technique", "source": "Pencil & Paper; Uxcel"}, {"rule": "Filters never freeze, jump or reset while people are choosing.", "why": "Update results asynchronously while the panel stays usable. Never scroll to the top after an input or auto-collapse a group, and keep filters across refresh and Back.", "kind": "principle", "source": "Vitaly Friedman"}, {"rule": "Show applied filters as removable chips above the results, with a result count and Clear all.", "why": "Active filters should show three times: ticked in the menu, counted on the filter's label, and in an applied-filters summary. Chips above the results, not above the panel, stop the panel shifting.", "kind": "technique", "source": "Pencil & Paper; Friedman"}, {"rule": "Order filter values by their type, not alphabetically by default.", "why": "Sizes run smallest to largest, price low to high and ratings high to low; known names such as brands go A to Z. Zappos sorted shoe widths alphabetically, splitting adjacent widths, and testers barely used the filter.", "kind": "evidence", "source": "Moran and Nielsen, NN/g"}, {"rule": "Name filters and values concretely, in people's own words.", "why": "Avoid vague names like 'Item type' and spell out abbreviations. A filter with only vague values frustrates people more than a missing filter.", "kind": "principle", "source": "Moran and Harley, NN/g"}, {"rule": "Never show a bare 'no results'; explain why and offer a way forward.", "why": "Offer near matches, popular items or a contact route, and handle plurals, typos and spelling variants. Only 28% of searches succeeded after a failed first query, because people kept rewording (indicative).", "kind": "principle", "source": "Smashing; Nielsen, NN/g"}, {"rule": "Show a visible search field, not just an icon, when search is a primary task.", "why": "Size the field for about 27 characters and keep the query editable on the results page. One vendor case reported 267% more search clicks after replacing an icon with a fixed bar (indicative).", "kind": "evidence", "source": "Pencil & Paper; Uxcel; AB Tasty via Demand Curve"}, {"rule": "Start site-wide search unscoped, and show any scope beside the box with a one-click widen.", "why": "A preselected scope goes unnoticed, so people conclude the item doesn't exist. Never offer two search boxes with different scopes.", "kind": "evidence", "source": "Sherwin, NN/g"}, {"rule": "Keep autocomplete short and plain: up to 10 suggestions on desktop, 4 to 8 on mobile, no inner scroll.", "why": "Trending items and images under the search box were used 7 times in 60 chances, because they read as ads. Label any non-query suggestions, such as 'Recent searches'.", "kind": "evidence", "source": "Baymard; Kaplan, NN/g"}], "sourcesDiffer": ["Redd combines search, sort and filter in one area; Uxcel keeps sort separate; default: separate controls grouped in one toolbar beside the search box.", "Friedman shows suggestions on focus; Pencil & Paper and Dean after 2 to 3 characters; default: recent and popular on focus, matches after 2 to 3 characters.", "Brain shows only filters that apply to the results; Friedman keeps unavailable options disabled and explained; default: hide options that can never match, and keep options emptied by another selection greyed with a count of 0.", "Paste disables Apply and Clear all until something changes; brain never pre-disables actions; default: keep them enabled.", "Brain puts facets beside results on desktop; Friedman prefers filters above results; default: beside results for large catalogues refined many times, above for a few key filters."], "tryIt": "Mistype your top 10 search terms and record what comes back. Then apply four filters in a row and note every time the panel moves, resets or locks.", "quiz": [{"q": "An enterprise list has a slow back end, and people usually set date range, status and owner together. How should filters apply?", "options": ["Live, re-querying on every click", "In batch, with one Apply button showing the match count", "On a separate advanced-search page", "Only after the page is reloaded"], "answer": 1, "explain": "Batch apply with one global Apply suits very large data or slow systems, and lets people set several filters without the page fighting them."}, {"q": "A shoe shop lists widths alphabetically and testers ignore the filter. What change do you make?", "options": ["Order widths from narrowest to widest", "Keep A to Z for consistency with other filters", "Order by stock level", "Replace the list with a slider"], "answer": 0, "explain": "Sizes and widths run smallest to largest. Alphabetical order split adjacent widths, which is why the Zappos filter went unused."}, {"q": "In-app search defaults to the current category, and people decide a product doesn't exist. What fixes it for site-wide search?", "options": ["Add a second search box that searches everything", "Add trending images under the box", "Hide the scope to keep the box clean", "Start unscoped, and show any scope beside the box with one-click 'Search everything'"], "answer": 3, "explain": "A preselected scope goes unnoticed. Site-wide search starts unscoped, and two boxes with different scopes are never the answer."}]}, {"id": "m06-l3", "title": "Charts that tell the truth", "neuron": "charts-and-dashboards", "intro": "A chart earns its place only if it answers a question quickly and honestly. Most people read bars easily and trends or relationships much less well, so choose forms they can read and remove anything that distorts.", "points": [{"rule": "Give every chart one question, and put that question or its answer in the title.", "why": "Start from the question (metric, population, implied action), not the data you happen to have. Each visual should point to a next step, even if it's 'do nothing'.", "kind": "principle", "source": ""}, {"rule": "Choose the chart by the question, then by how accurately people read its encoding.", "why": "How much: bars. Over time: lines. Part of a whole: stacked bar or treemap. Distribution: histogram or box plot. Relationship: scatter. Position on a common scale reads best, then length, then angle or area.", "kind": "technique", "source": "slb2248; Laubheimer, NN/g"}, {"rule": "Start bars and areas at zero; never use 3D or cherry-picked date ranges.", "why": "Lines needn't start at zero, but bars and areas must. Truncated axes, 3D and cherry-picked ranges count as dark patterns, not just poor craft.", "kind": "caution", "source": "Uxcel; Gulsen"}, {"rule": "Label lines and bars directly, and use one highlight colour per chart.", "why": "Direct labels save a trip to a legend. Where many series compete, grey most of them, or split the chart into small labelled multiples.", "kind": "principle", "source": "Eisenhuth, Smashing"}, {"rule": "Never use colour alone: pair red and green with an arrow and a signed delta.", "why": "Use colour-blind-safe palettes that vary lightness, not just hue, and test in greyscale. Red and green also imply a verdict, so use them only when judging against a target.", "kind": "default", "source": "Fard"}, {"rule": "Give chart marks 3:1 contrast against their neighbours, not just the background.", "why": "Bars, lines and segments are graphics under WCAG, so adjacent segments in a stacked bar or donut must differ at 3:1 or carry a second cue. A darker outline round each segment lets fills stay soft.", "kind": "principle", "source": "Eisenhuth, Smashing"}, {"rule": "Keep within limits: about 5 lines, about 7 bars sorted by value, pies at most five slices.", "why": "Pies suit only one whole split into distinct parts, starting at 12 o'clock and going largest to smallest. Put time on the horizontal axis.", "kind": "principle", "source": "Bakusevych; Uber Base"}, {"rule": "Avoid forms that distort: smoothed lines, bubbles scaled by radius, dual y-axes.", "why": "A smoothed curve implies values between measurements that don't exist. Scaling a radius makes twice the value look four times as big, and two y-axes invite false comparisons.", "kind": "caution", "source": "Uber Base; peer-review via aitmpl"}, {"rule": "Make forecasts look different from actuals, and label them as estimates.", "why": "Actuals are solid; forecasts are dashed in a second colour with a light confidence band and a marked line where actuals end. Show the spread rather than one compromise figure.", "kind": "technique", "source": "ui-ux-pro-max via aitmpl; Peshin"}, {"rule": "Write a text summary of each chart, describing it as you would over the phone.", "why": "Cover the highlights, lowlights and notable parts, not the raw data, and show the summary on the page. Treemaps, Sankeys, network graphs and radar charts always need a table or list alternative.", "kind": "technique", "source": "Kalbag"}], "sourcesDiffer": ["Gulsen allows 3 to 6 pie segments for rough overviews; Uber Base caps pies at five; default: five.", "Fard suggests about five colours plus semantic ones; brain keeps one highlight per chart; default: one highlight per chart, five as the dashboard's categorical ceiling.", "slb2248 suggests 300 to 500ms chart transitions; Emil Design Eng caps UI motion under 300ms and avoids animating functional content; default: short data transitions, or none, in product dashboards."], "tryIt": "Pick three charts from a live product and rewrite each title as the question it answers. Remove or redraw any chart that answers none, or that breaks the zero-baseline, colour or contrast rules.", "quiz": [{"q": "A stacked bar uses soft pastel segments that are hard to tell apart. What is the best fix?", "options": ["Add a legend below the chart", "Switch to a 3D bar so segments separate", "Add a darker outline round each segment, or another cue, so neighbours differ at 3:1", "Rely on the hue differences already there"], "answer": 2, "explain": "Adjacent marks must differ at 3:1 or carry a second cue. An outline meets that and keeps the fills soft."}, {"q": "A designer smooths a monthly sign-ups line into a curve because it looks calmer. What is wrong?", "options": ["The curve suggests values between measurements and distorts the slope", "Curves can't be labelled directly", "Line charts must always start at zero", "Monthly data should always be a pie chart"], "answer": 0, "explain": "Join points with straight segments. A fitted curve implies data that doesn't exist and changes the apparent rate of change."}, {"q": "You need to show revenue share across nine product lines. Which chart fits best?", "options": ["A pie with nine slices", "A 3D donut", "A donut with the total in the centre", "A horizontal bar chart sorted by value"], "answer": 3, "explain": "Pies fail beyond five slices, and 3D distorts comparison. Bars use length, which people read accurately, and sorting by value aids comparison."}]}, {"id": "m06-l4", "title": "Dashboards people use", "neuron": "charts-and-dashboards", "intro": "A dashboard summarises a product and should answer 'what needs me today?' Many are built because competitors have one and are never opened. Decide the decision it serves, frame every number, and trade space, pages, detail and interaction deliberately.", "points": [{"rule": "Check you need a dashboard; for most users, put specific insights in the workflow.", "why": "Exploratory dashboards suit data-literate roles, and most people aren't. A message such as '3 invoices overdue' often serves better; never build one because competitors have one.", "kind": "principle", "source": "Wagner"}, {"rule": "Lead with at most 4 to 5 KPIs that answer 'what needs me today', then trends, then detail.", "why": "Everything should be actionable, with each KPI linking to its list. Put the most important metric top left and larger.", "kind": "principle", "source": "Kukula"}, {"rule": "Frame every number with a previous period, average, target or warning threshold.", "why": "A figure without comparison can't answer 'is this good?' Stripe shows each metric beside its previous period. Round numbers too, because false precision exaggerates small changes.", "kind": "principle", "source": "Stripe via 925Studios; Kukula"}, {"rule": "Match the dashboard type and refresh rate to how fast decisions are made, and show an as-of time.", "why": "Operational dashboards monitor in real time and refresh often. Analytical ones are for drilling down, so constant refreshing is noise; strategic ones track goals.", "kind": "principle", "source": "Uxcel; Creative Navy"}, {"rule": "Tailor content by role first, and offer customisation only as a supplement.", "why": "Managers need a team overview with drill-down; individual contributors need granular personal views. Relying on build-your-own layouts often means nobody worked out what each role needs.", "kind": "principle", "source": "Bakusevych"}, {"rule": "Don't make analytic dashboards scroll, or hide compared data behind tabs.", "why": "Scrolling breaks comparison, so fit the screen or use several pages. Overflow suits dashboards people read rather than compare, such as magazine or repository dashboards.", "kind": "principle", "source": "Bach et al.; Uxcel"}, {"rule": "Trade screenspace, pages, abstraction and interactivity explicitly; you can't minimise them all.", "why": "Shrinking one forces another up. To fit a phone, add pages, add interaction such as filters, or raise abstraction by aggregating. Make the trade visible in reviews.", "kind": "principle", "source": "Bach et al."}, {"rule": "Give every card the same anatomy and generous gaps between cards.", "why": "Title top left, view controls and actions top right, content in the rest, so people know where to look. Bakusevych prefers 24px gaps to 12px.", "kind": "technique", "source": "Bakusevych"}, {"rule": "Design the dashboard last, from components that already exist.", "why": "It summarises the rest of the product. Designed first, it changes every time another view does.", "kind": "technique", "source": "Bakusevych"}, {"rule": "Give every metric an owner, a written definition and a change log; retire unused dashboards.", "why": "Label metrics precisely and ask a newcomer to explain a chart back. One team found over 90% of its dashboards had no weekly users (anecdotal).", "kind": "evidence", "source": "Oh, Mind the Product"}], "sourcesDiffer": ["Brain says at most 4 to 5 KPIs at the top; Bakusevych caps the whole dashboard at about 5 to 7 widgets; default: 4 to 5 headline KPIs within roughly 5 to 7 widgets on the first screen, with more behind drill-down.", "Bakusevych says avoid gauges; Bach et al. list gauges and progress bars as normal; default: a linear progress bar with marked thresholds, not decorative dials.", "Creative Navy treats custom layouts as expected; Stripe and Bakusevych favour opinionated defaults; default: opinionated defaults unless building dashboards is the product's job.", "Creative Navy lets users choose refresh rates; brain matches refresh to decision speed; default: a sensible rate per metric with an as-of time, and user-set intervals only in monitoring and builder tools."], "tryIt": "List every widget on one dashboard with the decision it serves and its owner. Cut or move anything without both, and add a comparison to every bare number.", "quiz": [{"q": "A KPI tile shows a bare '42,180 sign-ups'. What most improves it?", "options": ["Show it with the previous period or target beside it", "Make the number larger and bolder", "Show the exact figure to two decimal places", "Add an animated counter"], "answer": 0, "explain": "Every number needs a frame, such as a previous period, average, target or threshold, so people can tell whether it's good."}, {"q": "An analytic dashboard must work on a phone without losing usefulness. Which approach follows the trade-off model?", "options": ["Shrink every chart to fit one long scrolling page", "Keep the same layout and let people pinch to zoom", "Add pages, add filters or detail on demand, or aggregate to a higher level", "Remove the comparison values to save space"], "answer": 2, "explain": "When screenspace shrinks, pages, interaction or abstraction must rise. Scrolling breaks comparison on analytic dashboards."}, {"q": "A support team watches a live queue, and leadership reviews quarterly trends. How should refresh differ?", "options": ["Both refresh every few seconds for consistency", "Neither refreshes automatically", "The quarterly view refreshes fastest because more people see it", "The queue refreshes often; the trend view needn't, and both show an as-of time"], "answer": 3, "explain": "Match refresh to how fast decisions are made. Operational views refresh often; on analytical views constant refreshing is noise."}]}, {"id": "m06-l5", "title": "Choosing components and icons", "neuron": "components-and-systems", "intro": "Most component mistakes come from using a pattern because it looks neat rather than because it fits the task. Icons are the clearest case: few mean one thing to everyone. Check each component against convention, keyboard use and evidence before adopting it.", "points": [{"rule": "Evaluate a pattern before adopting it, and try the smallest fix first.", "why": "Ask whether research shows it fixes a real problem, whether it follows convention, and whether it works on small screens and by keyboard. Prefer native elements and tested primitives for comboboxes, menus and tabs.", "kind": "principle", "source": "Adam Silver"}, {"rule": "A badge is read-only status; a chip is interactive. Never let a label look like a button.", "why": "Chips need focus and selected states. Read-only badges are filled with no border and squarer corners, while outlines are kept for buttons.", "kind": "principle", "source": "Harrison; Friedman"}, {"rule": "Use cards for browsing equal items; use lists or tables for ranked results and comparison.", "why": "Cards give every item equal rank and scan worse than lists, because the same field sits in a different place on each card. With one action, make the whole card the link; with several, never nest clickable areas.", "kind": "principle", "source": "Uxcel; Laubheimer, NN/g"}, {"rule": "Mark accordion headers with a downward caret, and make the whole header one target.", "why": "In a first-click study of 136 people, the caret was the only standard icon that beat both a nonsense icon and no icon. People tap label and icon equally, so never split a header into a link plus a toggle.", "kind": "evidence", "source": "Laubheimer and Budiu, NN/g"}, {"rule": "Use tabs only for distinct groups with one- or two-word labels, and never hide critical content.", "why": "Most attention goes to the default tab, so select the most-used one. If people must compare content across panels, put it on one page instead.", "kind": "principle", "source": "Sunwall, NN/g"}, {"rule": "Avoid carousels; if one is used, no autoplay, visible labelled controls and five frames at most.", "why": "Hidden slides don't get seen, and many people see only the first frame. A single strong static hero beats a carousel.", "kind": "caution", "source": "Pernice, NN/g"}, {"rule": "Give every drag and drop a keyboard and button alternative.", "why": "Space or Enter picks up, arrows move, Space or Enter drops and Escape cancels, with each step announced. On mobile, a 'Move to' action beats dragging.", "kind": "principle", "source": "Friedman; dnd kit"}, {"rule": "Give icons visible labels, except search, close and play/pause.", "why": "Few icons have one standard meaning. Labels fixed the icon-only Outlook toolbar for all skill levels, where new icons and regrouping didn't (secondhand; indicative).", "kind": "default", "source": "Harley, NN/g; UX Myths"}, {"rule": "Keep icon order and position stable across screens and releases.", "why": "People remember position, not pictures. When toolbar images changed but kept their places, people adapted quickly; when places were shuffled, they got lost.", "kind": "evidence", "source": "UIE via UX Myths; Calabro"}, {"rule": "When an icon-only button is unavoidable, give it an accessible name, a tooltip and a 44px target.", "why": "Use aria-label or hidden text, never the title attribute alone. The tooltip matches the name and shows at once on keyboard focus; pad a 20px icon out to at least 44 by 44px.", "kind": "default", "source": "SubUX"}], "sourcesDiffer": ["Which icons are universal: brain allowed search, close and menu; Harley names home, print and the magnifying glass; Calabro says the hamburger isn't universal; default: icon-only for search, close and play/pause and editor formatting, and give the menu icon a visible 'Menu' label where space allows.", "Pernice allows auto-forwarding carousels if timing lets people read each frame; Nielsen and brain say no autoplay; default: no autoplay.", "Brain allows 2 to 9 tabs in a row; Sunwall and Wang prefer accordions on phones; default: accordions on phones when there are more than about three sections or long labels.", "Elliott accepts an icon-only collapsed navigation rail for experienced users; Calabro warns against unlabelled rails; default: labels on by default, with a collapsed rail only as a choice the person makes."], "tryIt": "Audit one screen for icon-only controls outside search, close and play/pause. Add visible labels to the most-used ones, and run a matching test with five people to show the team why.", "quiz": [{"q": "Users ignore every button on an icon-only toolbar except Delete. The team wants to redraw the icons. What does the evidence suggest?", "options": ["Redraw the icons with clearer metaphors", "Rearrange the icons into new groups", "Add visible text labels to the important buttons", "Add hover tooltips and leave the icons as they are"], "answer": 2, "explain": "In the Outlook case, new icons and regrouping didn't help, but labels did at once. Tooltips are slow and absent on touch."}, {"q": "A product card needs to open a detail page and also offer Share and Save. How should you build it?", "options": ["Wrap the whole card in a link and put the buttons inside it", "Use a button hierarchy, or a stretched link with actions layered above, so no clickable areas nest", "Show Share and Save only on hover", "Make nothing clickable except a small 'More' link"], "answer": 1, "explain": "Several actions call for a button hierarchy, never nested clickable areas, because nesting breaks keyboard and screen reader use."}, {"q": "Mobile menu sections expand in place. Which header treatment do you choose?", "options": ["A right-facing arrow beside the label", "A plus sign as the only cue", "No icon, to keep it clean", "A downward caret, with label and icon as one target"], "answer": 3, "explain": "Only the caret beat both controls in NN/g's study. A right arrow did no better than no icon, and an unmarked header makes people expect a new page."}]}, {"id": "m06-l6", "title": "Diagrams that explain", "neuron": "diagrams", "intro": "A diagram should show how a system, process or service really works, so the reader understands it faster than from text. Pick the type by the question, keep to a strict complexity budget, and treat deletion as the main quality move.", "points": [{"rule": "Ask first whether a diagram is needed at all.", "why": "If a well-written paragraph or a three-column table would teach as much, don't draw. A diagram earns its place only if it encodes a decision.", "kind": "principle", "source": "Lavery"}, {"rule": "Choose the diagram by the question it answers.", "why": "Flowchart for a process with decisions; swimlane for handoffs between people; sequence for interactions over time; state diagram for a lifecycle; ERD for data structure; data flow diagram for where data goes; C4 for architecture.", "kind": "technique", "source": "Lavery; mermaid-diagrams"}, {"rule": "One diagram, one concept; split rather than crowd.", "why": "Show one process, one scenario or one level of abstraction per diagram. For complex systems, start with context and add more detailed diagrams as needed.", "kind": "principle", "source": "mermaid-diagrams; c4-architecture"}, {"rule": "Keep explanatory diagrams to about 9 nodes, 12 arrows, 2 accents and 2 callouts.", "why": "These are the author's defaults (indicative). Over 9 nodes it's probably two diagrams: an overview and a detail.", "kind": "evidence", "source": "Lavery"}, {"rule": "Delete until nothing more can go: every node a distinct idea, every line carrying information.", "why": "Two nodes that always travel together are one, and a line is dropped if layout already shows the relationship. Accent one or two focal elements only.", "kind": "principle", "source": "Lavery"}, {"rule": "Let shape carry the type of step, never colour alone.", "why": "Pill for start and end, rectangle for a step, diamond for a decision. A diamond has at most three exits, every branch is labelled, and four or more exits become nested decisions.", "kind": "default", "source": "Lavery; mermaid-diagrams"}, {"rule": "Pick architecture diagram levels by audience.", "why": "Executives see context only, product managers context and container, and architects add key components. Every box names what it is, its type and a short description.", "kind": "technique", "source": "c4-architecture"}, {"rule": "Make arrows go one way and say what flows, with a verb phrase.", "why": "Write 'Reads orders from, JSON/HTTPS', never just 'uses'. Two one-way arrows beat one double-headed arrow, which hides who starts the exchange.", "kind": "principle", "source": "c4-architecture; draw-io"}, {"rule": "In swimlanes, give each role a lane and make handoffs visible.", "why": "Every step sits in the lane of whoever is responsible. Handoffs, where a step crosses lanes, are where bottlenecks usually sit; Lavery caps swimlanes at 5 lanes.", "kind": "technique", "source": "Peterka; Lavery"}, {"rule": "Give every diagram a short and a long text alternative.", "why": "The long description covers relationships, sequence and any meaning carried by colour or size, ideally in the main content. For a flowchart, a structured list or table of steps usually works best.", "kind": "technique", "source": "W3C WAI"}], "sourcesDiffer": ["Lavery caps diagrams at 9 nodes; the mermaid-diagrams skill allows up to 20, ideally under 15; default: 9 for diagrams meant to explain, up to about 15 to 20 for reference diagrams people study, such as an ERD."], "tryIt": "Take one diagram from a recent spec or deck and count its nodes, arrows and accents against the budget. Split or cut it until it fits, and write its long text description.", "quiz": [{"q": "You're presenting a system's architecture to executives. Which level of diagram should you show?", "options": ["Context only", "Container and component levels", "A deployment diagram with every region", "A code-level class diagram"], "answer": 0, "explain": "C4 levels follow the audience: executives need context only, while product managers, architects and developers go deeper."}, {"q": "A flowchart decision diamond has five outgoing branches. What should you do?", "options": ["Colour each branch differently", "Refactor it into nested decisions with at most three exits each", "Remove the branch labels to reduce clutter", "Replace the diamond with a rectangle"], "answer": 1, "explain": "A diamond has at most three exits. Four or more become nested decisions, and every branch keeps its label."}, {"q": "A diagram for a review deck has 14 nodes and is hard to follow. What is the best fix?", "options": ["Shrink the text so everything fits", "Accent the four most important nodes", "Add a legend inside the drawing", "Split it into an overview diagram and a detail diagram"], "answer": 3, "explain": "Over 9 nodes an explanatory diagram is probably two diagrams. Accenting four things means you haven't decided what matters."}]}]}, {"id": "m07", "title": "Design systems and frontend", "summary": "How to decide on, build, govern and document a design system, and what a design lead needs to know about how interfaces are built and checked in code.", "neurons": ["design-system-basics", "design-system-ops", "design-system-specs-and-ai", "design-systems", "frontend-engineering", "frontend-quality", "books-systems-and-collaboration"], "lessons": [{"id": "m07-l1", "title": "Design system fundamentals", "neuron": "design-system-basics", "intro": "A design system is a set of standards plus the people who run it. Knowing its parts, and when it actually pays off, keeps you building a working toolkit rather than a showpiece.", "points": [{"rule": "Treat a system as a repository plus a team; a repository with no team decays.", "why": "NN/g defines a design system as standards for managing design at scale, with two parts: the repository and the people who run it.", "kind": "principle", "source": "Fessenden, NN/g"}, {"rule": "Keep component libraries and pattern libraries apart.", "why": "A component library specifies single UI elements. A pattern library specifies groupings, layouts, templates and flows. Teams often treat the terms as synonyms.", "kind": "principle", "source": "NN/g; Figma"}, {"rule": "Don't mistake a style guide for a whole system.", "why": "Content, brand and front-end style guides are parts of a system. A style guide alone has no components or code, so it can't keep products consistent.", "kind": "caution", "source": "NN/g; UX Design Institute"}, {"rule": "Build a system only when years of repeatable work lie ahead.", "why": "The return comes from future reuse, so a proof of concept or a prototype likely to change doesn't justify one. Signals of need: inconsistency across platforms, several brands or themes, repeated work, slow onboarding.", "kind": "principle", "source": "Fessenden, NN/g; Bergman, Figma"}, {"rule": "Choose adopt, adapt or create by weighing cost, control and brand differentiation.", "why": "Adopting an existing system is cheapest and fastest, but every customisation erodes the savings. Past a point, building your own is cheaper.", "kind": "technique", "source": "Fessenden, NN/g"}, {"rule": "Before any component, write down why, which problems it solves and how you'll measure success.", "why": "Answers tied to business goals, such as faster releases or developer productivity, win buy-in.", "kind": "technique", "source": "Figma, Design systems 102"}, {"rule": "Audit code as well as screens, and build design variables from production.", "why": "Auditing the codebase for components, CSS variables and shared patterns shows where design and code solve the same problem differently, so they don't drift from day one.", "kind": "technique", "source": "Figma, Design systems 102"}, {"rule": "Roll out small: a few tokens, about ten components, one pilot team.", "why": "Audit high-use patterns, define a small token set and at most about 10 of the most reused components, document when to use each, connect them to code, and pilot before going wide. A first pass takes a few months.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Plan for stalling: maintenance never ends and benefits arrive late.", "why": "Late benefits weaken leadership support against near-term delivery. Show early wins, budget ongoing time and recruit champions.", "kind": "caution", "source": "Bergman, Figma; Fessenden, NN/g"}, {"rule": "Staff at least an interaction designer, a visual designer and a developer.", "why": "This is NN/g's minimum team, ideally with a part-time researcher, architect and content writer. An executive sponsor isn't essential but secures money and shows the system matters.", "kind": "principle", "source": "Fessenden, NN/g"}], "sourcesDiffer": [], "tryIt": "Check your product against the signals of need (inconsistency, several brands or themes, repeated work, slow onboarding), then write a one-page case choosing adopt, adapt or create, with how you would measure success.", "quiz": [{"q": "A team is building a proof of concept that will probably change a lot within months. Should they build a design system for it?", "options": ["Yes, starting with a full component library", "Yes, but only the foundations", "No: the return comes from reuse over years of repeatable work", "Only if an executive sponsor approves it"], "answer": 2, "explain": "A system pays off through future reuse, so it isn't worth building for a proof of concept or a prototype likely to change."}, {"q": "Your company has a brand guide with palette, logos and type. A stakeholder says you already have a design system. What is the best reply?", "options": ["Agree: a brand guide is a design system", "A style guide is one part; without components and code it can't keep products consistent", "Style guides replace pattern libraries, so nothing else is needed", "Only a content style guide would count as a system"], "answer": 1, "explain": "Style guides are one part of a system. Without components, code and a team, they can't keep products consistent."}, {"q": "You adopted a public design system and keep customising it heavily for your brand. What does the lesson warn about?", "options": ["Each customisation erodes the savings of adopting; past a point, building your own is cheaper", "Customisation always increases the return on a system", "You should fork the system every month", "Adopting has no migration cost, so customising is free"], "answer": 0, "explain": "Adopt, adapt and create sit on a scale of cost and control. Heavy customisation removes the savings that made adopting attractive."}]}, {"id": "m07-l2", "title": "Tokens and components", "neuron": "design-system-ops", "intro": "Tokens and component contracts are where a system's decisions become reusable. Name things by function, layer tokens strictly and keep component APIs small and predictable.", "points": [{"rule": "Name tokens by function, not appearance, running from general to specific.", "why": "Fixed parts in a fixed order, such as color.action.primary.bg.hover, make names guessable and survive theme changes. Keep one token source feeding design and code.", "kind": "principle", "source": "arla6ka; Dean"}, {"rule": "Components read semantic tokens; semantic tokens point straight at primitives.", "why": "Semantic-to-semantic chains hide where a value comes from and break when the middle link changes. Component tokens start at zero and are added only when a component must differ in one theme or brand.", "kind": "principle", "source": "Kelly, Figma; arla6ka"}, {"rule": "Tokenise only when the need is shown.", "why": "Good reasons are reuse, coordinated change and variation by brand, theme or platform. Values like 0, 100%, auto, currentColor, one-off layout values and content-set values stay untokenised.", "kind": "technique", "source": "Balise; arla6ka"}, {"rule": "Pair every surface token with its foreground token.", "why": "Pairing surface.inverse with text.inverse means contrast is checked on the pair, not guessed per screen.", "kind": "technique", "source": "arla6ka; shadcn/ui"}, {"rule": "Name spacing tokens by where they're used, and keep component and layout scales apart.", "why": "A name like space.label-to-field says which value to pick; tight or loose doesn't. Structural spacing sits on 8s, with 4 and 12 only inside components.", "kind": "technique", "source": "Baldwin; Checklist Design"}, {"rule": "Check every component in all its states, at 200% zoom and with long text.", "why": "The full state list is default, hover, focus-visible, active, disabled, loading, error and success, plus dark mode, 100% and 200% zoom, and long and translated text.", "kind": "technique", "source": "Hallmark"}, {"rule": "Use one union prop for mutually exclusive options, never booleans.", "why": "A status prop of idle, pending, success or error can't hold two values; separate booleans can both be true. Prefer composition, such as Card.Header, to show-hide booleans.", "kind": "technique", "source": "arla6ka"}, {"rule": "Keep look-alike components with different jobs separate.", "why": "Badge and chip, or button and action button, stay apart so each can be restyled independently. Visual similarity alone never justifies merging.", "kind": "caution", "source": "Harrison; Karl Koch"}, {"rule": "Make the smallest system change that works.", "why": "In order: reuse as is, compose existing parts, add a property or variant, change the shared contract, and only then add a distinct pattern.", "kind": "technique", "source": "Karl Koch"}, {"rule": "Write down which state wins when two hold at once.", "why": "With no app majority: disabled, then open or focused, then invalid, then hover, then rest. A disabled field inside an invalid form shows no error.", "kind": "technique", "source": "arla6ka"}], "sourcesDiffer": ["Which token tier comes first: Checklist Design starts with primitives and component tokens and adds the semantic tier later; Atmos and Ouriach put semantic tokens first. Default: a semantic layer from the start, with component tokens only where a value can't derive from the semantic one.", "One configurable component or several: Ouriach splits components by intended use to avoid prop soup; brain merges near-duplicates into variants. Default: variants where properties are few and independent; a separate component when a property changes meaning (error, destructive) or the property panel gets long.", "Grid base: a 4px base with an 8px working unit is usual; GOV.UK sets line heights in multiples of 5. Default: 4/8 for product UI, following the official system's grid when the brief names one."], "tryIt": "Pick one component in your library and write its state precedence, its prop vocabulary (merging any conflicting booleans into a union prop) and the semantic tokens it reads.", "quiz": [{"q": "A designer wants the semantic token text.muted to point at another semantic token, text.secondary. What is the right call?", "options": ["Fine: chains add flexibility", "Point it straight at a primitive; semantic chains hide the source and break when the middle link changes", "Point it at a raw hex value", "Turn it into a component token"], "answer": 1, "explain": "Semantic tokens should alias primitives directly. Chains of semantic tokens hide where values come from and break easily."}, {"q": "A Button has isLoading, isSuccess and isError booleans, and someone set two to true at once. What is the best fix?", "options": ["Add an isIdle boolean as well", "Split it into three separate button components", "Replace them with one status prop of idle, pending, success or error", "Leave them, since booleans are simplest"], "answer": 2, "explain": "Mutually exclusive options belong in one union prop, which can't hold two values at once."}, {"q": "A selectable card with bulk actions looks almost identical to a navigation card. Should you merge them?", "options": ["Merge them, since they look the same", "Merge them and add an isSelectable boolean", "Delete the navigation card", "Keep them separate: their contracts differ, and looks alone never justify merging"], "answer": 3, "explain": "Visual similarity never justifies merging. Components with different jobs and contracts stay separate."}]}, {"id": "m07-l3", "title": "Governance and adoption", "neuron": "design-system-ops", "intro": "A system succeeds only when teams use it. Governance makes change predictable, and adoption needs marketing, support and honest measures.", "points": [{"rule": "Use semantic versioning as the contract and deprecate on a stated timeline.", "why": "Patch for fixes, minor for compatible additions, major for breaking changes. Deprecate in the release that adds the replacement, keep the old item for at least one minor cycle, and prefix breaking entries with BREAKING and a migration path.", "kind": "technique", "source": "Dean"}, {"rule": "Gate entry: useful, unique, tested with disabled users and ready to merge.", "why": "GOV.UK's gate is the best documented. Every component page carries its status, last-updated date, accessibility status and an evidence line.", "kind": "technique", "source": "GOV.UK"}, {"rule": "Treat a component as unfinished until its documentation is written.", "why": "Documentation is part of done. Say when to use each component, not only how it looks, and write for designers, developers and product managers.", "kind": "principle", "source": "Ayres, Figma"}, {"rule": "Don't rely on docs alone to stop misuse.", "why": "People read documentation only when stuck. Add design reviews with engineers, annotations that link to the component and ongoing education.", "kind": "caution", "source": "Harrison"}, {"rule": "Market the system like a product launch.", "why": "Interview designers, engineers and leaders first, then tailor the pitch: creative freedom for designers, reuse for developers, time to market for leaders. Avoid launching late on Fridays, in holidays or crunch periods.", "kind": "technique", "source": "Boyer, Figma"}, {"rule": "Win buy-in by fixing one painful, visible problem.", "why": "Solving something like mismatched buttons in front of the team that feels it persuades more than presentations.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Measure what consumers achieve, not portal visits or component count.", "why": "Track the share of production UI built from components, overrides, support questions (which should fall), time to first use, workarounds, forks and versions in circulation.", "kind": "technique", "source": "Dean; Balise"}, {"rule": "Read detachments by team as well as by component.", "why": "One team causing most detachments points to that team's unmet need. Detachments spread across the organisation point to a rigid component, which may need a slot rather than another variant.", "kind": "technique", "source": "Kelly, Figma"}, {"rule": "Offer migration support, not mandates, starting with willing teams.", "why": "Treat objections as gaps. Recruit champions in product, design and engineering, run office hours, and recognise contributions formally so advocacy isn't unpaid goodwill.", "kind": "principle", "source": "Dean; Ouriach; Boyer"}, {"rule": "Treat every exception as a contract with an owner and review date.", "why": "State the invariant bypassed, the need, alternatives, risk, owner, review date and return path. Never promote patterns on popularity, effort or request count.", "kind": "technique", "source": "Balise"}], "sourcesDiffer": ["Is two uses the trigger for a component? Goswami adds a component at two uses; Karl Koch says a fixed count is no permission to abstract. Default: two uses is the trigger to consider a component, not proof; one consequential requirement can be enough.", "When a pattern is proven: Balise wants about ten real instances; plugin87 promotes a one-off to candidate at two uses. Default: two uses to become a candidate, recommended only after wider use shows it holds.", "System size: Curtis and Frost sell design systems on efficiency at any scale; Vonshak warns a large system can cost a small team more than it saves. Default: start with the few coded components the team actually reuses and grow from there."], "tryIt": "Draft a one-page adoption plan for your system: the measures you will track, the deprecation policy, and one visible fix you could ship for a pilot team this quarter.", "quiz": [{"q": "You are replacing an old component with a new one. Which release plan follows the lesson?", "options": ["Remove the old one in the next patch release", "Deprecate it in the release that adds the replacement, keep it for at least one minor cycle, state the removal version and ship a migration path", "Rename it silently so nobody notices", "Keep both versions forever to avoid breaking anything"], "answer": 1, "explain": "Semver is the contract: deprecate alongside the replacement, give a stated timeline and provide a migration path."}, {"q": "Almost all detachments of your Table component come from one team. What does that suggest?", "options": ["That team has an unmet need worth investigating", "The component is too rigid for the whole organisation", "Detachments are noise and can be ignored", "Lock the component so it can't be detached"], "answer": 0, "explain": "Detachments concentrated in one team point to that team's need; detachments spread widely would point to a rigid component."}, {"q": "A team asks to promote their pattern into the system because many people have requested it. What is the best response?", "options": ["Promote it: demand proves its value", "Put it to a vote of all designers", "Reject it, since the system is closed", "Don't promote on request count; check it against the entry gate and real uses"], "answer": 3, "explain": "Patterns are never promoted on popularity or request count. They must meet the entry gate and hold up in real use."}]}, {"id": "m07-l4", "title": "Lessons from ten systems", "neuron": "design-systems", "intro": "Carbon, Atlassian, Primer, Salt, GOV.UK, Polaris, Fluent, Material, Spectrum and Ant solve the same problems differently. Study each for its strength, b
