, "options": ["End-to-end success may be near 59%, so evaluate the whole journey", "The journey is fine because every step passes", "Only the weakest single screen matters", "Journey scores can't be estimated from steps"], "answer": 0, "explain": "Touchpoint scores compound: four steps at 85 to 90% give about 59% end to end. Evaluate whole journeys, not screens."}]}]}, {"id": "m14", "title": "Ethics, trust and beyond screens", "summary": "How to spot and remove manipulation, handle consent and data honestly, design for money and risk, and carry good practice into voice, spatial, phone, physical and print work.", "neurons": ["ethics-and-trust", "data-and-trust", "finance-ux", "beyond-screens"], "lessons": [{"id": "m14-l1", "title": "Deceptive patterns and sensitive contexts", "neuron": "ethics-and-trust", "intro": "Manipulative patterns spread quietly through conversion-only A/B tests and copying competitors, and mild ones pass usability tests. This lesson gives you a way to classify, grade and fix them, and to design for people who are stressed or vulnerable.", "points": [{"rule": "Never use dark patterns: never pre-tick consent, marketing or paid add-ons.", "why": "Pre-ticked consent is invalid under GDPR and PECR, and a default left unchanged is not consent to an extra payment under the Consumer Contracts Regulations. Brain rates it Critical, as a legal risk.", "kind": "default", "source": "Planet49 ruling; Consumer Contracts Regulations 2013"}, {"rule": "Classify each audit finding as Dark, Grey or Mistake before rating severity.", "why": "Dark exploits the gap between intent and outcome; Grey is visible but the default serves the business; Mistake is an honest usability problem. Mislabelling a mistake as dark discredits the whole audit.", "kind": "technique", "source": "Uxcel"}, {"rule": "Test subtle cases: the intent gap, the front-page test, second-order effects, and who benefits from each default.", "why": "Blatant patterns are easy to spot; subtle ones need explicit tests. Ending with a trust verdict (trustworthy, some concerns, manipulative) makes the audit actionable.", "kind": "technique", "source": "Uxcel"}, {"rule": "Review each choice with a persona of your most vulnerable user.", "why": "People miss subtle patterns, especially those with less formal education. Ask whether people could spend or share more than meant, and whether they are rushed, pressured or shamed for saying no.", "kind": "evidence", "source": "Rosala, NN/g"}, {"rule": "Show the full price, including fees and taxes, from the first price shown.", "why": "Drip pricing hides the real cost until checkout. The DMCC Act 2024 requires an invitation to purchase to show the total price the consumer will necessarily pay.", "kind": "principle", "source": "Chan, NN/g; DMCC Act s230"}, {"rule": "Show urgency and scarcity only when true and live; never on high-stakes comparisons.", "why": "A false limited-time claim is banned outright under the DMCC Act. Without live stock data, use honest general wording, and avoid time pressure where people compare loans, insurance or contracts.", "kind": "caution", "source": "DMCC Act Schedule 20"}, {"rule": "Cancelling never needs a call, documents, a required survey or guilt copy.", "why": "Offer a call, never require one. Remind people before a trial becomes a charge, and design to the coming UK subscription rules now: reminders, cooling-off and straightforward ending.", "kind": "principle", "source": "UX Magazine; DMCC Act Part 4 Ch 2"}, {"rule": "For stressed users: one question per screen, short steps, calm visuals and a one-tap fast path.", "why": "Distress shrinks capacity. Keep crisis or core coping features free of payment, currency or progress gates, and make anonymity the default for peer features.", "kind": "technique", "source": "Smashing"}, {"rule": "Design natural stopping points and make autoplay opt-in.", "why": "Endless feeds, autoplay, variable rewards and streak anxiety count as attention exploitation. Ask: would we still ship this if it lowered our key metric? People who stop should feel proud, not guilty.", "kind": "principle", "source": "Vakil, Mind the Product; Deshmukh, UX Magazine"}, {"rule": "Audit cancel and consent flows with assistive technology.", "why": "Flows that fail with screen readers or keyboards, low-contrast decline buttons and focus traps in consent dialogs are dark patterns in their own right.", "kind": "caution", "source": "ghaida/intent"}], "sourcesDiffer": ["Infinite scroll: one catalogue rates it Medium; NN/g accepts it for some feeds. Default: count endless feeds with no stopping point as attention exploitation, but keep NN/g's nuance that the feed's purpose matters.", "Pre-ticked opt-ins: the Uxcel audit rates them Grey and one UX Magazine piece shows a pre-ticked newsletter box. Default: never pre-tick consent, marketing or paid add-ons; rate it Critical.", "Streaks: in general products make them forgiving (grace windows, freezes, gradual reduction); in wellbeing products avoid them and show cumulative activity. Singman calls streak anxiety ethical; default: treat it as dark-pattern adjacent.", "Decoy plans: Figma and Demand Curve recommend decoy pricing. Default: every plan must be one a real segment would sensibly choose, ordered cheapest to dearest."], "tryIt": "Pick one checkout or cancel flow you own and write its decision contract: options including do nothing, the default and who it benefits, effort to accept versus refuse, and the exit. Grade each finding Dark, Grey or Mistake.", "quiz": [{"q": "An audit finds a cancel button that is hard to find because of a confusing settings layout, with no sign anyone intended it. How should you classify it?", "options": ["Dark, because it blocks cancelling", "Grey, because the business benefits", "Critical, because it is a roach motel", "Mistake, and send it to the heuristic review"], "answer": 3, "explain": "A Mistake is an honest usability problem. Mislabelling it as dark discredits the audit."}, {"q": "Marketing wants a countdown banner reading 'Offer ends tonight' on a loan comparison page, though the rate never changes. What is the right response?", "options": ["Allow it if the countdown is accurate to the second", "Remove it: the claim is false and pressure has no place on high-stakes comparisons", "Allow it but use a muted colour", "Replace it with a stock count instead"], "answer": 1, "explain": "A false limited-time claim is banned under the DMCC Act, and brain's rule is no time pressure where people need to compare loans or contracts."}, {"q": "You are designing a peer-support feature for people in crisis. Which choice fits the lesson?", "options": ["Make anonymity the default and keep core coping features free of gates", "Unlock the coping tools after a seven-day streak", "Ask several questions per screen to get people help faster", "Use bright alerts so urgent messages are not missed"], "answer": 0, "explain": "Crisis or core coping features stay free of payment, currency or progress gates, and anonymity is the default for peer features."}]}, {"id": "m14-l2", "title": "Consent, data and AI transparency", "neuron": "data-and-trust", "intro": "Trust is built at the moments you ask for data, explain what happened, or admit a system's limits. Consent must be fair in both directions, data use explained where it happens, and AI honest about what it can and cannot do.", "points": [{"rule": "Put Accept and Reject side by side with equal weight and the same number of clicks.", "why": "Withdrawing must be as easy as giving. Group choices under plain-language purposes, never bundle them, and keep 'Customise' as a separate link.", "kind": "principle", "source": "Deshmukh, UX Magazine; ICO"}, {"rule": "Verify consent parity at runtime, and capture network requests before and after each choice.", "why": "A design file can't prove behaviour, and banner text doesn't prove scripts are blocked. Test arrival, refuse all, accept all, per purpose, withdraw and expiry.", "kind": "technique", "source": "Balise, following the CNIL"}, {"rule": "Judge consent flows by understanding, not consent rate.", "why": "Observation or a cloze test shows whether people actually grasped what they agreed to. An 'I have read and agree' tick is not proof that anyone understood.", "kind": "principle", "source": "Deshmukh; Salminen, UX Magazine"}, {"rule": "Ask for one permission at the moment the task needs it.", "why": "Just-in-time requests give context, but too many and people stop reading. Ask after people have seen value, never block the core task on a refusal, and offer a way back through settings.", "kind": "technique", "source": "IF; Checklist Design"}, {"rule": "Explain what is collected, why, whether it trains AI and for how long, where it happens.", "why": "Say exactly what a sharing toggle shares on the same screen. Name categories after the data itself, with simple safe defaults and deep optional controls.", "kind": "principle", "source": "Olding, Mind the Product"}, {"rule": "Treat inferences from interaction data as sensitive personal data.", "why": "Cursor speed and hesitation can predict intent and even traits. Disclose, get consent and minimise, and always be able to say where an inferred value came from.", "kind": "caution", "source": "Kuric, Smashing"}, {"rule": "State the AI failure rate and say when the model is out of its depth.", "why": "'Wrong 15% of the time' lands differently from '85% accurate'. State key limits before first use and again where each applies.", "kind": "principle", "source": "Vant; Peshin, Mind the Product"}, {"rule": "Give real failures a distinct signal, the concrete reason, an explicit boundary and a recovery path.", "why": "Say what did not happen ('Nothing was sent, written or charged'). Never a bare 'Something went wrong' or a cheerful hallucination, and retries must change strategy, not loop.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Give each AI capability its own toggle and never default to 'Allow all'.", "why": "'Read inbox' is separate from 'Send email'. Set expiry by default, offer one-click revoke and keep granted scopes visible. Memory scope defaults to the narrowest safe option and is never silently promoted.", "kind": "default", "source": "AI UX Playground"}, {"rule": "Explain why each recommended item appears and give a nearby control to correct it.", "why": "'Recommended for you' implies relevance without a reason. Separate editorial, personalised and sponsored items, and label ads 'Sponsored' with the advertiser and a 'Why this ad?' route.", "kind": "principle", "source": "McCarthy-Jones, The UXologist"}], "sourcesDiffer": [], "tryIt": "Take one consent or permission prompt in your product and test it both ways: count clicks to accept and to refuse, then check what network requests fire after refusing. Rewrite any vague purpose line such as 'help us improve'.", "quiz": [{"q": "Your cookie banner has a large 'Accept all' button and a small 'Manage' link leading to a second screen with 'Reject all'. What is wrong?", "options": ["Refusing takes more effort than accepting, so parity fails", "Nothing, as long as Reject all exists somewhere", "The buttons must be pixel-identical", "The banner should use a toast instead"], "answer": 0, "explain": "Accept and Reject need equal weight and the same number of clicks; pixel-identical buttons aren't required, but equal effort is."}, {"q": "An AI agent's email send fails mid-task. Which message best follows the failure disclosure pattern?", "options": ["'Something went wrong. Please try again.'", "'Oops! Let's give that another go!' with an automatic retry loop", "A small grey note in the normal answer style", "A distinct error state: 'Couldn't connect to your mail server. Nothing was sent.' with a recovery action"], "answer": 3, "explain": "Failures get a distinct signal, the concrete reason, an explicit boundary of what didn't happen and a recovery path."}, {"q": "A product team proposes a success metric for a redesigned consent flow. Which is best?", "options": ["Share of people who tap Accept", "Time to dismiss the banner", "Whether people can correctly say what they agreed to", "Number of people who open Customise"], "answer": 2, "explain": "Judge consent by understanding, not consent rate, using observation or a cloze test."}]}, {"id": "m14-l3", "title": "Designing finance products", "neuron": "finance-ux", "intro": "In finance, regulation dictates what is shown, people arrive anxious, data is dense and one mistaken tap can move real money. Failures and delayed consequences are part of the normal experience, so design them as carefully as the happy path.", "points": [{"rule": "Keep three facts checkable at every step: who receives the money, how much leaves, and what happens next.", "why": "Fees, consent and reversibility belong in the main decision, not supporting detail. The review screen is the last point of control.", "kind": "principle", "source": "McCarthy-Jones, The UXologist"}, {"rule": "Design failure states as first-class states, not edge cases.", "why": "Fraud blocks, pending transfers, failed verification and exceeded limits are normal in finance. The error screen often matters more than the success screen.", "kind": "principle", "source": "UXDA"}, {"rule": "Never shift blame to the customer in error copy.", "why": "Replace 'Invalid input' or 'Operation failed' with what happened, why, what happens next and how the customer is protected. A cryptic decline from an unseen risk rule reads as the bank's fault.", "kind": "caution", "source": "UXDA"}, {"rule": "Diagnose a failure through the whole system, not just its message.", "why": "Check whether history, notifications and support all show the same state, whether people can recover without retrying wrongly, and whether a rule causes repeated false failures.", "kind": "technique", "source": "UXDA"}, {"rule": "Show delayed consequences at the point of decision, and measure outcomes weeks or months on.", "why": "A loan completed easily can still be misunderstood. Conversion and speed miss later churn, complaints and bad debt.", "kind": "principle", "source": "UXDA"}, {"rule": "Keep deliberate friction where money or risk is at stake.", "why": "Simplicity must not make risky actions feel trivial. Scale reassurance to the size of the payment, and test an optional extra check for very large transfers.", "kind": "caution", "source": "Eleken; Ramsey, Built for Mars"}, {"rule": "Explain why you need each piece of data at the point you ask.", "why": "For example, 'to keep your account secure and meet KYC rules'. Break compliance disclosures into short scannable steps; if testers find the flow frustrating, users will be infuriated.", "kind": "technique", "source": "Andrus, Eleken"}, {"rule": "Offer insight without judgement, and make personalisation opt-in.", "why": "'You spent 20% more on travel this month', not 'Stop overspending'. Explain how recommendations are made and give a one-tap pause; avoid directive AI advice in finance.", "kind": "principle", "source": "Andrus, Eleken; Shkinder, Mind the Product"}, {"rule": "Show Confirmation of Payee as four distinct states, and make scam warnings specific.", "why": "Match, close match, no match and unable to check each need their own treatment. Warnings form part of the firm's case, so tie them to new payees or unusual amounts and record that they were shown. These are inferred design implications.", "kind": "technique", "source": ""}, {"rule": "Lead refund and penalty schedules with the protection, one reference point and real dates.", "why": "A shrinking-refund graph lost to a plain 'full refund within 48 hours' line. Use calendar dates and times rather than relative labels (indicative).", "kind": "evidence", "source": "Linowski, GoodUI"}], "sourcesDiffer": ["Scope of UX: UXDA argues UX must own strategy, brand behaviour and governance; most of brain treats those as shared with product and leadership. Default: trace each screen problem to its rule, policy or operational cause and name the owner, rather than claiming ownership of all of them."], "tryIt": "Take one payment or transfer flow and list every failure state it can reach. For each, check the copy says what happened, why, what next and how the customer is protected, and that history, notifications and support show the same state.", "quiz": [{"q": "A transfer is blocked by a fraud rule and the screen says 'Operation failed'. What is the best fix?", "options": ["Add a retry button so people can try again", "Say what happened, why, what happens next and how they are protected", "Hide the block and process it later silently", "Show the full fraud rule logic"], "answer": 1, "explain": "Never shift blame; explain what happened, why, what next and how the customer is protected. A safe summary of a rule is enough."}, {"q": "Leadership celebrates that a new loan flow converts 30% faster. What should you add before calling it a success?", "options": ["A/B test the button colour", "Remove the remaining disclosures", "Measure time on page", "Outcome measures weeks or months on, such as complaints and bad debt"], "answer": 3, "explain": "Conversion and task speed miss delayed consequences; pair them with outcome measures at the right time horizon."}, {"q": "A spending insight card needs copy for a month of high travel spend. Which fits?", "options": ["'You spent 20% more on travel this month.'", "'Stop overspending on travel!'", "'You're failing your budget goal.'", "'Cut travel now to save money.'"], "answer": 0, "explain": "Insight without judgement states the fact and leaves the decision to the person."}]}, {"id": "m14-l4", "title": "Voice, AR and spatial", "neuron": "beyond-screens", "intro": "When the interface leaves a flat screen, people lose cues they rely on: what to say, whether the microphone is live, where to press. Brain's firm defaults still apply wherever there is a screen, and these patterns fill the gaps for voice, phone, AR, gestures and spatial UI.", "points": [{"rule": "Show example phrases next to the microphone.", "why": "Empty or silent recordings show people don't know what to say. Answer greetings with suggestions, and make commands discoverable with 'What can I say?'.", "kind": "technique", "source": "Barbiro, UX Magazine"}, {"rule": "Never let a voice glow or waveform be the only sign the microphone is live.", "why": "Keep a visible mic button state and announce it in text ('Listening.', 'Microphone blocked'). Under reduced motion use a static icon or subtle opacity change instead.", "kind": "default", "source": "Antalik; AI UX Playground"}, {"rule": "Give idle, listening, processing and speaking distinct visual states.", "why": "Show processing within about 200ms of the end of speech so people don't talk over the model (indicative). An idle microphone must not look live.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Echo recognised commands, offer a typed fallback and confirm payments, sends and deletes.", "why": "Commands trigger actions, so a clear no-match state and stop or cancel must always be available. Skip voice for dense data entry and open offices.", "kind": "principle", "source": "AI UX Playground"}, {"rule": "In phone menus, say the task before the number and keep to four or five options.", "why": "'For billing, press 2' lets callers judge relevance before holding the number. Avoid shared words across options, and let people press early.", "kind": "technique", "source": "Kohler, NN/g"}, {"rule": "Always offer the keypad up front; never speech only.", "why": "Don't wait for speech to fail before offering keys. Give one meaning per key and a way back at every level, mentioned last.", "kind": "principle", "source": "Kohler, NN/g"}, {"rule": "On hold, give wait time and queue position about every 1.5 to 2 minutes, or offer a callback.", "why": "Interrupting every 18 seconds, as one organisation did, is far too often. Offer details by text message rather than dictation.", "kind": "evidence", "source": "Kohler, NN/g"}, {"rule": "In AR, put text on solid panels and state the requirements before starting.", "why": "Text over a live camera view is unreadable on busy backgrounds. Say what the experience needs: space, light, a flat surface or a headset (small study, indicative).", "kind": "technique", "source": "Behnam and Budiu, NN/g"}, {"rule": "Skip AR when seeing the object in place doesn't help a decision.", "why": "Ordinary images do the job with less effort. Where AR does help, label the icon in text and mark AR-ready products in lists.", "kind": "caution", "source": "Behnam and Budiu, NN/g"}, {"rule": "Keep touch-free gestures few and reliable, with a simple alternative to path-based gestures.", "why": "Avoid gestures whose return movement reads as a second command, and show feedback when one isn't recognised. WCAG 2.5.1 requires the alternative. In VR, size controls by arm's reach.", "kind": "principle", "source": "Hasoshyn and Chalyi; Holloway and Noone"}], "sourcesDiffer": ["Context between voice requests: Booking treats each request as new; Google and Amazon keep context from earlier turns. Default: keep context for follow-ups within a session, say what was carried over, and make starting again easy."], "tryIt": "Script your product's phone menu or voice entry point aloud. Check task-before-number wording, option count, a way back at every level, and a visible plus text-announced microphone state on any screen.", "quiz": [{"q": "Your voice assistant shows a glowing orb that pulses with the user's voice, and nothing else. What is the main problem?", "options": ["The orb should be larger", "Voice assistants should not show any visual", "The glow is the only sign the mic is live, with no text state or reduced-motion alternative", "The orb should pulse faster"], "answer": 2, "explain": "A glow is decoration, not the status; pair it with a visible button state and text announcements, and use a static icon under reduced motion."}, {"q": "Which phone menu prompt follows the guidance?", "options": ["'For billing, press 2.'", "'Press 1 for account balance, press 2 for account changes.'", "'Please say what you need after the tone.' with no keypad option", "A promotion, then nine options"], "answer": 0, "explain": "Task before number lets callers judge relevance first; avoid shared words, speech-only input and promotions before the menu."}, {"q": "A furniture shop wants AR on every product, including rugs bought mainly on pattern. What should you advise?", "options": ["Use AR everywhere for consistency", "Replace product photos with AR", "Hide AR behind an unlabelled icon to keep pages clean", "Use AR only where seeing the item in place helps the decision, and label AR-ready products"], "answer": 3, "explain": "Skip AR when it adds nothing; where it helps, mark AR-ready products and label the icon in text."}]}, {"id": "m14-l5", "title": "Print and physical", "neuron": "beyond-screens", "intro": "Many journeys break at a physical touchpoint: a terminal, a venue, a flyer, a device used with gloves. Print has its own production rules, while hierarchy, type and colour rules still apply on paper.", "points": [{"rule": "Set up print files at 300 DPI at the printed size.", "why": "Pixels equal inches times 300, so A4 is 2480 by 3508px. Export CMYK PDF for print and RGB PNG or JPG for screen, and print one test copy before the run.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Add at least 3mm bleed and keep text 3 to 6mm inside the trim.", "why": "A canvas set to the final size still needs bleed added. Export a high-resolution PDF with crop and bleed marks; large formats magnify any bleed error.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Choose the format by how it is distributed and how long the message is.", "why": "A5 suits door drops, DL envelopes and vouchers, rack cards displays. Bigger brochures cost more and get picked up less (indicative).", "kind": "principle", "source": "Figma resource library"}, {"rule": "Treat folds as part of the experience and keep key messages off them.", "why": "A tri-fold gives six panels and suits step-by-step content; a gatefold suits reveals. Mark panel edges and test-print to check alignment and panel order.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Run a glance test: show the piece briefly and ask what it is for.", "why": "Date, time, place and the action should be findable almost at once. It is the print version of the five-second test. No image beats a blurry one.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Never require people to follow a brand account or install something to order or pay.", "why": "In self-service venues this counts as a dark pattern. Offer several payment methods and plan staff as a deliberate fallback when the system fails.", "kind": "caution", "source": "Tang and Liu, NN/g"}, {"rule": "Sync self-service menus with stock and make sure special requests reach the kitchen.", "why": "Never let people order something that has run out. A 'no onions' note is worthless unless it arrives where the food is made; group orders show who added what.", "kind": "principle", "source": "Tang and Liu, NN/g"}, {"rule": "Check physical touchpoints for accessibility, not just the screens.", "why": "Journeys break at ATMs without speech output, touchscreen payment devices and counters that force private disclosures. The European Accessibility Act covers new terminals, so older ones remain gaps.", "kind": "caution", "source": "Sredojevic, UX Magazine"}, {"rule": "Design for where the device is used: gloves, lighting, noise and posture.", "why": "In healthcare and other physical settings, show only the data for the current step, and fix these problems before regulatory approval.", "kind": "principle", "source": "Tsynkevich, Toptal"}, {"rule": "Keep scents brief, simple and familiar, with a way to opt out.", "why": "Scented cinema failed because smells arrived late, lingered and mixed. Associations are personal and unpleasant smells linger, so let people switch them off.", "kind": "evidence", "source": "Mikhel, Smashing"}], "sourcesDiffer": [], "tryIt": "Pick one printed piece or physical touchpoint in your service. For print, check 300 DPI, 3mm bleed, safe area and CMYK export, then run a glance test; for a venue or terminal, walk it as someone using speech output or a different payment method.", "quiz": [{"q": "A designer exports an A5 flyer at its exact size in RGB with text 1mm from the edge. What needs fixing?", "options": ["Nothing, A5 needs no bleed", "Only switch to CMYK", "Increase the paper weight", "Add 3mm bleed, move text 3 to 6mm inside the trim and export a CMYK PDF with marks"], "answer": 3, "explain": "A final-size canvas still needs bleed, text belongs in the safe area, and print files are CMYK PDFs with crop and bleed marks."}, {"q": "An unmanned café requires customers to follow its social account before the payment screen unlocks. How should you treat this?", "options": ["As a dark pattern to remove", "As acceptable growth practice", "As fine if the follow can be undone later", "As a minor copy issue"], "answer": 0, "explain": "Never require people to follow a brand account or install something to order or pay; it counts as a dark pattern."}, {"q": "A clinical device app works well in the office but nurses struggle on the ward. What should the team check first?", "options": ["The brand colours", "Gloves, lighting, noise and posture, and whether each step shows only its own data", "Adding more data to each screen", "Marketing copy on the splash screen"], "answer": 1, "explain": "Design for the physical conditions of use and show only the data for the current step, fixing problems before regulatory approval."}]}]}];
const DEFAULTS = [
  ["Accessibility", "WCAG 2.2 AA as the floor. Visible focus everywhere. Never colour alone. Support reduced motion. Touch targets 44pt (iOS) and 48dp (Android), 24px minimum."],
  ["Type", "Body text 16px minimum everywhere, product UI included. Secondary text about 13px, almost never below 12px. Inputs 16px on mobile."],
  ["Forms", "One column. Labels above fields, never placeholder or floating labels. Mark optional fields \"(optional)\". No input masks, no maxlength, no paste blocking. Radios over dropdowns. Validate on submit with an error summary and inline errors. Never pre-disable submit."],
  ["Actions", "One primary action per view. Button labels name the outcome. Cancel is a link after page-level forms and a secondary button inside dialogs. Prefer undo to confirmation. Confirm only destructive, irreversible or high-stakes actions, naming the action in the button."],
  ["Icons", "A visible text label on every icon except search, close and play/pause. Icon-only buttons always have an accessible name."],
  ["Messages", "Feedback in place first. Never a toast for errors or anything people must act on. If a toast is used, at least 6 seconds and a way to extend it."],
  ["Navigation", "Links for navigation and buttons for actions, never styled as each other. The URL reflects state. Pagination over infinite scroll. Avoid sticky menus."],
  ["Motion", "Animate only with a stated purpose. Never block input. Frequent actions get little or no animation."],
  ["Content", "Plain, specific, sentence case. One term per concept. No dark patterns."]
];
const KIND_LABEL = { default: "Firm default", principle: "Principle", evidence: "Evidence", technique: "Technique", caution: "Caution" };

/* ---------- state ---------- */
const STORE_KEY = "dbc-progress-v1";
let state = { done: {}, quiz: {}, last: null };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const LESSONS = [];
const BY_ID = {};
COURSE.forEach((m, mi) => {
  BY_ID[m.id] = { type: "module", m };
  m.lessons.forEach((l, li) => { const e = { type: "lesson", m, l, mi, li }; LESSONS.push(e); BY_ID[l.id] = e; });
});
const TOTAL_LESSONS = LESSONS.length;
const TOTAL_POINTS = LESSONS.reduce((n, e) => n + e.l.points.length, 0);
const TOTAL_Q = LESSONS.reduce((n, e) => n + e.l.quiz.length, 0);
/* Time estimate: reading at 200 words a minute, plus about a minute per quiz question. The try-it exercise isn't counted. */
const words = s => String(s || "").split(/\s+/).filter(Boolean).length;
function lessonMins(l) {
  let w = words(l.intro) + words(l.tryIt);
  l.points.forEach(p => { w += words(p.rule) + words(p.why); });
  (l.sourcesDiffer || []).forEach(x => { w += words(x); });
  l.quiz.forEach(q => { w += words(q.q) + words(q.explain) + q.options.reduce((n, o) => n + words(o), 0); });
  return Math.max(5, Math.round(w / 200 + l.quiz.length));
}
const moduleMins = m => m.lessons.reduce((n, l) => n + lessonMins(l), 0);
const TOTAL_MINS = COURSE.reduce((n, m) => n + moduleMins(m), 0);
const fmt = mins => mins < 60 ? `${mins} min` : `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, "0")} min`;
const leftMins = () => LESSONS.filter(e => !state.done[e.l.id]).reduce((n, e) => n + lessonMins(e.l), 0);

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");
const moduleDone = m => m.lessons.filter(l => state.done[l.id]).length;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const tick = on => `<span class="tick ${on ? "on" : ""}" aria-hidden="true"></span>`;
const bar = (a, b, label) => `<div class="bar" role="img" aria-label="${esc(label)}"><span style="width:${pct(a, b)}%"></span></div>`;

/* ---------- views ---------- */
function viewHome() {
  const done = Object.keys(state.done).filter(k => BY_ID[k]).length;
  const answered = Object.keys(state.quiz).length;
  const right = Object.entries(state.quiz).filter(([k, v]) => { const [lid, qi] = k.split("|"); const e = BY_ID[lid]; return e && e.l.quiz[qi] && e.l.quiz[qi].answer === v; }).length;
  const next = (state.last && BY_ID[state.last]) ? BY_ID[state.last] : LESSONS.find(e => !state.done[e.l.id]) || LESSONS[0];
  return `
  <section class="hero">
    <div>
      <p class="eyebrow">${COURSE.length} modules · ${TOTAL_LESSONS} lessons · ${TOTAL_POINTS} rules · about ${Math.round(TOTAL_MINS / 60)} hours</p>
      <h1>Everything in your design brain, one lesson at a time</h1>
      <p class="lede">Built from the brain's neurons: layout to leadership. Each lesson gives the rules and the reasoning behind them, flags where sources disagree, sets you a practical exercise and checks your understanding with three questions.</p>
    </div>
    <div class="stat-panel">
      <p class="eyebrow">Your progress</p>
      <p class="big num">${pct(done, TOTAL_LESSONS)}%</p>
      ${bar(done, TOTAL_LESSONS, `${done} of ${TOTAL_LESSONS} lessons complete`)}
      <div class="stats">
        <div><b class="num">${done}/${TOTAL_LESSONS}</b><span class="muted">lessons done</span></div>
        <div><b class="num">${right}/${answered}</b><span class="muted">questions right</span></div>
        <div><b class="num">${fmt(leftMins())}</b><span class="muted">left to study</span></div>
      </div>
      <a class="btn primary" href="#${next.l.id}">${done ? "Continue" : "Start"}: ${esc(next.l.title)}</a>
    </div>
  </section>
  <div class="section-head"><h2>Modules</h2><span class="muted">Take them in any order</span></div>
  <div class="grid">
    ${COURSE.map((m, i) => { const d = moduleDone(m); return `
      <a class="mcard" href="#${m.id}">
        <span class="code">Module ${i + 1}</span>
        <h3>${esc(m.title)}</h3>
        <p>${esc(m.summary)}</p>
        <div class="meta"><span class="num">${d} of ${m.lessons.length} lessons · ${m.lessons.reduce((n, l) => n + l.points.length, 0)} rules · about ${fmt(moduleMins(m))}</span>${bar(d, m.lessons.length, `${d} of ${m.lessons.length} lessons complete`)}</div>
      </a>`; }).join("")}
  </div>`;
}

function viewModule(m) {
  const i = COURSE.indexOf(m);
  return `
  <div class="page-head">
    <p class="crumbs"><a href="#home">Modules</a><span aria-hidden="true">/</span><span>Module ${i + 1}</span></p>
    <h1>${esc(m.title)}</h1>
    <p class="intro muted">${esc(m.summary)}</p>
    <p class="num"><strong>About ${fmt(moduleMins(m))}</strong> <span class="muted">across ${m.lessons.length} lessons, not counting the exercises</span></p>
    <p class="src">From neurons: ${m.neurons.map(esc).join(", ")}</p>
  </div>
  <ol class="lessons">
    ${m.lessons.map((l, li) => `
      <li><a href="#${l.id}">${tick(state.done[l.id])}
        <span><span class="t">${li + 1}. ${esc(l.title)}</span><p>${esc(l.intro.split(". ")[0].replace(/\.$/, ""))}.</p></span>
        <span class="muted num">${lessonMins(l)} min</span></a></li>`).join("")}
  </ol>
  <div class="row" style="margin-top:24px">
    <a class="btn primary" href="#${(m.lessons.find(l => !state.done[l.id]) || m.lessons[0]).id}">Start the next lesson</a>
  </div>`;
}

function viewLesson(e) {
  const { m, l, mi, li } = e;
  const prev = LESSONS[LESSONS.indexOf(e) - 1], next = LESSONS[LESSONS.indexOf(e) + 1];
  state.last = l.id; save();
  return `
  <div class="reader">
    <aside class="outline">
      <details open>
        <summary>Module ${mi + 1}: ${esc(m.title)}</summary>
        <ol>${m.lessons.map((x, xi) => `<li><a href="#${x.id}" ${x.id === l.id ? 'aria-current="page"' : ""}>${tick(state.done[x.id])}<span>${xi + 1}. ${esc(x.title)} <span class="muted num">· ${lessonMins(x)} min</span></span></a></li>`).join("")}</ol>
      </details>
    </aside>
    <article class="lesson">
      <div class="page-head" style="margin:0">
        <p class="crumbs"><a href="#home">Modules</a><span aria-hidden="true">/</span><a href="#${m.id}">${esc(m.title)}</a><span aria-hidden="true">/</span><span>Lesson ${li + 1} of ${m.lessons.length}</span></p>
        <h1>${esc(l.title)}</h1>
        <p class="intro">${esc(l.intro)}</p>
        <p class="src">About ${lessonMins(l)} min to read and answer the questions · Neuron: ${esc(l.neuron)}</p>
      </div>

      <section aria-labelledby="h-rules" style="display:grid;gap:12px">
        <h2 id="h-rules">The rules</h2>
        <ol class="points">
          ${l.points.map(p => `<li>
            <div class="point-head"><span class="chip k-${esc(p.kind in KIND_LABEL ? p.kind : "principle")}">${KIND_LABEL[p.kind] || "Principle"}</span><span class="rule">${esc(p.rule)}</span></div>
            <p class="why">${esc(p.why)}</p>
            ${p.source ? `<p class="src">${esc(p.source)}</p>` : ""}
          </li>`).join("")}
        </ol>
      </section>

      ${(l.sourcesDiffer && l.sourcesDiffer.length) ? `<section class="note differ" aria-labelledby="h-diff"><h3 id="h-diff">Where sources differ</h3><ul>${l.sourcesDiffer.map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>` : ""}

      ${l.tryIt ? `<section class="note try" aria-labelledby="h-try"><h3 id="h-try">Try it on your own work</h3><p class="src">Not counted in the lesson time</p><p>${esc(l.tryIt)}</p></section>` : ""}

      <section class="quiz" aria-labelledby="h-quiz">
        <h2 id="h-quiz">Check your understanding</h2>
        ${l.quiz.map((q, qi) => quizBlock(l.id, q, qi)).join("")}
      </section>

      <div class="done-box">
        ${tick(state.done[l.id])}
        <span style="flex:1;min-width:180px">${state.done[l.id] ? "You've marked this lesson as done." : "Finished reading and the questions?"}</span>
        <button class="btn ${state.done[l.id] ? "" : "primary"}" type="button" data-act="toggle-done" data-id="${l.id}">${state.done[l.id] ? "Mark as not done" : "Mark lesson as done"}</button>
      </div>

      <nav class="pager" aria-label="Lessons">
        ${prev ? `<a class="btn" href="#${prev.l.id}">Previous: ${esc(prev.l.title)}</a>` : "<span></span>"}
        ${next ? `<a class="btn primary" href="#${next.l.id}">Next: ${esc(next.l.title)}</a>` : `<a class="btn primary" href="#practice">Take the practice test</a>`}
      </nav>
    </article>
  </div>`;
}

function quizBlock(lid, q, qi, opts = {}) {
  const key = `${lid}|${qi}`;
  const chosen = opts.fresh ? undefined : state.quiz[key];
  const answered = chosen !== undefined;
  const name = (opts.prefix || "q") + "-" + lid + "-" + qi;
  return `
  <form class="qform" data-key="${key}" data-mode="${opts.mode || "lesson"}" novalidate>
    <fieldset class="q">
      <legend>${opts.label ? esc(opts.label) + " " : ""}${esc(q.q)}</legend>
      ${q.options.map((o, oi) => {
        let cls = "";
        if (answered && oi === q.answer) cls = "right";
        else if (answered && oi === chosen) cls = "wrong";
        return `<label class="opt ${cls}" for="${name}-${oi}"><input type="radio" id="${name}-${oi}" name="${name}" value="${oi}" ${answered && oi === chosen ? "checked" : ""}><span>${esc(o)}${answered && oi === q.answer ? " <strong>(correct answer)</strong>" : ""}${answered && oi === chosen && oi !== q.answer ? " <strong>(your answer)</strong>" : ""}</span></label>`;
      }).join("")}
      <div class="fb" aria-live="polite">${answered ? feedback(q, chosen) : ""}</div>
      ${answered ? "" : `<div class="row"><button class="btn" type="submit">Check answer</button></div>`}
    </fieldset>
  </form>`;
}
function feedback(q, chosen) {
  const ok = chosen === q.answer;
  return `<div class="feedback ${ok ? "ok" : "no"}"><strong>${ok ? "Correct." : "Not quite."}</strong><span>${esc(q.explain)}</span></div>`;
}

function viewDefaults() {
  return `
  <div class="page-head">
    <h1>Firm defaults</h1>
    <p class="intro">These hold across every neuron unless a task says otherwise. Learn these first: most lessons come back to them.</p>
  </div>
  <dl class="defaults">${DEFAULTS.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>`;
}

/* Flashcards */
let fc = { deck: "all", kind: "all", order: [], i: 0, flipped: false };
function buildDeck() {
  const cards = [];
  LESSONS.forEach(e => { if (fc.deck !== "all" && e.m.id !== fc.deck) return; e.l.points.forEach(p => { if (fc.kind !== "all" && p.kind !== fc.kind) return; cards.push({ e, p }); }); });
  fc.order = cards; fc.i = 0; fc.flipped = false;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function viewCards() {
  if (!fc.order.length && !fc.built) { buildDeck(); fc.built = true; }
  const c = fc.order[fc.i];
  return `
  <div class="page-head">
    <h1>Flashcards</h1>
    <p class="intro">Read the rule, say the reasoning to yourself, then reveal it.</p>
  </div>
  <div class="card-stage">
    <div class="toolbar">
      <div class="field"><label for="fcDeck">Module</label>
        <select id="fcDeck"><option value="all">All modules</option>${COURSE.map((m, i) => `<option value="${m.id}" ${fc.deck === m.id ? "selected" : ""}>${i + 1}. ${esc(m.title)}</option>`).join("")}</select></div>
      <div class="field"><label for="fcKind">Type of rule</label>
        <select id="fcKind"><option value="all">All types</option>${Object.entries(KIND_LABEL).map(([k, v]) => `<option value="${k}" ${fc.kind === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <button class="btn" type="button" data-act="fc-shuffle">Shuffle</button>
    </div>
    ${c ? `
    <div class="flash" aria-live="polite">
      <div class="row" style="justify-content:space-between"><span class="chip k-${esc(c.p.kind)}">${KIND_LABEL[c.p.kind] || "Principle"}</span><span class="src num">Card ${fc.i + 1} of ${fc.order.length}</span></div>
      <p class="front">${esc(c.p.rule)}</p>
      ${fc.flipped ? `<div class="back"><p>${esc(c.p.why)}</p>${c.p.source ? `<p class="src" style="margin-top:8px">${esc(c.p.source)}</p>` : ""}<p style="margin-top:10px"><a href="#${c.e.l.id}">From: ${esc(c.e.m.title)} / ${esc(c.e.l.title)}</a></p></div>` : ""}
    </div>
    <div class="row">
      <button class="btn" type="button" data-act="fc-prev" ${fc.i === 0 ? "disabled" : ""}>Previous card</button>
      <button class="btn ${fc.flipped ? "" : "primary"}" type="button" data-act="fc-flip">${fc.flipped ? "Hide the reasoning" : "Show the reasoning"}</button>
      <button class="btn ${fc.flipped ? "primary" : ""}" type="button" data-act="fc-next" ${fc.i >= fc.order.length - 1 ? "disabled" : ""}>Next card</button>
    </div>` : `<p class="muted">No cards match. Choose another module or type of rule.</p>`}
  </div>`;
}

/* Practice test */
let pr = { scope: "all", qs: [], i: 0, answers: [], started: false };
function startPractice() {
  const pool = [];
  LESSONS.forEach(e => { if (pr.scope === "done" && !state.done[e.l.id]) return; if (pr.scope !== "all" && pr.scope !== "done" && e.m.id !== pr.scope) return; e.l.quiz.forEach((q, qi) => pool.push({ e, q, qi })); });
  pr.qs = shuffle(pool).slice(0, 10); pr.i = 0; pr.answers = []; pr.started = true;
}
function viewPractice() {
  const doneCount = Object.keys(state.done).length;
  if (!pr.started) return `
  <div class="page-head">
    <h1>Practice test</h1>
    <p class="intro">Ten questions picked at random from across the course, about 10 minutes. Answers here don't change your lesson scores.</p>
  </div>
  <form id="prStart" class="card-stage" novalidate>
    <div class="field"><label for="prScope">Questions from</label>
      <select id="prScope">
        <option value="all">All ${TOTAL_Q} questions in the course</option>
        <option value="done" ${doneCount ? "" : ""}>Lessons I've marked as done (${doneCount})</option>
        ${COURSE.map((m, i) => `<option value="${m.id}" ${pr.scope === m.id ? "selected" : ""}>Module ${i + 1}: ${esc(m.title)}</option>`).join("")}
      </select></div>
    <p class="err" id="prErr" hidden></p>
    <div class="row"><button class="btn primary" type="submit">Start the test</button></div>
  </form>`;
  if (pr.i >= pr.qs.length) {
    const right = pr.answers.filter(Boolean).length;
    const missed = pr.qs.filter((x, i) => !pr.answers[i]);
    return `
    <div class="page-head"><h1>You scored ${right} out of ${pr.qs.length}</h1>
      <p class="intro">${right === pr.qs.length ? "A clean sweep." : "Revisit the lessons behind the ones you missed."}</p></div>
    ${missed.length ? `<div class="results">${missed.map(x => `<a class="result" href="#${x.e.l.id}"><span>${esc(x.q.q)}</span><span class="src">Review: ${esc(x.e.m.title)} / ${esc(x.e.l.title)}</span></a>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:24px"><button class="btn primary" type="button" data-act="pr-again">Take another test</button></div>`;
  }
  const x = pr.qs[pr.i];
  const answered = pr.answers[pr.i] !== undefined;
  return `
  <div class="page-head"><p class="eyebrow num">Question ${pr.i + 1} of ${pr.qs.length}</p>${bar(pr.i, pr.qs.length, `Question ${pr.i + 1} of ${pr.qs.length}`)}</div>
  <div class="card-stage">
    ${quizBlock(x.e.l.id, x.q, x.qi, { mode: "practice", fresh: !answered, prefix: "p" + pr.i })}
    <p class="src">From ${esc(x.e.m.title)} / <a href="#${x.e.l.id}">${esc(x.e.l.title)}</a></p>
    ${answered ? `<div class="row"><button class="btn primary" type="button" data-act="pr-next">${pr.i === pr.qs.length - 1 ? "See my score" : "Next question"}</button></div>` : ""}
  </div>`;
}

/* Search */
let query = "";
function viewSearch() {
  const q = query.trim().toLowerCase();
  const hits = [];
  if (q.length > 1) LESSONS.forEach(e => e.l.points.forEach(p => { const hay = (p.rule + " " + p.why + " " + (p.source || "")).toLowerCase(); if (hay.includes(q)) hits.push({ e, p }); }));
  const hl = s => { const t = esc(s); if (!q) return t; const qe = esc(query.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return t.replace(new RegExp(qe, "gi"), m => `<mark>${m}</mark>`); };
  return `
  <div class="page-head">
    <h1>Search</h1>
    <p class="intro">${q.length > 1 ? `${hits.length} rule${hits.length === 1 ? "" : "s"} mention “${esc(query.trim())}”.` : "Type at least two letters in the search box above."}</p>
  </div>
  <div class="results">${hits.slice(0, 150).map(h => `
    <a class="result" href="#${h.e.l.id}">
      <span class="point-head"><span class="chip k-${esc(h.p.kind)}">${KIND_LABEL[h.p.kind] || "Principle"}</span><span class="rule">${hl(h.p.rule)}</span></span>
      <span class="why">${hl(h.p.why)}</span>
      <span class="src">${esc(h.e.m.title)} / ${esc(h.e.l.title)}</span>
    </a>`).join("")}</div>`;
}

/* ---------- router ---------- */
function route(focus) {
  const h = (location.hash || "#home").slice(1);
  let html, nav = "home";
  if (h === "defaults") { html = viewDefaults(); nav = "defaults"; }
  else if (h === "flashcards") { html = viewCards(); nav = "flashcards"; }
  else if (h === "practice") { html = viewPractice(); nav = "practice"; }
  else if (h === "search") { html = viewSearch(); nav = ""; }
  else if (BY_ID[h] && BY_ID[h].type === "module") html = viewModule(BY_ID[h].m);
  else if (BY_ID[h] && BY_ID[h].type === "lesson") html = viewLesson(BY_ID[h]);
  else html = viewHome();
  app.innerHTML = html;
  document.querySelectorAll("nav.main a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (focus) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
}
window.addEventListener("hashchange", () => route(true));

/* ---------- events ---------- */
document.getElementById("searchForm").addEventListener("submit", ev => {
  ev.preventDefault(); query = document.getElementById("q").value;
  if (location.hash === "#search") route(false); else location.hash = "search";
});
document.getElementById("q").addEventListener("input", ev => { query = ev.target.value; if (location.hash === "#search") route(false); });

app.addEventListener("submit", ev => {
  const f = ev.target;
  if (f.id === "prStart") { ev.preventDefault(); pr.scope = document.getElementById("prScope").value; startPractice();
    if (!pr.qs.length) { pr.started = false; route(false); const er = document.getElementById("prErr"); er.textContent = "There are no questions there yet. Mark some lessons as done, or choose all questions."; er.hidden = false; return; }
    route(true); return; }
  if (!f.classList.contains("qform")) return;
  ev.preventDefault();
  const picked = f.querySelector("input[type=radio]:checked");
  const fb = f.querySelector(".fb");
  if (!picked) { fb.innerHTML = `<p class="err">Choose an answer, then check it.</p>`; f.querySelector("input[type=radio]").focus(); return; }
  const v = Number(picked.value);
  const [lid, qi] = f.dataset.key.split("|");
  const q = BY_ID[lid].l.quiz[qi];
  if (f.dataset.mode === "practice") { pr.answers[pr.i] = v === q.answer; route(false); const b = app.querySelector('[data-act="pr-next"]'); if (b) b.focus(); return; }
  state.quiz[f.dataset.key] = v; save();
  const tmp = document.createElement("div");
  tmp.innerHTML = quizBlock(lid, q, Number(qi));
  f.replaceWith(tmp.firstElementChild);
});

app.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "toggle-done") { const id = b.dataset.id; if (state.done[id]) delete state.done[id]; else state.done[id] = true; save(); route(false); const nb = app.querySelector('[data-act="toggle-done"]'); if (nb) nb.focus(); }
  if (a === "fc-flip") { fc.flipped = !fc.flipped; route(false); app.querySelector('[data-act="fc-flip"]').focus(); }
  if (a === "fc-next" && fc.i < fc.order.length - 1) { fc.i++; fc.flipped = false; route(false); app.querySelector('[data-act="fc-flip"]').focus(); }
  if (a === "fc-prev" && fc.i > 0) { fc.i--; fc.flipped = false; route(false); app.querySelector('[data-act="fc-flip"]').focus(); }
  if (a === "fc-shuffle") { shuffle(fc.order); fc.i = 0; fc.flipped = false; route(false); }
  if (a === "pr-next") { pr.i++; route(true); }
  if (a === "pr-again") { pr.started = false; route(true); }
});
app.addEventListener("change", ev => {
  if (ev.target.id === "fcDeck") { fc.deck = ev.target.value; buildDeck(); route(false); document.getElementById("fcDeck").focus(); }
  if (ev.target.id === "fcKind") { fc.kind = ev.target.value; buildDeck(); route(false); document.getElementById("fcKind").focus(); }
});

route(false);
</script>
</body>
</html>
