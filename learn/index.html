es; the rest of the identity carries the story. Good logos come from signed-off goals, lots of sketching, a strong one-colour form, optical craft and testing at real sizes, then a presentation judged against the goals.", "points": [{"rule": "A logo identifies; it doesn't explain. Spread the brand story across the wider identity.", "why": "It gains meaning from the products and people behind it. Apple's 1976 illustrated logo was replaced within a year.", "kind": "principle", "source": "Rand and Haviv, via Paget"}, {"rule": "Write the brief as a list of goals, including 'won'ts', and get it approved in writing before design.", "why": "Signed-off goals make feedback objective, discourage late opinions and are the main defence against design by committee.", "kind": "technique", "source": "Paget"}, {"rule": "Sketch on paper first, including the obvious clichés, and never stop at the first good idea.", "why": "Vectors look finished too early. Sketching clichés early gets them out of the way; ideas are cheap and the skill is choosing.", "kind": "technique", "source": "Paget"}, {"rule": "Design in solid black first, then add colour with a reason.", "why": "If it works in one colour it works anywhere, from embossing to embroidery. Colour and gradients hide weak ideas.", "kind": "principle", "source": "Paget; HOW judges"}, {"rule": "Default to a combination mark for a new brand; use a symbol alone only once the brand is known.", "why": "A symbol means nothing until seen many times, and building recognition from it alone is slow and expensive.", "kind": "principle", "source": "Figma RL; Paget"}, {"rule": "Reduce in steps (about 300, 150, 75, 32 and 16px) and note which detail fails first.", "why": "The first loss marks where a small version should start. Plan a micro mark, and drop taglines from small versions.", "kind": "technique", "source": "Kittl"}, {"rule": "Redraw the reversed version rather than recolouring it.", "why": "White on dark looks heavier (irradiation), so shave weight; faces and eyes become photographic negatives otherwise.", "kind": "technique", "source": "Paget"}, {"rule": "Correct optically, not mathematically: overshoot round forms and sit centred elements slightly above centre.", "why": "Exact geometry often looks wrong; Google's 2015 G isn't a perfect circle. Grids refine an idea; they don't generate one.", "kind": "technique", "source": "Paget; LogoDesign.net"}, {"rule": "Ask 'Does this meet the goals?', never 'What do you think?'", "why": "Asked what they think, people list dislikes. Asked about the goals, they give a yes or objective feedback.", "kind": "technique", "source": "Paget"}, {"rule": "Never call a mark legally available; say 'no obvious conflict in a preliminary search'.", "why": "Run reverse image searches and the WIPO Global Brand Database before presenting, and recommend a trademark attorney for anything that matters.", "kind": "caution", "source": "Paget; Balise"}], "sourcesDiffer": ["How many concepts: section 17 says two or three; Nezhynska narrows about 30 to two; LogoGeek later shows one. Default: one recommended concept plus at most one genuine alternative where the brief is uncertain, each on its own, never numbered on one sheet.", "Descriptive cues: an HBR study of 597 companies found product-type cues tended to help, while brain treats literal depictions of today's product as a mistake. Default: a cue that signals the category is fine; don't draw one specific current product, and go abstract when the category has negative associations.", "Colour in round one: Paget shows it; others hold it back. Default: lead with black and white, then colour with its reason in the same session."], "tryIt": "Take a logo you are working on, reduce it in steps down to 16px and in solid black, and note what fails first. Then rewrite your presentation's feedback question as 'Does this meet the goals?' with the goals listed.", "quiz": [{"q": "A client wants the logo to show their mission, three services and their city skyline. What is the best response?", "options": ["Include all of them but in smaller sizes", "A logo identifies rather than explains; keep the strongest idea and let the wider identity tell the story", "Use a gradient to tie the elements together", "Pick a mascot that holds all three"], "answer": 1, "explain": "A logo is the full stop, not the sentence; spread the story across the identity."}, {"q": "You need a white-on-navy version of a black logo. What should you do?", "options": ["Swap the fill colour to white and export", "Add a drop shadow for contrast", "Increase the stroke weight", "Redraw it, shaving weight to correct irradiation and checking negative details"], "answer": 3, "explain": "The reversed version is a redraw: white on dark looks heavier, so weight is reduced by eye."}, {"q": "A new start-up with an unfamiliar name asks for a standalone abstract symbol with no wordmark. What does the lesson advise?", "options": ["Use a combination mark until the brand is known", "Go ahead; abstract symbols are the most memorable", "Use only a monogram of the initials", "Use an emblem for heritage"], "answer": 0, "explain": "A symbol alone means nothing until seen many times; a combination mark is the safe default for new brands."}]}, {"id": "m09-l7", "title": "Presentations and slide craft", "neuron": "presentations", "intro": "A deck works when someone skimming only the titles can follow the argument, and every slide makes one point with honest evidence. Decide early whether it will be presented or read, then let the content set the composition, not the template.", "points": [{"rule": "Write action titles: each states the conclusion as a full sentence, and the titles alone tell the story.", "why": "'Revenue grew 12% driven by pricing, not volume' beats 'Revenue analysis'. If you can't state the answer in one sentence, the slide isn't ready.", "kind": "technique", "source": "Deckary"}, {"rule": "Make one point per slide and move dense support to footnotes or an appendix.", "why": "Footnote every number with source, date and method in small text under the exhibit.", "kind": "principle", "source": "Deckary"}, {"rule": "Decide first whether it is a speaking deck or a reading deck.", "why": "Speaker-led slides carry one idea and one to three bullets; reading-first slides four to eight bullets. Split rather than shrink.", "kind": "technique", "source": "Zhang, frontend-slides"}, {"rule": "If text doesn't fit, change the composition: move, resize or split, shorten copy, and shrink type last.", "why": "Never shrink below the floor to make text fit; use fewer items, bigger shapes or a different layout.", "kind": "principle", "source": "Yapily; wshobson"}, {"rule": "Use only confirmed proof points; never estimate or round up, and mark gaps visibly as [X]%.", "why": "Better a visible gap than an invented figure. Keep a list of things never to claim alongside the claims you can make.", "kind": "caution", "source": "Yapily"}, {"rule": "Apply the swap test to boxes: if every box could swap places without changing meaning, the hierarchy is wrong.", "why": "Give the most important box a distinct treatment, and remember boxes aren't the default; content can sit straight on the background.", "kind": "technique", "source": "Yapily"}, {"rule": "Never put two consecutive content slides in the same composition.", "why": "Alternate text-led and visual-led slides, and match composition complexity to content density.", "kind": "principle", "source": "Yapily"}, {"rule": "Propose the structure before building: numbered slides, one line each, with the layout named.", "why": "Agreeing the outline first is cheaper than reworking a built deck, and density problems get flagged up front.", "kind": "technique", "source": "Yapily"}, {"rule": "QA by rendering every slide to an image and checking it.", "why": "Look for leftover placeholder text, overflow and clipping, substituted fonts, uneven gaps and low-contrast text.", "kind": "technique", "source": "Yapily; Anthropic pptx skill"}, {"rule": "Make charts readable from the back of the room, with direct labels, and never invent chart data.", "why": "Use one distinct colour-blind-safe colour per category and alt text in shared decks. Without real figures, use a non-numeric exhibit.", "kind": "principle", "source": "Figma RL; Alam"}], "sourcesDiffer": ["Minimum text size: Kawasaki says never below 30pt; Yapily's skill allows 9pt in boxes while its template says 12pt. Default: presented decks follow Kawasaki as closely as content allows; read-alone decks never go below the template's floor; for projected talks with data, 18pt is the floor.", "Title as label or conclusion: Yapily keeps a small reference title; consulting decks make the title the conclusion. Default: both, a small label for orientation plus a full-sentence headline.", "Deck length: Kawasaki 10, DocSend about 20, a consulting median of 38 (unsourced). Default: set by the job and time slot, one point per slide; a pitch stays near 10 to 20."], "tryIt": "Take a recent deck and read only its titles aloud. Rewrite each topic title as a one-sentence conclusion, and flag any slide whose number has no confirmed source.", "quiz": [{"q": "A stakeholder skims your deck and can't follow the argument. Titles read 'Background', 'Data', 'Findings'. What fixes this best?", "options": ["Add an agenda slide", "Make the titles bigger", "Rewrite each title as a full-sentence conclusion", "Add more bullet points under each title"], "answer": 2, "explain": "Action titles state the conclusion, so the titles alone tell the story."}, {"q": "A slide has too much text for its box. What should you try first?", "options": ["Reduce the font size until it fits", "Move, resize or split the slide, or cut copy, before shrinking type", "Let it overflow into the footer", "Switch to a condensed font"], "answer": 1, "explain": "Text fits or the composition changes; shrinking type is the last resort."}, {"q": "A sales slide would be stronger with a customer adoption figure, but none is confirmed. What should you do?", "options": ["Estimate a plausible figure and round it", "Use a competitor's figure", "Drop the slide entirely", "Write a visible placeholder such as [X]% and note where the figure might come from"], "answer": 3, "explain": "Only confirmed proof points may be used; a visible gap is better than an invented number."}]}]}, {"id": "m10", "title": "Designing for AI", "summary": "How to decide when AI belongs, design trustworthy AI interfaces, conversations and agents, evaluate them, and use AI well in your own design work.", "neurons": ["ai", "agents", "ai-patterns", "conversational-design", "ai-evals-and-context", "ai-in-ux-work", "ai-prompting"], "lessons": [{"id": "m10-l1", "title": "Designing AI features and trust", "neuron": "ai", "intro": "Most AI features fail because they don't fit how people already work, or because checking the output costs more than doing the task. Decide first whether AI belongs at all, scope it narrowly, and give it as much evidence and control as the moment of reliance needs.", "points": [{"rule": "Put scoped AI help where work already happens, not in a separate AI destination.", "why": "Target tasks that are severe, frequent and frustrating, and prefer reliability over novelty. Build it into the existing flow, at the moment of decision.", "kind": "principle", "source": "NN/g; Amplitude"}, {"rule": "Scope AI features narrowly by default and add breadth only when needs justify it.", "why": "Narrow features tested better than broad chat: people understood them, prompted more easily and iterated more. Narrow scope also lets you expose capabilities as buttons and fields.", "kind": "evidence", "source": "NN/g, Moran"}, {"rule": "Before building, run four checks: enough context, fits input limits, output checkable, core tasks work without AI.", "why": "A one-quote summary passes; whole-project summaries and automated reports fail, because checking costs more than doing. Split complex analysis into small, checkable steps.", "kind": "technique", "source": "NN/g, Knoll"}, {"rule": "Use rules, not generative AI, where outcomes must be precise, auditable or the same every time.", "why": "Generative AI suits open-ended drafting, summarising and complex outputs. Facts such as revenue come from code; the model can write placeholders that code fills from source data.", "kind": "principle", "source": "Agentic Path Design"}, {"rule": "Automate tasks people want rid of; augment tasks they want to own.", "why": "Automate recurring, disliked, describable, low-risk tasks. Keep judgement-heavy, high-risk or hard-to-define tasks human, and test which one users actually want.", "kind": "principle", "source": "Agentic Path Design; Torres"}, {"rule": "Never let AI displace a core function.", "why": "An AI chat that took over a search field made search itself worse. An unneeded feature is bad; one that blocks a needed feature is worse.", "kind": "caution", "source": "NN/g, Moran"}, {"rule": "Present output as an editable draft that needs explicit approval before it is saved anywhere authoritative.", "why": "In a regulated setting, accurate output that auto-saved was poorly adopted. Edits on drafts are also a useful learning signal.", "kind": "evidence", "source": "Mind the Product"}, {"rule": "Match trust scaffolding to the moment of reliance.", "why": "A creative draft needs an AI label, editing and feedback; a factual answer needs claim-level citations and freshness; high-impact decisions need evidence, review, override and audit. One-size disclaimers fail both ends.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Show confidence only where it changes the decision, as High / Medium / Low or a shortlist.", "why": "Raw percentages invite false precision; a bare 78% fails. When evidence is weak, lower the precision with ranges, categories or a partial answer.", "kind": "principle", "source": "Uxcel; AI UX Playground"}, {"rule": "Count the verification tax: correcting, re-prompting and spotting errors are hidden user work.", "why": "Design it out by letting the system say I don't know and showing how corrections improve later answers.", "kind": "caution", "source": "Mind the Product"}], "sourcesDiffer": ["Agentic Path Design suggests percentages for high-stakes settings and verbal labels for low-stakes ones; the Atlas wants P10 to P90 ranges on forecasts; brain prefers High / Medium / Low or a shortlist. Default: labels or a shortlist for general audiences, numbers or ranges only for trained expert users, and research either choice first.", "Relationship-design detects frustration and adapts the interface; brain never infers sensitive traits or assigns feelings. Default: respond to explicit signals such as repeated failures."], "tryIt": "Take one AI feature idea on your roadmap and run it through the four checks and the automate-or-augment question. Write down which trust scaffolds its moment of reliance needs.", "quiz": [{"q": "A team wants AI to auto-generate a full quarterly report from all project data. What is the main problem by the four checks?", "options": ["The model is too slow for long reports", "Checking the output would cost more than doing the task", "Reports should always be written in chat", "Users prefer percentages to prose"], "answer": 1, "explain": "Whole-project summaries and automated reports fail the check that output can be verified and edited cheaply. Split it into small, checkable steps."}, {"q": "A payroll product wants AI to state each employee's net pay in a summary. What is the best approach?", "options": ["Let the model calculate the figures and add a disclaimer", "Show the model's step-by-step reasoning for each figure", "Hide the figures behind a Show more control", "Have code fill the figures from source data into placeholders the model writes"], "answer": 3, "explain": "Facts such as payroll come from code. The model can write placeholders that code fills from source data, with links."}, {"q": "An AI writes structured records in a regulated tool. Output is accurate, but adoption is poor. What change does the lesson suggest?", "options": ["Present output as an editable draft that needs explicit approval before saving", "Raise model accuracy further", "Auto-save faster so people wait less", "Add a confidence percentage to each record"], "answer": 0, "explain": "Accurate output that auto-saved was poorly adopted. Drafts that need explicit approval keep people in control and their edits become a learning signal."}]}, {"id": "m10-l2", "title": "AI interface patterns", "neuron": "ai-patterns", "intro": "A blank chat box hides what a feature can do and forces people to prompt. Good AI interfaces back the text field with recognisable controls, shape output for the job, and make sources, labels and refinement easy.", "points": [{"rule": "Back the chat box with task controls and pick the output shape from the job.", "why": "Use sliders, presets and templates beside chat, and show tables, checklists or ranked options with the key answer first. A wall of prose where a table fits is a named failure.", "kind": "principle", "source": "NN/g; AI UX Playground"}, {"rule": "Replace the blank box with a guided empty state that says what the AI knows and doesn't.", "why": "One box that does everything hides capabilities, and prompting is less intuitive than search. Starter tasks and one-tap mode controls mean nobody needs prompt-engineering skill.", "kind": "technique", "source": "UX Magazine; Built for Mars"}, {"rule": "Offer 2–4 follow-up chips naming concrete next tasks tied to the answer, never Tell me more.", "why": "Follow-ups under each answer are currently the most useful kind of suggestion. Keep them editable before sending and refresh them after each answer.", "kind": "technique", "source": "NN/g; AI UX Playground"}, {"rule": "Let people refine a selected part instead of only regenerating the whole output.", "why": "In an image-generation study, changing one detail redrew the whole image and people described it as fighting the AI. Offer targeted edits that leave the rest alone.", "kind": "evidence", "source": "NN/g, Mugunthan and Gibbons"}, {"rule": "Keep Retry, Regenerate and Continue as distinct verbs.", "why": "Retry repeats the request and replaces the answer, Regenerate gives a variation and keeps the original, and Continue extends a cut-off answer.", "kind": "technique", "source": "Calvo, ui-craft"}, {"rule": "Place each citation beside its claim, with the real title and a link to the exact passage.", "why": "People rarely click sources but trust answers more when they're shown. A citation that doesn't support its claim is worse than none.", "kind": "evidence", "source": "NN/g, Chan"}, {"rule": "Don't offer step-by-step reasoning as the explanation; prefer sources and stated limits.", "why": "Narrated reasoning is often an after-the-fact rationalisation and suggests false certainty. Avoid human names, personas and I thought about phrasing.", "kind": "caution", "source": "NN/g, Chan"}, {"rule": "Label AI content, keep the label through copy and export, and name the action.", "why": "Rewrote with AI says more than a bare AI badge. Tell AI suggestions apart from confirmed or human-edited content.", "kind": "principle", "source": "UX Magazine; Shape of AI"}, {"rule": "Always add a text label to a sparkles icon.", "why": "In a test of 107 people (indicative), no one linked sparkles to AI and 73% read a star as save or favourite.", "kind": "default", "source": "NN/g, Kaplan"}, {"rule": "While streaming, keep the start of the new answer in view and offer jump to latest.", "why": "Never pull the reader away or move focus while a response streams. Announce Responding at the start and the finished answer at the end, not every token.", "kind": "default", "source": "NN/g; Visa Design System"}], "sourcesDiffer": ["Section 23 says auto-scroll when the user is within about 60px of the bottom; NN/g says keep the start of the new message in view. Default: anchor the start of a new answer in view, never pull the reader away, and offer a jump to latest control.", "The AI UX Playground collapses reasoning by default behind a named control; NN/g worries about false certainty. Default: don't offer reasoning as the explanation; where agentic work needs a trail, show tool steps and keep any summary collapsed and labelled as a summary.", "One skill enables Send only when input is non-empty; brain never pre-disables submit. Default: an empty send does nothing and shows no error."], "tryIt": "Audit one AI screen against the eight chat checks: purpose, visible context, no prompt skill needed, clear waiting and failure, checkable claims, partial fixes, right structure, recovery. List the two weakest.", "quiz": [{"q": "Users of an AI writing tool complain they must regenerate the whole document to fix one paragraph. What should you add?", "options": ["A bigger Regenerate button", "A confidence score per paragraph", "Refinement scoped to a selected paragraph, with presets", "A longer system prompt"], "answer": 2, "explain": "Refining a selected part beats regenerating everything; only offering Regenerate forces a full rewrite for a one-paragraph fix."}, {"q": "Your AI button uses only a sparkles icon. What does the evidence suggest?", "options": ["Add a text label, because people don't reliably link sparkles to AI", "Keep it; sparkles is a universal AI symbol", "Swap it for a star icon", "Animate it so it stands out"], "answer": 0, "explain": "In NN/g's test no one linked sparkles to AI and most read a star as save. Visible labels on icons are a firm default."}, {"q": "Stakeholders want to show the model's step-by-step reasoning to build trust in answers. What is the better default?", "options": ["Show the full reasoning expanded on every answer", "Show sources and stated limits rather than narrated reasoning", "Give the assistant a human name so it feels accountable", "Remove all explanation to keep it clean"], "answer": 1, "explain": "Narrated reasoning is often rationalisation and suggests false certainty. Sources and stated limits explain without overclaiming."}]}, {"id": "m10-l3", "title": "Agents and autonomy", "neuron": "agents", "intro": "Agents act for people, so autonomy is a product decision, not a model capability. Grant the least autonomy that gets the job done, stage risky actions for approval, and make every action visible, bounded and recoverable.", "points": [{"rule": "Grant the lowest autonomy level that delivers the outcome.", "why": "Score each action on impact, reversibility, reliability, sensitivity and how easily errors are spotted. When signals conflict, take the lower level or split the workflow.", "kind": "principle", "source": "AI UX Playground"}, {"rule": "Use five levels: suggest, draft, confirm, bounded, monitor.", "why": "Each level names who decides, who acts and who monitors. Default new users and irreversible actions to confirm.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Build an agent only when the task needs one; otherwise use a model call plus rules.", "why": "The task should be multi-step and hard to specify in advance, worth the extra cost and latency, and its errors catchable and recoverable. Any no means a simpler tier.", "kind": "principle", "source": "Tiwari; Anthropic"}, {"rule": "Stage, don't execute: an approval card shows the exact payload, impact, Edit and Deny.", "why": "Name the verb and object, scope, the rule that triggered the gate and recovery. Never ask after the side effect, and add no friction to low-stakes actions.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Preview intent in plain language with three exits: Proceed, Edit plan, Handle it myself.", "why": "Without a preview people feel ambushed and switch the feature off. Write steps as Cancel flight AA123, not an API call.", "kind": "technique", "source": "Yocco, Smashing"}, {"rule": "State when an action becomes permanent, for example Undo available for 15 minutes.", "why": "Hiding the point of no return is the failure; one unrecoverable error does lasting damage. Keep an action log with one-click undo.", "kind": "default", "source": "Yocco, Smashing"}, {"rule": "An agent may combine at most two of: untrusted input, sensitive data, external actions.", "why": "All three together let prompt injection steal data or act. If a task needs all three, add human approval or another reliable check.", "kind": "principle", "source": "Meta, Agents Rule of Two"}, {"rule": "Set hard limits on steps or spend; at the cap, keep finished work and offer ways on.", "why": "A budget that only emails an admin isn't a ceiling. Offer raise the limit, wait for the reset or narrow the scope, and never lock people out of earlier results.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Never imply a booking or send happened when the agent couldn't act.", "why": "Approval keeps the agent working behind a gate; handoff passes the job to a person. Give the partial result and hand over the last step with the context.", "kind": "caution", "source": "AI UX Playground"}, {"rule": "Make lowering autonomy easy, because one failure often makes people abandon the agent.", "why": "Indicative targets: over 85% of plans accepted unedited, review if overrides exceed 10%, and turn off automation where more than 5% of actions are undone.", "kind": "evidence", "source": "Yocco, Smashing"}], "sourcesDiffer": [], "tryIt": "List every action an agent in your product could take and score each on impact and reversibility. Assign an autonomy level and a gate type (none, before the run, after the draft) to each.", "quiz": [{"q": "An email agent reads messages from anyone, can see the user's private files and can send replies. What does the Rule of Two say?", "options": ["It is fine if the model is strong enough", "Add a disclaimer near the input", "Allow it, but log every action", "Remove one leg, such as requiring approval before sending"], "answer": 3, "explain": "All three together let prompt injection steal data or act. Drop one leg, for instance trusted senders only or a person approving drafts."}, {"q": "An agent's approval dialog reads Continue? with Yes and No. What is missing?", "options": ["The exact payload, plain-language impact, and Edit and Deny options", "A countdown timer", "A larger Yes button", "A confidence percentage"], "answer": 0, "explain": "An approval card stages the action and shows payload, verb and object, scope, impact and recovery. If a gate can't say what will change, it isn't a gate."}, {"q": "A booking agent cannot complete payment because the site needs a manual step. What should it do?", "options": ["Report success and retry later in the background", "Silently cancel the task", "Give the partial result and hand the last step to the person", "Ask the person to start again from scratch"], "answer": 2, "explain": "Never imply the booking happened. Hand off with the summary, context and actions already taken."}]}, {"id": "m10-l4", "title": "Conversational design", "neuron": "conversational-design", "intro": "Chat is not automatically easier. It suits fuzzy goals, while defined tasks are often better served by a GUI. When you do design a conversation, keep turns short, carry context, confirm before acting and fail honestly.", "points": [{"rule": "Use chat for fuzzy goals people explore; use a GUI for defined tasks.", "why": "Trip planning and brainstorming suit chat. A menu is a flat conversation that shows many paths at once in fewer turns.", "kind": "principle", "source": "Phillips, after Saffer"}, {"rule": "Judge hybrid chat by steps removed, not by time saved.", "why": "In a study of 73 students, task time didn't differ, but clicks fell from about 10 to 6. Most gain came from one request replacing locate, navigate, act (indicative).", "kind": "evidence", "source": "Dizon et al., HAI 2026"}, {"rule": "Make safeguards on the agent path at least as strong as on the GUI path.", "why": "People delegated deletes as readily as reads, so preview, confirmation and undo must hold for chat-driven actions too.", "kind": "caution", "source": "Dizon et al., HAI 2026"}, {"rule": "Let people choose how much to delegate; don't make delegation the default.", "why": "About half the variance in assistant use came from who the person was, even among people told to use it.", "kind": "evidence", "source": "Dizon et al., HAI 2026"}, {"rule": "Review dialogue against Grice's maxims and answer the implied request.", "why": "Quantity, quality, relevance and manner. Do you know the actor? needs the name, not Yes.", "kind": "technique", "source": "Sahu, UX Magazine"}, {"rule": "Keep turns short, one thought per turn, about three options, with turn ownership obvious.", "why": "No monologues; break big tasks into small steps with a check after each, and keep Help available everywhere.", "kind": "principle", "source": "Sahu; Phillips; Hampton"}, {"rule": "Support both buttons and free text.", "why": "People disliked typing what could be a button, and removing free text after a menu choice trapped them. Carousels hid options; for long lists hand over to sort, filter or a GUI.", "kind": "evidence", "source": "NN/g, Budiu"}, {"rule": "Carry context across turns and topic switches; never make people repeat themselves.", "why": "Bots failed when they asked for the account again on every question or forced a restart after No. Keep a pending task through a side question.", "kind": "principle", "source": "NN/g, Budiu; Sahu"}, {"rule": "Confirm by restating the parsed request before acting, not with a bare OK.", "why": "For example, £200 to the account ending 0345? Validate at the turn where an error would be costly to undo.", "kind": "technique", "source": "Sahu; Hampton"}, {"rule": "Fail honestly and hand over to a person at once when asked.", "why": "An honest I don't understand plus a route to a person went down well; confident wrong answers and loops annoyed people. Refusing handoff is worse than escalating early.", "kind": "principle", "source": "NN/g, Budiu; Kenderova and Kohler"}], "sourcesDiffer": ["Phillips cites a study finding human-like traits help only alongside empathy; NN/g finds personas inflate expected capability. Default: a restrained, neutral voice that acknowledges the situation, with no human name and no claimed feelings."], "tryIt": "Role-play one key conversation with a colleague, happy path first, then write three transcripts (happy path, error recovery, edge case) and check each against Grice's maxims.", "quiz": [{"q": "A team claims their new chat assistant failed because task times were no faster than the GUI. What does the evidence suggest?", "options": ["Remove the assistant", "Measure steps removed per delegation as well as time", "Make the assistant the only way in", "Add a friendlier persona"], "answer": 1, "explain": "Chat cut effort, not time: clicks and navigations fell while time stayed level. Judge hybrids by steps removed."}, {"q": "A user asks the bot about delivery, then switches to collection. The bot asks for their address again. What principle is broken?", "options": ["Grice's maxim of manner", "Short turns", "Honest failure", "Carrying context across topic switches"], "answer": 3, "explain": "Bots failed when they asked for the address again after a switch from delivery to collection. Carry context and don't make people repeat themselves."}, {"q": "Before transferring money, what should a conversational assistant say?", "options": ["£200 to the account ending 0345?", "OK, done.", "Great question! Let me help.", "Processing your request..."], "answer": 0, "explain": "Confirm by restating the parsed request before acting, especially where an error would be costly to undo."}]}, {"id": "m10-l5", "title": "Evals and context", "neuron": "ai-evals-and-context", "intro": "You can't spec a non-deterministic system screen by screen, so you define good and test against it. Start from real failures, use the cheapest check that works, and remember that better context usually beats more context or a better prompt.", "points": [{"rule": "Write the hypothesis and its failure line before any AI build.", "why": "Add We'll know we're wrong if a behaviour doesn't reach a level by a date. The team agrees both lines first, so success isn't defined after results arrive.", "kind": "technique", "source": "Jeff Gothelf"}, {"rule": "Start with error analysis on real traces before building judges or dashboards.", "why": "Read inputs, prompts, tool calls and outputs, annotate, group and rank by customer impact. Around 100 traces is roughly where new failure categories stop appearing.", "kind": "principle", "source": "Husain and Shankar; Torres"}, {"rule": "Use failure categories you observed, not ones you brainstormed.", "why": "Generic labels such as hallucination score or coherence show the list was brainstormed. Grounded ones such as missing query constraint show it was observed.", "kind": "caution", "source": "Husain and Shankar"}, {"rule": "Use the cheapest eval that works: code checks, then golden datasets, then judges.", "why": "Many subjective failures reduce to a keyword list once you know the domain. Report code checks and judged checks separately, never as one blended score.", "kind": "technique", "source": "Torres; Eval Genius"}, {"rule": "Use several binary judges, one criterion each, rather than one rating scale.", "why": "Annotators disagree on a 3 versus a 4 and judges inherit the noise. A holistic is this helpful? judge gives verdicts nobody can act on.", "kind": "principle", "source": "Husain and Shankar"}, {"rule": "Validate a judge with true-positive and true-negative rates, not accuracy.", "why": "If 90% of traces pass, a judge that always says Pass scores 90% and catches nothing. Target both rates above 90%, minimum 80%.", "kind": "evidence", "source": "Husain and Shankar"}, {"rule": "Use real inputs from target users; invented examples mostly test your own assumptions.", "why": "Run each input several times and set the pass bar as a rate, such as 8 in 10 acceptable, because outputs vary.", "kind": "caution", "source": "Jeff Gothelf"}, {"rule": "Treat a passing eval as a gate, not proof of value.", "why": "Passing shows output is good enough to put in front of people; only real use shows whether the business outcome follows. Pilot next.", "kind": "principle", "source": "Jeff Gothelf"}, {"rule": "Expect errors to multiply across agent steps.", "why": "About 1 failing call in 40, with 10–20 calls per run, meant roughly half of all runs failed.", "kind": "evidence", "source": "Torres, Product Talk"}, {"rule": "Curate and label context in users' words; more context isn't better.", "why": "Tools named in jargon such as credential-recovery workflow were picked wrongly; renaming them reset-password and unlock-account fixed it. Longer input alone lowers quality.", "kind": "evidence", "source": "Perez, NN/g; Torres"}], "sourcesDiffer": ["Husain and Shankar and brain use binary pass/fail per failure mode; one community skill scores 1–10 with a judge and 1–5 on a human form; the AI UX Playground rubric uses anchored 1–5. Default: binary per named failure, an anchored scale only where graded quality is the point.", "Dean scores text signals of frustration with untested weights; brain responds only to explicit signals and never names feelings. Default: act on behaviour such as repeated questions or a handoff request, and escalate once one fix has failed."], "tryIt": "Pull 20 real traces from an AI feature, annotate what went wrong in free text, then group the notes into observed failure categories. Pick one and write a binary pass/fail check for it.", "quiz": [{"q": "Your judge reports 92% accuracy, and 92% of traces pass by human labels. What should you check?", "options": ["Nothing; 92% is above target", "Whether a bigger model would score higher", "Its true-negative rate, since it may pass everything", "Its average 1–5 score"], "answer": 2, "explain": "A judge that always says Pass would score the pass rate as accuracy and catch nothing. Check both true-positive and true-negative rates."}, {"q": "A team's failure list reads: hallucination, toxicity, coherence. What does this suggest?", "options": ["The list was brainstormed; redo error analysis on real traces", "The list is complete and ready for judges", "They should switch to a 1–10 scale", "They need more synthetic data"], "answer": 0, "explain": "Generic labels show a brainstormed list. Application-grounded categories come from reading traces."}, {"q": "An agent picks the wrong tool when users ask to unlock their account. The tool is named credential-recovery workflow. What fix fits the evidence?", "options": ["Add more context about every tool", "Upgrade the model", "Add a CRITICAL instruction to the system prompt", "Rename tools in users' words, such as unlock-account"], "answer": 3, "explain": "Mismatched language, not missing tools, caused wrong calls. Renaming the tools in users' words fixed it."}]}, {"id": "m10-l6", "title": "AI in UX work", "neuron": "ai-in-ux-work", "intro": "AI speeds up drafting, but polished output is not evidence of accuracy, and your judgement becomes the bottleneck. Form your own view first, delegate only when it's cheaper, keep real people in research, and keep a human responsible for what ships.", "points": [{"rule": "Think first, ask second.", "why": "Note your own reaction and proposal before prompting, then use AI for a second view and push back when it's wrong. Self-test: could you still do this work without AI?", "kind": "principle", "source": "NN/g, Kohler"}, {"rule": "Delegate only when instructing and checking is cheaper than doing it yourself.", "why": "One-off tasks rarely repay a detailed prompt; repeated tasks do. Treat AI as a book-smart intern that agrees too easily and invents sources.", "kind": "principle", "source": "NN/g, Moran"}, {"rule": "Never let AI invent evidence or replace real participants with synthetic users.", "why": "Require direct quotes and check them against transcripts; trace each insight to a source or label it an assumption. Synthetic users are less varied and more extreme than real people.", "kind": "caution", "source": "NN/g; Mind the Product"}, {"rule": "When AI-generated UI repeats a problem, fix the inputs, not each output.", "why": "Improve UX context files, approved patterns, content and accessibility standards, and a list of deceptive patterns to avoid.", "kind": "technique", "source": "NN/g"}, {"rule": "Scope each AI edit to one section, and diff numbers, names and quotes against the original.", "why": "Over 20 rounds of delegated editing, frontier models corrupted about 25% of a document's content (indicative). Errors are rare but severe and read as grammatical.", "kind": "evidence", "source": "Microsoft Research, via Neil Patel"}, {"rule": "Use automated AI usability reviews only as a supplement to testing with people.", "why": "In Baymard's test, GPT-4 auditing 12 pages gave about 80% false positives and found 14% of known issues (indicative).", "kind": "evidence", "source": "NN/g with Baymard"}, {"rule": "Have an experienced designer review AI-built UI before it reaches production.", "why": "Polished output looks shippable. Use AI prototypes for function, not pixel accuracy; multi-screen flows degrade.", "kind": "caution", "source": "NN/g"}, {"rule": "Keep your context library in separate global, local and ambient files, and maintain it.", "why": "Files written once went stale, and one project's guidelines leaked into another. If you can't say what to change to change behaviour, a rebuild is due.", "kind": "technique", "source": "NN/g, Kohler"}, {"rule": "Read what you approve when agents ask for permissions.", "why": "Non-developers clicked Accept on permission requests unread; one agent attempted a $200 purchase under a boundaries file the AI had largely written itself.", "kind": "evidence", "source": "NN/g, Moran and Gibbons"}, {"rule": "Agree a few non-negotiables before AI pilots, then run 1–2 pilots scored on outcomes.", "why": "Cover personal and client data, accessibility and human sign-off. Show value in 30–60 days on efficiency, quality and user outcomes, and measure adoption by decisions, not output volume.", "kind": "technique", "source": "NN/g; Boag"}], "sourcesDiffer": ["Budiu (NN/g) says AI finding even 50% of issues is worth using if human testing covers the rest; Baymard says 70% accuracy is poor value because misses and false positives can't be told apart. Default: only as a supplement to testing with people, only where accuracy is published, never as the only check.", "Pandya stopped reviewing AI output for visual consistency, leaving it to specs, tokens and audit; brain says an experienced designer reviews AI-built UI. Default: the audit owns token-level consistency; design review keeps hierarchy, composition, content and accessibility.", "Brain agrees privacy, accessibility and oversight rules before pilots; Boag says relax governance while people learn. Default: a short set of non-negotiables before pilots, everything else loose until pilots show what is needed."], "tryIt": "Pick one recurring, generation-heavy task and run AI alongside your normal method for a week. Record time saved without quality loss, missed context, and outputs that looked right but felt wrong.", "quiz": [{"q": "You need a stakeholder update and will be held accountable for its details. How should you use an AI summary of the source research?", "options": ["Send the summary as-is", "Read the source yourself; summaries are for staying informed", "Ask a second model to summarise it too", "Add a disclaimer saying AI wrote it"], "answer": 1, "explain": "AI summaries are fine when you only need to be informed. Read the source yourself whenever you'll be held accountable for the details."}, {"q": "After 15 rounds of asking AI to polish a whole spec, what is the main risk?", "options": ["The tone becomes too formal", "The document gets shorter", "Silent corruption such as a shifted digit or changed name", "Formatting breaks"], "answer": 2, "explain": "Repeated delegated editing quietly damages documents. Scope each edit and diff numbers, names, quotes and attributions."}, {"q": "AI-generated screens keep including a confirmshaming pattern. What is the most durable fix?", "options": ["Add the pattern to a deceptive-patterns list in the context files the AI generates from", "Correct each screen by hand", "Switch to a different model", "Ask the AI to be more ethical in each prompt"], "answer": 0, "explain": "Fix the inputs, not each output: improve the context files, approved patterns and the list of deceptive patterns to avoid."}]}, {"id": "m10-l7", "title": "Prompting for design work", "neuron": "ai-prompting", "intro": "Good prompting is mostly clear briefing: role, context, rules and output format, with complexity added only as needed. For design work, give the design language first, change one thing at a time, and remember that rework, not prompt length, is the real cost.", "points": [{"rule": "Give a role, context, rules and output format, and tell the AI to ask when data is missing.", "why": "Forbid invented quotes, mark unknowns rather than inventing product facts, and ask it to explain an input before critiquing it.", "kind": "technique", "source": "NN/g; Optimize My Prompt"}, {"rule": "Escalate prompt complexity only as needed.", "why": "Start with a direct instruction, then add constraints, then reasoning steps, then 2–3 input-output examples. Starting complex is a named pitfall.", "kind": "technique", "source": "prompt-engineering-patterns"}, {"rule": "Ask for 15–20 divergent options, then select and combine.", "why": "Add good and bad examples, and check every rule was followed, because models claim compliance they didn't deliver.", "kind": "technique", "source": "NN/g, Moran"}, {"rule": "Describe and show what you want; add a specific don't only for an observed failure.", "why": "Positive examples work better than saying what not to do, and negations can make the forbidden behaviour more available.", "kind": "principle", "source": "Anthropic; Pocock"}, {"rule": "Drop shouting such as CRITICAL: you MUST from prompts for newer models.", "why": "Newer models follow system prompts closely, so shouting causes overuse. Write use X when it would improve Y, and soften language if something overtriggers.", "kind": "caution", "source": "Anthropic"}, {"rule": "Give the design language first and make one change per prompt.", "why": "Point at existing examples, describe the interaction not the implementation, and build ugly first then polish in passes, because asking for everything at once drops things like hover states.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Count rework, not prompt length, as the cost.", "why": "A longer precise brief often costs less than a short vague one plus corrections. Give feedback as explicit change and keep lists and revise only the affected layer.", "kind": "principle", "source": "AI UX Playground"}, {"rule": "Break the model's house style with exact values or several distinct directions.", "why": "Vague instructions such as not cream just swap in another fixed palette. Give exact hex values, typefaces and layout constraints, or ask for about four directions and build one.", "kind": "technique", "source": "Anthropic"}, {"rule": "Never ask is this accessible?; have the model try to break the flow in passes.", "why": "Run keyboard, screen-reader, colour, forms and component-contract passes. AI can't certify contrast from a screenshot, legal compliance or assistive-technology testing.", "kind": "caution", "source": "AI UX Playground"}, {"rule": "Reader-test documents with a fresh model that has no context.", "why": "Predict 5–10 questions real readers would ask, give a fresh model only the document, and check its answers and what it finds ambiguous.", "kind": "technique", "source": "doc-coauthoring"}], "sourcesDiffer": ["The prompt-engineer skill wants explicit don'ts; Anthropic finds positive examples work better and Pocock adds that negations make the forbidden behaviour more available. Default: describe and show what you want, keep one source of truth, and add a specific don't only for a failure you have observed.", "One brainstorming skill asks one question per message; another batches up to four; doc-coauthoring batches 5–10. Default: batch closed multiple-choice questions; ask open questions one at a time."], "tryIt": "Rewrite one UI-generation prompt you use often: design language first, real content, constraints like a brief, one change per follow-up. Compare the correction rounds against your old prompt.", "quiz": [{"q": "An AI keeps generating every dashboard in warm off-white with a serif display font. Your prompt says clean and minimal, not cream. What should you do?", "options": ["Add NEVER USE CREAM in capitals", "Regenerate until it changes", "Give exact hex values, typefaces and layout constraints, or ask for four distinct directions", "Shorten the prompt"], "answer": 2, "explain": "Vague instructions swap in another fixed palette. Exact values or several distinct directions break the house style."}, {"q": "You want a quick accessibility first pass on a flow using AI. Which prompt approach fits?", "options": ["Ask is this accessible? and accept the answer", "Ask the model, as a reviewer trying to break the flow, to run keyboard, screen-reader, colour and form passes", "Ask it to certify contrast from a screenshot", "Skip AI and only test after launch"], "answer": 1, "explain": "Never ask is this accessible?; structured passes find more. AI still can't certify contrast from a screenshot or replace testing with disabled people."}, {"q": "A tool in your agent fires far too often. The system prompt says CRITICAL: you MUST use this tool if in doubt. What is the best fix?", "options": ["Soften it to use the tool when it would improve the result", "Add more guardrails forbidding misuse", "Repeat the instruction twice", "Remove the tool entirely"], "answer": 0, "explain": "Newer models follow prompts closely, so shouting causes overuse. Soften the language rather than adding guardrails."}]}]}, {"id": "m11", "title": "Research and evaluation", "summary": "How to run interviews, tests and surveys, weigh what the evidence really says, evaluate designs by inspection and critique, make decisions that stick and audit UX debt.", "neurons": ["research", "research-methods", "research-evidence", "heuristics", "books-research", "reviews-and-decisions", "ux-debt-and-audits"], "lessons": [{"id": "m11-l1", "title": "Interviews and usability tests", "neuron": "research", "intro": "Interviews and usability tests are the core of qualitative research, but small wording and facilitation mistakes quietly ruin the data. The core idea: collect real, recent behaviour, not opinions or predictions, and turn what you see into changes.", "points": [{"rule": "Ask about the last time something happened, never what people 'typically' or 'usually' do.", "why": "General questions invite an invented composite. Get the specific case first, then ask whether that is how they normally do it.", "kind": "technique", "source": "Tomer Sharon"}, {"rule": "Never ask people what they want, would buy or would pay.", "why": "Predictions mislead and 'like' or 'hate' predict no behaviour. Ask for true stories about the past, and how they have already tried to solve the problem.", "kind": "caution", "source": "Erika Hall, Laura Klein"}, {"rule": "Test 5–8 people per segment.", "why": "Five find the major issues and 10–15 usually reach saturation. One or two per round is only a quick iteration check.", "kind": "evidence", "source": ""}, {"rule": "In tests, wait until people finish or get stuck before asking anything.", "why": "Interrupting changes behaviour. Watch for hovering without clicking, repeated actions and backing out, and use neutral prompts like 'keep talking', not 'why did you do that?'.", "kind": "technique", "source": "Lewis and Rieman"}, {"rule": "Test early, while the design is still ugly.", "why": "A first test near launch finds problems nobody has time to fix. Poor usability also sinks concept tests, so fix obvious issues before judging a concept.", "kind": "principle", "source": "Tomer Sharon"}, {"rule": "Give tasks as scenarios with a motivation, start and end easy, and pilot with one participant.", "why": "Bare instructions do not mirror real use, and an unmoderated test cannot clarify a confusing task later.", "kind": "technique", "source": "Tomer Sharon"}, {"rule": "Prioritise fixes by severity and frequency, then retest.", "why": "Frequency is high at 30% or more of participants, moderate at 11–29% and low at 10% or fewer. Fix severe, frequent problems on core tasks first, with the lowest-effort fix.", "kind": "technique", "source": "Erika Hall"}, {"rule": "A designer who cannot stay silent should not facilitate.", "why": "Selling, helping and leading questions are the classic interviewer errors. A separate observer notes reactions, failures and frustration with time codes.", "kind": "caution", "source": "Erika Hall, Laura Klein"}, {"rule": "A test that leads to no change has failed; let stakeholders watch.", "why": "Recorded struggles and invitations to observe persuade better than a report. Involving stakeholders in study design stops them dismissing the method later.", "kind": "principle", "source": "Tomer Sharon, Laura Klein"}], "sourcesDiffer": ["One Smashing author advises against think-aloud; NN/g treats it as standard. Default: think-aloud, watching for its effect on behaviour.", "Klein lists asking people to imagine as an error; Huryn and Lichaw use 'if you could wave a magic wand'. Default: ask it only after concrete past stories, and read the answer as a goal, not a feature spec.", "Kristen Berman says never test a single design; brain tests one direction at a time in qualitative sessions. Default: brain's rule, with between-subjects or A/B tests when the question is which variant drives behaviour."], "tryIt": "Take your next interview guide and rewrite every 'would', 'usually' or 'how do you choose' question as a question about the last specific time, then pilot the guide on one colleague.", "quiz": [{"q": "You want to learn how finance teams pick a supplier. Which opening question will give you the most reliable data?", "options": ["How do you usually choose a supplier?", "Would you use a tool that ranked suppliers for you?", "Tell me about the last time you chose a supplier.", "What features would your ideal supplier tool have?"], "answer": 2, "explain": "Asking about the last specific case avoids an invented composite. 'Usually', 'would' and feature wish-lists all invite predictions or averages."}, {"q": "In a test, 4 of 12 participants could not complete checkout because of the same problem. How should you rate it?", "options": ["Severe and high frequency, so fix it first", "Severe but low frequency, so log it for later", "Moderate frequency only, so wait for more data", "Not significant with 12 people, so ignore it"], "answer": 0, "explain": "Being unable to complete is high severity, and 4 of 12 is about 33%, which counts as high frequency (30% or more). Severe and frequent problems on core tasks are fixed first."}, {"q": "Halfway through a task a participant goes quiet and keeps hovering over a menu without clicking. What should the facilitator do?", "options": ["Ask why they are not clicking the menu", "Point out the right option so the session stays on time", "Ask whether they find the menu confusing", "Wait until they finish or are clearly stuck, using only neutral prompts"], "answer": 3, "explain": "Hovering without clicking is a signal to note, not interrupt. Asking why invites invented reasons, and helping or leading spoils the data."}]}, {"id": "m11-l2", "title": "Research methods and surveys", "neuron": "research-methods", "intro": "Most research that 'produced nothing' started from a fuzzy question or the wrong method. Frame the question first, pick the method that answers it, recruit for behaviour and keep surveys short and unbiased.", "points": [{"rule": "Write the research question before any interview question, using an outcome verb.", "why": "'Describe', 'evaluate' or 'identify' have an end; 'understand' and 'explore' do not. Mixing up research and interview questions is the usual reason teams say research produced nothing.", "kind": "technique", "source": "Erika Hall"}, {"rule": "Pick the method by the question you need answered.", "why": "Needs suit experience sampling, who the users are suits interviews, long workflows suit diary studies, usability suits usability tests, and 'which design is better' suits A/B tests.", "kind": "technique", "source": "Tomer Sharon"}, {"rule": "Study it as a journey if it crosses channels, takes days or turns on feelings; otherwise as a flow.", "why": "Journeys need field studies, diary studies and interviews. A flow inside one product suits usability tests with analytics as a second source.", "kind": "technique", "source": "Kaplan, NN/g"}, {"rule": "Recruit for behaviour and hide the key criterion among other options.", "why": "People bend the truth to take part. Ask how often they do several things in a frequency grid, keep screeners to about 7 questions and avoid yes/no.", "kind": "technique", "source": "Erika Hall, Krasovskaya"}, {"rule": "Ask for feedback after a finished task, in about a minute, closed question first.", "why": "Never ask on arrival or mid-task. State the length in numerals, then offer an optional short text box and conditional follow-ups.", "kind": "technique", "source": "Kaley, NN/g"}, {"rule": "Keep surveys to 5–10 essential questions, with neutral wording, and pilot first.", "why": "Add 'don't know' to closed items, put sensitive questions late, and randomise question and answer order except ordered scales.", "kind": "technique", "source": "Soegaard, IxDF; Khachatryan"}, {"rule": "Audit surveys for leading, double-barrelled and loaded wording, scale mismatch and order effects.", "why": "Also check acquiescence risk and recall burden. Leave validated scales such as SUS untouched, and follow an audit with a few cognitive interviews.", "kind": "technique", "source": "AI UX Playground"}, {"rule": "Include disabled participants in every study, at prototype stage.", "why": "A rule of thumb is about 15% of general usability participants and 5–12 in an accessibility study (indicative). Late findings become patches that lose to feature work.", "kind": "evidence", "source": "Friedman, Williams (Smashing)"}, {"rule": "Test in real conditions, on the weakest device and connection your users have.", "why": "Stress, distraction, one hand, glare and poor signal reveal friction that a lab hides. Write down where you expect people to struggle before testing, then compare.", "kind": "principle", "source": "Deshmukh, UXM"}, {"rule": "Time five-second tests to the question: about 5 seconds for recall, 10 or more for complex screens.", "why": "Attractiveness ratings held steady from 2 seconds, but recognising a site's purpose kept improving up to 10 seconds (vendor study; indicative).", "kind": "evidence", "source": "Kuric, Smashing"}], "sourcesDiffer": ["Hall says never run focus groups; Salminen uses them for attitudes before design. Default: no focus groups for design decisions; treat any early-attitude group as a hypothesis and test behaviour separately.", "Loza advises against paying participants; NN/g, GOV.UK and Hall pay to avoid self-selection. Default: pay, promptly.", "Anthropic's user-research skill gives 10–15 diary participants over 2–8 weeks; Sharon gives about 8 (6–12). Default: 8 (6–12), more only when segments behave differently."], "tryIt": "Write a one-line research question for your current project using 'describe', 'evaluate' or 'identify', then choose its method from the question-to-method list and draft a 7-question behavioural screener.", "quiz": [{"q": "A team's research plan says: 'We will understand how users feel about invoicing.' What is the main problem?", "options": ["It names no method", "'Understand' has no end point, so the research cannot be finished or judged", "It should focus on features, not feelings", "It is too specific to be useful"], "answer": 1, "explain": "Problem statements should use an outcome verb such as 'describe' or 'evaluate'. 'Understand' and 'explore' have no end, which is why such research often 'produces nothing'."}, {"q": "You need to recruit people who travel for business at least monthly. Which screener question works best?", "options": ["Do you travel for business every month? (Yes/No)", "Are you a frequent business traveller?", "We are looking for business travellers. How often do you travel for work?", "How often do you take a plane? (rows for business, holiday, visiting family, other)"], "answer": 3, "explain": "A frequency grid hides the criterion among other options and avoids yes/no. Naming who you want lets people bend the truth to take part."}, {"q": "When should a product ask for in-app feedback?", "options": ["Right after a meaningful task is finished, in about a minute", "As soon as the app opens, while the user is fresh", "Halfway through a task, while the experience is in mind", "With a 'can we ask you later?' prompt so users can choose"], "answer": 0, "explain": "Ask after a finished task, never on launch or mid-task. 'Ask you later' prompts get forgotten. Keep it to about a minute with the length stated."}]}, {"id": "m11-l3", "title": "Weighing evidence", "neuron": "research-evidence", "intro": "Data and research both mislead when read carelessly. Knowing how to check a number, grade a body of evidence and act in proportion stops teams shipping on noise, and stops AI output passing as research.", "points": [{"rule": "Weigh observed behaviour above what people say.", "why": "People predict their own behaviour badly, and asking them to explain a preference makes their judgement worse. Treat stated intent as a hypothesis.", "kind": "principle", "source": "UX Myths; Barbiro"}, {"rule": "Before trusting a number, rule out tracking, denominator, timing and platform causes.", "why": "Check the event fires on what its name says, the denominator did not move, the step is enforced, no release, holiday or campaign landed, and no platform split hides the effect.", "kind": "technique", "source": "Dean"}, {"rule": "When data and research disagree, never average them into a middle finding.", "why": "Data answers what, how often and where; research answers why. Before the resolving study, write down what result would make you drop each account.", "kind": "principle", "source": "Dean"}, {"rule": "Give each insight a confidence level with stated criteria.", "why": "High means 3 or more independent, unprompted sources consistent across segments; medium is 2 sources or prompted only; low is a single source.", "kind": "technique", "source": "Haines"}, {"rule": "Grade the whole body of evidence, then act in proportion to it.", "why": "High-quality evidence justifies changing practice, moderate supports provisional decisions, low is for hypotheses, and very low should not drive decisions alone.", "kind": "principle", "source": "GRADE"}, {"rule": "Treat an experiment result that looks too good as a bug until replicated.", "why": "In a mature product, expect 80–92% of tests to fail (Twyman's law covers the too-good case). Year-long holdouts separate real lift from pulled-forward demand.", "kind": "evidence", "source": "Ronny Kohavi"}, {"rule": "Say 'evaluate', not 'validate', and phrase assumptions so they can fail.", "why": "Say 'validated' only with the claim, its scope and its strength. Design tests to find reasons to stop, not to confirm.", "kind": "principle", "source": "Balise; Mann"}, {"rule": "Use two methods from different quadrants: self-reported and observed, direct and indirect.", "why": "Mixing them lets you tell a real finding from one method's bias. Triangulating analytics, business data, support tickets and interviews catches what one source misses.", "kind": "technique", "source": "Donna Spencer; Cao et al."}, {"rule": "Never treat synthetic users or AI interviews as evidence.", "why": "Synthetic respondents show less spread and miss rare answers, and digital twins scored SUS 4.4–6.7 points higher than their humans (one dataset; indicative).", "kind": "caution", "source": "NN/g; MeasuringU"}, {"rule": "Hand AI the logistics, never the learning.", "why": "Research produces outputs and team learning, and AI only produces the first. Keep moderation, live observation, debriefs and interpretation with people.", "kind": "caution", "source": "Rosala, NN/g"}], "sourcesDiffer": ["Brain says 'evaluate', not 'validate'; Sharon uses 'validate or, most likely, invalidate'. Default: say 'evaluate' in reports; where 'validate' is used, phrase the assumption so it can fail.", "Sponheim and Brown (NN/g) say never generate personas or findings with AI; Kohler suggests a custom AI per persona for workshops. Default: AI may draft or role-play personas only from real research data, labelled as AI, never to evaluate a design.", "Budiu found twins built from long interviews beat persona models; MeasuringU found more detail made twins drift further. Default: no level of detail turns synthetic answers into evidence."], "tryIt": "Take one metric your team quoted recently and run the five checks on it (event, denominator, enforced step, concurrent events, platform split), then give the claim a confidence level.", "quiz": [{"q": "Sign-ups jumped 40% the week a redesign shipped. What should you check first?", "options": ["Whether a campaign, holiday or release landed that week, and whether the event and denominator changed", "Whether users liked the new design in a survey", "Nothing; a 40% lift that clearly is the redesign's effect", "Whether competitors saw the same jump"], "answer": 0, "explain": "Before trusting a number, rule out concurrent events, tracking changes and a moved denominator. A result that looks too good is treated as a bug until replicated."}, {"q": "Analytics show a metric rising, but interviewees say the product feels worse. What does the lesson say this usually means?", "options": ["The interviews are wrong because data beats opinion", "Average the two into a 'mixed results' finding", "Users are resistant to change and will adapt", "You have optimised a proxy; investigate why, deciding first what would make you drop each account"], "answer": 3, "explain": "Metric up but 'feels worse' signals an optimised proxy. Never average the two; data gives the what and research the why."}, {"q": "A theme appears in one customer's interview only, raised after you prompted it. What confidence should it get?", "options": ["High, because it was clearly stated", "Medium, because it was prompted", "Low, because it rests on a single source", "None; drop it from the findings"], "answer": 2, "explain": "A single source is low confidence. Flag single-source patterns rather than dropping them; high confidence needs 3 or more independent, unprompted sources."}]}, {"id": "m11-l4", "title": "Heuristic evaluation", "neuron": "heuristics", "intro": "Heuristic evaluation lets experts find many usability problems cheaply and early, but only when it is run with several independent evaluators and rated properly. It never replaces testing with users; the two find different problems.", "points": [{"rule": "Use three to five evaluators, never one.", "why": "One evaluator finds about 35% of problems, and different people find different ones (indicative). Nielsen's cost model put the optimum at four.", "kind": "evidence", "source": "Nielsen, NN/g"}, {"rule": "Evaluate alone and keep notes hidden until everyone has finished.", "why": "Independence stops anyone anchoring on someone else. Merge, affinity-map and discuss afterwards.", "kind": "technique", "source": "Nielsen; Moran and Gordon, NN/g"}, {"rule": "Make two passes: learn the flow first, then inspect each element against the heuristics.", "why": "Allow about 1–2 hours per evaluator. Record one problem per entry, naming the heuristic broken, so partial fixes can be tracked.", "kind": "technique", "source": "Nielsen, NN/g"}, {"rule": "Personal dislike is never a finding, and never write 'user error'.", "why": "Judge against the stated criteria. Errors are the design's fault, so the fix is a redesign, not training or a warning.", "kind": "caution", "source": "Harley; Laubheimer, NN/g"}, {"rule": "A violation is not automatically a fix; weigh it against context.", "why": "A hamburger menu breaks recognition over recall but may be the right trade-off on a phone. Breaking a heuristic on purpose should be backed by research.", "kind": "principle", "source": "Moran and Gordon, NN/g"}, {"rule": "Rate severity after the sessions, independently, and average at least three raters.", "why": "Finding and judging do not mix. About 72% of findings are minor (indicative), so without ratings the few serious problems drown. No open Critical at release.", "kind": "technique", "source": "Nielsen, NN/g"}, {"rule": "Inspect first to clear obvious problems, then test with users.", "why": "Inspection and testing overlap little. Inspections miss domain problems, so weight testing above inspection for specialist B2B tools.", "kind": "principle", "source": "Nielsen, NN/g"}, {"rule": "Use a cognitive walkthrough to judge learnability, asking four questions at each step.", "why": "Will people try for the right result, notice the action, link it to their goal and see progress? Any no fails the step; assume the right feedback and carry on.", "kind": "technique", "source": "Flaherty, NN/g"}, {"rule": "Escalate on sight: invisible focus, meaning by colour alone, no accessible name, no undo on destructive actions.", "why": "These are high severity whatever else the review finds. A finding cap may shorten a report but never hide a blocker.", "kind": "default", "source": "Krehel"}, {"rule": "Score error messages with the 12-criterion rubric to settle opinion arguments.", "why": "Rate visibility, communication and efficiency criteria from 1 to 4 privately, then average: 3.3 and above is an A, 1.5 or below a D.", "kind": "technique", "source": "Neusesser and Sunwall, NN/g"}], "sourcesDiffer": ["Brain uses Critical, Major, Minor and Cosmetic; Nielsen uses 0–4; NN/g expert reviews often use High, Medium and Low. Default: brain's four labels (4 Critical, 3 Major, 2 Minor, 1 Cosmetic), with no open Critical at release.", "Nielsen folds frequency, impact and persistence into one rating; Hall rates severity and frequency separately. Default: one merged rating for heuristic evaluations; Hall's two axes for usability tests, where frequency is measured.", "A critique skill bands a 0–40 total score; brain rejected totals because thorough reviews score worse. Default: per-heuristic anchors to communicate, never the total as a target."], "tryIt": "Recruit two colleagues, agree a narrow scope (one task on one device), each inspect it alone against Nielsen's ten, then merge and rate severity independently.", "quiz": [{"q": "Your manager suggests you run the heuristic evaluation alone to save time. What is the strongest reply?", "options": ["One evaluator is fine if they are senior enough", "One evaluator finds only about a third of problems, so three to five working independently is needed", "Heuristic evaluation should always be done as a group workshop", "It does not matter, because testing will catch everything anyway"], "answer": 1, "explain": "One evaluator finds about 35% of problems, and different people find different ones. Evaluators work alone and merge later; testing finds different problems, not the same ones."}, {"q": "An evaluator writes: 'User error: people kept pressing Delete instead of Archive.' How should the finding be rewritten?", "options": ["Keep it, and add a warning tooltip to Delete", "Delete it, because users should learn the interface", "Rate it Cosmetic, since it is the users' fault", "Frame it as a design problem against a named heuristic, such as lookalike controls placed side by side"], "answer": 3, "explain": "Errors are the design's fault; never write 'user error'. Each finding names the heuristic broken, and the fix is a redesign, not training or warnings."}, {"q": "You are reviewing a specialist trading tool and have budget for only one method. What does the lesson suggest?", "options": ["Weight testing with users, because inspections miss domain problems", "A heuristic evaluation, because it is cheaper", "A cognitive walkthrough of every screen", "An expert review by someone on the product team"], "answer": 0, "explain": "Evaluators without domain knowledge overlook problems in specialist systems, so for specialist B2B tools testing with users is weighted above inspection."}]}, {"id": "m11-l5", "title": "Critique and design reviews", "neuron": "reviews-and-decisions", "intro": "Reviews go wrong when taste is debated as fact, polish is argued before value, and 'no issues' hides what nobody checked. Good critique is staged, evidence-based and honest about coverage.", "points": [{"rule": "Review by stage: strategy, then problem, then proposed solution, then what launched.", "why": "Agree the problem before anyone commits to high-fidelity design, so the review does not debate polish on the wrong problem.", "kind": "principle", "source": "Lenny skills, Miro"}, {"rule": "Check value, then ease, then delight.", "why": "First ask whether the screen solves the problem, then whether people can finish the task, including by keyboard and screen reader. If value fails, leave polish findings out.", "kind": "principle", "source": "Calvo"}, {"rule": "Turn taste into something visible: hierarchy, density, grouping, contrast or clarity.", "why": "'Looks boring' is not a finding. Each restated issue needs its consequence and one fix, and should trace to a broken principle.", "kind": "technique", "source": "Kostenchuk"}, {"rule": "Try to disprove each finding before reporting it; report the strongest few.", "why": "A finding must cite the rule broken, trace to what people see and have exactly one fix. Report the strongest 3–5 and say what else was seen and cut.", "kind": "technique", "source": "Calvo"}, {"rule": "Label every comment: blocking, important, nit, suggestion, learning or praise.", "why": "Labels stop small preferences reading as demands. Ask rather than announce: 'What happens if this list is empty?'", "kind": "technique", "source": "code-review-excellence"}, {"rule": "Answer a design instruction by asking what outcome it serves, then offer options.", "why": "Phrase feedback as 'I notice…', 'I wonder…', 'What if…'. Offering several ways to reach the outcome keeps the conversation on goals, not orders.", "kind": "technique", "source": "Dean"}, {"rule": "Say 'no findings in the examined scope', never 'no issues'.", "why": "Mark each area as examined with findings, examined with none, not applicable or not examined. A check you did not run is 'not verified', never a pass.", "kind": "caution", "source": "Huryn; Krehel"}, {"rule": "Match each claim to the evidence it rests on.", "why": "A screenshot supports claims about hierarchy and visible affordances, never DOM structure. No 'done' or 'fixed' without fresh evidence.", "kind": "caution", "source": "Kostenchuk; Vincent"}, {"rule": "Have an outsider run expert reviews, and include strengths.", "why": "The reviewer should not have worked on the design. Listing strengths means good elements survive a redesign.", "kind": "principle", "source": "Harley, NN/g"}, {"rule": "Run review meetings in 45–60 minutes, share material 24–48 hours ahead and record the decision.", "why": "Context, solution, trade-offs, questions, then a decision: approved, approved with changes or needs revision. Do not let it become a working session.", "kind": "technique", "source": "professional-communication"}], "sourcesDiffer": ["NN/g expert reviews often use High, Medium and Low; brain uses Critical, Major, Minor and Cosmetic. Default: brain's four levels, collapsed to three only in a client summary.", "Krehel caps findings at 5 or 15, ibelick stops at three visual findings, Calvo reports the strongest 3–5. Default: report the strongest few, and say what else was seen and cut."], "tryIt": "In your next critique, label every comment you give (blocking, important, nit, suggestion, learning, praise) and end with a 'Left alone' list explaining what you deliberately did not flag.", "quiz": [{"q": "A stakeholder says a screen 'needs more pop'. How should you record this in the review?", "options": ["As a blocking finding, since a stakeholder raised it", "Ignore it, since taste is not a finding", "Restate it as a visible issue such as weak hierarchy or contrast, with its consequence and one fix", "Add it as a nit without further detail"], "answer": 2, "explain": "Taste is turned into something you can see, such as hierarchy, density or contrast, each with a consequence and a fix. It is neither accepted as-is nor ignored."}, {"q": "You reviewed only the sign-up flow and found nothing serious. How should the summary read?", "options": ["No issues found", "No findings in the examined scope (sign-up flow); other areas not examined", "Everything passes", "Approved for release"], "answer": 1, "explain": "Say 'no findings in the examined scope', never 'no issues', and list what was not examined so silence is not read as a clean bill of health."}, {"q": "A design does not yet solve the user's problem, but its spacing is also inconsistent. What goes in the review?", "options": ["Lead with the value problem and leave polish findings out", "Both, ranked equally", "Spacing first, because it is quickest to fix", "Only the spacing, because value is a product decision"], "answer": 0, "explain": "Check value, then ease, then delight. If value fails, leave polish findings out so the review does not debate polish on the wrong solution."}]}, {"id": "m11-l6", "title": "Decision methods", "neuron": "reviews-and-decisions", "intro": "Research and reviews only matter if they change decisions. A few simple methods help teams pick the right question first, name one decider, record why and avoid the classic traps.", "points": [{"rule": "Answer the eigenquestion first: the one that would settle the most others.", "why": "Rank open questions by how many others each would settle, not by importance.", "kind": "technique", "source": "Shishir Mehrotra"}, {"rule": "Test each reason alone: if only this were true, would we still do it?", "why": "A pile of weak reasons often hides a strong one against. Look for the single decisive reason.", "kind": "technique", "source": "Rahul Vohra, from Reid Hoffman"}, {"rule": "Use SPADE: Setting, People, Alternatives, Decide, Explain, with one decider.", "why": "The single decider also executes. Everyone is heard; not everyone has to agree.", "kind": "technique", "source": "Gokul Rajaram"}, {"rule": "Map the whole option space before recommending one.", "why": "Putting every possible solution on one framework surfaces philosophical differences that a single proposal hides.", "kind": "technique", "source": "Yuhki Yamashata, Figma"}, {"rule": "When work will not finish inside its appetite, stop and reshape instead of extending it.", "why": "The circuit breaker asks what was fuzzy or unseen, reshapes the work and then tries again.", "kind": "technique", "source": "Ryan Singer"}, {"rule": "Write a decision record with the trade-offs accepted and a revisit trigger.", "why": "Records cover context, options (including weak ones), the choice and why, and consequences. Write one when impact is big, it is hard to reverse or people disagree.", "kind": "technique", "source": "Rezvani"}, {"rule": "Avoid decision by committee, analysis paralysis and choosing the newest thing.", "why": "Other anti-patterns: choosing for your CV, rejecting what was not invented here, optimising too early and not writing down why.", "kind": "caution", "source": "Rezvani"}, {"rule": "Name the decision a study will change before you start it.", "why": "Link each research output to that decision. Keep evidence state apart from decision state: reframe, hold, deepen, experiment, proceed, pivot, abandon or stop.", "kind": "principle", "source": "Klip, Nadworny; Balise"}, {"rule": "In five whys, never stop at a person.", "why": "'Someone forgot' is a symptom; keep asking about training, communication and workload. When several causes interact, use a fishbone diagram instead.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Name fallacies in debates, such as 'conversion rose, so the redesign worked'.", "why": "That is affirming the consequent. Others include counting only what is easy to count and drawing the target round the cluster. A fallacy does not make the conclusion false.", "kind": "caution", "source": ""}], "sourcesDiffer": [], "tryIt": "List the open questions on your current project, rank them by how many others each would settle, and write a one-page decision record for the top one, including the trade-offs accepted and a revisit trigger.", "quiz": [{"q": "Your team has eight open questions about a new feature. Which should you tackle first?", "options": ["The one the most senior person cares about", "The cheapest one to answer", "The one whose answer would settle the most of the others", "Whichever is most important to the business"], "answer": 2, "explain": "The eigenquestion ranks questions by how many others each would settle, not by importance or cost."}, {"q": "A root-cause session concludes: 'The designer forgot to add the error state.' What should happen next?", "options": ["Record it and remind the designer", "Keep
