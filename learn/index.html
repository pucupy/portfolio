<title>Design Brain Course</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important} img{max-width:100%}

/* Layout: a study tool. Plain header, then either a module grid (home) or a two-column lesson reader (outline rail + 68ch text column). Stacks to one column on phones. */
:root {
  --bg: #f5f6f9;
  --surface: #ffffff;
  --sunk: #eceef4;
  --fg: #171a24;
  --muted: #565d70;
  --line: #d9dce6;
  --accent: #2d4fd6;
  --accent-soft: #e5eaff;
  --on-accent: #ffffff;
  --good: #1d7a4d;
  --good-soft: #e1f3e9;
  --warn: #b4441f;
  --warn-soft: #fbe7df;
  --tech: #6a3fb8;
  --tech-soft: #efe7fb;
  --ev: #0d6f7c;
  --ev-soft: #dff2f4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1a1d27; --sunk: #222634; --fg: #e9ebf2; --muted: #a3a9ba; --line: #323748;
    --accent: #8ea4ff; --accent-soft: #252f57; --on-accent: #10142a;
    --good: #6fd3a0; --good-soft: #17352a; --warn: #ff9f7f; --warn-soft: #3d2219;
    --tech: #c4a6ff; --tech-soft: #2e2445; --ev: #6fd0dc; --ev-soft: #163238;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1a1d27; --sunk: #222634; --fg: #e9ebf2; --muted: #a3a9ba; --line: #323748;
  --accent: #8ea4ff; --accent-soft: #252f57; --on-accent: #10142a;
  --good: #6fd3a0; --good-soft: #17352a; --warn: #ff9f7f; --warn-soft: #3d2219;
  --tech: #c4a6ff; --tech-soft: #2e2445; --ev: #6fd0dc; --ev-soft: #163238;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.wrap { max-width: 1160px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4vw + 1rem, 3.1rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 500 0.8rem/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header (not sticky, on purpose) */
header.site { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 20px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font: 700 1.15rem/1 var(--display); }
.brand svg { flex: none; }
nav.main { display: flex; flex-wrap: wrap; gap: 4px 18px; }
nav.main a { color: var(--fg); text-decoration: none; padding: 10px 2px; border-bottom: 2px solid transparent; font-weight: 500; }
nav.main a[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
nav.main a:hover { color: var(--accent); }
form.search { margin-left: auto; display: flex; gap: 8px; align-items: center; }
form.search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
input[type="search"], select {
  font: 16px var(--body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px;
}
input[type="search"] { width: 220px; max-width: 100%; }
@media (max-width: 720px) { form.search { margin-left: 0; width: 100%; } input[type="search"] { flex: 1; width: auto; } }

.btn {
  font: 600 16px/1.2 var(--body); border-radius: 8px; padding: 11px 18px; min-height: 44px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Progress bar */
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: end; margin-bottom: 40px; }
.hero p.lede { font-size: 1.15rem; max-width: 60ch; margin-top: 14px; color: var(--muted); }
.stat-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.stat-panel .big { font: 700 2.4rem/1 var(--display); }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
.stats div { display: grid; }
.stats b { font: 600 1.25rem/1.2 var(--mono); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.mcard {
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; text-decoration: none; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
}
.mcard:hover { border-color: var(--accent); }
.mcard .code { font: 500 0.85rem var(--mono); color: var(--accent); }
.mcard h3 { font-size: 1.2rem; }
.mcard p { color: var(--muted); font-size: 0.95rem; }
.mcard .meta { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin: 40px 0 16px; }

/* Lesson reader */
.reader { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 900px) { .reader { grid-template-columns: 1fr; gap: 24px; } }
aside.outline { display: grid; gap: 10px; }
aside.outline ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
aside.outline a { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--fg); font-size: 0.95rem; line-height: 1.35; }
aside.outline a:hover { background: var(--sunk); }
aside.outline a[aria-current="page"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; display: grid; place-items: center; }
.tick.on { background: var(--good); border-color: var(--good); }
.tick.on::after { content: ""; width: 7px; height: 4px; border: 2px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
@media (max-width: 900px) { aside.outline details:not([open]) ol { display: none; } }
aside.outline summary { cursor: pointer; font-weight: 600; padding: 8px 0; }

article.lesson { max-width: 70ch; display: grid; gap: 28px; }
.crumbs { font-size: 0.9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.intro { font-size: 1.12rem; }
ol.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
ol.points li { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.point-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.rule { font-weight: 600; font-size: 1.05rem; }
.why { color: var(--muted); }
.src { font: 0.82rem var(--mono); color: var(--muted); }
.chip { font: 500 0.75rem/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; white-space: nowrap; }
.k-default { background: var(--accent-soft); color: var(--accent); }
.k-principle { background: var(--sunk); color: var(--fg); }
.k-evidence { background: var(--ev-soft); color: var(--ev); }
.k-technique { background: var(--tech-soft); color: var(--tech); }
.k-caution { background: var(--warn-soft); color: var(--warn); }
.note { border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.note.differ { background: var(--sunk); }
.note.try { background: var(--accent-soft); }
.note ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Quiz */
.quiz { display: grid; gap: 20px; }
fieldset.q { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; margin: 0; display: grid; gap: 12px; min-width: 0; }
fieldset.q legend { font-weight: 600; padding: 0 6px; margin-left: -6px; float: left; width: 100%; }
fieldset.q legend + * { clear: both; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--warn); background: var(--warn-soft); }
.feedback { padding: 12px 14px; border-radius: 8px; display: grid; gap: 4px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--warn-soft); }
.feedback strong { color: inherit; }
.err { color: var(--warn); font-weight: 500; }

.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 20px; }
.done-box { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }

/* Module page */
ol.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 780px; }
ol.lessons a { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--fg); }
ol.lessons a:hover { border-color: var(--accent); }
ol.lessons .t { font-weight: 600; }
ol.lessons p { color: var(--muted); font-size: 0.95rem; }

/* Flashcards */
.card-stage { max-width: 680px; display: grid; gap: 16px; }
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; min-height: 240px; display: grid; gap: 14px; align-content: start; }
.flash .front { font: 600 1.4rem/1.35 var(--display); }
.flash .back { border-top: 1px dashed var(--line); padding-top: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 500; font-size: 0.95rem; }

/* Defaults */
dl.defaults { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 0; max-width: 900px; margin: 0; border-top: 1px solid var(--line); }
dl.defaults dt, dl.defaults dd { padding: 16px 0; border-bottom: 1px solid var(--line); margin: 0; }
dl.defaults dt { font: 700 1.1rem var(--display); }
@media (max-width: 640px) { dl.defaults { grid-template-columns: 1fr; } dl.defaults dt { border-bottom: 0; padding-bottom: 0; } }

.results { display: grid; gap: 10px; max-width: 820px; }
.result { display: grid; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--fg); }
.result:hover { border-color: var(--accent); }
mark { background: var(--accent-soft); color: var(--fg); border-radius: 3px; padding: 0 2px; }
.page-head { display: grid; gap: 10px; margin-bottom: 28px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .flash { transition: border-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="#home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="8" cy="9" r="4" fill="var(--accent)"/><circle cx="20" cy="7" r="3" fill="var(--tech)"/><circle cx="19" cy="20" r="4.5" fill="var(--ev)"/><path d="M8 9 L20 7 L19 20 Z" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>
      Design Brain Course
    </a>
    <nav class="main" aria-label="Main">
      <a href="#home" data-nav="home">Modules</a>
      <a href="#defaults" data-nav="defaults">Firm defaults</a>
      <a href="#flashcards" data-nav="flashcards">Flashcards</a>
      <a href="#practice" data-nav="practice">Practice test</a>
    </nav>
    <form class="search" role="search" id="searchForm">
      <label for="q">Search every rule</label>
      <input type="search" id="q" name="q" placeholder="Search every rule" autocomplete="off">
      <button class="btn" type="submit">Search</button>
    </form>
  </header>
  <main id="app" tabindex="-1"></main>
</div>

<script>
const COURSE = [{"id": "m01", "title": "Visual foundations", "summary": "How to build layouts, spacing, type, colour, themes and finish that read clearly, scale across screens and show judgement rather than defaults.", "neurons": ["layout-and-visual", "responsive-layout", "visual-polish", "taste", "colour-and-theming", "typography", "books-visual-and-type"], "lessons": [{"id": "m01-l1", "title": "Layout, grids and hierarchy", "neuron": "layout-and-visual", "intro": "Layout decides what people see first and whether a screen holds up at every size. Design for size classes, not devices, choose the grid from the content, and settle placement and hierarchy before you style anything.", "points": [{"rule": "Design per size class: compact under 600, medium 600–839, expanded 840–1199, large 1200 and up.", "why": "Layout should follow the space available, not the device or orientation. Material 3 now splits large into large (1200–1599) and extra-large (1600 and up).", "kind": "principle", "source": "Material 3, Apple HIG"}, {"rule": "Change navigation with the class: bottom bar on compact, rail on medium, sidebar or drawer on large.", "why": "A bottom bar holds 3–5 frequent tasks plus More, ordered by how often people use them. Keep the hamburger for secondary items, because hidden things don't get found.", "kind": "technique", "source": "Material 3"}, {"rule": "Let the content pick the grid type; 12 columns on desktop, 8 on tablet, 4 on mobile.", "why": "Column grids are the default, modular grids suit galleries and catalogues, manuscript grids suit long text. A modular grid on simple content is false rigour.", "kind": "principle", "source": "Uxcel"}, {"rule": "Decide what matters most, then scale everything else down.", "why": "When everything is emphasised, nothing is. Keep to about 3 type sizes per screen, at most 2 large elements and at most 3 levels of contrast treatment.", "kind": "principle", "source": "IxDF, NN/g"}, {"rule": "Settle where something sits before tuning its size; start the key message top left.", "why": "Position signals importance before anyone reads. Text-heavy pages are scanned in an F pattern and sparse pages in a Z, so put key information on those paths.", "kind": "principle", "source": "Butler"}, {"rule": "Make every element align to something on purpose, and keep to two or three left edges.", "why": "Alignment to a grid, baseline, edge or optical centre makes structure readable. One element breaking alignment stands out, so misalign only for emphasis.", "kind": "technique", "source": "Krehel, taste-skill"}, {"rule": "Keep one primary action per view; move more than 3 secondary actions into a menu.", "why": "A single clear lead keeps hierarchy intact. Competing primary actions mean neither wins.", "kind": "default", "source": "Krehel"}, {"rule": "Blur, squint or turn the screen upside down to test hierarchy, using real content.", "why": "If you can't tell where to look first, the hierarchy isn't working. Blur at about 5, 10 and 20px; a strongly coloured photo in a secondary slot can take over the page.", "kind": "technique", "source": "IxDF, NN/g"}, {"rule": "Keep decorative images in one aligned column rather than zigzagging them.", "why": "In NN/g eyetracking, alternating rows made people land on decorative images by accident and hunt back for the text. Zigzag is fine for 2–3 rows.", "kind": "evidence", "source": "Flaherty, NN/g"}, {"rule": "Keep frequently used controls in stable, bounded regions and never rearrange menus on their own.", "why": "People remember the neighbourhood of a control, not its exact spot. Reflowing or self-sorting menus break spatial memory; a separate recently used area is the exception.", "kind": "caution", "source": "Laubheimer, NN/g"}], "sourcesDiffer": ["Golden ratio: Figma suggests 1.618 for column splits, type scales and spacing; brain uses it only to place focal points. Default: spacing stays on the scale; 1.618 is acceptable as one type-scale choice, never a spacing system."], "tryIt": "Take one screen you shipped recently, blur it at 10px and 20px, and write down what draws the eye first. If it isn't the one primary action or key fact, change placement before size.", "quiz": [{"q": "A tablet app shows a hamburger menu holding its four most-used destinations. What should change?", "options": ["Make the hamburger icon larger", "Move the frequent destinations into a navigation rail, keeping the hamburger for secondary items", "Add a tooltip to the hamburger", "Put all destinations in a bottom bar of eight tabs"], "answer": 1, "explain": "On medium widths a rail suits frequent tasks. Hidden items don't get found, so the hamburger is only for secondary items."}, {"q": "You blur a dashboard at 20px and a bright photo in a side story is the strongest spot. What does that tell you?", "options": ["The blur test only works on text", "Nothing, because the template looked fine", "The photo is an accidental focal point that competes with the intended lead", "The primary button needs a drop shadow"], "answer": 2, "explain": "The heaviest blur shows accidental focal points, and real content can take over a page that looked fine as a template."}, {"q": "A product catalogue and a long help article both need grids. Which pairing fits?", "options": ["Modular grid for the catalogue, manuscript grid for the article", "Manuscript grid for both", "Modular grid for both for consistency", "Hierarchical grid for the catalogue, modular for the article"], "answer": 0, "explain": "Grid type follows content: modular for catalogues and galleries, manuscript for long text."}]}, {"id": "m01-l2", "title": "Spacing and responsive layout", "neuron": "responsive-layout", "intro": "Spacing shows structure before any border does, and responsive layout is about reflowing, not stretching or shrinking. Use a scale, let content set breakpoints, and test at the widths and zoom levels that break things.", "points": [{"rule": "Make the gap between groups at least twice the gap inside a group.", "why": "Proximity is what groups things. If the outer gap is less than about twice the inner one, a border or background is doing work that space should do.", "kind": "principle", "source": "Krehel"}, {"rule": "Use a 4/8 grid with named spacing tokens; never one-off values like a 13px offset.", "why": "Margins are 16px on compact and 24px from medium. Don't mix a 4px and an 8px base; give unavoidable exceptions a functional name so they read as exceptions.", "kind": "principle", "source": "Uxcel"}, {"rule": "Separate with space first, then background or border, and add divider lines last.", "why": "The weakest container that still shows the structure keeps the screen quiet. Keep a full border where it defines a hit area.", "kind": "technique", "source": "Krehel, Dean"}, {"rule": "Keep component spacing and layout spacing as two separate scales.", "why": "If a button's padding and a page's section gap share a token, the rhythm looks off.", "kind": "technique", "source": "Checklist Design"}, {"rule": "Break where the content breaks, not at device widths.", "why": "Use media queries for page layout and user preferences, container queries for reusable components; a card might switch to a row at about 450px of its own width.", "kind": "principle", "source": "Smashing"}, {"rule": "Treat phone as a second composition: re-prioritise and recompose, don't just stack or shrink.", "why": "Wide grids become fewer columns and secondary rails move after the main content. If text has to shrink to fit, the design isn't finished.", "kind": "principle", "source": "taste-skill"}, {"rule": "Check mobile-first pages on a large screen and use extra width for more content.", "why": "In an NN/g study, thinly spread desktop pages meant more scrolling, harder comparison and lower trust (indicative). Scaling a mobile image up adds nothing.", "kind": "evidence", "source": "Flaherty, Neusesser and Chitale, NN/g"}, {"rule": "Test at 280, 320, 375, 390, 414, 768, 1024, 1280 and 1440px, at 200% zoom and with long text.", "why": "A layout that only fits at exactly 16px root size fits by luck. Use pseudo-localisation or German, and allow strings to run about 75% longer in translation.", "kind": "technique", "source": "plugin87, ustwo"}, {"rule": "Defend grids against overflow with minmax(0, 1fr), min-width: 0 and overflow-wrap: anywhere.", "why": "Inputs' intrinsic width, min-width auto on grid items, unbreakable tokens like URLs and nowrap pills are the common causes of narrow-width overflow.", "kind": "technique", "source": "plugin87"}, {"rule": "Give anything collapsed or off-screen a visible cue, and name hidden counts.", "why": "Let the next item peek 16–32px. A disclosure says what it hides, such as Show 12 more results, not More.", "kind": "technique", "source": "Krehel"}], "sourcesDiffer": ["Max-width wrapper: redesign-skill wraps every page in one max-width container; taste-skill v2 says don't by reflex. Default: constrain reading columns; let tools and visual fields use the width they need.", "Mobile line length: Uxcel suggests about 30–40 characters on phones, ui-ux-pro-max 35–60 (indicative). Phone widths already land near this, so don't pad text in to force either."], "tryIt": "Screenshot a page and divide every gap by the smallest repeated gap. Where the between-group gap is under twice the within-group gap, fix the spacing and remove a border.", "quiz": [{"q": "A settings form has 16px between fields and 16px between sections, with divider lines doing the grouping. What's the best fix?", "options": ["Make the dividers darker", "Add a card around every field", "Reduce field spacing to 4px", "Increase the section gap to at least twice the field gap, then remove dividers that space now covers"], "answer": 3, "explain": "Space comes first, and the gap between groups should be at least twice the gap inside them. Dividers come last."}, {"q": "A reusable card appears in a narrow sidebar and a wide main column. How should it switch layout?", "options": ["With a container query based on the card's own width", "With a media query at 768px", "By detecting the device in JavaScript", "By making two separate card components"], "answer": 0, "explain": "Container queries suit components that appear in more than one context, with breakpoints set by the component's content."}, {"q": "Your mobile-first product page looks sparse on desktop, with specs in accordions one per screen. What does the research suggest?", "options": ["Scale the hero image up to fill the width", "Keep the accordions for consistency", "Show the specs side by side so people can compare in one view", "Add more white space between sections"], "answer": 2, "explain": "Keep what people compare in one view and use the width for more content. Thin dispersion lowered trust in NN/g's study."}]}, {"id": "m01-l3", "title": "Typography for interfaces", "neuron": "typography", "intro": "Type carries most of an interface's hierarchy and most of its reading. Get body text right first, build a small scale by role, and separate levels with size, weight and space before colour.", "points": [{"rule": "Body text is 16px minimum everywhere; secondary text about 13px; inputs 16px on mobile.", "why": "This holds in product UI too. Secondary text such as captions goes almost never below 12px, and 16px inputs stop iOS zooming on focus.", "kind": "default", "source": ""}, {"rule": "Build hierarchy with size, weight and space first, colour last; each level clearly distinct.", "why": "Two levels 2px apart at the same weight look like a mistake. Aim for about 4 text styles and 2 weights per screen.", "kind": "principle", "source": ""}, {"rule": "Start with three sizes and add weight, case and space for in-between ranks.", "why": "One element leads and everything else supports it. A fourth size is fine only while the lead still clearly dominates.", "kind": "technique", "source": "Alma Hoffmann, Smashing"}, {"rule": "Use one family for product UI, or at most two with strict roles.", "why": "Two faces are either identical or clearly contrasting, never merely similar. Pick the body face for legibility first, then be expressive in headings.", "kind": "principle", "source": "Toptal, Butterick"}, {"rule": "Set unitless line-height: display about 1.1, headings 1.2–1.3, body 1.5–1.6.", "why": "Size, line-height and line length are linked, so change one and re-tune the others. A wider measure needs slightly more leading.", "kind": "technique", "source": "Krehel, Schöndorfer"}, {"rule": "Cap measure by context: 55–70 characters for long reading, 45–65 for UI copy.", "why": "Set it as a max-width rather than letting the screen edge define the block, and recheck it whenever the typeface changes, as faces differ a lot in width.", "kind": "principle", "source": "Dean, Schöndorfer"}, {"rule": "Use tabular lining figures for data, tables, timers and live values.", "why": "Proportional figures jitter and won't align in columns. Right-align quantities and align on the decimal separator.", "kind": "technique", "source": "Butterick, Karpenko"}, {"rule": "Use sentence case everywhere, and keep all caps to five words or fewer, tracked.", "why": "All-caps text slowed reading by about 13–20% in older studies (secondhand, indicative). Store text in natural case and uppercase with CSS.", "kind": "default", "source": "Breland and Breland, via Quovantis"}, {"rule": "Write fluid type as clamp() in rem mixed with a viewport unit; never pure vw.", "why": "Viewport units alone cancel browser zoom, a WCAG 1.4.4 risk. Test at 200% zoom.", "kind": "caution", "source": "D'Amato"}, {"rule": "Avoid weights lighter than 400 below 18px, and don't change weight on hover.", "why": "Thin weights belong only at 28px and up. Changing weight on hover widens the label and shifts its neighbours; show state with colour or fill.", "kind": "caution", "source": "Krehel, arla6ka"}], "sourcesDiffer": ["Mobile body size: Dean accepts 14px body text on mobile; brain keeps 16px everywhere. Default: 16px.", "Smallest text: Dean sets 14px as the floor for captions and labels. Default: 13px for genuinely secondary metadata, 14px or more for anything essential to the task.", "Ideal line length: Schöndorfer gives 60–80 characters for desktop reading, not backed by research. Default: Dean's ranges, with up to about 80 acceptable for long-form if line height rises to about 1.6.", "Modular scales: Butterick sizes headings by eye; Rutter and Boulton compose from a defined scale. Default: a small fixed token set, tuned by eye.", "System fonts: some skills ban system fonts and Inter as generic; Apple, Material and GOV.UK favour them. Default: system or house fonts for product UI; apply the ban only to brand and showcase surfaces."], "tryIt": "Audit one screen's text styles: count distinct sizes and weights, check every body string is at least 16px, and replace any adjacent levels that differ by only a pixel or two.", "quiz": [{"q": "A dense admin table uses 14px body text to fit more rows. What does the default say?", "options": ["Fine, because dense UI allows 14px body", "Keep body at 16px; only genuinely secondary text such as metadata goes to about 13px", "Drop to 12px and add tracking", "Use a lighter weight to save space"], "answer": 1, "explain": "Body is 16px minimum everywhere, product UI included. Only secondary text goes smaller."}, {"q": "A column of prices doesn't line up and digits jitter as values update. What's the fix?", "options": ["Switch to a monospaced display face", "Centre-align the column", "Add letter-spacing to the numbers", "Turn on tabular lining figures and right-align on the decimal"], "answer": 3, "explain": "Tabular figures keep digits the same width, and quantities right-align on the decimal separator."}, {"q": "A designer wants a heading at 18px and a subheading at 17px, both semibold. What's wrong?", "options": ["The levels are too close to read as different; separate them with a clear step in size, weight or space", "Headings should always be in caps", "Subheadings must use a different typeface", "Nothing, a 1px difference is enough"], "answer": 0, "explain": "Each level must differ clearly from the next. Levels a pixel or two apart at the same weight look like a mistake."}]}, {"id": "m01-l4", "title": "Colour systems and contrast", "neuron": "colour-and-theming", "intro": "Colour should inform, not decorate. Build scales in a perceptual space, name tokens by role, keep neutrals dominant and one accent for action, and check contrast while you build rather than at QA.", "points": [{"rule": "Meet WCAG 2.2 AA for every pairing and never let colour carry meaning alone.", "why": "Add an icon, text or pattern alongside colour. Check text on every surface and button text on every state, plus focus rings, icons and borders.", "kind": "default", "source": ""}, {"rule": "Build scales in OKLCH, not HSL, at a constant hue.", "why": "HSL lightness doesn't match what people see. More than about 10 degrees of hue drift across steps is visible, and chroma should peak mid-ramp.", "kind": "technique", "source": "Atmos, Krehel"}, {"rule": "Layer tokens: primitives, then semantic tokens named by role, never colour names.", "why": "Use bg.success, not bg.green. Components never map straight to primitives, so a rebrand or dark mode changes one tier.", "kind": "principle", "source": "Atmos, Basova, Wilshaw"}, {"rule": "Give each colour one job; ring-fence the action colour so it never decorates.", "why": "One accent kept for the primary action stays meaningful. Colour that decorates dilutes colour that informs.", "kind": "principle", "source": "Wilshaw"}, {"rule": "Keep neutrals dominant: about 70–90% of pixels, one accent around 5–10%.", "why": "Dense product UI is mostly neutral. Treat 60-30-10 as a balance check, not a target, and keep the accent off headings and decoration.", "kind": "principle", "source": "Calvo, taste-skill"}, {"rule": "Don't trust shade numbers for contrast; measure every pair.", "why": "White on blue-600 passes at 5.17:1 but on green-600 fails at 3.30:1. White on most Tailwind 500 hues fails 4.5:1, so solid fills often need the 600 step.", "kind": "evidence", "source": "hipuku, Krehel"}, {"rule": "On white, #767676 is the lightest neutral grey that passes AA for text.", "why": "It measures 4.54:1; #999999 is 2.85:1 and fails. Use at most three text colours, each at least 4.5:1.", "kind": "evidence", "source": "computed"}, {"rule": "Status colours often fail with white text; use dark text on a light tint instead.", "why": "White on a typical success green is 2.54:1 and warning amber 2.15:1. Green-800 on green-100 reaches 6.49:1.", "kind": "caution", "source": "refactoring-ui-skill"}, {"rule": "Keep status hues at least 15 degrees of hue from the accent.", "why": "If the brand sits close to error red, branding gets read as feedback. Define a separate error family or treat destructive actions distinctly.", "kind": "technique", "source": "Krehel, Uxcel"}, {"rule": "Work in greyscale first, then add colour for actions, navigation and state.", "why": "Anything that vanishes in greyscale has a contrast problem whatever its hue. Hierarchy comes from lightness contrast, not hue.", "kind": "technique", "source": "Boulton, Kalbag"}], "sourcesDiffer": ["Scale size: Atmos builds 9–11 step scales per family; Wilshaw warns unused shades confuse. Default: keep full scales at the primitive layer and expose only the shades semantic tokens use.", "Which step is the button: refactoring-ui-skill calls 500 whichever shade works with white text. Default: choose the button step by measured contrast, not by its number.", "Opacity for text hierarchy: one skill uses a single ink at 70, 40 and 20% opacity; 40% black on white fails 4.5:1. Default: solid colours checked for contrast.", "60-30-10 in product UI: the rule comes from interior design and simple screens. Default (inferred): a check on balance, not a target; neutrals dominate."], "tryIt": "List every colour your product uses, group them by meaning, and give each a role name. Flag any colour with no role and any text pair under 4.5:1.", "quiz": [{"q": "A team names tokens blue-500-button and green-success-text. What's the main risk?", "options": ["The names are too short", "Hue in semantic names breaks on rebrand and dark mode; name by role instead", "Numbers in names slow the build", "Designers can't find blue tokens"], "answer": 1, "explain": "Semantic names never contain colour names. Naming by role means a rebrand changes one value instead of every screen."}, {"q": "A success badge uses white text on a bright green and looks fine. What should you do?", "options": ["Ship it, it looks fine", "Make the text bold instead of checking", "Measure it; it likely fails AA, so use dark text on a light green tint or a darker shade", "Add a glow around the text"], "answer": 2, "explain": "Generated status colours often fail with white text. Flipping to dark text on a light tint usually passes."}, {"q": "Your brand colour is red, close to the error colour. What's the recommended approach?", "options": ["Use the brand red for errors too, to stay on-brand", "Remove all red from the product", "Rely on users learning the difference", "Define a separate error family at least 15 degrees of hue away, or treat destructive actions distinctly"], "answer": 3, "explain": "Status hues keep their distance from the accent so branding isn't read as feedback."}]}, {"id": "m01-l5", "title": "Dark mode and theming", "neuron": "colour-and-theming", "intro": "A dark theme is a second mapping of the same roles, not an inversion. Elevation, weight and contrast all behave differently on dark surfaces, and theming works only if the semantic tier is the one that changes.", "points": [{"rule": "Follow the system setting and persist the user's choice once they pick one.", "why": "Once someone picks a theme, never override it with the system setting. On the web, follow the system with an optional override.", "kind": "principle", "source": "Calvo"}, {"rule": "Map the same semantic names onto the same primitives for dark mode; never just invert.", "why": "Dark mode, white-label and increased contrast should all repoint only the semantic tier.", "kind": "principle", "source": "Atmos, Basova, Krehel"}, {"rule": "Use dark grey of about #121212 rather than pure black, with near-white text.", "why": "Primary text around #E0E0E0 to #F0F0F0 avoids glare. Keep interactive text above 4.5:1.", "kind": "technique", "source": "mobile-design, refactoring-ui-skill"}, {"rule": "Show elevation with lighter surfaces, not shadows: closer surfaces are lighter.", "why": "Shadows vanish on dark. Material's overlays go from about 5% white at 1dp to 14% at 12dp; add a faint white ring around 8% where adjacent greys sit too close.", "kind": "technique", "source": "Material, Krehel"}, {"rule": "Desaturate accents slightly in dark mode and keep the hue.", "why": "Drop OKLCH chroma by about 10–15% (indicative). Saturated colour glows on dark backgrounds.", "kind": "technique", "source": "Calvo"}, {"rule": "Make borders and separators lighter than the dark background, not darker.", "why": "On dark canvases interaction fills need about 1.5 times the light values, and a recessed well goes lighter than the page.", "kind": "principle", "source": "Basova, Zakariasson"}, {"rule": "Pick one switching mechanism and turn transitions off while the theme changes.", "why": "Mixing a media query for some tokens and a class for others gives a half-themed interface. Leaving transitions on fires every state animation at once.", "kind": "caution", "source": "Krehel, arla6ka"}, {"rule": "Theme the parts you didn't draw: selection, caret, scrollbars, focus rings and browser chrome.", "why": "Set theme-color and color-scheme so scrollbars and native controls match. Check images, data colours and the flash of the wrong theme on load.", "kind": "technique", "source": "impeccable, Balise"}, {"rule": "For white-label, allow one customer colour, derive the rest and gate it on contrast.", "why": "Lock semantic colours and the type and spacing scales, give a live preview and reset, and put logos in a neutral tile.", "kind": "technique", "source": ""}, {"rule": "Write increased-contrast variants per appearance, including dark plus more contrast.", "why": "One shared prefers-contrast block can lower contrast on dark backgrounds. Test forced-colours mode too.", "kind": "caution", "source": "Krehel, Balise"}], "sourcesDiffer": ["True black on OLED: mobile-design suggests #000000 to save battery, noting smear when scrolling. Default: #121212, except media or night-use apps.", "Dark mode by reversal: Krehel's earlier skill reverses the light palette; later sources say reversal is only a start. Default: reverse, then tune and recheck every pair.", "In-app appearance switch: Apple advises against one. Default: native apps follow the system with no toggle; web follows the system with an optional override.", "Weight on dark: some sources lighten text on dark, others say it looks thinner. Default: keep 400 for small text, adjust tracking and leading first, test on a real OLED screen."], "tryIt": "Switch a screen to dark mode and check three things: raised surfaces are lighter than the base, no shadows carry depth, and every text pair still passes 4.5:1.", "quiz": [{"q": "In dark mode, cards use the same drop shadow as light mode and blend into the page. What's the better approach?", "options": ["Make the shadow darker and larger", "Raise cards with a slightly lighter surface and a faint white ring if needed", "Use pure black for the page", "Add a coloured glow around each card"], "answer": 1, "explain": "Shadows vanish on dark, so closer surfaces get lighter. A faint ring helps where adjacent greys are too close."}, {"q": "A user chose light mode in the app, then their OS switches to dark at sunset. What should happen?", "options": ["Stay in light mode, because the user's choice is persisted", "Switch to dark to match the OS", "Ask them every evening", "Switch only the background, not text"], "answer": 0, "explain": "Follow the system by default, but once someone picks a theme never override it with the system setting."}, {"q": "When the theme toggles, every hover and fade on the page animates at once. What's the fix?", "options": ["Slow all transitions down", "Remove all transitions from the product", "Turn transitions off for the frame where the theme changes", "Reload the page on toggle"], "answer": 2, "explain": "Theme switches should change instantly; disable transitions during the switch."}]}, {"id": "m01-l6", "title": "Visual polish and depth", "neuron": "visual-polish", "intro": "Polish is the sum of small, consistent decisions: one depth strategy, radii that nest, edges that don't double up and optical fixes where geometry looks wrong. Get the fundamentals right before decorating, then add one restrained flourish.", "points": [{"rule": "Pick one depth strategy per product: borders only, subtle shadows, layered shadows or surface tints.", "why": "Mixing them muddies the surface stack. Never put a shadow on a card and on the button inside it.", "kind": "principle", "source": "Dammyjay93, Uxcel"}, {"rule": "Declare elevation once: a hairline folded into the shadow or a border, never both stacked.", "why": "A 1px border under a wide soft shadow draws a double edge, the ghost card. Keep real borders for structure, inputs and selected states.", "kind": "caution", "source": "impeccable, Krehel"}, {"rule": "Nest radii concentrically: outer radius equals inner radius plus padding.", "why": "A 24px outer corner with 8px padding needs a 16px inner corner; matching radii leave the gap uneven. Subtract border width too.", "kind": "technique", "source": "Lily Konings, Krehel"}, {"rule": "Set radius by size: small for inputs and buttons, medium for cards, large for modals.", "why": "One uniform radius on every element regardless of size is a tell. Card radii of 12–16px are common.", "kind": "technique", "source": "Dammyjay93"}, {"rule": "Make visible differences intentional; elements of the same type look identical.", "why": "A slightly different radius reads as a different category. Collapse near-duplicate greys, radii and shadows into one token.", "kind": "principle", "source": "Dean, Uxcel"}, {"rule": "Clickable things look clickable and static things don't.", "why": "Never give headings or labels link colour or button styling. A small arrow is the weakest clickability signal.", "kind": "principle", "source": "Loranger, NN/g"}, {"rule": "Adjust optically where geometry misleads, in 1px nudges.", "why": "A play triangle centred mathematically looks off-centre; a circle needs to be about 5% larger than a square to look the same size.", "kind": "technique", "source": "Jones, Marvel"}, {"rule": "Lower icon contrast beside text and match stroke to text weight.", "why": "Icons look heavier than the words beside them. Use 1.5px stroke beside regular text and 2px beside semibold, one stroke weight per set.", "kind": "technique", "source": "Hobday, Krehel"}, {"rule": "Extend touch targets to 44 by 44px with a pseudo-element, without overlapping.", "why": "Small visual controls can keep their look while staying hittable. Dense desktop allows 40 by 40px minimum.", "kind": "default", "source": "Krehel"}, {"rule": "Walk every state before calling it done: hover, focus, active, loading and empty.", "why": "Hover uses colour, opacity, border or shadow and never moves neighbours. Check finish at 200% zoom.", "kind": "technique", "source": "Krehel, Calvo"}], "sourcesDiffer": ["Border, shadow or both: brain pairs borders with shadows; arla6ka says a border on resting surfaces and a shadow on raised ones. Default: one depth strategy per product, and a border plus shadow only where each does a different job.", "Liquid Glass: Apple puts it on the control layer with legibility rules; NN/g's expert review found text losing contrast over photos. Default: follow Apple's rules, test glass over your busiest real content, and fall back to opaque surfaces where contrast fails.", "Radius everywhere: one skill says sharp corners or one radius used sparingly. Default: radius by size; one uniform radius on every element is the tell."], "tryIt": "Pick one component with nested surfaces and check its radii add up, that it has one edge treatment, and that every state is designed. Fix the worst inconsistency.", "quiz": [{"q": "A card has a 16px radius and 8px padding, and its inner image also has a 16px radius. What should the image radius be?", "options": ["24px", "16px", "4px", "8px"], "answer": 3, "explain": "Inner radius equals outer radius minus padding: 16 minus 8 gives 8px, so the curves stay concentric."}, {"q": "A popover has a 1px grey border and a wide soft shadow, and its edge looks doubled. What's the fix?", "options": ["Use one edge: fold a faint hairline into the shadow or keep only the border", "Make the border darker", "Add a second shadow", "Increase the radius"], "answer": 0, "explain": "Declare elevation once. A border under a wide shadow draws a ghost-card double edge."}, {"q": "Section headings use the same blue as links. What problem does this cause?", "options": ["None, blue headings improve hierarchy", "People read static headings as clickable", "Headings become too small", "It breaks dark mode"], "answer": 1, "explain": "Static things shouldn't look clickable. Never give headings or labels link colour."}]}, {"id": "m01-l7", "title": "Taste and judgement", "neuron": "taste", "intro": "Taste is how you choose between options that all pass the rules. These are judgement calls, not research findings: earn every element, spend boldness in one place, and make the design specific to its product. Drop any of them that a real test contradicts.", "points": [{"rule": "Earn every element: if removing something loses nothing, remove it.", "why": "Good screens feel finished because nothing is left to cut. Stop when the next removal would hide a needed decision or affordance.", "kind": "principle", "source": "Karl Koch"}, {"rule": "One hero per view: one number, chart or action leads.", "why": "When two things compete for attention, neither wins.", "kind": "principle", "source": ""}, {"rule": "Quiet chrome, loud content.", "why": "Thin rules or none, soft surfaces and small muted labels over large values let the content read first.", "kind": "principle", "source": ""}, {"rule": "Simplicity is not minimalism; complexity is earned by the task.", "why": "Burying everything behind one control looks minimal but isn't simple. A cockpit is complex because flying is; frequent functions keep a fixed home.", "kind": "principle", "source": "Kowalski, Lightspark"}, {"rule": "Spend boldness in one place, then quiet the rest.", "why": "One memorable element with everything around it disciplined. If every element gets louder, the section gets flatter.", "kind": "technique", "source": "frontend-design, impeccable"}, {"rule": "Find distinctiveness in the subject's own world and test with the swap test.", "why": "Would it look the same in any other product? List concepts and colours from the product's world, and name one default you're choosing not to use.", "kind": "technique", "source": "Dammyjay93, frontend-design"}, {"rule": "Taste is not trend; if a style needs defending against usability rules, the rules win.", "why": "Prefer what will still look right in three years over glass effects, gradients or oversized type.", "kind": "caution", "source": ""}, {"rule": "Treat slop as a choice made by reflex and test it by removing it.", "why": "Suspect an element that could paste into an unrelated product, says nothing or competes with content. If nothing is lost when it's gone, it was slop.", "kind": "caution", "source": "Meng To"}, {"rule": "Fix in order: idea, hierarchy, composition, type, imagery, colour, detail, motion.", "why": "In a final pass, make what's there more coherent rather than adding a shape, filter or font. Never refill a removed gap with ornament.", "kind": "technique", "source": "taste-skill, canvas-design"}, {"rule": "Speed and feel are design values.", "why": "Keyboard-first paths, instant feedback and familiar shortcuts make a product feel crafted as much as visuals do. Feel decides daily-use tools.", "kind": "principle", "source": "Lenny skills, Figma"}], "sourcesDiffer": ["Numbered sections: Meng To treats 01, 02, 03 numbering as a craft signal; taste-skill, impeccable and brain's anti-slop rules ban decorative numbers. Default: number only real sequences, such as steps or a timeline.", "Smooth scroll and grain: redesign-skill suggests both everywhere; taste-skill and impeccable reject them by default. Default: native scroll, and grain only with a stated reason.", "Display type at 2.5 times body: one author's threshold for heroes; brain keeps headings modest in dense UI. Default: 2.5 times for display and hero text only."], "tryIt": "Take one screen and list what it must achieve. Mark every element that serves none of it, remove or demote those, and write down what you removed and where it went.", "quiz": [{"q": "Two concepts for a landing page differ only in palette. How should you treat them?", "options": ["As two strong options to test", "As finished, pending colour sign-off", "As one concept; vary how the page is organised before the palette", "As proof the palette is the key decision"], "answer": 2, "explain": "Varying colour without varying structure is cosmetic: two concepts that differ only in colour are one concept."}, {"q": "A designer hides every setting behind one menu button to look minimal, and users can't find options. What principle applies?", "options": ["Earn every element, so the menu is right", "Taste is not trend", "One hero per view", "Simplicity is not minimalism; keep frequent functions in a fixed, visible home"], "answer": 3, "explain": "Burying everything behind one control looks minimal but isn't simple. Frequent actions keep a stable place."}, {"q": "In a final review the instinct is to add a gradient to a section that feels flat. What does the fix order suggest?", "options": ["Make what's there more coherent, starting with hierarchy and composition, before adding ornament", "Add the gradient, then review again", "Add grain to hide the flatness", "Make every element bolder"], "answer": 0, "explain": "Fix idea and hierarchy before detail, and in a final pass make what's there more coherent rather than adding a shape or filter."}]}]}, {"id": "m02", "title": "Accessibility", "summary": "How to design touch, keyboard, screen-reader, visual and cognitive access to WCAG 2.2 AA, keep products fast and lean, and run accessibility work through law, audits and process.", "neurons": ["accessibility", "accessibility-practice"], "lessons": [{"id": "m02-l1", "title": "Touch, keyboard and focus", "neuron": "accessibility", "intro": "If people cannot hit a control or reach it by keyboard, nothing else about it matters. Generous targets, a full keyboard route and a focus indicator that is always visible are the floor for every interface.", "points": [{"rule": "Make touch targets 44pt on iOS and 48dp on Android; treat 24px as a floor, not a goal.", "why": "24px is the WCAG 2.2 AA minimum (2.5.8). The visual can be smaller than the hit area, but space targets at least 8px apart and put main actions in the thumb zone.", "kind": "default", "source": "WCAG 2.2, Apple, Material"}, {"rule": "Grow the hit area with padding, not margin, and use one generous size for every input type.", "why": "Only padding makes the clickable area bigger; a 16px icon needs 4px of padding all round for 24px. Switching sizes by pointer type fails because laptops have touchscreens and people with motor impairments use mice and styluses.", "kind": "technique", "source": "Bailey, Smashing"}, {"rule": "Show a visible focus indicator on every focusable element; never remove the outline without a stronger replacement.", "why": "A good ring is at least 2px solid with 3:1 against every adjacent colour, checked in forced-colours mode and never animated. Design and document it for every interactive component.", "kind": "default", "source": "Krehel, Checklist Design"}, {"rule": "Every flow and every pointer interaction must work by keyboard, using one consistent keyboard model.", "why": "Tab moves between widgets, arrows move within composites such as menus and tabs, Enter or Space activates and Escape closes. Press, drag and hover reveals all need a keyboard equivalent.", "kind": "principle", "source": "WAI-ARIA Authoring Practices"}, {"rule": "Keep visual order the same as DOM order, and never use a positive tabindex.", "why": "Screen readers and focus follow the DOM, so CSS reordering scrambles them. Use tabindex 0 only for real custom widgets and -1 for programmatic focus targets.", "kind": "caution", "source": "Kalbag"}, {"rule": "Every gesture needs a visible button alternative.", "why": "Swipe actions get a menu, drag and drop gets select then move, pinch zoom gets zoom buttons and shake gets a button. Check custom gestures against system gestures, screen readers and switch control.", "kind": "technique", "source": "mobile-design skill"}, {"rule": "Never let a focused element hide under a sticky header or footer.", "why": "WCAG 2.4.11 requires focus not to be obscured. Use scroll-margin so focused items clear sticky elements.", "kind": "technique", "source": "WCAG 2.4.11"}, {"rule": "In modals, make the background inert, move focus in on open and return it to the trigger on close.", "why": "Confirmations use the alertdialog role and focus the least destructive action. Non-modal dialogs don't trap focus but still close on Escape and return focus.", "kind": "technique", "source": "Krehel, Vercel WIG"}, {"rule": "Hover must never be the only route to anything.", "why": "Tooltips must also open on focus, be dismissible without moving the pointer and stay until dismissed. Row actions on hover and tooltips on disabled items are unreachable by keyboard and touch.", "kind": "caution", "source": "WCAG 1.4.13"}, {"rule": "Keep destructive actions away from frequent ones, and never put opposites small and side by side.", "why": "Fitts's law says big, close targets are faster, which also makes near misses easy. Corner targets need to be larger because touch accuracy falls at screen edges, and taps should fire on release so people can slide off to cancel.", "kind": "caution", "source": "Laws of UX, Uxcel"}], "sourcesDiffer": ["Brain gives 44px hit areas on mobile; Bailey warns against switching sizes by pointer or device detection. Default: one generous size for every input, at least 24px, with 44pt/48dp as the floor on touch platforms.", "Apple allows a 28 by 28pt minimum on iOS and 20 by 20pt on macOS. Default: 44pt for touch; 28pt only for dense secondary controls with space around them; macOS pointer targets follow Apple.", "Tabs: WAI-ARIA uses one tab stop and arrow keys; Adam Silver notes many screen-reader users don't know to press arrows. Default: the ARIA pattern; if testing shows people stuck, let each tab take focus."], "tryIt": "Unplug your mouse and complete your product's most important flow using only the keyboard, noting every place focus disappears, gets hidden or lands somewhere unexpected.", "quiz": [{"q": "A 16px icon button needs to meet a 44px hit area on a touch screen. What is the right fix?", "options": ["Add margin around it so it meets the spacing exception", "Add 14px of padding all round so the clickable area itself grows", "Make it 44px only when the device reports a coarse pointer", "Leave it, because the visual is what WCAG measures"], "answer": 1, "explain": "Only padding enlarges the clickable area, and switching size by pointer type fails mixed-input users. Margin meets the letter of the spacing exception, not its intent."}, {"q": "A designer wants a card grid reordered with CSS so the newest card appears first visually. What should you check?", "options": ["That the hover state still works", "That the cards have positive tabindex values in visual order", "That the reordered cards use a lighter background", "That the source order matches the new visual order"], "answer": 3, "explain": "Screen readers and focus follow the DOM, so visual order must equal DOM order. Positive tabindex is never the fix because it scrambles order."}, {"q": "Table rows reveal Edit and Delete buttons only on mouse hover. What is the problem?", "options": ["The actions can't be reached by keyboard or touch unless they also appear on focus", "Nothing, as long as the buttons have good contrast", "Hover reveals are fine if a tooltip explains them", "The buttons should simply be disabled until hovered"], "answer": 0, "explain": "Hover must never be the only route. Row actions on hover are unreachable by keyboard and touch unless they also appear on focus."}]}, {"id": "m02-l2", "title": "Screen readers and semantics", "neuron": "accessibility", "intro": "Screen readers, braille displays and even AI agents read the structure underneath the visuals. Get the native semantics right first, use ARIA sparingly and correctly, and make sure every change on screen is announced.", "points": [{"rule": "Use native semantics before ARIA: real buttons, links, labels, tables and headings.", "why": "ARIA adds no keyboard behaviour and invalid ARIA fails silently. Pages using ARIA averaged about twice the errors of pages without it (WebAIM Million, indicative).", "kind": "principle", "source": "Smashing, WebAIM"}, {"rule": "Visible text must be part of the accessible name, and names leave out the control type.", "why": "WCAG 2.5.3 requires label in name so voice users can say what they see. Say Save, not Save button; don't add roles an element already has; never aria-hide a focusable element.", "kind": "principle", "source": "Smashing, WCAG 2.5.3"}, {"rule": "Write alt text by purpose: empty for decoration, meaning for information, action for function.", "why": "A search icon's alt is Search, not magnifying glass, and a logo names the brand. An icon button is named for its action, such as Delete project, not Trash icon.", "kind": "technique", "source": "Sredojevic, UX Magazine"}, {"rule": "Make a skip link the first focusable element, shown clearly on focus, pointing at main content.", "why": "Sighted keyboard users can't jump by headings or landmarks without extensions, so they need it. Hide it off-screen or clipped, never with display none, and keep it on screen a little longer so fast tabbing doesn't hide it.", "kind": "technique", "source": "GOV.UK, WebAIM"}, {"rule": "Announce async updates with a live region that already exists in the DOM.", "why": "Adding the container and the message together usually isn't announced. Use polite status for toasts and result counts, and assertive only for urgent errors about the current action.", "kind": "technique", "source": "Open Design craft, Krehel"}, {"rule": "After a client-side route change, move focus to the new heading and update the page title.", "why": "A new view in a single-page app triggers no page load, so screen readers aren't told anything changed.", "kind": "technique", "source": "Kostenchuk"}, {"rule": "Set the page language, a descriptive page title and one h1 with a real heading order.", "why": "Screen-reader and braille users rely on these to orient, and braille displays flatten columns, so DOM order must match visual order.", "kind": "principle", "source": "Sredojevic, Uxcel"}, {"rule": "Refer to controls by their visible label, never by position.", "why": "Instructions like the button on the right fail for screen-reader and zoom users (WCAG 1.3.3). Also avoid screen-reader-only instructions on how to use the interface; they get in the way.", "kind": "caution", "source": "Sredojevic, Kalbag"}, {"rule": "If a button must be disabled, use aria-disabled so it stays focusable.", "why": "Focus isn't lost mid-submit and the explanation stays reachable. Never use pointer-events none, which blocks clicks but not keyboard.", "kind": "technique", "source": "Friedman, Smashing"}, {"rule": "Test ARIA-pattern components with real screen readers, not only automated tools.", "why": "The Authoring Practices make no claims about screen-reader output, so compliant third-party components can still fail. Test in NVDA or JAWS and VoiceOver.", "kind": "caution", "source": "Hidde de Vries"}], "sourcesDiffer": ["Skip links: Kalbag wants them visible at all times; brain shows them on focus. Default: show on focus; where long lists sit before useful controls, a permanently visible skip link is worth it."], "tryIt": "Strip the styling from one key page and read it in document order, then check it with a screen reader, noting any meaning carried only by an image, animation or hidden panel.", "quiz": [{"q": "A filter panel updates a results count without a page reload, but screen-reader users hear nothing. The developer injects a new aria-live div containing the message. Why might it still fail?", "options": ["aria-live only works on buttons", "The live region should be assertive for all updates", "The live region must exist in the DOM before the message is added", "Result counts should never be announced"], "answer": 2, "explain": "Adding the container and the message together usually isn't announced. Keep a stable empty region and update its text, using polite status for counts."}, {"q": "An icon-only button shows a bin glyph. Which accessible name is best?", "options": ["Trash icon", "Delete project button", "Bin", "Delete project"], "answer": 3, "explain": "Functional icons are named for their action, not their glyph, and names leave out the control type."}, {"q": "A single-page app swaps views on navigation. What should happen after each route change?", "options": ["Move focus to the new main heading or region and update the page title", "Nothing, the browser handles it", "Show a toast saying the page has changed", "Reload the full page to trigger an announcement"], "answer": 0, "explain": "No page load means screen readers aren't told. Moving focus to the new heading and updating the title solves this."}]}, {"id": "m02-l3", "title": "WCAG and inclusive design", "neuron": "accessibility", "intro": "WCAG 2.2 AA is the floor, but real needs vary through the day, combine and are often temporary or situational. Design one universal experience that survives contrast, zoom, motion and cognitive demands rather than bolting on an accessible extra.", "points": [{"rule": "Target WCAG 2.2 AA: 4.5:1 for text, 3:1 for large text and UI parts.", "why": "3:1 also covers input borders, focus indicators and informational icons; disabled controls and logos are exempt. Large text is 18pt or 14pt bold, about 24px and 18.7px, not 18px.", "kind": "default", "source": "WCAG 2.2, Uxcel"}, {"rule": "Never rely on colour alone; pair it with an icon or text.", "why": "Colour blindness affects up to 8% of men and 0.5% of women. Green for success needs an icon or text too, and charts should avoid red/green pairs, vary lightness and label directly.", "kind": "default", "source": "WCAG 1.4.1, Kalbag"}, {"rule": "Never disable zoom; support 200% zoom, text scaling, user spacing and reflow at 320px.", "why": "Content must reflow without horizontal scroll and survive WCAG 1.4.12 spacing overrides. Use min-height, not fixed heights, and add 400% zoom and forced-colours modes to manual tests.", "kind": "principle", "source": "WCAG 1.4.4, 1.4.12, Dean"}, {"rule": "Offer a real reduced-motion alternative, and give anything moving over 5 seconds a visible pause.", "why": "Use a cross-fade or nothing. Nothing flashes more than 3 times a second, and muted looping hero videos still need a pause (WCAG 2.2.2).", "kind": "default", "source": "WCAG 2.2.2, Krehel"}, {"rule": "Prefer one universal design over a separate accessible extra.", "why": "Larger default text beats a text-size button; no carousel beats a keyboard-operable one. On a small budget, pick the cheapest change that reaches the widest audience.", "kind": "principle", "source": "Kalbag"}, {"rule": "Design for predictable layouts, plain literal language and minimal time pressure.", "why": "Overload that stops someone finishing is an accessibility barrier. Score each step: 4 or more decisions, 3 or more things to remember, or 2 or more new concepts suggests a redesign (indicative).", "kind": "principle", "source": "Dean"}, {"rule": "Warn at least 2 minutes before a session timeout, with one-click extend and saved input.", "why": "This is stricter than the WCAG floor of 20 seconds. Say up front that a limit exists, announce the warning once, and never time out reading, browsing or search.", "kind": "technique", "source": "Smashing, WCAG 2.2.1"}, {"rule": "Remove puzzle-style authentication and never block paste.", "why": "WCAG 3.3.8 rules out image or audio CAPTCHAs, shuffled PIN pads and exact-recall questions. Use passkeys, magic links, OTP and password autocomplete.", "kind": "caution", "source": "WCAG 3.3.8, Sredojevic"}, {"rule": "Don't equate a technology with a disability.", "why": "Sighted people with dyslexia use screen readers, and many disabled people use no assistive technology. Analytics can't see assistive technology either.", "kind": "caution", "source": "Kalbag"}, {"rule": "Map core tasks across an ability spectrum instead of a pass/fail checklist.", "why": "Rate 5 to 10 core tasks across steps of vision, hearing, motor and cognitive ability as works, friction, workaround or fails. The first failing point shows who is excluded and which fix includes most people.", "kind": "technique", "source": "Dean"}], "sourcesDiffer": ["Secondary text in dark mode: Kostenchuk accepts 3:1; Apple asks for 7:1 on custom dark pairs. Default: 4.5:1 for all text people must read; 3:1 only for large text and disabled states.", "Simplified modes: inclusive-design-skills proposes a simplified/full toggle; Kalbag prefers one universal design. Default: one design; a simplified mode only in genuinely complex tools, completing every core task, remembered, never labelled easy mode.", "In-app text-size controls: Kendrick (NN/g) recommends them for older readers; brain relies on OS and browser settings. Default: brain's rule, unless research shows your audience doesn't use zoom or system text size.", "Underlining links: NN/g says clear nav menus and link lists can rely on contrast plus hover and focus cues; Uxcel underlines all links. Default: underline links in running text; menus and link lists may drop it with 3:1 contrast and a non-colour hover and focus cue."], "tryIt": "Pick three core tasks and test each with 200% zoom, the largest system text size, dark mode with increased contrast and reduced motion turned on together, recording where each one breaks.", "quiz": [{"q": "A form shows required-field errors only by turning the border red. What is the minimum change?", "options": ["Use a brighter red", "Add an icon and a text message linked to the field", "Make the border thicker", "Show a toast listing the errors"], "answer": 1, "explain": "Colour must never be the only cue. Errors use an icon, bold border and a message linked with aria-describedby."}, {"q": "A stakeholder asks for a text-size button so older users can read better. What is the brain's default response?", "options": ["Build the button and remember the choice across pages", "Add a separate easy mode for older users", "Lock the text size so the layout doesn't break", "Rely on OS and browser settings and make the default text larger, unless research shows the audience doesn't use them"], "answer": 3, "explain": "Universal design beats bolt-on controls, and OS and browser settings already handle text size. Older adults need the full product working, not a stripped-down version."}, {"q": "Grey text measures 2.85:1 on white and is set at 18px regular. Does it pass AA?", "options": ["Yes, 18px counts as large text so 3:1 is close enough", "Yes, if APCA scores it highly", "No, large text starts at 18pt (about 24px) or 14pt bold, and 2.85:1 fails even the 3:1 allowance", "No, but only because it is grey"], "answer": 2, "explain": "18px is not large text under WCAG; it needs 4.5:1. Even under the large-text rule, 2.85:1 is below 3:1."}]}, {"id": "m02-l4", "title": "Performance and sustainability", "neuron": "accessibility", "intro": "A slow or heavy product excludes people on weak devices, poor connections and unreliable power. Measure in the field, set budgets, build so core tasks work without JavaScript, and keep the baseline lean for people and the planet.", "points": [{"rule": "Build with progressive enhancement: content, navigation and forms work from the server; JavaScript is an extra.", "why": "Plan for failed scripts, dropped connections and CDN outages; a small percentage of visits is still a lot of people. When retrofitting, protect core tasks and never block an unsupported browser outright.", "kind": "principle", "source": "Adam Silver"}, {"rule": "Judge Core Web Vitals at the 75th percentile: LCP 2.5s, INP 200ms, CLS 0.1 or less.", "why": "INP replaced FID in March 2024, so ignore sources still quoting FID.", "kind": "evidence", "source": "web.dev"}, {"rule": "Treat Lighthouse as a quick lab check and confirm with real-user field data.", "why": "CrUX is a 28-day rolling window, so fixes take weeks to show. Rank slow pages by traffic, and when field data regresses, check whether visitors changed before blaming code.", "kind": "technique", "source": ""}, {"rule": "Complete mutations in under 500ms and treat tasks over 50ms as long.", "why": "A frame is about 16.6ms, so move heavy computation to workers. If people click repeatedly because the server is slow, fix the slowness and guard against duplicate submits rather than adding feedback.", "kind": "evidence", "source": ""}, {"rule": "Set a page-weight budget and make anything new pay for itself by removing something.", "why": "For example, 1MB for a landing page plus a minimum performance score. Fix the heaviest pages of one high-value journey first.", "kind": "technique", "source": ""}, {"rule": "Give images explicit dimensions, prioritise the LCP image and lazy-load the rest.", "why": "Explicit sizes stop layout shift. Serve AVIF or WebP, preload only above the fold, and replace decorative photos with CSS or SVG.", "kind": "technique", "source": ""}, {"rule": "Choose font-display per font, preload only the critical one and subset it.", "why": "Swap shows fallback text at once; fallback uses the web font only if it arrives within about 3 seconds; optional lets slow connections skip it. Variable fonts can replace a file per weight.", "kind": "technique", "source": "Rutter, NN/g"}, {"rule": "Prefer native platform features, but not when the polyfill outweighs the library.", "why": "Native dialog, popover and Intl can save tens of KB. Audit dependencies regularly.", "kind": "principle", "source": ""}, {"rule": "Keep a lean, sustainable baseline: system fonts, little JS, few images, no autoplay video.", "why": "Add green hosting near users, small task-specific AI models over large general ones, and batched non-urgent AI calls. Explain impact with energy-rating labels rather than grams of CO2.", "kind": "principle", "source": ""}, {"rule": "Weigh who a change helps against who it hurts, using your own analytics.", "why": "A change that helps most people is acceptable only if the rest still get the old experience unharmed. A file format a fifth of people can't open fails that test.", "kind": "caution", "source": "Whitenton and Gibbons, NN/g"}], "sourcesDiffer": ["Brain's 1MB landing-page budget carries a Sources differ note against other resource budgets kept in the frontend-engineering neuron."], "tryIt": "Pick one high-value journey, pull its field Core Web Vitals and page weights, and list the single heaviest asset on each page with what you would remove to pay for it.", "quiz": [{"q": "Lighthouse scores improved after a fix last week, but field data hasn't moved. What is the most likely explanation?", "options": ["The fix didn't work, so roll it back", "CrUX is a 28-day rolling window, so field improvements take weeks to show", "Lighthouse is always more accurate than field data", "Field data only measures desktop users"], "answer": 1, "explain": "Lighthouse is a lab check; CrUX field data rolls over 28 days, so fixes appear slowly."}, {"q": "Users double-submit a payment form because the server takes several seconds. What should you do first?", "options": ["Add a spinner and a longer success animation", "Disable the submit button from page load", "Show a toast asking people to wait", "Fix the slowness and guard against duplicate submits"], "answer": 3, "explain": "The neuron says to fix the slowness and guard against duplicates rather than paper over it with feedback."}, {"q": "A new feature would add 300KB to a page already at its weight budget. What does the budget rule say?", "options": ["Something else must be removed to pay for it", "Raise the budget, since features matter more", "Ship it and lazy-load everything", "Budgets only apply to landing pages"], "answer": 0, "explain": "Anything new must be paid for by removing something, which keeps the budget meaningful."}]}, {"id": "m02-l5", "title": "Running accessibility work", "neuron": "accessibility-practice", "intro": "Accessibility succeeds or fails in process: how you make the case, meet the law, audit and fix. Build it into the design system and workflow early, judge by whether disabled people can finish tasks, and never mistake a clean scan for conformance.", "points": [{"rule": "Never treat a clean automated scan as conformance; always add keyboard, zoom and screen-reader checks.", "why": "Scanners catch about 30% of issues, fewer on native apps. Deque's 57% counts defect volume, GitHub's 64% counts criteria, and browser-driven checks reach about 80% (indicative).", "kind": "caution", "source": "Deque, GitHub, AccessLint"}, {"rule": "Audit by WCAG-EM: scope, explore, sample, evaluate, report per success criterion.", "why": "Sample the entry page, each key flow end to end, each template or complex widget and important states, plus a small random set. One URL with no sampling is a scan, not an audit.", "kind": "technique", "source": "W3C WCAG-EM, AccessLint"}, {"rule": "Rate severity by how completely access is blocked, not by how easy the fix is.", "why": "Critical is usually a Level A failure, Major AA, Minor AAA or best practice. Raise contrast failures to Critical when the text is needed to finish the core task.", "kind": "principle", "source": "Uxcel"}, {"rule": "Annotate accessibility during design and fix issues in shared components.", "why": "Deque reports about 67% of auto-detectable issues start in design. Organise annotation kits by element type with code values prefilled, and fix recurring issues at the component or workflow that causes them.", "kind": "technique", "source": "Deque, Hagadorn, Sredojevic"}, {"rule": "Write the standard into the design system and document contrast for every colour pair.", "why": "Feedback colours often pass in light mode and fail in dark. When a brand colour fails, restrict it to decoration or derive darker or lighter shades for UI; test components with VoiceOver/Safari and NVDA/Chrome.", "kind": "technique", "source": "Checklist Design, Wang"}, {"rule": "Hold the red lines: never ship something unusable by keyboard or remove existing accessibility for a deadline.", "why": "Blocked outranks harder and permanent needs outrank situational ones. Fix it later counts only with a ticket and a date; record who is excluded, severity, workaround and fix date.", "kind": "caution", "source": "Dean"}, {"rule": "Fix blockers this sprint, major issues within 30 days and minor within 90 (indicative).", "why": "Treat regressions as critical and add an automated test for each fix. Teams often reserve 10 to 20% of each sprint (indicative).", "kind": "technique", "source": "Dean"}, {"rule": "Make the case by showing real struggle, not by legal or moral argument.", "why": "Legal framing makes stakeholders defensive. Have them watch disabled customers, ask for small commitments, then agree a roadmap with owners and dates; people who struggle mostly leave silently.", "kind": "technique", "source": "Friedman, Wang, Smashing"}, {"rule": "Know the law: the European Accessibility Act and UK public-sector rules.", "why": "The EAA covers selling to EU customers in sectors such as e-commerce and banking, with new products from 28 June 2025 and existing ones by 28 June 2030. UK public-sector sites must publish an accessibility statement and are monitored against WCAG 2.2 AA.", "kind": "evidence", "source": "UX Design Institute, GOV.UK"}, {"rule": "Don't rely on an overlay widget, and keep a human route for accommodation requests.", "why": "Over 1,000 businesses using overlays were sued in 2024 (indicative). Even when compliant, a process for individual requests is still needed; building in from the start costs about the same.", "kind": "caution", "source": "UsableNet, Hudson, UX Myths"}], "sourcesDiffer": ["EN 301 549 still cites WCAG 2.1. Default: WCAG 2.2 AA, which meets both.", "Conformance level: a Toptal article calls Level A the usual minimum; UK and EU public-sector practice is AA. Default: WCAG 2.2 AA.", "Contrast as an option: Salminen lists high contrast as a mode to offer; WCAG 2.2 makes 4.5:1 and 3:1 the default for everyone. Default: contrast in the default theme; a higher-contrast mode is an addition, never the fix.", "Automation coverage: brain says scanners catch about 30%; Deque's 57% counts defect volume. Default: keep brain's caution and always add manual checks.", "Severity tiers: addyosmani rates issues such as a missing skip link as Serious; brain rates by how completely access is blocked. Default: brain's scale, using the list as a triage prompt."], "tryIt": "Scope a WCAG-EM audit for your product: list the entry page, two or three high-use flows of different types (form, table, text), the templates and states you'd sample, and how you'd rate severity.", "quiz": [{"q": "A team's automated checker reports zero issues on the home page. The PM asks to mark the product as conformant. What's the right reply?", "options": ["Agree, since automated tools catch most issues", "Agree, but rescan monthly", "Disagree, and suggest installing an overlay to be safe", "Disagree: one scanned URL is not an audit, and scanners miss most issues without keyboard, zoom and screen-reader checks"], "answer": 3, "explain": "Scanners catch about 30% of issues, and a single URL with no sampling is a scan, not a WCAG-EM audit. Overlays are not a defence either."}, {"q": "Two issues: a hard-to-fix Level A failure blocking checkout by keyboard, and a quick AA contrast fix on a footer link. How should they be ranked?", "options": ["The keyboard blocker is more severe, because severity follows how completely access is blocked", "The contrast fix first, because it is quicker", "Both equal, because both fail WCAG", "The contrast fix first, because AA matters more than A"], "answer": 0, "explain": "Rate by how completely access is blocked, not ease of fix. Level A failures blocking a core task are usually Critical."}, {"q": "The brand's primary colour fails contrast as button text. The client loves it. What's the recommended move?", "options": ["Drop the brand colour entirely", "Keep it on buttons and add a high-contrast mode toggle", "Restrict it to decoration or derive darker or lighter shades of it for text and interactive roles", "Keep it, since brand colours are exempt like logos"], "answer": 2, "explain": "Acknowledge what the client likes, name the barrier and offer an accessible version. A high-contrast mode is an addition, never the fix."}]}]}, {"id": "m03", "title": "Forms and flows", "summary": "How to design forms, inputs and multi-step flows that as
