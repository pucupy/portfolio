k less, recover well from errors and work for everyone.", "neurons": ["forms-and-flows", "form-components", "sign-in", "address-forms", "asking-less", "wizards-and-progress", "dates-and-time", "rule-builders"], "lessons": [{"id": "m03-l1", "title": "Form fundamentals", "neuron": "forms-and-flows", "intro": "Nobody wants to fill in your form, so every second of answering or hesitating is a cost. Good forms are plain, single-column and honest about what they need and what happens next.", "points": [{"rule": "Remove anything that slows people down; don't try to make a form fun or novel.", "why": "Completion time is answering time plus hesitation time, so cut both. People will still make mistakes, so design recovery as carefully as the form itself.", "kind": "principle", "source": "Adam Silver"}, {"rule": "Use one column, with every field on its own line.", "why": "Multi-column forms cause skipped and misread fields, errors and abandonment. In CXL's test a single-column form was finished 15.4 seconds faster on average.", "kind": "default", "source": "Adam Silver, CXL"}, {"rule": "Start with one question per page and combine only when research shows a need.", "why": "Questions grouped by habit add load. Don't pick a layout to fill whitespace; a single-step form holds about 8 fields at most before it should go multi-step.", "kind": "principle", "source": "GOV.UK, Paste"}, {"rule": "Put labels above fields, always visible; never use placeholder or floating labels.", "why": "Placeholders vanish or shrink, have low contrast and look like answers. Labels above survive translation, zoom, error messages and narrow screens.", "kind": "default", "source": "GOV.UK"}, {"rule": "Mark optional fields with \"(optional)\" rather than asterisks on required ones.", "why": "A marker on every field carries no information. Where most fields are optional, label the required ones in words, never with an asterisk alone, and never mix both markers in one form.", "kind": "default", "source": "GOV.UK, Kalbag"}, {"rule": "Labels name the value; hints instruct, and sit under the label.", "why": "Cut filler such as \"Enter your…\" and hints that restate the label. Avoid labels the field completes as a sentence, since word order changes in translation.", "kind": "technique", "source": "Paste, Ant Design"}, {"rule": "Use placeholders only for example values, never instructions or anything that looks like an answer.", "why": "An example such as +44 7700 900123 shows the pattern without pretending to be a filled-in value.", "kind": "technique", "source": ""}, {"rule": "Size each field to the expected input and set the right type, inputmode and autocomplete.", "why": "Field width hints at answer length. Turn spellcheck off for emails, codes and usernames, and never use type number for phone or card numbers, which adds spinner arrows.", "kind": "technique", "source": "Dutton, web.dev"}, {"rule": "Tell people what they'll need before they start and what happens after they submit.", "why": "Say which documents to have ready and roughly how long it takes. Before submit, say where the input goes, who is notified and any deadlines.", "kind": "principle", "source": "Carello, Contensis"}, {"rule": "Order fields to match the real-world object and dependencies.", "why": "A card form runs in the order printed on the card. Put fields others depend on first, then easiest to hardest for momentum.", "kind": "technique", "source": "Co-op, Helios"}], "sourcesDiffer": ["Contensis and Ant put labels beside fields on longer forms; default: labels above, which survive translation, zoom and narrow screens.", "Baymard allows 2 to 3 fields on one line only when they form one entity (card number, expiry, security code); brain says every field on its own line; default: keep one per line, treating a genuinely single entity like the date exception.", "Contensis allows either an asterisk on required fields or \"(optional)\" on optional ones; default: \"(optional)\"."], "tryIt": "Take a form you own and audit it against these rules: count multi-column rows, placeholder labels and asterisks, then rewrite one screen as a single column with labels above and \"(optional)\" markers.", "quiz": [{"q": "A stakeholder wants to put first name and last name side by side to make a sign-up form look shorter. What should you do?", "options": ["Agree, because it reduces scrolling", "Use floating labels so the fields can be narrower", "Keep one field per line, ideally a single \"Full name\" field", "Put the two fields side by side only on desktop"], "answer": 2, "explain": "Multi-column layouts cause skipped and misread fields; one field per line is the default, and a single Full name field is preferred unless something downstream needs parts."}, {"q": "Most fields on a long application are required, but three are not. How should you mark them?", "options": ["Add \"(optional)\" to the three optional fields", "Add a red asterisk to every required field", "Mark nothing, since most are required", "Use both asterisks and \"(optional)\" for clarity"], "answer": 0, "explain": "Brain marks optional fields with \"(optional)\" and never mixes markers in one form."}, {"q": "A designer uses grey placeholder text inside each field instead of labels to keep the form clean. What is the main problem?", "options": ["Placeholders cannot be translated", "Placeholders vanish when typing, have low contrast and can look like answers", "Placeholders slow page load", "Placeholders break the browser back button"], "answer": 1, "explain": "Placeholder labels disappear or shrink, are low contrast and can pass for filled values, so labels go above, always visible."}]}, {"id": "m03-l2", "title": "Validation and errors", "neuron": "forms-and-flows", "intro": "People will make mistakes however good the form is, so recovery is part of the design. Brain validates on submit, shows a summary plus inline errors, and never blocks what people type.", "points": [{"rule": "Validate on submit, with an error summary linking to each field and an inline error beside it.", "why": "Move focus to the summary or first error. Submit-time validation avoids premature errors and is the approach best evidenced with disabled users.", "kind": "default", "source": "GOV.UK, Adam Silver"}, {"rule": "Never pre-disable the submit button.", "why": "Disabled buttons can't be focused, are hard to read and give no clue what's wrong. People think the form is broken, and on long forms the button is off-screen when it becomes enabled.", "kind": "default", "source": "Adam Silver"}, {"rule": "Errors say what happened and how to fix it, never \"Invalid input\".", "why": "For example, \"Enter a UK postcode, for example SG1 2AA\". Use templates such as \"Enter [thing]\", \"Select [thing]\" and \"[Thing] must be [n] characters or fewer\".", "kind": "principle", "source": "Paste"}, {"rule": "Never restrict input: no input masks, maxlength or paste blocking.", "why": "Masks move the cursor, block deleting and break autofill; maxlength silently cuts pasted text. Accept any format, trim whitespace, then explain what's wrong.", "kind": "default", "source": ""}, {"rule": "Once an error shows, keep it until the value actually passes.", "why": "Clearing it as soon as someone types or refocuses removes the instruction just when it is needed. Keep the hint visible too, with the error first.", "kind": "technique", "source": "Uxcel, Paste"}, {"rule": "Wire errors up with aria-invalid and aria-describedby, and never use red alone.", "why": "The programmatic link lets screen readers announce the message, and colour alone fails WCAG 1.4.1. Reserve red for errors.", "kind": "default", "source": "Krehel, Enders"}, {"rule": "Show a known rule as helper text before input; if one error keeps firing, redesign.", "why": "Saying the requirement up front prevents the error. Errors are a design fault, not a user fault, so the fix is a redesign, not a warning.", "kind": "technique", "source": "Krehel, NN/g"}, {"rule": "Let people past soft errors and give a way out of a blocked form.", "why": "When a value may be right but can't be confirmed, warn and let them continue. Offer \"Can't continue? Tell us\" with consent before sending data to support.", "kind": "technique", "source": "Friedman"}, {"rule": "Separate slips from mistakes when fixing errors.", "why": "Slips are autopilot lapses, fixed with constraints, defaults and undo. Mistakes come from a wrong mental model, fixed with clearer labels and research.", "kind": "principle", "source": "Uxcel"}, {"rule": "Disable submit only once the request is in flight, with a spinner and the original label.", "why": "This prevents double submits; send an idempotency key, and a failed submit keeps every value people entered.", "kind": "technique", "source": "Krehel, Vercel"}], "sourcesDiffer": ["Some Smashing authors, Babich, IxDF and Baymard-citing sources favour inline validation as people type; Uxcel, Helios and Apple validate on blur; GOV.UK, Adam Silver and Paste validate on submit; default: submit, with the error kept visible until the value passes.", "NN/g authors recommend formatting values as people type; brain bans masks; default: accept any format, clean it up behind the scenes and show it back in chunks.", "Dutton caps fields with maxlength; default: no maxlength, check length on submit with generous limits."], "tryIt": "Submit an empty and a badly filled version of one of your forms. List every error message, rewrite each to say what happened and how to fix it, and check whether submit was ever disabled.", "quiz": [{"q": "A team wants to keep the Continue button disabled until all fields are valid, to stop bad submissions. What is the better approach?", "options": ["Keep it disabled but make it look faint", "Keep it enabled, validate on submit and show a summary plus inline errors", "Hide the button until the form is valid", "Disable it and add a tooltip explaining why"], "answer": 1, "explain": "Pre-disabled buttons look broken and give no reason; brain keeps submit enabled and validates on submit."}, {"q": "A phone field uses a mask that inserts brackets and dashes as people type. Users complain they can't paste. What should replace it?", "options": ["A plain field that accepts any format, cleaned up behind the scenes", "A maxlength of 11 digits", "Three split boxes for area code and number", "A mask that only applies on mobile"], "answer": 0, "explain": "Masks break paste, deleting and autofill; accept any input and normalise it afterwards."}, {"q": "Which error message best follows the guidance?", "options": ["Invalid date", "Error: field 3 is wrong", "Please be more careful", "Enter a date of birth in the past"], "answer": 3, "explain": "Errors say what's wrong and how to fix it in specific, plain words."}]}, {"id": "m03-l3", "title": "Choosing input components", "neuron": "form-components", "intro": "The control you pick shapes how fast and how accurately people answer. Brain prefers visible choices over hidden ones and keeps each control to the job its shape promises.", "points": [{"rule": "Prefer a fully visible list of radios over a dropdown; use a select as a last resort.", "why": "Miller's law is about memory, not visible options. Radios can carry per-option hints, and a closed dropdown can be mistaken for an answered field.", "kind": "default", "source": "GOV.UK, NN/g"}, {"rule": "Checkboxes for any number of options, radios for exactly one, stacked vertically.", "why": "Horizontal rows are harder to scan. Make the label and its container clickable, and ask one thing per question.", "kind": "principle", "source": "Contensis, Checklist Design"}, {"rule": "Pick list controls by size: under about 5 options show them all; around 200 or more, use a combobox.", "why": "Use autocomplete only when people know what to type. Design-system thresholds vary (USWDS 7, Material 6, Carbon 3), so treat numbers as indicative.", "kind": "evidence", "source": "Smashing, NN/g"}, {"rule": "Use a toggle switch only when a change takes effect immediately.", "why": "Otherwise use a checkbox or radios. A toggle switches one low-risk thing on or off and needs loading and error states so a failed save isn't silent.", "kind": "principle", "source": "Checklist Design"}, {"rule": "Label switches so reading them with \"on\" or \"off\" makes sense.", "why": "\"Email notifications\", not \"Want emails?\" or \"Notifications: Off\". The label describes the on effect and never changes.", "kind": "technique", "source": "Uxcel, Paste"}, {"rule": "Never pre-tick consent or marketing boxes, and default only when most people would agree.", "why": "Defaults that serve the business backfire, and GoodUI's tests show no evidence preselection helps (indicative).", "kind": "caution", "source": "GoodUI"}, {"rule": "Avoid sliders; use min and max inputs or preset ranges instead.", "why": "Precise values never go on a slider. If one is used, labels sit above or beside it, since a finger hides labels below.", "kind": "caution", "source": "NN/g"}, {"rule": "No negated checkboxes, and add an explicit \"None\" where no choice is valid.", "why": "Ticking should mean yes. Once a radio is chosen it can't be unchosen, so offer \"None of the above\" or \"I do not know\" where valid.", "kind": "technique", "source": "Bakusevych, GOV.UK"}, {"rule": "Upload: let people pick any file, then check type and size with a specific error.", "why": "Don't use the accept attribute. State limits up front, show progress per file, and give each failure its own message and next step.", "kind": "technique", "source": "Paste, Checklist Design"}, {"rule": "Segmented controls are for selection of 2 to 3 short options, never navigation.", "why": "Switching views is a job for tabs. Up to 5 options only if each label fits on one line at 320px.", "kind": "technique", "source": "Goswami"}], "sourcesDiffer": ["Checklist Design, Uxcel and Helios preselect the likeliest radio; GOV.UK leaves radios unselected; default: unselected, never preselect consent or legal questions.", "Bakusevych moves to a dropdown above about 6 to 7 options; default: a long visible list of radios, with a select only for long known lists or predictable ordered sets.", "Uxcel accepts sliders for approximate values with min and max labels; default: avoid them."], "tryIt": "Find every dropdown in one product flow. For each, note the option count and whether people know the answer, then replace the ones with about 5 or fewer options with visible radios.", "quiz": [{"q": "A settings form has a switch for \"Weekly summary\" that only saves when the user presses Save at the bottom. What should change?", "options": ["Nothing, switches are fine anywhere", "Replace it with a checkbox, since the change does not take effect immediately", "Replace it with a dropdown", "Move the Save button next to the switch"], "answer": 1, "explain": "Toggles are for changes that apply at once; with submit-on-save a checkbox fits."}, {"q": "A question asks people to pick one of four contract types. Which control is best?", "options": ["Four vertically stacked radios with short hints", "A select dropdown", "A slider", "A combobox with type-ahead"], "answer": 0, "explain": "With few options, show them all as radios; radios can carry per-option hints."}, {"q": "A marketing consent checkbox is ticked by default to lift opt-ins. What is the right call?", "options": ["Keep it, as defaults reduce effort", "Keep it but grey out the label", "Untick it; consent boxes are never pre-ticked", "Replace it with a toggle switched on"], "answer": 2, "explain": "Consent and marketing checkboxes are never pre-ticked; defaults that serve the business backfire."}]}, {"id": "m03-l4", "title": "Asking less", "neuron": "asking-less", "intro": "The best field is the one you never show. Eliminate questions first, then automate what you can work out, and only then simplify what is left.", "points": [{"rule": "Eliminate, then automate, then simplify, in that order.", "why": "Polishing fields doesn't rescue a form that asks too much. Cut questions that aren't needed or aren't needed yet.", "kind": "principle", "source": "Wang, NN/g"}, {"rule": "Ask only what you need now, and let people add detail later.", "why": "Every field costs: Expedia reportedly gained about $12 million a year by removing an optional Company field (indicative). Test removals, as they don't always lift conversion.", "kind": "evidence", "source": "Birkett, CXL"}, {"rule": "Work out values instead of asking for them.", "why": "Derive town and region from a postcode and age from date of birth. Re-typed data creates near-duplicate records, so keep one source of truth.", "kind": "technique", "source": "Wang, NN/g"}, {"rule": "Prefill facts you already know; never prefill decisions.", "why": "Show inferred values as detected with a one-step Change link and never submit them unseen. Confirming costs less than naming.", "kind": "principle", "source": "Uxcel, UI-Patterns"}, {"rule": "Pre-fill values that describe this person; suggest values borrowed from others or guessed.", "why": "A wrong pre-fill must be noticed and deleted and can be saved as bad data; an ignored suggestion costs nothing.", "kind": "technique", "source": "Warwick"}, {"rule": "Ask the branching question first.", "why": "When most of the form depends on one answer, putting it first keeps every path short. Starting with one easy qualifying question was +12.5% across 15 GoodUI tests (indicative).", "kind": "evidence", "source": "Wang, GoodUI"}, {"rule": "Saving details for next time is opt-in, never assumed.", "why": "Offer an unticked \"Save for next time\" for cards and addresses.", "kind": "principle", "source": "Wang, NN/g"}, {"rule": "Treat values passed in links as untrusted input.", "why": "Query-string values can be edited by anyone, so validate them like typed input, and keep personal data out of URLs, which are logged and shared.", "kind": "caution", "source": "Paperform"}, {"rule": "Pre-fill from verified records shows its source and needs confirming.", "why": "Say where each value came from and how current it is, and don't treat it as the person's own statement until they confirm it (indicative source).", "kind": "caution", "source": "NHI Mgmt Group"}, {"rule": "Don't ask twice across a workflow or a channel.", "why": "Carry earlier answers forward, editable, into later forms, and make data entered on one channel available at the next.", "kind": "principle", "source": "FormAssembly, NN/g"}], "sourcesDiffer": ["Smart prefill fills the field and marks it as detected; Warwick only suggests; default: pre-fill values that describe this person from a source they'd expect, suggest values borrowed or guessed, and never pre-fill decisions."], "tryIt": "List every field in one of your forms and label each eliminate, automate or keep. Remove or derive at least two, and note where a suggestion would be safer than a pre-fill.", "quiz": [{"q": "A joint-account form auto-fills the second holder's surname with the first holder's surname. What is the better pattern?", "options": ["Keep the pre-fill but make it bold", "Offer it as a one-tap suggestion under an empty field", "Lock the field to the first holder's surname", "Remove the surname field entirely"], "answer": 1, "explain": "Values borrowed from someone else should be suggested, not pre-filled; a wrong pre-fill can offend and be saved unnoticed."}, {"q": "A contact form serves sales, support and press, with very different follow-up questions. Where should the enquiry type go?", "options": ["At the start, so each path stays short", "At the end, after contact details", "In a hidden field", "On a separate confirmation page"], "answer": 0, "explain": "Ask the branching question first so people see only what applies to them."}, {"q": "You are asked to make a long form easier. What should you do first?", "options": ["Restyle the fields with larger inputs", "Add inline help to every field", "Cut questions that aren't needed, or aren't needed yet", "Split it into more steps"], "answer": 2, "explain": "Eliminate first, then automate, then simplify; polishing doesn't rescue a form that asks too much."}]}, {"id": "m03-l5", "title": "Sign-in and security", "neuron": "sign-in", "intro": "Sign-in is a gate everyone passes, so small frictions add up and lockouts are costly. Offer more than one way in, keep the fields simple and make every failure lead somewhere.", "points": [{"rule": "Use a show/hide password toggle instead of a confirm-password field.", "why": "Show requirements as a live checklist; this is one of the few allowed exceptions to submit-time validation. Passwords start hidden.", "kind": "technique", "source": "Uxcel, Checklist Design"}, {"rule": "Failed logins say \"Email or password is wrong\" without revealing which.", "why": "Keep the email prefilled so only the password needs retyping. Don't explain security rules in enough detail to help attackers.", "kind": "technique", "source": "Uxcel"}, {"rule": "Never offer only one way in, and avoid lockouts that tighten with each failure.", "why": "Biometrics and PINs fail with injury, tremor or wet hands. Allow paste and password managers.", "kind": "principle", "source": "Joycelyn, NCSC"}, {"rule": "Let people sign up without a password, using a one-time code or magic link.", "why": "Offer an optional password and biometrics afterwards, never forced. Let people choose email or text for codes.", "kind": "technique", "source": "Budiu, NN/g"}, {"rule": "Score passwords on length and check them against a breached-password list.", "why": "Composition rules such as mixed case and symbols contradict NIST SP 800-63B; substitutions like P@ssw0rd fool client-side rules.", "kind": "evidence", "source": "NIST, UI-Patterns"}, {"rule": "Verification screens show where the code went and give each failure its own next step.", "why": "Expired, wrong and too many attempts each need different help. A single plain input is accessible; per-digit boxes are optional.", "kind": "technique", "source": "Checklist Design"}, {"rule": "Two-factor setup verifies a code first and requires recovery codes before finishing.", "why": "Skipping verification can silently lock people out. Offer at least two methods and require re-authentication before turning 2FA off.", "kind": "caution", "source": "Checklist Design"}, {"rule": "Show one to three social providers above the email form, with \"Continue with…\".", "why": "Only providers your audience uses; six or seven logos add decision friction. Request name and email only.", "kind": "technique", "source": "UI-Patterns"}, {"rule": "Require an account only where identity is needed, and return people exactly where they were.", "why": "Guest checkout is the primary path; offer an account after purchase. After sign-in, restore the page and state, including half-written text.", "kind": "principle", "source": "UI-Patterns, Uxcel"}, {"rule": "\"Email already registered\" is never a dead end.", "why": "Offer sign-in and reset links in the message, unless revealing that an account exists is a security risk.", "kind": "caution", "source": "signup-flow-cro"}], "sourcesDiffer": ["UI-Patterns shows the last-used sign-in method; Friedman says don't, as it reveals the provider to anyone at the keyboard; default: Friedman's, pointing to the linked provider on a sign-in error.", "Joycelyn suggests tolerating small typing mismatches and image-recognition login; default: exact match, paste and password managers allowed, object recognition only as one option among several.", "Yadav asks for the password twice; default: a single field with show/hide."], "tryIt": "Walk through your product's sign-up, sign-in and password reset end to end. Note every confirm field, lockout, dead-end error and lost state, and propose a fix for each.", "quiz": [{"q": "A sign-up form asks for the password twice to prevent typos. What should replace the second field?", "options": ["A security question", "A show/hide toggle and a live checklist of real requirements", "A CAPTCHA", "A maxlength on the first field"], "answer": 1, "explain": "Brain replaces confirm-password with show/hide and visible requirements."}, {"q": "A password policy demands an uppercase letter, a number and a symbol. What does the guidance favour?", "options": ["Length plus a check against breached or common passwords", "Adding more composition rules", "Forcing a reset every 30 days", "Client-side checks only"], "answer": 0, "explain": "Length and a blocklist beat composition rules, which substitutions easily fool."}, {"q": "Someone who signed up with Google tries to sign in with their email address. What should happen?", "options": ["Show \"Account not found\"", "Create a second account", "Point them to the Google sign-in they used", "Lock the account after three tries"], "answer": 2, "explain": "Send people to the method they used rather than a generic error."}]}, {"id": "m03-l6", "title": "Addresses and dates", "neuron": "dates-and-time", "intro": "Addresses and dates look simple but vary by country and are easy to misread. Pick the input by how the data is shaped, accept many formats and never leave the order ambiguous.", "points": [{"rule": "Type known distant dates; use a calendar picker for dates within about a year.", "why": "Date of birth is faster typed in three labelled day, month and year boxes. Pickers suit bookings and ranges, and typing is always allowed.", "kind": "principle", "source": "Li, NN/g, GOV.UK"}, {"rule": "Never auto-advance focus between date or code segments.", "why": "Auto-advance surprises people and breaks editing; three labelled boxes with hints above is brain's default.", "kind": "caution", "source": "Friedman, GOV.UK"}, {"rule": "Accept any separator, with or without leading zeros, and explain obvious mistakes.", "why": "9-3-17 and 09/03/17 should both parse. For 31 February say \"February has 29 days at most\", never \"Incorrect date\".", "kind": "technique", "source": "Li, NN/g"}, {"rule": "Write months as words and use four-digit years in displays; store ISO 8601.", "why": "01/05/12 reads three ways depending on the reader. Show \"17 Jan 2025\" and keep YYYY-MM-DD in databases and APIs.", "kind": "principle", "source": "Alexgour"}, {"rule": "Use relative dates only where elapsed time is the point; evidence shows absolute dates.", "why": "Feeds can say \"3 days ago\", but transactions, audit and deadlines show the absolute date, reachable without hover. Prefer long forms like \"2 months ago\" over \"2mo\".", "kind": "principle", "source": "Calvo, Primer"}, {"rule": "Avoid asking for times; otherwise one text box that accepts many formats.", "why": "Offer a default or a few common times as radios. Avoid native time inputs and split hour and minute fields.", "kind": "technique", "source": "Heydlauf"}, {"rule": "For addresses, ask for country first and change the format to match.", "why": "Field order, postcode presence, labels and patterns all vary by country. Use location to preselect the country only.", "kind": "principle", "source": "Coyle, Start"}, {"rule": "Don't add a state or region field by habit.", "why": "Etsy's US-centric form led German users to type nonsense into the state field, and some parcels went to the US.", "kind": "evidence", "source": "Grenier, Etsy"}, {"rule": "Address lookup must always offer manual entry and editable results.", "why": "Services don't cover every address, so never trap people in search.", "kind": "caution", "source": "Start, Coyle"}, {"rule": "Model address formats as data per country, not as code full of conditionals.", "why": "One record per country drives entry and display order, separators, required fields and labels.", "kind": "technique", "source": "Grenier, Etsy"}], "sourcesDiffer": ["UX Planet wants one date field with auto-advance, a floating label and validation as people type; default: three labelled boxes, no auto-advance, validate on submit.", "GOV.UK uses labelled address lines with postcode lookup for UK services; Dutton prefers one box; default: GOV.UK's lines for UK-only services needing structured data, one box plus country for international or free-form addresses.", "Primer switches to an absolute date after a month; Calvo wants absolute dates wherever provenance matters; default: Calvo for evidence, Primer's thresholds elsewhere."], "tryIt": "Pick one date field and one address form in your product. Check that dates are typed or picked by distance, months display as words, and the address form adapts to a non-UK country.", "quiz": [{"q": "A form asks for date of birth with a calendar picker that opens on today's month. What is the better input?", "options": ["A scrolling wheel picker", "Three dropdowns for day, month and year", "Three labelled text boxes for day, month and year", "A single field with an auto-advancing mask"], "answer": 2, "explain": "Known distant dates are faster typed; brain uses three labelled boxes."}, {"q": "A payments history shows \"3 weeks ago\" on every transaction. What should change?", "options": ["Show absolute dates, since transactions are evidence", "Nothing, relative dates are friendlier", "Use micro forms like \"3w\"", "Show dates only on hover"], "answer": 0, "explain": "Anything that is evidence, such as transactions, shows the absolute date, reachable without hover."}, {"q": "A checkout serves several countries and always shows a required State field. What should you do?", "options": ["Keep it required for consistency", "Make it a free-text field for everyone", "Ask for country first and show region only where that country uses it", "Remove the country field"], "answer": 2, "explain": "Regions vary by country, and wrong fields create wrong data; country first, then the matching format."}]}, {"id": "m03-l7", "title": "Wizards, task lists, check answers", "neuron": "wizards-and-progress", "intro": "Long tasks need structure without trapping people. Use a wizard only for infrequent, linear tasks, a task list for long ones, and always let people check and change their answers before committing.", "points": [{"rule": "Use a wizard for infrequent, linear tasks with dependencies, and keep fewer than 7 steps visible.", "why": "Show the current position and what's left. More than 5 to 7 steps means the flow needs restructuring; treat 8 as a hard ceiling.", "kind": "principle", "source": "NN/g, Uxcel"}, {"rule": "A wizard is never the only route.", "why": "Experts and people repeating the task need a faster way, such as one editable form. Wizards also block comparing across steps and bulk entry.", "kind": "caution", "source": "Budiu, NN/g"}, {"rule": "Move forward in order; go back freely without losing data or showing errors.", "why": "Data persists between steps and is never asked for twice (WCAG 3.3.7). Save progress so people can leave and come back.", "kind": "principle", "source": "Budiu, WCAG"}, {"rule": "End with a check-answers page where every answer has its own Change link.", "why": "Each link opens a page with just that question. Skip it only for short, low-stakes, easily reversed wizards.", "kind": "technique", "source": "GOV.UK"}, {"rule": "Buttons name the outcome: \"Continue to payment\", and \"Publish\" rather than \"Finish\".", "why": "Earlier steps say where they lead; the last says what is committed, ideally with a preview of the result.", "kind": "default", "source": "Budiu, Creative Navy"}, {"rule": "For long, high-stakes tasks, use a task list page with a status per task.", "why": "Use it only with evidence people can't finish in one sitting or need to choose order. The whole row is the link, and statuses are words.", "kind": "technique", "source": "GOV.UK"}, {"rule": "Prefer an honest step count to seeded or decorative progress bars.", "why": "Use one indicator only. A bar that barely moves is a sign the wizard is too long.", "kind": "caution", "source": "GOV.UK, Lollypop"}, {"rule": "Replace interruption pages with a normal question using radios.", "why": "A warning panel with two buttons stops the journey; a question makes the choice deliberate.", "kind": "technique", "source": "GOV.UK"}, {"rule": "Order steps easiest first and put reassurance before anxious steps.", "why": "Stressed people don't read instructions on the step itself. Move friction after the first real value, and test the order against the mental model.", "kind": "principle", "source": "Deshmukh"}, {"rule": "Help people resume, not just restart.", "why": "On return, show where they were and what they chose, and say up front they can come back.", "kind": "technique", "source": "Lollypop, Eleken"}], "sourcesDiffer": ["Creative Navy disables Next until a valid choice is made; default: keep Next enabled and explain on press.", "Eleken validates inline; default: validate each step when Continue is pressed.", "Some Smashing authors seed progress bars partly filled; GOV.UK discourages progress bars in forms; default: an honest step count.", "Kaplan praises jumping to any step; default: forward in order for consumer flows, jumping from a visible map in expert tools whose steps don't depend on each other."], "tryIt": "Map one multi-step flow you own: count the steps, check the back behaviour and the last button label, and sketch a check-answers page with a Change link per answer.", "quiz": [{"q": "A 12-step onboarding wizard has a progress bar that barely moves. What does the guidance suggest?", "options": ["Restructure the flow, perhaps into a task list", "Seed the bar at 30% to feel faster", "Add a second step tracker", "Add a congratulations page at the end"], "answer": 0, "explain": "More than 5 to 7 steps needs restructuring; a stalled bar signals a too-long wizard, and a task list suits long tasks."}, {"q": "Power users complete the same set-up wizard several times a week. What should you add?", "options": ["Nothing; consistency matters", "A faster non-wizard route, such as one editable form", "Swipe navigation", "Autoplay through steps"], "answer": 1, "explain": "A wizard is never the only route; repeat users need a faster path."}, {"q": "What should the final button of a listing wizard say?", "options": ["Finish", "Next", "Submit form", "Publish listing"], "answer": 3, "explain": "The last step names what is committed."}]}, {"id": "m03-l8", "title": "Rule builders", "neuron": "rule-builders", "intro": "Rule builders let people write logic the system then runs, so mistakes are silent and costly. Make each condition readable, show how they combine, and keep saving separate from switching on.", "points": [{"rule": "Use a rule builder when conditions are unknown in number and kind.", "why": "If text search finds what people need, or every query uses the same variables, a fixed form is simpler. Design for occasional, non-technical users.", "kind": "principle", "source": "Toxboe and Barrett, UI-Patterns"}, {"rule": "Stack one condition per row, reading field, operator, value.", "why": "The value input and operators change with the field's type. Start with one empty row in an ALL group, not a blank canvas.", "kind": "technique", "source": "UI-Patterns, Swif"}, {"rule": "Let one row take several values with \"is any of\".", "why": "Chips in one row beat a stack of OR rows for the same field.", "kind": "technique", "source": "Vercel, Gorgias"}, {"rule": "Keep nesting to one level, and show how grouped conditions combine.", "why": "Deeper trees are hard to read. Use brackets or inset groups, plain \"and\" and \"or\" connectors, and never delete conditions when switching ALL and ANY.", "kind": "principle", "source": "Swif, Bryter"}, {"rule": "Separate If from Then, and always say what happens otherwise.", "why": "A fallback for anything no rule catches avoids silent gaps.", "kind": "principle", "source": "Typeform, Calendly"}, {"rule": "Read the rule back as a sentence.", "why": "A live summary lets people check the logic without parsing rows and doubles as the rule's description in the list.", "kind": "technique", "source": "ClickUp"}, {"rule": "An empty group is an error, not \"no filter\".", "why": "An empty group never matches, so it can make the whole rule unmatchable. Block saving with an error naming the group.", "kind": "caution", "source": "Usertour"}, {"rule": "Save and switch on are separate decisions.", "why": "A new rule stays off until complete, and \"Turn on rule\" explains what is missing. Confirm in place, never with a toast alone.", "kind": "default", "source": "Jira, Airtable"}, {"rule": "Test rules before they touch real cases, and ask what happens to existing records.", "why": "Run scenarios without deploying, and let people choose how matching existing records are handled rather than applying silently.", "kind": "technique", "source": "uFlow, Quicken"}, {"rule": "Record every run and edit, and land AI-drafted rules in the same editable builder.", "why": "An audit log shows who changed what and which cases it affected; templates and AI drafts must be checkable condition by condition.", "kind": "technique", "source": "Jira, Confluence"}], "sourcesDiffer": ["Rivers praises Apple's mixed \"Match all\" with nested \"any\" groups; a reader found it confusing; default: one level of groups with plain connectors and a sentence read-back.", "uFlow says drag-and-drop visual flows make engines usable by non-technical teams; form-based rows do the same; default: condition rows for a single decision, a card chain for multi-step rules, drag and drop always with a keyboard alternative."], "tryIt": "Take one automation or filter screen and add a sentence read-back and an \"otherwise\" outcome. Check what happens if a user saves an empty group.", "quiz": [{"q": "A user saves a rule with an empty OR group beside an AND condition. What should happen?", "options": ["Treat the empty group as \"no filter\"", "Save silently and log a warning", "Block saving with an error naming the empty group", "Delete the empty group automatically"], "answer": 2, "explain": "An empty group never matches, so it is an error to catch on save."}, {"q": "Users keep adding three OR rows: State is MA, State is NH, State is VT. What is the better design?", "options": ["A nested group for each state", "One row: State is any of MA, NH, VT", "A free-text query box", "A separate rule per state"], "answer": 1, "explain": "One row taking several values is simpler than stacked OR rows for one field."}, {"q": "A new automation is switched on the moment the user saves a draft. What should change?", "options": ["Keep save and turn on as separate actions, with the rule off until complete", "Show a success toast", "Ask for confirmation in a modal", "Disable the save button"], "answer": 0, "explain": "Saving and switching on are separate decisions; confirm in place when it is on."}]}]}, {"id": "m04", "title": "Actions, feedback and states", "summary": "How to design buttons, confirmations, calls to action, screen states, errors, overlays and menus so people always know what will happen, what is happening and how to recover.", "neurons": ["actions-and-feedback", "action-patterns", "calls-to-action", "states-and-loading", "overlays-and-messages", "tooltips-popovers-and-menus"], "lessons": [{"id": "m04-l1", "title": "Buttons and actions", "neuron": "actions-and-feedback", "intro": "Buttons are promises: their style says how important an action is and their label says what will happen. Get the hierarchy, wording and states right and people act with confidence instead of guessing.", "points": [{"rule": "Have one primary action per view; secondary as outline, tertiary as a link.", "why": "Keeping the number of buttons low keeps the main action dominant. When actions are of equal weight and secondary to the content, neutral buttons alone are fine.", "kind": "default", "source": "Salesforce Lightning, Ant Design"}, {"rule": "Label buttons with the outcome: 'Save and continue', not 'Next'; 'Close', not 'OK'.", "why": "High-stakes buttons state the exact consequence ('Confirm £400 transfer'). Labels that only make sense in context, idioms and slang cause wrong choices.", "kind": "default", "source": ""}, {"rule": "Use a button when it changes data and a link when it only changes the view.", "why": "If a sensible URL could sit behind it, it is a link. Never style one as the other: link-styled buttons and button-styled links break expectations and voice control.", "kind": "default", "source": "Maassen, Paste"}, {"rule": "Loading buttons keep their label and width, and stay focusable with aria-disabled.", "why": "Disabling during loading loses keyboard and assistive-technology users, and a box that changes size pushes neighbours. Block repeat submits in script instead.", "kind": "technique", "source": "Helios, arla6ka"}, {"rule": "Disable only when people can make the action available, and explain how in visible text.", "why": "Hide controls that will never be usable for this role or state. Otherwise leave the button enabled and, on press, say why they can't continue and what to do.", "kind": "default", "source": "Panagiotidi, Silver"}, {"rule": "Show disabled with lower opacity of the button's own colour, not grey.", "why": "A grey button can be mistaken for a low-priority secondary action such as Cancel.", "kind": "technique", "source": "Panagiotidi"}, {"rule": "Give press feedback on pointer-down, within about 100–150ms; delay hover by about 150–200ms.", "why": "Slow focus or pressed states make people tab past or press again, while an instant hover fires on a passing pointer. A press scale of 0.96–0.97, never below 0.95, suits buttons. Timings are indicative.", "kind": "evidence", "source": "Gordon, NN/g; Kowalski"}, {"rule": "Keep style and state as separate layers, and design every state for every style.", "why": "Style (primary, secondary, tertiary) shows importance and never changes; state (hover, focus, pressed, loading, disabled) shows the current interaction. Look-alike states cause mistakes.", "kind": "principle", "source": "Gordon, NN/g"}, {"rule": "Keep the primary action in the same place from step to step.", "why": "Fast users tap where the button used to be, and animation doesn't fix a moving target. Don't repeat one primary label across steps, or people feel they aren't progressing.", "kind": "principle", "source": "Koch; Jarrett"}, {"rule": "Use one verb per action across the product, and give repeated buttons unique accessible names.", "why": "If it's 'Edit' on one page, don't say 'Change' elsewhere. Twenty 'Edit' buttons need hidden context such as 'Edit home address'.", "kind": "technique", "source": "Helios, Paste, Canvas"}], "sourcesDiffer": ["Cancel: brain makes it a link after the primary on page-level forms; Uxcel and platform norms make it a secondary button. Default: a link after page forms, a secondary button inside dialogs and sheets.", "Primary position: Helios and Paste put the primary first on the left; Atlassian, Primer and brain put the dialog primary rightmost. Default: page forms primary left with Cancel as a link; dialogs primary rightmost; wizards Next right; apply it consistently.", "Trailing icons: brain says icons lead; Calvo gives trailing icons meaning. Default: leading icons, trailing only for a chevron, an external-link mark or a forward arrow on a step button.", "Toggle labels: the ARIA APG keeps a static label with aria-pressed; Budiu and Apple change the label to name the next action. Default: static label with aria-pressed, or swap the name and drop aria-pressed, never both."], "tryIt": "Take one busy screen and list every button with its style, label and states. Rewrite any label that doesn't name its outcome and remove any second primary.", "quiz": [{"q": "A 'Save' button is pressed and the request takes two seconds. What should the button do?", "options": ["Switch to native disabled and swap its label for a spinner", "Show an indicator, keep its label and width, and block repeats with aria-disabled", "Disappear until the request finishes", "Stay unchanged and show a toast when done"], "answer": 1, "explain": "Loading buttons keep their label and box size and stay focusable; native disabled drops keyboard and assistive-technology users."}, {"q": "A 'Publish' button can't be used until the person adds a title. What is the brain's default?", "options": ["Grey it out until the title exists", "Hide it until the title exists", "Explain it in a tooltip on the disabled button", "Leave it enabled and, on press, say a title is needed"], "answer": 3, "explain": "The brain never pre-disables submit-style actions; it explains on press, or shows visible helper text next to the control."}, {"q": "Which element should 'View invoice', which opens the invoice detail, be?", "options": ["A link, because it only changes the view", "A primary button, because it's important", "A ghost button styled as a link", "A button, because script handles it"], "answer": 0, "explain": "A link changes only the view and a button changes data; if a sensible URL could sit behind it, it's a link."}]}, {"id": "m04-l2", "title": "Confirm, undo and delete", "neuron": "actions-and-feedback", "intro": "Confirmation dialogs only work when they are rare and unexpected; used everywhere, people approve them blindly. Match the protection to how costly and reversible the action is, and prefer undo for routine work.", "points": [{"rule": "Prefer undo to confirmation; confirm only destructive, irreversible or high-stakes actions.", "why": "Undo, revision history and audit logs protect routine actions without friction. Confirmations everywhere cause alert fatigue and train blind approval.", "kind": "default", "source": ""}, {"rule": "Scale friction by impact and reversibility.", "why": "Low impact and reversible: just do it and log it. High impact but reversible: notify and keep a review trail. High impact and irreversible: preview and ask.", "kind": "principle", "source": "Smashing"}, {"rule": "Escalate the check with the stakes, from a named dialog up to re-authentication.", "why": "In rising order: a dialog naming the action, typing the object's name, re-authentication, a second channel, then a second person's approval.", "kind": "technique", "source": "Ponamariov, Paste, Ant Design"}, {"rule": "Build destructive dialogs from four parts: question, consequence, way out, matching verb.", "why": "The heading names the action and object ('Discard new budget?'), the body states the consequence, and the button repeats the verb so people who read only buttons still know what happens.", "kind": "technique", "source": "Bexiga, Yifrah"}, {"rule": "Never use 'Cancel' as the way out of a cancel or delete dialog.", "why": "It makes a double negative. Use the opposite of the action: 'Keep it', 'Stay', 'Back'.", "kind": "caution", "source": "Yifrah, Bexiga"}, {"rule": "Never give Enter or initial focus to the destructive button.", "why": "People press prominent buttons without reading. Put initial focus on the safe option or the heading.", "kind": "caution", "source": "Apple HIG, Panagiotidi"}, {"rule": "Protect the step that actually destroys, not the link that starts the flow.", "why": "Don't hide or red-fill the starting link; red implies it happens at once. Keep it quiet and use a filled danger button only inside the confirmation.", "kind": "principle", "source": "Quartz, Refactoring UI"}, {"rule": "Make undo real in the data: soft delete with a stated, fixed grace period.", "why": "Gmail's undo send gives a 20-second window. If an action can't be reversed, delay it so it can be stopped. 'Are you sure?' doesn't replace undo.", "kind": "technique", "source": "bencium, Panagiotidi, Wayne"}, {"rule": "Label an X that might mean cancel, or make it save and close.", "why": "An unlabelled X can mean discard or keep and leave. Use words such as Cancel and Apply, or save on close and say so. 'When in doubt, save, then out.'", "kind": "technique", "source": "Harley, NN/g; Rosala, NN/g"}, {"rule": "Back follows the path taken, preserves state and is never hijacked.", "why": "Never reset progress or trap people on a page. If a form can't survive Back, warn before leaving and let people stay.", "kind": "principle", "source": "Rosala, NN/g"}], "sourcesDiffer": ["Confirm before every delete: ui-ux-pro-max treats a missing 'Are you sure?' as high severity; brain and Paste prefer undo and confirm only medium and high stakes. Default: brain's.", "Type-to-confirm: Ponamariov keeps the confirm button disabled until the name is typed; brain never pre-disables. Default: leave it enabled and say what to type, or aria-disabled with helper text.", "Learn-more link in a destructive dialog: Panagiotidi adds one; Uxcel says a third action pulls people out. Default: state key losses in one line, or an in-dialog disclosure, never a link that navigates away.", "Save model: brain auto-saves long forms; Lenard made the commit explicit where it triggered downstream processes. Default: auto-save drafts; explicit commit when it sets off downstream processes."], "tryIt": "List every committing action in a product you work on, not just deletes. Place each in the impact and reversibility grid and decide undo, notify or confirm.", "quiz": [{"q": "People archive dozens of emails a day, and archiving is reversible. What protects them best?", "options": ["A confirmation dialog for each archive", "Type the subject line to confirm", "Archive at once with a visible Undo", "Disable archive until an item is opened"], "answer": 2, "explain": "Frequent, reversible actions get undo; confirmations for repeated actions train blind approval."}, {"q": "Which button pair suits a dialog titled 'Cancel subscription?'", "options": ["'Cancel' and 'OK'", "'Keep subscription' and 'Cancel subscription'", "'No' and 'Yes'", "'Cancel' and 'Cancel subscription'"], "answer": 1, "explain": "The way out is the opposite of the action and the decision button repeats the heading's verb, avoiding a double-negative 'Cancel'."}, {"q": "A 'Delete workspace' action is irreversible and affects teammates. Where should the strongest protection sit?", "options": ["On the confirmation step, with typing the name or re-authentication", "On a red-filled link at the top of settings", "Hidden in a submenu so few people find it", "In a toast after deletion"], "answer": 0, "explain": "Protect the step that destroys and escalate the check with the stakes; the starting link stays quiet rather than hidden or red."}]}, {"id": "m04-l3", "title": "Calls to action", "neuron": "calls-to-action", "intro": "A call to action wins through contrast with its neighbours, a clear promise and a well-chosen moment, not sheer size or colour psychology. Most CTA sources are written for marketing pages; inside product UI the core button rules govern.", "points": [{"rule": "Give the CTA weight through contrast with its neighbours, not absolute size.", "why": "Size against other actions, colour against the background and space around it decide importance. A big button disappears in a crowded hero; a plain one with room stands out.", "kind": "principle", "source": "Gube, Scacca"}, {"rule": "Make sure the biggest button is the primary.", "why": "A large target attracts clicks whether meant or not. Nothing utilitarian, such as 'Back to top' or a cookie control, should outrank the main CTA.", "kind": "principle", "source": "Murphy; Ceros"}, {"rule": "Promise only what happens next, and only what you control.", "why": "A 'Book now' that leads to choosing a room should say 'Show rooms'; 'Send code' is safer than 'Get code', because delivery isn't in your hands.", "kind": "principle", "source": "Silyanova"}, {"rule": "Lead with a verb plus object in 2 to 4 words; never OK, Submit or 'Click here'.", "why": "'Send message', 'Start free trial'. A label should make sense after both 'Would you like to…' and 'I would like to…'. Length guidance is indicative.", "kind": "technique", "source": "Hall; Greer"}, {"rule": "Answer the hesitation in a short, true line beside the button.", "why": "People expect cost, effort, time or a catch. 'No card needed' or 'Takes 2 minutes' removes it; keep the label short and the reassurance outside it.", "kind": "technique", "source": "Gube, Tubik"}, {"rule": "Repeat one goal down a long page rather than adding different CTAs.", "why": "Several different CTAs lengthen the decision and dilute the measure of success. A second CTA is fine only when it serves a distinct user goal.", "kind": "principle", "source": "Ceros; Forge and Smith"}, {"rule": "Use ghost buttons only as secondaries, never as the primary.", "why": "Across 7 tests ghost primaries were very likely worse, with a meta-analysis of −2.8% (indicative). Never put them over photos or video; outline at 3:1 and text at 4.5:1.", "kind": "evidence", "source": "GoodUI #77; Scacca"}, {"rule": "Never use red for a primary CTA, and use urgency only when it is true and specific.", "why": "Material, Apple and GOV.UK keep red for errors and destruction. Fake urgency is a dark pattern; a real deadline goes beside the button, never shouted in caps.", "kind": "caution", "source": "Sandeepani"}, {"rule": "Don't give the business's preferred option the heavier style when both are real choices.", "why": "A 25% tip as a button with 10% as a link is a nudge and a dark pattern. Genuine consent and opt-in choices get equal weight.", "kind": "default", "source": "Maassen; Deshmukh"}, {"rule": "Test one variable at a time and measure what follows the click.", "why": "SEEK's solid and ghost buttons had similar click-through but different conversion, so clicks alone can crown the wrong variant.", "kind": "evidence", "source": "Scacca; Forge and Smith"}], "sourcesDiffer": ["Above the fold or after the case: Forge and Smith list many high-converting spots; Tubik and Ceros put the CTA after the case. Default: landing pages carry the CTA on the first screen and repeat it after each block; in product flows the action follows the content it acts on.", "Sticky CTAs: GoodUI #41 found no reliable win across 29 tests; one retailer reported a 78% lift (indicative). Default: keep the action reachable and test a sticky version before shipping.", "Ghost buttons: Maassen says avoid them; Scacca supports them as secondaries. Default: an outlined secondary with visible border and contrast is fine; a faint ghost or any ghost primary is not.", "First-person labels: some skills prefer 'Start my trial'. Default: no pronoun; 'my' only for the person's own item."], "tryIt": "Rewrite the main CTA on one landing page so it names the real next step, then add one true reassurance line beside it.", "quiz": [{"q": "A hotel site's 'Book now' button leads to a page for choosing a room. What label fits better?", "options": ["'Book now!'", "'Submit'", "'Show rooms'", "'Get started'"], "answer": 2, "explain": "Promise only what happens next: the click shows rooms, so the label should say so."}, {"q": "A team wants a transparent outlined button as the hero CTA over a video background. What's the best advice?", "options": ["Fine, if the outline is thin enough to look elegant", "Use a filled primary; ghost buttons suit secondaries on plain backgrounds", "Make it red to stand out from the video", "Make it larger so it still dominates"], "answer": 1, "explain": "Ghost primaries lost in testing and fail over shifting backgrounds; the primary should be filled."}, {"q": "Sign-ups stall because visitors wonder if a card is needed. What should change first?", "options": ["Add 'No card needed' as a short line beside the button", "Put 'Sign up free with no card required today' in the button", "Add a countdown timer", "Add three more CTAs down the page with different labels"], "answer": 0, "explain": "Answer the hesitation next to the button and keep the label short; different CTAs dilute the decision."}]}, {"id": "m04-l4", "title": "Screen states and loading", "neuron": "states-and-loading", "intro": "Every screen has more states than the happy path, and each needs a next step. Loading should feel honest and calm: show structure early, say what is happening and never fake precision.", "points": [{"rule": "Design every state: loading, empty, partial, dense, error, offline, permission denied, long and short content.", "why": "For each, ask what people see, what they can do and how they recover. Every state needs a way out, and every screen a next step or recovery path.", "kind": "principle", "source": "fortify, Dean"}, {"rule": "Choose the loader by what matters: skeleton for structure, spinner for activity, bar for duration.", "why": "Skeletons are for content, not processes; uploads and exports get a progress bar. An endless spinner on measurable work reads as broken.", "kind": "technique", "source": "UI State Expander; Tankala, NN/g"}, {"rule": "Delay a spinner by 150–300ms and, once shown, keep it for 300–500ms.", "why": "Fast loads then show nothing and wait for nothing, while slow ones don't flicker. Never delay ready content for effect.", "kind": "technique", "source": "Wichary"}, {"rule": "Match skeletons to the final layout exactly, and skip them for near-instant loads.", "why": "A matching skeleton stops content shifting; under about 200ms it flickers like a glitch. No frame-only skeletons, a gentle pulse, and off under reduced motion.", "kind": "technique", "source": "Tankala, NN/g; Checklist Design"}, {"rule": "Say what's happening with a verb and the specific item, not 'Loading'.", "why": "'Syncing your emails' beats 'Processing'. Above about 10 seconds with no estimate, show the current step and steps done and remaining. Show only steps that are real.", "kind": "technique", "source": "Smashing; Kaplan, NN/g"}, {"rule": "Give feedback in place: the control that started an action shows its progress and result.", "why": "Save turns into a spinner, then a tick, where people are already looking. Do it the same way everywhere so people learn where feedback appears.", "kind": "default", "source": "Head"}, {"rule": "Pace progress honestly and let people cancel or run long work in the background.", "why": "90% in five seconds then five minutes for the rest feels deceptive. Estimates are ranges, not a jumping clock; offer cancel throughout.", "kind": "principle", "source": "Apple HIG; Babich; Kaplan, NN/g"}, {"rule": "Give every request a timeout and treat a timeout as unknown, not failed.", "why": "Say 'taking longer than expected' at about 15s and stop the spinner at about 60s with retry (indicative). Don't say 'failed' until confirmed; prevent duplicates.", "kind": "technique", "source": "Open Design craft; Balise"}, {"rule": "Keep the six kinds of nothing distinct: pending, absent, empty, zero, false and failed.", "why": "A failed load shown as 'No results' misleads. Show empty only after the request resolves; keep previous results while a search updates.", "kind": "caution", "source": "Huryn; Balise"}, {"rule": "Stress-test with plausible worst-case data, never random strings.", "why": "Long names, unbreakable emails, counts of 0, 1 and 1,000+, non-Latin text, extreme amounts, at 320px and 200% zoom. Never truncate amounts or dates.", "kind": "technique", "source": "Kowalski"}], "sourcesDiffer": ["Minimum spinner time: Wichary says never add an artificial minimum wait; brain keeps a shown spinner for 300–500ms. Default: the show delay means fast loads wait for nothing; the minimum applies only once a spinner has appeared.", "Skeletons versus spinners: Tankala keeps skeletons for full-page loads of about 2–10 seconds; NN/g's glossary limits spinners to under about 3 seconds. Default: a skeleton for any content area with known layout, a small spinner otherwise; start saying what's happening at about 3 seconds.", "Wait thresholds: graduated messages start at 0–3s; NN/g's limits are about 0.1s, 1s and 10s. Default: Uxcel and NN/g timings, with the others as a cross-check.", "Announcing completion: Kaplan keeps success modals; default is a persistent non-modal notice plus activity history."], "tryIt": "Pick one screen and write its state inventory: each state, what people see, what they can do and how they move on. Mark any state that has no exit.", "quiz": [{"q": "A report export takes about 40 seconds and its progress is measurable. What's the right treatment?", "options": ["A full-page spinner until it finishes", "A skeleton of the report layout", "An indeterminate spinner on the button", "A determinate progress bar with specific status text and a way to cancel or carry on"], "answer": 3, "explain": "Measurable work gets a progress bar; long waits need specific text and should let people cancel or run in the background."}, {"q": "A search request fails, and the list shows 'No results'. What's wrong?", "options": ["Nothing, if the copy is friendly", "A failed state is shown as empty, which misleads people", "It should show a spinner forever instead", "It needs an illustration"], "answer": 1, "explain": "Failed and empty are different kinds of nothing; collapsing them sends people the wrong next step."}, {"q": "Most loads on a page finish in under 150ms but some take 2 seconds. How should the spinner behave?", "options": ["Show it only after a 150–300ms delay, then keep it at least 300–500ms", "Always show it for at least one second", "Never show any indicator", "Show a skeleton on every load, however fast"], "answer": 0, "explain": "The show delay hides fast loads, and the minimum time stops flicker once a spinner has appeared."}]}, {"id": "m04-l5", "title": "Errors and empty states", "neuron": "states-and-loading", "intro": "An error message is a recovery tool, not a verdict, and an empty state is a starting point, not a void. Both should say what happened and give one clear way forward.", "points": [{"rule": "Say what happened, why and what to do next, beside where it broke.", "why": "Lead with the action in one or two sentences. With room, add what happens if it isn't fixed. An error with no recovery path is always high severity.", "kind": "principle", "source": "Uxcel, Paste, Krehel"}, {"rule": "Mark errors with at least three cues, such as text, an icon and a border.", "why": "This extends never colour alone. Keep those cues for errors and warnings only, at AA contrast.", "kind": "default", "source": "Neusesser and Sunwall, NN/g"}, {"rule": "Keep the wrong input, name it in the message and offer the likely fix as one tap.", "why": "Never clear what people typed. A town that doesn't match the postcode gets a button with the matching town.", "kind": "technique", "source": "Neusesser and Sunwall, NN/g"}, {"rule": "No blame words, no 'Oops', no exclamation marks, no ALL CAPS.", "why": "Avoid 'invalid', 'illegal' and accusing 'you'. Put the system's rule first ('Same-day delivery starts at £35'), not the person's shortfall.", "kind": "caution", "source": "Neusesser and Sunwall, NN/g; Krehel"}, {"rule": "Recover by who can fix it: full, partial or no control.", "why": "Full: name the field and format. Partial: next step and timeframe. None: acknowledge it, confirm what's safe ('Your money hasn't been taken') and say when you'll update. 'Try again' alone isn't recovery.", "kind": "technique", "source": "Ogaga, Mind the Product"}, {"rule": "Match error scope to the failure, and retry only what failed.", "why": "Field, form, section, page and app errors each get their own treatment. A failed section shows an inline retry while the rest works; never collapse an error into an empty state.", "kind": "principle", "source": "Open Design craft"}, {"rule": "Cap retries, then route to support with a copyable error ID.", "why": "Later automatic retries back off (about 2s, 4s, 8s); after three failures, swap Retry for 'Contact support' with the ID. Timings are indicative.", "kind": "technique", "source": "Open Design craft; Calvo"}, {"rule": "Empty states say what goes here, why it's empty and the one action that fills it.", "why": "The button continues the sentence ('Your basket is empty' plus 'Start shopping'). A filtered empty state names the query and offers 'Clear filters'.", "kind": "principle", "source": "Uxcel; Kaplan, NN/g"}, {"rule": "Give each cause of emptiness its own copy: first use, cleared, no results, error, no permission, stale.", "why": "One generic empty state is a defect. Cleared states can reward ('You're all caught up'); no-results states need recovery such as removing one filter.", "kind": "principle", "source": "Uxcel; UI State Expander"}, {"rule": "Keep not found and no permission as different screens, with at least two routes onward.", "why": "Otherwise a permissions problem is reported as data loss. 404 pages need search, key links and a route home; dead ends aren't fine.", "kind": "caution", "source": "Calvo; Uxcel"}], "sourcesDiffer": ["When errors appear: Kaplan says never before people could finish; Neusesser and Sunwall allow real-time errors for often-wrong fields. Default: validate on submit; real-time help only as a requirements checklist.", "Apologising: brain's 404 rule asks for a plain apology; frontend-design says never apologise; Paste keeps 'sorry' for real harm. Default: no apology for errors people can fix; a short one when the service failed them or lost work.", "Humour after total failure: Neusesser and Sunwall suggest something pleasant; default keeps jokes out, except possibly a low-stakes consumer outage page.", "Empty-state art: Quartz bans art and centred blocks; brain allows a spot illustration with about 300px of space. Default: brain's for first-use full pages; Quartz's top-left, no-art version for no-results and filtered states in tables and dense tools."], "tryIt": "Collect five error messages from your product and score them on the NN/g rubric (visibility, communication, efficiency, 1–4 each). Rewrite the lowest scorer.", "quiz": [{"q": "A payment provider is down and the person can't fix it. What should the message include?", "options": ["'Invalid payment. Try again.'", "'Oops! Something broke!'", "A bare error code", "An acknowledgement, confirmation that no money was taken and when you'll update"], "answer": 3, "explain": "With no control, acknowledge the problem, confirm what's safe and say when you'll update; 'try again' alone isn't recovery."}, {"q": "One dashboard card fails to load while the others work. What should it show?", "options": ["An inline error with retry inside that card", "A page-level error replacing the whole dashboard", "An empty state saying 'No data yet'", "A modal explaining the failure"], "answer": 0, "explain": "Match error scope to the failure; a failed section gets an inline retry while the rest keeps working, never an empty state."}, {"q": "A filtered table returns nothing. What's the best empty state?", "options": ["A large illustration with 'Nothing here'", "The first-use message 'Create your first item'", "Name the query and offer 'Clear filters' or removing one filter", "A generic 404 page"], "answer": 2, "explain": "No-results is its own cause and needs recovery: name the query and offer a way back."}]}, {"id": "m04-l6", "title": "Modals, drawers and messages", "neuron": "overlays-and-messages", "intro": "A page is the default; overlays must earn their interruption. Choose the container by the size of the task, and put messages where people are already looking rather than in toasts that vanish.", "points": [{"rule": "Default to a page; reach for a modal only for short decisions that must be settled first.", "why": "Ask in order: ignorable, small inline edit, long task, needs the background, must be settled first. Long, multi-step or reading-heavy work is a page; a sub-task needing the list in view is a drawer.", "kind": "principle", "source": "Friedman, Neufeld, Fessenden"}, {"rule": "Never use modals for errors, onboarding, announcements, multi-step tasks or surprise promos.", "why": "Irrelevant modals teach people to ignore all modals. If people could reasonably ignore it, it isn't a modal.", "kind": "caution", "source": "Fessenden, NN/g; Mondal"}, {"rule": "Keep modals to one job, about three fields, no scrolling and at most two buttons.", "why": "A scrolling modal belongs on a page or in a drawer. The title carries the whole message ('Discard draft?', not 'Warning') and the buttons answer it.", "kind": "technique", "source": "Uxcel; Faruqi; Mondal"}, {"rule": "Never stack modals.", "why": "A second modal signals an information architecture problem. Replace the content, use steps in one modal, or move to a drawer or page; the one exception is a short 'discard changes?' confirmation.", "kind": "caution", "source": "Mueller"}, {"rule": "Escape, Close and Cancel always work; block backdrop clicks when work or a destructive choice is at stake.", "why": "Trap focus and return it to the trigger on close. Escape closes only the topmost layer. Native dialog with showModal() handles most of this.", "kind": "technique", "source": "arla6ka; Faruqi"}, {"rule": "Keep the same modality at every breakpoint; on phones, use a bottom sheet with a visible Close.", "why": "A non-modal desktop panel that becomes a full-screen modal forces a response desktop didn't. Many people miss the grabber, so sheets also need a Close button.", "kind": "principle", "source": "Fessenden; Laubheimer, NN/g"}, {"rule": "Give feedback in place; never use toasts for errors or for Undo people must catch.", "why": "Toasts disappear, cover content and sit far from the action. Updating the control people just used shows the change where they look.", "kind": "default", "source": "Adam Silver; Friedman"}, {"rule": "If you must use a toast, show it at least 6 seconds, pause it and let people extend it.", "why": "Auto-dismissing toasts fail WCAG 2.2.1. Pause on hover, focus and a hidden tab; never auto-dismiss a toast with a link or button.", "kind": "default", "source": "Byrne-Haber; Friedman; arla6ka"}, {"rule": "Pick the message by urgency: persistent alert, warning, transient confirmation or badge.", "why": "Action needed now gets a persistent alert; information only, a transient confirmation. Red only when something went wrong; never style information as a warning.", "kind": "principle", "source": "Uxcel; Kaplan, NN/g"}, {"rule": "Time overlays by what people just did: never before content loads or straight after login.", "why": "Email sign-ups come after a meaningful moment, non-modal. Cookie consent offers accept, reject and manage with equal weight, one overlay at a time.", "kind": "principle", "source": "Kaley, NN/g; Tankala, NN/g"}], "sourcesDiffer": ["Toast duration: brain gave 4–6s; Byrne-Haber's floor is 6s; Friedman caps at 7s; Paste uses 500ms per word. Default: at least 6s, paused and extendable, lengthened for longer text.", "Stacking: brain says never; Eleken allows a second layer as a natural extension. Default: never, except a short discard confirmation that returns people unchanged.", "Overlay URLs: Saasfactor says modals change neither URL nor history; Maassen gives content overlays URLs. Default: short decision modals get none; a drawer showing a viewable object gets a URL and Back closes it.", "Forms in drawers: Helios keeps forms out of flyouts; brain edits a record in a drawer beside its list. Default: drawer when people need the list in view, otherwise follow Helios.", "Error toasts: Paste and Helios allow some; default keeps the firm rule, never a toast for errors."], "tryIt": "Run three overlays in your product through the seven-step decision guide. For any that fail, sketch the page, drawer or inline alternative.", "quiz": [{"q": "People edit records in a list and need to glance back at other rows while editing. What container fits?", "options": ["A centred modal", "A drawer or side panel beside the list", "A toast with an edit link", "A second modal over the first"], "answer": 1, "explain": "When people need the background while they work, use a drawer that keeps the list's filters, sort and scroll."}, {"q": "A save fails because the server is unreachable. How should this be shown?", "options": ["A toast that disappears after 3 seconds", "A modal that blocks the page", "A message in place beside the action, with a way to retry", "Nothing, and retry silently forever"], "answer": 2, "explain": "Errors never go in toasts; feedback belongs in place, where people can act on it."}, {"q": "A confirmation needs to appear while an edit modal is open. What's acceptable?", "options": ["A short 'discard changes?' confirmation that returns people to the edit modal unchanged", "A full second modal with its own form", "Closing the edit modal and opening a new page without warning", "A tooltip asking them to confirm"], "answer": 0, "explain": "Never stack modals, with the one tolerable case of a short discard confirmation that returns people unchanged."}]}, {"id": "m04-l7", "title": "Tooltips, popovers and menus", "neuron": "tooltips-popovers-and-menus", "intro": "Small anchored overlays are easy to add and easy to get wrong. Tooltips are a last resort for supplementary text, popovers hold small interactive tasks, and menus need a visible route, sensible order and full keyboard support.", "points": [{"rule": "Treat tooltips as a last resort for supplementary text, never essential information.", "why": "Prefer visible inline help. Many tooltips on one screen means labels or icons are failing. Hover-only help is a defect on touch.", "kind": "principle", "source": "Uxcel"}, {"rule": "Never explain a disabled button in a tooltip; show the reason as visible text.", "why": "Disabled buttons take no focus or hover, so keyboard and touch users can't reach it. aria-disabled with a reachable explanation is the fallback.", "kind": "caution", "source": "arla6ka; Paste"}, {"rule": "Put tooltips only on focusable elements, text only, short, with no links or buttons inside.", "why": "About 80 characters or three lines; anything interactive belongs in a popover opened by click. A tooltip on inline text is invisible to people.", "kind": "technique", "source": "Paste, Helios"}, {"rule": "Delay the first tooltip in a group, then open neighbours at once; hide after about 200ms.", "why": "Around 200–400ms before the first one avoids accidental hovers; a short hide delay stops flicker and lets the pointer travel in. Timings are indicative.", "kind": "technique", "source": "Floating UI; Volpe"}, {"rule": "Use a click-to-open toggletip for help people might need.", "why": "Hover tooltips fail voice-control and magnifier users. A toggletip announces in a status region, closes on Escape, and keeps rules and limits out of tips; those belong on the page.", "kind": "technique", "source": "Pickering; Silver; Kaplan, NN/g"}, {"rule": "Give every context menu action a visible route as well.", "why": "Right-click and long-press are shortcuts and undiscoverable on touch. Mirror the actions in a visible kebab menu or toolbar, in the same order.", "kind": "principle", "source": "arla6ka"}, {"rule": "Order menus by frequency, keep them short, and put destructive items last behind a divider.", "why": "About 7 items or fewer, grouped with separators, at most one level of submenu and none on mobile. Destructive items get an icon too, since not everyone sees red.", "kind": "technique", "source": "Uxcel; Helios"}, {"rule": "Name overflow triggers specifically and keep essential, frequent actions out of them.", "why": "The kebab is visible without hover and named, say 'Post actions', not 'Options'. A menu holding only Delete, or a hidden End chat, is wrong.", "kind": "caution", "source": "Kaplan, NN/g"}, {"rule": "Site navigation is a list of links, not an ARIA menu.", "why": "A 'Menu' button is a disclosure with aria-expanded. Keep role menu for application menus, with arrow keys, Escape returning focus and Tab leaving.", "kind": "technique", "source": "Pickering"}, {"rule": "Open popovers only by explicit action, one at a time, with focus in and back to the trigger.", "why": "Initial focus never lands on an irreversible action. No warnings in popovers, never a cascade, and they originate from their trigger.", "kind": "technique", "source": "Apple HIG; Paste; Lightning"}], "sourcesDiffer": ["Hover tooltips: Silver says they can't be made accessible; Pickering keeps them as a last resort for dense toolbars. Default: last resort, with a toggletip or details element for any help people might need.", "Tooltip delay: Antalik uses 80ms; brain uses 150–200ms on buttons, about 400ms for the first tooltip in a cold group, and 80–100ms only for navigation hover states.", "Unavailable items: Apple hides unavailable context-menu items; Villar disables them so the menu keeps its shape. Default: native Apple apps follow Apple; web and cross-platform disable and show shortcuts beside items.", "Tooltip on a disabled control: Floating UI and Checklist Design allow it with aria-disabled; Paste, Atlassian and brain forbid it. Default: visible text, aria-disabled with a reachable explanation as fallback."], "tryIt": "Audit one toolbar or table row: for every tooltip ask whether the content belongs in the UI, and check every right-click action also has a visible route.", "quiz": [{"q": "A form field has a 20-character limit and the team wants to explain it in an info tooltip. What should they do?", "options": ["Use a hover tooltip on an info icon", "Put it in a modal opened from a help icon", "Mention it only after the person exceeds it", "Show the limit on the page beside the field"], "answer": 3, "explain": "Rules and limits never go in a tip; hiding them causes errors and can become deceptive."}, {"q": "Table rows offer Rename, Duplicate and Delete through right-click only. What's the fix?", "options": ["Add a visible kebab menu with the same actions in the same order, Delete last", "Add a tooltip saying 'Right-click for options'", "Move Delete to the top of the context menu", "Replace the browser's menu on every link too"], "answer": 0, "explain": "Context menus are shortcuts; mirror the actions in a visible menu with destructive items last."}, {"q": "A help bubble needs a 'Learn more' link and a short explanation. Which pattern fits?", "options": ["A hover tooltip containing the link", "A title attribute on the icon", "A click-opened toggletip or popover, closing on Escape", "A modal opened by the info icon"], "answer": 2, "explain": "Tooltips hold text only; interactive content goes in something opened by click, and a tip never opens a modal."}]}]}, {"id": "m05", "title": "Navigation and information architecture", "summary": "How to structure, label and test content, and how to build web and app navigation that helps people find things and know where they are.", "neurons": ["navigation-and-ia", "app-navigation", "information-architecture", "books-interaction-and-ia"], "lessons": [{"id": "m05-l1", "title": "Web navigation patterns", "neuron": "navigation-and-ia", "intro": "Navigation is how people learn what a site holds and how they move around it. Most failures come from hiding it, nesting it too deeply or relying on hover. Keep it visible, conventional and click-driven.", "points": [{"rule": "Keep top-level categories visible on desktop; never hide global navigation behind a hamburger or one dropdown.", "why": "Hiding it costs a click and leaves people who land on a deep page unaware of the rest of the site. Desktop hamburgers were used in 27% of tasks against 48–50% for visible navigation, and tasks took at least 39% longer (indicative).", "kind": "evidence", "source": "Pernice and Budiu, NN/g"}, {"rule": "On mobile, show all top-level links when there are four or fewer; otherwise combine visible items with a menu.", "why": "Combined navigation, with main items visible and the rest in a menu, clearly beat hiding everything (86% against 57% use; indicative).", "kind": "evidence", "source": "Pernice and Budiu, NN/g"}, {"rule": "Use links for navigation and buttons for actions.", "why": "A real link lets new-tab, middle-click and right-click work. Anything that loads a new page is styled as a link, not as tabs, and a
