asking why, about process, training, communication and workload", "Add a mandatory sign-off step for that designer", "Close the analysis because a cause was found"], "answer": 1, "explain": "Five whys never stops at a person; 'someone forgot' is a symptom, so keep asking about training, communication and workload."}, {"q": "After two weeks of meetings, a feature decision is a compromise nobody actually chose. Which anti-pattern is this?", "options": ["Not invented here", "Optimising too early", "Choosing the newest thing", "Decision by committee"], "answer": 3, "explain": "Decision by committee produces a compromise nobody chose. SPADE avoids it by naming one decider while still hearing everyone."}]}, {"id": "m11-l7", "title": "UX debt and audits", "neuron": "ux-debt-and-audits", "intro": "UX debt builds up as small inconsistencies that no single screen review catches. A structured audit turns them into a prioritised register and design system rules, while being honest about what is confirmed and what was not covered.", "points": [{"rule": "Agree the scope and evidence first: code branch, prototype, production screenshots, research.", "why": "Code on the main branch may not match what is deployed, so note which source each finding comes from.", "kind": "technique", "source": ""}, {"rule": "Look for one concept with two names, or one action with two verbs.", "why": "An action labelled both Import and Sync breaks the default of one term per concept, and is a common source of debt.", "kind": "default", "source": ""}, {"rule": "Hunt for false affordances, cut-off text, unlabelled numbers and late failures.", "why": "Watch for rows that look clickable but are not, truncated text with no way to read it, numbers with no unit and actions that fail after the click when the system already knew.", "kind": "technique", "source": ""}, {"rule": "Record each item with severity, who it affects, how often, effort, fix, status and evidence.", "why": "Also give it a number, title and category, so the register can be filtered and tracked.", "kind": "technique", "source": ""}, {"rule": "Keep temporary items out of the debt register.", "why": "Test-only controls and 'Coming soon' placeholders go on a separate Before launch list, each marked remove or build.", "kind": "caution", "source": ""}, {"rule": "Grade confidence: anything depending on data, settings or rendering is a hypothesis until a screenshot confirms it.", "why": "Copy and logic read from code can be certain. Never present a hypothesis as a confirmed finding; list the screenshots needed.", "kind": "principle", "source": ""}, {"rule": "Sort by severity band, then lowest effort first within each band.", "why": "Frequency feeds severity. A severity times frequency over effort score can be used inside a band, never across bands.", "kind": "technique", "source": "Dean"}, {"rule": "Where several items share a cause, write one design system rule and name the component change.", "why": "A per-row clickability rule on the table fixes many items at once. Check each rule against existing defaults and say where they differ.", "kind": "technique", "source": ""}, {"rule": "Report coverage, so a short register is not read as a clean bill of health.", "why": "List areas that had only a light pass and where the search stopped early, plus open items such as screenshots and decisions needed.", "kind": "caution", "source": ""}, {"rule": "Do not manufacture issues to fill the register.", "why": "Findings are not quotas; 'no change recommended' is a valid result.", "kind": "caution", "source": ""}], "sourcesDiffer": [], "tryIt": "Pick one area of a product you know and spend 30 minutes listing every concept with two names and every row that looks clickable but is not, recording severity, effort and evidence for each.", "quiz": [{"q": "Your audit turns up a 'Coming soon' tab and a debug toggle left in the UI. Where do they belong?", "options": ["On a separate Before launch list, each marked remove or build", "In the debt register as Low severity", "In the debt register as Critical, since users can see them", "Nowhere; temporary items are not worth recording"], "answer": 0, "explain": "Temporary items are not debt. They go on a separate Before launch list with remove or build, so they are not mixed into the register."}, {"q": "From the code alone, you suspect a table shows numbers without units, but this depends on account settings. How do you record it?", "options": ["As a confirmed High finding", "Leave it out until someone complains", "As a hypothesis, listing the production screenshot needed to confirm it", "As certain, because it came from the code"], "answer": 2, "explain": "Anything depending on data, settings or rendering is a hypothesis until a production screenshot confirms it. Only copy and logic read from code are certain."}, {"q": "A Medium item takes a day to fix and a High item takes three weeks. A combined score ranks the Medium item first. What does the method say?", "options": ["Follow the combined score", "Fix whichever the team prefers", "Merge them into one design system rule", "Sort by severity band first; only use effort to order items within a band"], "answer": 3, "explain": "Sort by severity band, then lowest effort first within each band. Never rank by a single score across severity bands."}]}]}, {"id": "m12", "title": "Process, delivery and leadership", "summary": "How to explore and prototype, ship safely, hand off and QA, run projects, diagnose work by layer, lead designers and win support for design.", "neurons": ["process", "delivery", "project-management", "layers", "leadership", "books-leadership-and-craft", "books-process-and-strategy"], "lessons": [{"id": "m12-l1", "title": "Design process and prototyping", "neuron": "process", "intro": "Process is how you avoid committing too early to the wrong idea. Explore genuinely different directions, then use the cheapest prototype that answers the question in front of you.", "points": [{"rule": "Explore 2–3 radically different directions for big decisions, but test one design at a time.", "why": "Side-by-side tests rarely produce a clear winner, participants learn the task from the first version, and comparisons need about three times as many participants. Fix what fails; switch approach only if it can't be fixed.", "kind": "principle", "source": ""}, {"rule": "Make concepts differ in what the user does, not in how it looks.", "why": "Vary the sequence, unit of interaction, who decides, entry point or commitment point. The same steps with new styling is one concept twice, and no option should be a strawman.", "kind": "principle", "source": "Dean, citing Dow, Glienke and Klemmer"}, {"rule": "Use the cheapest prototype that still gives reliable results.", "why": "Figma suits rough flows early. Before release, a working HTML prototype lets people fill in forms, use screen readers and rotate the device.", "kind": "technique", "source": ""}, {"rule": "Match fidelity to the question, not to habit.", "why": "Low fidelity suits structure and navigation; high fidelity suits data visualisation and multistep flows. With a mature design system, mid-fidelity with real components is as quick as low-fi and is the default.", "kind": "technique", "source": "Adolphus; Boyer and Lowry"}, {"rule": "Go interactive for filters, dashboards and conversational flows.", "why": "Participants need to meet real states and edge cases. In one survey (indicative), interactive prototypes were the only deliverable in the top five for managers, clients and developers alike.", "kind": "evidence", "source": "NN/g"}, {"rule": "Signal low fidelity on purpose when you want feedback on structure.", "why": "Use greyscale with no shadows and label it work in progress. If stakeholders fixate on visual detail, lower the fidelity until the feedback is about structure.", "kind": "technique", "source": "Boyer and Lowry"}, {"rule": "Turn research into stories, scenarios and paper flows before any UI.", "why": "Paper is cheap, keeps people judging the whole flow and keeps rejected ideas visible. Writing each scenario as base, enhanced and 'if resources allow' sets scope and shows in advance what can be cut.", "kind": "technique", "source": "Christopher Murphy"}, {"rule": "Leave an element out until research shows people struggle without it.", "why": "A test that passes with an extra element doesn't prove it was needed, and 'nobody used it' proves nothing either way.", "kind": "principle", "source": "Adam Silver"}, {"rule": "Fix selection criteria and the decider before comparing concepts.", "why": "Apply the criteria to the incumbent too, never graft features from losing concepts onto the winner, and record for each rejected concept what would revive it.", "kind": "caution", "source": "Dean"}, {"rule": "Separate generating ideas from judging them.", "why": "Rapid divergent sketching such as 8 ideas in 8 minutes helps before refining. Ask for range, not volume: ten near-identical directions are one option.", "kind": "technique", "source": "Platt"}], "sourcesDiffer": ["Brain shows 2–3 options; a typography-first method shows ten and bans references; another randomises for variety. Default: 2–3 for product work, a reference-free round only when differentiation is the brief, and never randomise.", "Murphy prepares 3–5 mood boards; brain shows 2–3 options per stage. Default: 2–3, including a conservative option for an existing product.", "Jenny Wen (as cited) argues for trusting intuition and building; Gibbons and Wang say that works only for experienced designers in mature domains. Default: build first only when the problem is framed, the domain mature and stakes low, and write the assumptions down."], "tryIt": "Take a feature you're about to design and sketch three concepts that differ in sequence or who decides, not in styling. Write the criteria you'll judge them by before comparing.", "quiz": [{"q": "You have two very different checkout concepts and a week for research. What is the best way to evaluate them?", "options": ["Show both to each participant side by side and ask which they prefer", "Pick the stronger one, test it, fix what fails, and switch only if it can't be fixed", "Merge the best parts of both into one design before any testing", "Ship both as an A/B test with no prior usability testing"], "answer": 1, "explain": "Brain explores several directions but tests one at a time. Side-by-side tests rarely give a clear winner and need about three times the participants."}, {"q": "A teammate presents three 'concepts' that use the same steps with different colours and layouts. What is the problem?", "options": ["There are too few concepts; there should be at least five", "The fidelity is too low to judge them", "They are really one concept, because they don't differ in what the user does", "They should have been tested before being presented"], "answer": 2, "explain": "Concepts must differ in what the user does, such as sequence or commitment point. The same steps with new styling is one concept twice."}, {"q": "In an early leadership review, stakeholders keep commenting on shadows and colours instead of the flow. What should you do next time?", "options": ["Add more visual polish so there is nothing left to criticise", "Skip the review until the design is final", "Send the file by email instead of presenting", "Lower the fidelity, using greyscale and a work-in-progress label"], "answer": 3, "explain": "Signal low fidelity on purpose. If people fixate on visual detail, lower the fidelity until the feedback is about structure."}]}, {"id": "m12-l2", "title": "Discovery to delivery and release", "neuron": "delivery", "intro": "Learning and building are both continuous, not two phases. Fail in discovery so paying customers never see the bad ideas, then release in small, reversible steps with clear exit rules.", "points": [{"rule": "Treat a prototype as a learning tool, never as a nearly finished product.", "why": "Real products also need reliability, observability, scale, localisation, integrations, security, compliance and disaster recovery. Prototype to learn, use professional tools to ship, and plan the path with engineers.", "kind": "principle", "source": "Cagan, SVPG"}, {"rule": "Rank assumptions by how badly you're hurt if each is wrong.", "why": "Then choose the lightest artefact that gives a trustworthy answer, and commit to the next stage only when evidence earns it.", "kind": "technique", "source": "Frischoff"}, {"rule": "Plan backwards from the end state and turn fragile points into short spikes.", "why": "Ask 'what must already be true?' four or five levels deep. Data, integration, compliance, vendor, scale and edge-case risks become 1–3 day spikes, each with a hypothesis, owner and success criteria.", "kind": "technique", "source": "Apps"}, {"rule": "Run premortems before launch and whenever assumptions change.", "why": "Collect anonymous input, then sort risks into tigers (real threats), paper tigers (look scary, aren't) and elephants (known, unspoken). Every tiger gets an owner and a next step.", "kind": "technique", "source": "Klein"}, {"rule": "Agree launch exit criteria early; green means evidence, not opinion.", "why": "Cover design states, accessibility, content, engineering monitoring and rollback, support briefing and metrics. 'Fix it after launch' is a decision with a named owner, and a no-go means the process worked.", "kind": "principle", "source": "Dean"}, {"rule": "Release in thin slices: heavy internal use, limited beta, then wide launch.", "why": "Widening by case complexity limits harm. Get sponsors to accept small failures in advance.", "kind": "technique", "source": "Roy; Cagan and Lieberich"}, {"rule": "Map every kill threshold to a feature flag with a named owner.", "why": "If you can't trace threshold to flag to owner, it isn't ready to ship.", "kind": "caution", "source": "John"}, {"rule": "Launch at about two-thirds of the project and keep the rest for fixing.", "why": "The last third goes on watching real use. After launch, run new work and optimisation as two streams, with optimisation time protected and reported so it stays funded.", "kind": "technique", "source": "Boag"}, {"rule": "Warn stakeholders that a changed familiar interface draws complaints.", "why": "Boag finds people adapt within about two weeks of regular use (indicative). Agree in advance not to roll back on early noise alone, and watch adoption metrics.", "kind": "evidence", "source": "Boag"}, {"rule": "Treat regulation as a discovery input and write obligations as user stories.", "why": "Turn regulatory impact into product implications such as auditability, consent and retention. Each obligation gets testable acceptance criteria, with privacy criteria in the Definition of Done.", "kind": "principle", "source": "Zhupan Lazareski; Ogendo"}], "sourcesDiffer": ["Kothandaraman builds first; Novinskaya writes user stories per screen and designs before building. Default: build-first for discovery; spec-first when handing work to a code generator.", "For complex, open-ended problems a series of sessions with reflection time beats one 2–5 day sprint; the GV Sprint uses a fixed timebox. Default: sprints for bounded problems, a series for open-ended ones."], "tryIt": "For your next release, write each kill threshold next to the flag that enforces it and the person who owns it. Any row you can't complete is a gap to close before launch.", "quiz": [{"q": "A stakeholder sees a polished Figma Make prototype and asks why it can't ship next week. What is the strongest answer?", "options": ["A prototype lacks reliability, security, scale, integrations and compliance work that a product needs", "Prototypes can ship if they pass a usability test", "It can ship if engineers copy the generated code", "It needs another round of visual polish first"], "answer": 0, "explain": "A prototype is not a product. Real products need many more use cases plus reliability, observability, security and compliance, so plan the path with engineers."}, {"q": "Three weeks after a redesign of a daily-use tool, complaints spike. Adoption metrics look healthy. What should the team do?", "options": ["Roll back immediately to protect satisfaction", "Offer every user the old design permanently", "Hold course as agreed in advance and keep watching adoption", "Stop collecting feedback until the noise dies down"], "answer": 2, "explain": "A changed familiar interface draws complaints even when it's better. Agree in advance not to roll back on early noise alone, and watch adoption."}, {"q": "In a premortem, the team names a risk everyone knows about but nobody has raised in planning. How should it be classed?", "options": ["A paper tiger", "A tiger with no owner", "Out of scope", "An elephant"], "answer": 3, "explain": "Elephants are known but unspoken risks. Tigers are real threats that each get an owner, and paper tigers look scary but aren't."}]}, {"id": "m12-l3", "title": "Design QA and handoff", "neuron": "delivery", "intro": "Handoff is ongoing collaboration, not a moment when files change hands. The costliest holes are what a spec doesn't say, so review for silences and check the build against one source of truth.", "points": [{"rule": "Share the problem, rationale and success criteria with engineers before designs are final.", "why": "Engineering shouldn't wait for final designs. AgileFall, design as a service and the feature factory are named anti-patterns; one cross-functional team that revisits what shipped is the fix.", "kind": "principle", "source": "de Vera; Salminen"}, {"rule": "Label designs exploratory or locked, and hand over the non-ideal states.", "why": "Engineers choose architecture by how settled the design is. Include long-string, error, empty and data-heavy states and transitions, not only the ideal screen.", "kind": "technique", "source": "Zhuo"}, {"rule": "Review a spec for what it doesn't say, using fixed prompts in order.", "why": "Check empty, maximum, failure, permission, concurrency, interruption, migration, copy and accessibility, and impact beyond the boundary. Holes found late cost most, and authors can't see what they didn't write.", "kind": "technique", "source": "devil skill, dhha22"}, {"rule": "Write each spec finding as a scenario, and flag gaps rather than taste.", "why": "'When the user does X during Y, Z is undefined.' If it can't be written that way, drop it. Disagreeing with a written decision is nitpicking; a case the rule doesn't cover is a finding.", "kind": "technique", "source": "devil skill, dhha22"}, {"rule": "Grade spec gaps as Blocker, Major or Minor, and rule accordingly.", "why": "A Blocker means the core flow can't be built, or a wrong guess writes data you can't repair. Approve with no Blockers or Majors; approve conditionally with Majors; reject on any Blocker.", "kind": "technique", "source": "devil skill, dhha22"}, {"rule": "Never average readiness into a percentage; one critical blocker stays a blocker.", "why": "Verdicts are ready, ready with conditions, not ready or not assessable. A condition without an owner is a blocker.", "kind": "principle", "source": "Balise"}, {"rule": "Run design QA per component against the source of truth, every state included.", "why": "Compare size, spacing, type, colours, shadows and each state from hover to error; log design value, built value and pass or fail, one bug per mismatch. Common slips are weight one step off and colour one shade off.", "kind": "technique", "source": "qa-test-planner"}, {"rule": "Test at least one end-to-end journey, including emails, before release.", "why": "Interactions tested alone can pass and still fail in sequence: one claims flow tested well, but its confirmation email contradicted it.", "kind": "evidence", "source": "Flaherty, NN/g"}, {"rule": "Before handover, check key sizes plus keyboard only, 200% zoom and a screen reader.", "why": "Check phone, tablet in both orientations, desktop and ultra-wide. Review at real size in real flows, with short and long content and large text, not in showcase frames.", "kind": "technique", "source": ""}, {"rule": "Hand off duration, easing, delay and iteration count for every animation.", "why": "A video alone hides these values, so engineers have to guess.", "kind": "technique", "source": "Head"}], "sourcesDiffer": ["Flowers says remove pipeline stages that exist only to compensate for an earlier one; Frost and Mall's 'hot potato' model keeps passing work back and forth. Default: remove stages that only compensate, and keep the back-and-forth for the ones that remain."], "tryIt": "Take a spec you're about to hand over and run the nine silence prompts against it. Write each gap as a 'When the user does X during Y, Z is undefined' sentence and grade it.", "quiz": [{"q": "A spec doesn't say what happens if two operators approve the same item at once, and a wrong guess could corrupt a ledger. How should you grade it?", "options": ["Minor: confirm before QA", "Major: buildable with a guess", "Not a finding, because it's an edge case", "Blocker: a wrong guess writes data you can't repair"], "answer": 3, "explain": "A Blocker is either an unbuildable core flow or a guess that writes irreparable data, such as balances or ledgers. Any Blocker means reject."}, {"q": "A readiness review shows 19 of 20 gates passed, but one critical gate failed. What is the verdict?", "options": ["Not ready, because one critical blocker isn't averaged away", "Ready, at 95%", "Ready with conditions, with no owner needed", "Not assessable"], "answer": 0, "explain": "Readiness uses no percentages. One critical blocker isn't averaged away, and a condition without an owner is itself a blocker."}, {"q": "Each step of a claims flow passed its acceptance criteria, but users are confused after submitting. What check was most likely missed?", "options": ["A per-component design QA of spacing", "A five-second test of the landing page", "An end-to-end journey test that includes the follow-up emails", "A heuristic review of the submit button"], "answer": 2, "explain": "Interactions tested alone can pass and still fail in sequence. In NN/g's example, the confirmation email contradicted a flow that had tested well."}]}, {"id": "m12-l4", "title": "Running design projects", "neuron": "project-management", "intro": "Most overruns come from hidden tasks, slow reviews and unmanaged change, not slow designers. Estimate from the bottom up, make approvals explicit and keep a baseline so every slip is visible and explained.", "points": [{"rule": "Estimate bottom-up with the team, and cut named tasks rather than shrinking everything.", "why": "One scope line can hide six tasks and an outside cost: testing with five users means recruiting, scheduling, scripting, running, paying and writing up. The breakdown also shows stakeholders why work takes as long as it does.", "kind": "technique", "source": "Harned"}, {"rule": "Allow generous review time per deliverable; it is the usual curveball.", "why": "Review cycles often take longer than making. Challenge promises such as feedback from six people within 24 hours.", "kind": "caution", "source": "Harned"}, {"rule": "Save the agreed plan as a baseline and annotate every moved date.", "why": "Note 'Baseline X; moved on Y because Z', save a new version, repeat it in the status update and talk through knock-on effects.", "kind": "technique", "source": "Harned"}, {"rule": "Map each deliverable to its reviewers and a single final approver early.", "why": "Always ask whether anyone you haven't met will have a view, and say up front what a reversed approval would cost. No clear decision maker is a red flag.", "kind": "principle", "source": "Harned"}, {"rule": "Give every task exactly one Accountable person.", "why": "Accountable is the last reviewer before done, not necessarily the lead. For decisions rather than tasks, use DACI or RAPID; on small teams a plain owner list is enough.", "kind": "principle", "source": "Harned; Figma resource library"}, {"rule": "Keep a Risks section in every weekly status update.", "why": "Bad news then arrives early as a risk, not late as a surprise. Follow it with a short call, because people don't read.", "kind": "technique", "source": "Harned"}, {"rule": "Never accept a change request on the spot; check it against scope and goals.", "why": "Listen for 'can we just', 'add' and 'a little'. Reply with the impact on timeline, resources and risk, options such as moving the date or dropping a named item, a recommendation and a decision date.", "kind": "technique", "source": "Harned; feedback-mastery"}, {"rule": "Find the critical path, and compress only zero-float tasks.", "why": "The longest chain of dependent tasks sets the shortest timeline. Fast-tracking and crashing add risk or cost, so use them only where slack is zero; optimistic estimates make any critical path fiction.", "kind": "technique", "source": "Figma resource library"}, {"rule": "Plan about 32 of 40 hours per person; never push to full utilisation.", "why": "Waits grow sharply near 100% utilisation. A weekly capacity sheet that includes non-project work and turns red above the limit puts a number on it.", "kind": "principle", "source": "Harned"}, {"rule": "Spot unrealistic deadlines and answer with options, not refusal.", "why": "Warning signs: set without engineering input, estimates below similar past work, no buffer and 'we just need to…'. Offer reduced scope by the date or full scope later, ask which matters more, and write the agreement down.", "kind": "caution", "source": "feedback-mastery"}], "sourcesDiffer": ["Harned plans about 32 of 40 hours; ux-pgm-skills plans 60–70% of nominal capacity and flags anyone above 80%. Default: Harned's 32 as the ceiling, lower for heavy meeting or on-call loads, and flag skills held by one person."], "tryIt": "Pick one line from your current project scope and break it down two levels into tasks with effort. Compare the total with what you'd guessed, and add explicit review time for each deliverable.", "quiz": [{"q": "In a review, a stakeholder says 'Can we just add a comparison table? It's a little thing.' What is the best immediate response?", "options": ["Agree, since it's small and builds goodwill", "Say you'll check it against the scope and plan, then reply with impact and options", "Refuse, since the scope is locked", "Add it quietly and absorb the time"], "answer": 1, "explain": "Don't answer change requests on the spot. Test them against success measures, then set out impact, options and a recommendation."}, {"q": "Research (5 days), UI design (10), prototyping (3) and handoff (2) run in sequence; marketing copy (4 days) runs alongside. The UI design is slipping. What can you do?", "options": ["Ignore it, since the marketing copy has float", "Crash the marketing copy task", "Cut the research to save time", "Treat it as critical-path, since any delay moves launch, and consider lending people from the copy task"], "answer": 3, "explain": "UI design sits on the zero-float critical path. Watch those tasks closest and lend people from tasks with float."}, {"q": "A designer's capacity sheet shows 40 planned project hours this week. What does the guidance suggest?", "options": ["Fine, if they have no meetings", "Fine for one week only", "Over the limit: plan about 32 of 40 hours, because waits grow sharply near full utilisation", "Over the limit only if they work on more than two projects"], "answer": 2, "explain": "Harned plans about 32 of 40 hours, and brain warns against full utilisation because waiting grows sharply near 100%."}]}, {"id": "m12-l5", "title": "Layers of product design", "neuron": "layers", "intro": "Jamie Mill's seven layers run from observed behaviour to surface. Weakness low down spreads upward as UX debt, so diagnose which layer is weak before polishing the screen.", "points": [{"rule": "Locate work in seven layers, from observed behaviour up to surface.", "why": "The problem space is observed behaviour, the domain and user needs; the solution space is strategy, conceptual model, interaction structure and surface. You can enter at any layer, but check the ones below first.", "kind": "principle", "source": "Jamie Mill"}, {"rule": "Rate each layer and work on the lowest one that is weak, assumed or not started.", "why": "Treat Assumed separately from Strong: assumptions that look solid hide the riskiest decisions. If a deadline justifies working higher up, name the trade-off.", "kind": "technique", "source": "Jamie Mill"}, {"rule": "Work one layer at a time, but probe upward to learn.", "why": "Mixing problem and solution space muddles output. When a layer feels ungrounded, sketch a flow or screen to see what it needs, then return; probing up to learn isn't committing up to build.", "kind": "technique", "source": "Jamie Mill"}, {"rule": "Look for decisions nobody knew were unmade; they are often worth most.", "why": "Design is decision-making: making, uncovering, evaluating and prioritising decisions. Capture decisions and open questions, not transcripts.", "kind": "principle", "source": "Jamie Mill, after Christopher Alexander"}, {"rule": "Mark every research finding observed, inferred or assumed.", "why": "An 'observed' finding needs a quotable verbatim beside it, or it's really inferred. Workarounds are strong signal, and gaps should be named, not papered over.", "kind": "technique", "source": "Jamie Mill"}, {"rule": "Strip your solution out of the 'When' in a job story.", "why": "If the 'When' names your dashboard or weekly email, it describes the current system, not the need. It must be picturable, triggered by an event, feeling, rhythm or threshold.", "kind": "caution", "source": "Jamie Mill"}, {"rule": "Apply the flip test: an opportunity that reads as a feature is a solution in disguise.", "why": "An Opportunity Solution Tree has one measurable outcome, first-person opportunities grouped by journey moment, and several bets per opportunity, each with its riskiest assumption and cheapest test.", "kind": "technique", "source": "Teresa Torres, via Mill"}, {"rule": "Model only real objects, and trace each one to a stated user need.", "why": "The conceptual model is the most neglected load-bearing layer. Real objects are instanceable, structured and useful alone; CAC and LTV are instances of one object, Metric. Mark objects resting on untested bets as provisional.", "kind": "principle", "source": "Jamie Mill, OOUX after Sophia Prater"}, {"rule": "Use one name per concept and one concept per name, everywhere.", "why": "Keep a ubiquitous language list with the chosen term, rejected alternatives and why, applied in UI, help text, API names and internal talk.", "kind": "default", "source": "Jamie Mill"}, {"rule": "Breadboard the flow in text before visual design, and tag surface issues by root layer.", "why": "Every affordance needs a named destination; one you can't name is an unmade decision. More than 5–6 places for one job means something can collapse, and many surface findings are symptoms to route back down.", "kind": "technique", "source": "Ryan Singer, via Mill"}], "sourcesDiffer": [], "tryIt": "Rate a current project's seven layers as Strong, Partial, Assumed, Weak, Not started or N/A. Find the lowest weak layer and write the one question you'd answer there first.", "quiz": [{"q": "Users misread labels on a settings screen. Reviewers find the same thing is called 'workspace', 'team' and 'account' in different places. Where is the root fix?", "options": ["The surface: rewrite each label for clarity", "Observed behaviour: run more interviews", "Strategy: pick a new North Star metric", "The conceptual model: agree one term per concept and apply it everywhere"], "answer": 3, "explain": "Tag surface findings by root layer. 'Match between system and real world' failures usually root in the conceptual model, fixed with a ubiquitous language list."}, {"q": "A job story reads: 'When I open the weekly report email, I want to see trends.' What is wrong with it?", "options": ["The 'When' names the solution, so it describes the current system, not the need", "It lacks an emotional job", "It should be written as a user story instead", "It needs a percentage target"], "answer": 0, "explain": "Strip the mechanism: if the 'When' names your email or dashboard, restate what's true about the person at that moment."}, {"q": "An orientation rates user needs as 'Assumed' and the surface as 'Partial'. The team wants to polish screens before a demo. What does the model suggest?", "options": ["Polish the surface, since it's closest to done", "Treat user needs as the bottleneck, and name the trade-off if the deadline forces surface work", "Treat Assumed as Strong and proceed", "Skip to strategy, since needs can be inferred later"], "answer": 1, "explain": "The bottleneck is the lowest layer rated Weak, Assumed or Not started. If a deadline justifies working higher, name the trade-off."}]}, {"id": "m12-l6", "title": "Leading designers", "neuron": "leadership", "intro": "A design lead's job is to make the team better, not to do the team's work. That means diagnosing before fixing, matching delegation to proven judgement, and building systems that let people decide without you.", "points": [{"rule": "Diagnose goals, roles and expectations before team dynamics or individuals.", "why": "Sort each problem into can't do (coach or move), won't do (align on purpose) or not set up to do (fix the system). Then make the one change that matters most, and expect 6–12 months of lower output.", "kind": "technique", "source": "Molly Graham; Anuj Rathi; Lenny skills"}, {"rule": "First ask whether a decision is reversible.", "why": "Delegate reversible decisions and move fast; irreversible ones get one named approver and deliberate consultation. Then disagree and commit, and reopen only with new information.", "kind": "principle", "source": "Dean; MacCaw"}, {"rule": "Match delegation level to the person's record on this specific task.", "why": "Levels run from 'do exactly this' to 'own it'. Reassess per task, delegate the outcome and the reason, and don't take it back at the first wobble.", "kind": "technique", "source": "Dean; MacCaw"}, {"rule": "Let the report own the 1:1 agenda; status belongs elsewhere.", "why": "Listen more than talk, keep a shared running doc, don't cancel, and end with 'anything I should know that I'm not asking about?'", "kind": "principle", "source": "Dean"}, {"rule": "Give feedback on behaviour a camera would record, and end with who does what by when.", "why": "SBI and GAIN avoid interpretation, 'always' and 'never'. Adding 'feel free to say no' doubled yes rates in a cited meta-analysis of 52 studies; 'let's' and 'should' mean nobody owns it yet.", "kind": "technique", "source": "Center for Creative Leadership; Lenny skills"}, {"rule": "Your reaction to bad news sets the ceiling on psychological safety.", "why": "It is missing when critique is silent, agreement evaporates afterwards and mistakes stay hidden. Don't read a quiet team as a healthy one.", "kind": "principle", "source": "Dean; Cutler"}, {"rule": "Measure the operation, never individuals.", "why": "Track cycle time, throughput, blocker age and rework against a baseline, paired with quality. Output counts get gamed: chasing velocity inflates estimates.", "kind": "caution", "source": "Dean; Rezvani"}, {"rule": "Replace your presence with artefacts so the team can decide without you.", "why": "Severity rubrics, self-serve dashboards and a playbook with a named owner let a team scale. Small teams can run as a centre of excellence with shared assets, training, consulting and champions.", "kind": "technique", "source": "Barham; Boag; Flaherty"}, {"rule": "Run a one-week anonymous friction log and read recurring problems as setup faults.", "why": "'I'll just build it myself' means the system isn't trusted; 'Is this the latest file?' means no single source of truth; 'Who's approving this?' means a broken feedback loop.", "kind": "technique", "source": "Bukengolts"}, {"rule": "Do reports' work only in an emergency, and say so out loud.", "why": "If it recurs, decide whether it's a training gap. Covering for a struggling manager hides the gap rather than fixing it.", "kind": "caution", "source": "MacCaw; Lenny skills"}], "sourcesDiffer": ["Ajayi timeboxes every decision in hours; Dean gives irreversible decisions deliberate consultation. Default: Ajayi's timeboxes for reversible decisions; irreversible ones get the consultation they need, with a dated deadline.", "An AI-native designer source says to measure designers on customer behaviour changed; Dean says measure the operation, never individuals. Default: use behaviour change as the team's outcome and a coaching topic, and don't rank individuals on it.", "The Manager's Handbook says share information by default, except pay and individual performance; brain had no rule. Default: open by default, but use judgement for sensitive critique and early work."], "tryIt": "List the last five decisions your team brought to you. Mark each reversible or not, and pick one reversible type you'll delegate from now on, with the outcome and reason written down.", "quiz": [{"q": "A team keeps missing quality bars. Before coaching individuals, what should a new lead check first?", "options": ["Which designer has the weakest craft", "Whether the team needs a reorganisation", "Whether goals, roles and expectations are clear", "Whether people get on with each other"], "answer": 2, "explain": "Snorkel before you scuba: check goals, roles and expectations before dynamics, pairs or individuals."}, {"q": "A designer wants to pick the icon style for an internal tool; you'd choose differently, but it's easy to change later. What should you do?", "options": ["Let them decide, since it's reversible and low consequence", "Overrule them and explain why", "Escalate to a design review", "Ask for three options and pick one yourself"], "answer": 0, "explain": "Reversible, low-consequence decisions are delegated quickly, even when you have high conviction, so people build judgement."}, {"q": "Leadership asks for a ranking of designers by tickets closed per sprint. What is the best response?", "options": ["Provide it, weighted by ticket size", "Provide it, but only privately", "Replace it with commits per designer", "Propose operation-level measures such as cycle time and rework, because individual output counts get gamed"], "answer": 3, "explain": "Measure the operation, never individuals. Output counts invite gaming, as with velocity inflating estimates."}]}, {"id": "m12-l7", "title": "Influence, change and storytelling", "neuron": "leadership", "intro": "Good design stalls without backing. Lead with the outcome, speak in the measures other teams already track, and treat changing minds as real work, not an afterthought.", "points": [{"rule": "Lead with the conclusion or ask, then the supporting arguments and evidence.", "why": "Minto's pyramid suits busy executives and any written decision paper. A reader who stops after the first line should still know what changed.", "kind": "technique", "source": "Minto; Connell-Waite"}, {"rule": "Pick a story structure to fit the job.", "why": "Use situation, complication, resolution for high-stakes pitches, Duarte's Sparkline for vision talks, and the scientific method for research, so you tell the story the evidence supports. Any structure beats none.", "kind": "technique", "source": "Connell-Waite; von Stackelberg"}, {"rule": "Make the user the hero and the team the guide, and include the struggle.", "why": "Say plainly what you did versus the team, and never inflate the result. Constraints, failed ideas and trade-offs make the story believable.", "kind": "principle", "source": "Connell-Waite"}, {"rule": "Translate UX terms into what they buy before the meeting.", "why": "Cognitive load, JTBD and WCAG mean little to other departments. Say fewer abandoned journeys, lower support cost, less compliance risk, and rehearse on a non-designer first.", "kind": "technique", "source": "Friedman"}, {"rule": "Compare the cost of doing nothing with the cost of the smallest measurable fix.", "why": "Restate design problems in metrics the team already tracks. If the answer is no, write down your recommendation and the cost of inaction, then move on.", "kind": "technique", "source": "Donska"}, {"rule": "Agree at kick-off that stakeholders bring problems and designers bring solutions.", "why": "When someone asks for a colour or layout change, point back to the agreement and ask what problem they're seeing. Then explain in terms of the original goals.", "kind": "principle", "source": "Harned, from Paul Boag"}, {"rule": "Walk stakeholders through the discovery chain and ask for input at each step.", "why": "Go from outcome to opportunities, target opportunity, solutions and assumption tests. Place a stakeholder's idea in the opportunity space rather than arguing with it.", "kind": "technique", "source": "Teresa Torres"}, {"rule": "Explain why before what, name the loss, and start change with a pilot.", "why": "An order from the top isn't enough; teach before asking for deliverables and give teams months to adjust. Anchor change in onboarding and the design system, because unreinforced change reverts.", "kind": "principle", "source": "Dean; Flaherty; Kotter"}, {"rule": "Assume executives hold three facts; give the minimum and one recommendation.", "why": "Executives skip pre-reads, so allow about 8 minutes of silent reading, restate the call, and frame trade-offs by company goals, never team capacity.", "kind": "technique", "source": "Ami Vora; Tara Seshan"}, {"rule": "Close reviews with a written commitment from each stakeholder.", "why": "Each leaves one comment saying whether they would go ahead, and why. A quiet meeting is not agreement.", "kind": "caution", "source": "Platt"}], "sourcesDiffer": ["Brain leads with the outcome; Lenny's SCR material gives the situation first, so a recommendation isn't abrupt. Default: the ask or conclusion in the first line, then a situation everyone accepts.", "Kotter's eight steps suit large hierarchical organisations; the Figma resource library notes they are linear and slow. Default: small or agile teams compress the steps, and every tool rollout gets an adoption plan."], "tryIt": "Rewrite the opening of your next design update so the first line is the recommendation and the ask. Then restate one UX term in it as a cost or metric the reader already tracks.", "quiz": [{"q": "You're asking a director to fund accessibility fixes. Which opening is most likely to land?", "options": ["An explanation of WCAG 2.2 success criteria", "Fixing these flows cuts support cost and compliance risk; here's the cost of leaving them", "A history of the team's research process", "A gallery of before-and-after screens with no commentary"], "answer": 1, "explain": "Lead with the outcome and translate UX terms into what they buy, comparing the cost of doing nothing with the fix."}, {"q": "A design review ends with nods and no objections. What should you have done before it closed?", "options": ["Ask each stakeholder to leave a written comment on whether they'd go ahead, and why", "Assume agreement and move to build", "Schedule a second review to confirm", "Email the slides afterwards"], "answer": 0, "explain": "A quiet meeting is not agreement. Platt closes reviews with a written commitment from each stakeholder."}, {"q": "Leadership mandates a new research practice across all teams starting next month. What does the guidance recommend?", "options": ["Enforce it immediately, since the order came from the top", "Let each team adopt it whenever they like, with no plan", "Write a detailed policy and skip training", "Teach first, start with one measurable pilot, and give teams months to adjust"], "answer": 3, "explain": "Change minds before changing operations: an order from the top isn't enough. Teach before asking for deliverables, pilot first, and allow time to adjust."}]}]}, {"id": "m13", "title": "Product thinking", "summary": "How to design first runs, activation, retention and leaving, use behavioural science honestly, frame and measure product work, make strategic decisions and manage whole customer journeys.", "neurons": ["product", "lifecycle-and-retention", "product-psychology", "product-thinking", "product-strategy", "journeys"], "lessons": [{"id": "m13-l1", "title": "Onboarding and first run", "neuron": "product", "intro": "The first run decides whether people ever feel the value they signed up for. The core idea is to find the moment value becomes real, then remove everything between sign-up and that moment, teaching inside the task rather than up front.", "points": [{"rule": "Find the activation event in your data, then build onboarding backwards from it.", "why": "Compare retained and churned users for the earliest action that separates them. Signing up, finishing a set-up wizard or finishing a tour is not activation.", "kind": "technique", "source": "Demand Curve"}, {"rule": "Test the product without onboarding first, and add it only if it measurably helps.", "why": "In one study, people who saw deck-of-cards tutorials succeeded no more often (91% against 94%) but rated tasks as harder. Tutorials can make an app seem more difficult (indicative).", "kind": "evidence", "source": "Kendrick, NN/g"}, {"rule": "Teach in response to what people just did, not before they start.", "why": "People start using software straight away and skip instructions. Explain after an action, help when something goes wrong, and treat repeated failures as the cue to introduce a feature; highlighting a feature within the current task works best.", "kind": "principle", "source": "Built for Mars; Laws of UX; NewsKit"}, {"rule": "Fix the interface first, then pick the lightest aid that does the job.", "why": "An inline hint needs no dismissal, a hotspot is an optional pointer people open, and coachmarks block the interface and are borderline anti-pattern. Keep spotlight modals for major changes only.", "kind": "technique", "source": "UI-Patterns"}, {"rule": "Let people get value before asking them to create an account.", "why": "Delaying registration until people have tried the product lifts sign-ups (Uxcel cites about 29%; indicative). AI products set the bar: one input, sample outputs, a result in seconds, then sign-up.", "kind": "evidence", "source": "Uxcel; Demand Curve"}, {"rule": "Map the minimum path to value and cut every step that is not needed now.", "why": "List every screen, field and prompt, mark each green, yellow or red, cut the reds and defer the yellows. Bush puts the share of sign-ups who never use the product at 40 to 60% (indicative).", "kind": "technique", "source": "Bush; Haines"}, {"rule": "Ask for permissions and notifications at a moment with a concrete benefit.", "why": "Asking people to share, rate or enable notifications before they have seen value converts poorly. Ask for the camera when capture starts, and judge a prompt by opt-in among people who saw it.", "kind": "principle", "source": "Bakusevych; Built for Mars"}, {"rule": "Keep tours to one topic, few steps, skippable and replayable from help.", "why": "Dismissing a tour often ends it for good, so offer a way to bring tips back. Never show it again once done, and introduce new features in context rather than re-running it.", "kind": "principle", "source": "Byrne, Intercom; Uxcel"}, {"rule": "Use checklists of 3 to 7 outcome-named items, and tick only what people really did.", "why": "Name items as outcomes with a time estimate and a start link, quick wins first and business asks last. Motivated people finish checklists anyway, so test whether the checklist itself raises retention.", "kind": "technique", "source": "UI-Patterns; Checklist Design"}, {"rule": "Every personalisation question must change what people see next.", "why": "Ask one to three questions, apply the answers straight away, and drop any question that only feeds marketing segmentation. Name what a skip skips, such as 'Skip personalisation'.", "kind": "caution", "source": "UI-Patterns; Wasilewski"}], "sourcesDiffer": ["Uxcel keeps onboarding to 4 to 5 screens and about a minute; Lichaw reports a flow lengthened by 15 screens that nearly doubled completion (indicative). Default: keep flows short, but don't cut a step that delivers the value; judge by later engagement, not step count.", "Superhuman removed the skip button and completion rose from 30% to over 98% (indicative); brain makes tours skippable. Default: block only on a short path to a committed, user-valued outcome the product can't work without.", "Onboarding skills cap tours at 3 to 5 steps; Byrne allows 5 to 7. Default: as few steps as the task needs, 5 at most unless testing shows more help.", "Some sources start progress bars part-filled; brain allows seeded progress only for steps really done. Default: tick only what the person actually completed."], "tryIt": "Sign up to your own product with a fresh email and a stopwatch. List every screen, field and prompt before the aha moment, mark each green, yellow or red, and propose what to cut or defer.", "quiz": [{"q": "A team counts 'finished the product tour' as activation and wants to make the tour mandatory to lift the number. What should they do first?", "options": ["Make the tour mandatory and measure completion", "Shorten the tour to three steps", "Add a celebration screen when the tour ends", "Compare retained and churned users to find the earliest action that separates them"], "answer": 3, "explain": "Finishing a tour is not activation. Find the real activation event in the data and build onboarding backwards from it."}, {"q": "A new feature is not being discovered. Which first step fits the lesson best?", "options": ["Fix the interface, then add the lightest aid, such as a hotspot shown to people who use the related area", "Add a blocking coachmark tour on every sign-in", "Show a full-screen modal announcing it to all users", "Re-run the original onboarding tour for everyone"], "answer": 0, "explain": "Pick the lightest aid that does the job, after fixing the interface. Coachmarks are borderline anti-pattern, and a modal at every sign-in teaches people to dismiss everything."}, {"q": "Your app asks for notification permission on the first screen, and few people opt in. What is the best change?", "options": ["Ask twice during onboarding", "Ask at a moment with a concrete benefit, such as right after an order for dispatch updates", "Make notifications a required set-up step", "Pre-select notifications on and let people opt out later"], "answer": 1, "explain": "Requests before any value convert poorly. Tie each ask to a clear benefit at the moment it matters."}]}, {"id": "m13-l2", "title": "Activation, retention and cancel flows", "neuron": "lifecycle-and-retention", "intro": "What happens after first run decides whether value repeats, whether people upgrade and how they leave. The core idea is to measure value, not activity, find where retention breaks before fixing it, and make leaving as honest and easy as joining.", "points": [{"rule": "Agree one definition of 'activated' and validate it against long-term retention.", "why": "Product, marketing and data should share it. Activation is finishing a key step; value is the outcome people came for, so also track time to first value and time to next value.", "kind": "principle", "source": "Morales, Amplitude"}, {"rule": "Separate the early action window from the later retention outcome when finding the aha moment.", "why": "Include every eligible sign-up, show immature cohorts separately rather than as churned, and never use outcome-window behaviour as a predictor. Confirm thresholds on a later cohort before believing them.", "kind": "technique", "source": "Haines, after Amplitude"}, {"rule": "Locate a retention drop by stage before fixing it.", "why": "Leaving before first value means fix onboarding; leaving after it means value isn't repeating; one worse cohort means fix targeting and the acquisition promise. Don't prop retention up with notifications.", "kind": "principle", "source": "product-decision-agent"}, {"rule": "Invest in activation before win-back.", "why": "Retention has three jobs in order: activation, engagement and resurrection. Teams over-invest in win-back, and broken activation can take about three months to show in the numbers.", "kind": "principle", "source": "Demand Curve"}, {"rule": "Prompt upgrades after value and before frustration, never during onboarding or mid-flow.", "why": "Good moments are after the aha moment, at genuine limits or next to a paid feature. After a dismissal, cool down for days, not hours, and cap prompts per session.", "kind": "principle", "source": "paywall-upgrade-cro"}, {"rule": "Lead a paywall with what people get, a specific button and an equally clear way out.", "why": "Use a headline about the benefit, not the price, plans compared with the current one marked, a button like 'Upgrade to Pro' and a neutral 'Continue with Free'. No confirmshaming.", "kind": "technique", "source": "paywall-upgrade-cro"}, {"rule": "Make cancelling as easy as signing up, with at most one retention offer.", "why": "The offer should be declinable in one tap, 'Stay' and 'Cancel' get equal weight, and exit reasons are skippable. Treat FTC click-to-cancel as a US principle, not settled law; UK subscription rules also require leaving to be no harder than joining.", "kind": "principle", "source": "Uxcel; Brandall"}, {"rule": "Match the save offer to the stated reason, beside the exit, never in front of it.", "why": "Too expensive gets a time-limited discount, not using it gets pause or set-up help, business closed gets no offer. A blanket discount saves nobody who isn't using the product; keep discounts at 20 to 30% for 2 to 3 months (indicative).", "kind": "technique", "source": "Haines"}, {"rule": "Offer pause before discount, capped at 1 to 3 months with a reminder before resuming.", "why": "Pause doesn't devalue the product. Haines claims 60 to 80% of pausers return (indicative); keep data and settings, and email 7 days and 1 day before auto-resume.", "kind": "evidence", "source": "Haines; UI-Patterns"}, {"rule": "Treat failed payments as their own churn, retried by decline type, with blame-free copy.", "why": "Haines puts failed payments at 30 to 50% of churn and the most recoverable (indicative). Retry soft declines, ask for a new card on hard ones, and write 'your payment didn't go through', not 'you failed to pay'.", "kind": "technique", "source": "Haines"}], "sourcesDiffer": ["Haines routes accounts above about $2,000 a month to a required customer-success call before cancelling completes; brain says leaving must be no harder than joining. Default: offer a call, never require one; alert customer success in parallel.", "Requiring a card for trials raises trial conversion but cuts sign-ups (all figures indicative). Default: decide on visitor-to-paid over the same horizon, not trial-to-paid, and always say whether a card is needed and remind before charging."], "tryIt": "Walk through your own product's cancel flow and count the screens, offers and wording of the buttons. Rewrite it as one optional reason question, one matched offer beside the exit, and a post-cancel page stating when access ends and data is deleted.", "quiz": [{"q": "Retention fell, and analysis shows most lost users never reached first value. What should the team fix?", "options": ["Send more re-engagement push notifications", "Launch a win-back email sequence", "Onboarding and the path to first value", "Add a discount to the cancel flow"], "answer": 2, "explain": "Locate the drop by stage. Leaving before first value points to onboarding, and propping retention up with notifications is ruled out."}, {"q": "A user cancelling says they haven't used the product in two months. Which save offer fits?", "options": ["A 50% discount for a year", "No offer and no option to pause", "A required call with customer success", "A pause, while learning why they stopped"], "answer": 3, "explain": "A discount won't help a dormant user. Pause beats discount, and discounts above 30% teach people to cancel for deals."}, {"q": "Where should an upgrade prompt appear?", "options": ["At a genuine usage limit, saying which limit and offering ways to carry on", "On the second screen of onboarding", "Mid-flow while someone is completing a task", "Again a few hours after the user dismissed it"], "answer": 0, "explain": "Ask after value, before frustration. Never during onboarding, mid-flow or soon after a dismissal; a usage-limit screen should never be an abrupt block."}]}, {"id": "m13-l3", "title": "Product psychology and its evidence", "neuron": "product-psychology", "intro": "Laws and biases help explain why a design works and predict what to test, but many popular effects are weaker than design folklore claims. The core idea is to use psychology in the user's interest and treat each effect as a hypothesis, labelled by how well its evidence transfers to interfaces.", "points": [{"rule": "Use laws and biases to predict what to test, never instead of testing.", "why": "Some underlying research is weak; ego depletion and decision fatigue have failed to replicate. Use effects in the user's interest, not against them.", "kind": "principle", "source": "Built for Mars; Laws of UX"}, {"rule": "Treat every nudge as a hypothesis to test, never a proven lever.", "why": "A meta-analysis reported a medium nudge effect, but after correcting for publication bias the average was about 0.04, with no evidence of an average effect.", "kind": "evidence", "source": "Maier et al., PNAS 2022"}, {"rule": "Cut options only where choice overload conditions hold; otherwise keep the full, visible set.", "why": "The jam study didn't generalise: one meta-analysis found an average effect of virtually zero. Another found a reliable effect only with hard decisions, complex sets, unclear preferences and a wish to minimise effort.", "kind": "evidence", "source": "Scheibehenne et al.; Chernev et al."}, {"rule": "Use loss aversion to protect people, not as a tactic assumed to double persuasion.", "why": "With symmetric, unordered gains and losses the coefficient was about 1.07, not reliably twice. Keep protective uses: auto-save, backup prompts before deletion, honest 'what you'll lose'.", "kind": "evidence", "source": "Yechiam and Zeif, 2025"}, {"rule": "Treat every default as a design decision, and never pre-select paid add-ons.", "why": "In a UK government simulation, pre-selected defaults made people 60 to 70% more likely to pick the more expensive option. Options made prominent but not selected had no significant effect.", "kind": "evidence", "source": "UK Department for Business and Trade"}, {"rule": "Design endings with care, but don't expect a good ending to repair a poor journey.", "why": "In a meta-analysis, peak and end ratings predicted overall ratings about as well as the plain average of all moments. Fix the friction first.", "kind": "evidence", "source": "Alaybek et al., 2022"}, {"rule": "Prompt only when people are both motivated and able to act.", "why": "If motivation is low, a prompt is noise; if ability is low, simplify the task first. When a step isn't happening, check which of motivation, ability or prompt is missing.", "kind": "principle", "source": "Fogg, via UI-Patterns"}, {"rule": "Add gamification last, after the core action is satisfying on its own.", "why": "Strip out every reward and see if the action still works. Make lapses recoverable with streak freezes or soft resets, and judge it on day-7 and day-30 retention, not interaction rate.", "kind": "principle", "source": "Singman; Bhasker"}, {"rule": "Avoid variable reward schedules in products for work, money or health.", "why": "Brain treats variable rewards as attention exploitation. Use triggers tied to real events, fixed milestone rewards tied to real progress, and investment that benefits the user.", "kind": "caution", "source": ""}, {"rule": "Label each behavioural claim by how well its evidence transfers to interfaces.", "why": "Sort claims into direct interface relevance, adjacent evidence that suggests a hypothesis, and limited transfer, such as Von Restorff, which shows a recall advantage but not that it drives action.", "kind": "technique", "source": "McCarthy-Jones, The UXologist"}], "sourcesDiffer": ["Brain (Laws of UX) allows novelty when standing out is the point and testing shows no usability cost; Pernice (NN/g) departs from convention only for a dramatic improvement. Default: Pernice's bar for routine product UI, brain's allowance for brand and storytelling surfaces.", "Game-design and onboarding skills list variable rewards and habit loops as tools; brain treats variable rewards as exploitation. Default: no variable schedules in products for work, money or health.", "Coglode suggests celebrating purchases; brain keeps enthusiasm for real effort or achievement. Default: confirm routine orders plainly; for big, considered purchases, a warm confirmation with one useful next step."], "tryIt": "Take a recent design rationale or deck that cites a psychology effect. Label each claim as direct, adjacent or limited transfer, and rewrite any that leans on a weak effect as a hypothesis with a test.", "quiz": [{"q": "A stakeholder wants to cut a pricing page from six plans to three, citing the jam study. Buyers here know what they need and the plans are simple. What fits the evidence?", "options": ["Cut to three, because choice overload is universal", "Keep the full visible set and add a marked recommendation and narrowing tools", "Hide extra plans in a dropdown", "Cut to one plan to remove all choice"], "answer": 1, "explain": "Choice overload is reliable only under four conditions, which don't hold here. Elsewhere keep the full set visible with a recommendation."}, {"q": "A team plans to rewrite all CTAs as loss-framed messages because 'losses are twice as strong'. What is the best response?", "options": ["Ship it, because the doubling effect is proven", "Combine it with a pre-selected paid add-on", "Add loss framing only to cancellation screens with repeated 'are you sure' steps", "Treat it as a hypothesis to test; the doubling holds only in some study designs"], "answer": 3, "explain": "With symmetric, unordered gains and losses the effect is about 1.07. Keep loss aversion for protective uses and test any persuasion tactic."}, {"q": "A habit app wants to add points and badges because engagement is flat. What should come first?", "options": ["Check whether the core action is satisfying without any rewards", "Add a variable reward schedule", "Measure success by interaction rate", "Remove streak freezes so lapses feel costly"], "answer": 0, "explain": "Gamification comes last. Fix the core action first, make lapses recoverable and judge it on day-7 and day-30 retention."}]}, {"id": "m13-l4", "title": "Product thinking and metrics", "neuron": "product-thinking", "intro": "Designers who frame problems well, test the riskiest assumptions and choose honest metrics shape what gets built. The core idea is that rigour scales with stakes: frame the problem free of solutions, agree the pass bar before testing, and pair every target with a guardrail.", "points": [{"rule": "Frame the problem so it isn't a solution in disguise, vague, a business goal or a symptom.", "why": "If only one solution could fix it, it's a solution in disguise. Voice test: could the person with the problem plausibly say this sentence?", "kind": "principle", "source": "Uxcel"}, {"rule": "Name the riskiest risk first: value, usability, feasibility, viability or ethics.", "why": "The risk decides the method. Don't test a solution's usability before the problem is validated.", "kind": "principle", "source": "Uxcel; Cagan"}, {"rule": "Phrase each assumption so it can fail, and agree the pass bar before the test.", "why": "Test the important, uncertain assumptions first. If 55% pass against a 70% bar, that means revise and retest, not 'close enough'.", "kind": "technique", "source": "Uxcel; Klein"}, {"rule": "Trust behaviour and commitment over stated intent; clicks prove interest only.", "why": "Ask about past behaviour, not hypothetical futures. An email-capture page only proves people will give an email; ask for real payment or a signed commitment.", "kind": "principle", "source": "Mom Test; Sharon"}, {"rule": "Apply the vanity test: could a happy, successful user never do this?", "why": "If so, it's a vanity metric. Measure a feature's purpose, not its clicks: a Save button is about retention, so check whether savers return.", "kind": "technique", "source": "Uxcel; Klein"}, {"rule": "For every target, ask how someone could hit it while making the product worse.", "why": "Pair it with a guardrail or counter-metric, such as session length up while task time and support contacts don't rise. Facebook dropped 'time spent' for this reason.", "kind": "caution", "source": "Uxcel"}, {"rule": "Choose a North Star by your business game, never revenue, with 3 to 5 input metrics.", "why": "The game is attention, transaction or productivity, and revenue lags. Add counter-metrics against Goodhart's law; good metrics are ratios compared over time.", "kind": "technique", "source": "Huryn"}, {"rule": "Don't A/B test with thin traffic, before product-market fit, or to answer 'why'.", "why": "Calculate sample size first, run at least a full business cycle and don't peek. Use 95% confidence by default and 99% for critical or irreversible flows.", "kind": "technique", "source": "Uxcel"}, {"rule": "Report a flat test by its sensitivity, and never extend it until it turns significant.", "why": "Give the smallest effect the test could detect and the interval. Reach the planned sample, then stop and log a failed hypothesis; label unplanned segment findings exploratory.", "kind": "caution", "source": "Haines"}, {"rule": "Write kill criteria in four parts before launch.", "why": "Metric, failure threshold, time window and a pre-agreed action, such as 'roll back if checkout completion is below 68% within 14 days', each with a named owner.", "kind": "technique", "source": "John, Mind the Product"}], "sourcesDiffer": ["Brain's problem statement names something measurable; Zhuo keeps metrics out of the brief. Default: state the goal in the user's terms, then attach the measure that shows it was met.", "Uxcel lists surveys for testing the problem; Sharon, Hall and Klein say surveys are almost never the way to learn needs. Default: interviews or observation for needs; surveys to screen, collect facts or measure something already defined.", "Brain reports NPS by cohort; Hall says it wasn't designed for research. Default: treat NPS as a trend beside behavioural metrics, never as an explanation.", "Sharon sends 1 to 5% of traffic to a variant on high-traffic products; brain says 50/50, or 90/10 for a risky variant. Default: 50/50 when traffic is limited; a smaller share when traffic is high or the variant is risky, after checking sample size."], "tryIt": "Take one metric your team is targeting and run it through the vanity test and the gaming question. Write the guardrail it needs and a four-part kill criterion for the next release that moves it.", "quiz": [{"q": "A brief reads 'Users need a dashboard to see their data.' What is wrong with it?", "options": ["It is too measurable", "It is a solution in disguise; only one solution could fix it", "It names the user too specifically", "It should name a business outcome like 'increase revenue' instead"], "answer": 1, "explain": "A frame that allows only one solution is a solution in disguise. 'Increase revenue' would be another failure: a business outcome posing as the problem."}, {"q": "An onboarding test hits 55% completion against an agreed 70% bar. What should the team do?", "options": ["Ship, since 55% is close enough", "Lower the bar to 50% and call it a pass", "Revise the design and retest", "Keep running the test until it reaches 70%"], "answer": 2, "explain": "The pass bar is agreed before testing. Missing it means revise and retest, and extending a finished test until it passes is ruled out."}, {"q": "A team wants to increase session length by 20%. What does the lesson recommend adding?", "options": ["A guardrail, such as task time and support contacts not rising", "A second vanity metric to confirm it", "Revenue as the North Star instead", "Nothing; session length is always a good sign"], "answer": 0, "explain": "Ask how the target could be hit while making the product worse, and pair it with a guardrail. Facebook dropped 'time spent' for this reason."}]}, {"id": "m13-l5", "title": "Strategy and decisions", "neuron": "product-strategy", "intro": "Strategy is choosing what to do and what not to, and good decisions come from naming the real blocker and how reversible the call is. The core idea is to diagnose before acting, count complexity as a cost, and match commitment to how hard a decision is to undo.", "points": [{"rule": "Write strategy as diagnosis, guiding policy and coherent actions, not a list of targets.", "why": "A list of targets isn't a strategy. A strategy says what you won't do, and every choice should reinforce the others so the whole is hard to copy.", "kind": "principle", "source": "Rumelt; Huryn"}, {"rule": "Ask how much more complicated the product becomes, not how hard it is to build.", "why": "Each toggle roughly doubles the states QA, support and users handle, and hiding a feature under 'advanced' doesn't remove its cost. Removing rarely used features is a real improvement.", "kind": "principle", "source": "Gale, First Round"}, {"rule": "Name a core blocker that passes at least two of five tests.", "why": "Fixing it eases other problems, leaving it weakens other fixes, it explains past failures, it sits close to behaviour or results, and you can change it. 'New users don't reach first value within 10 minutes' qualifies; 'the experience is poor' doesn't.", "kind": "technique", "source": "product-decision-agent"}, {"rule": "Find the mechanism behind the blocker before choosing a fix.", "why": "Common pairs are value or friction, inflow or absorption, goals or incentives, and rules or behaviour. Confirm with segments, time order or comparison, because co-occurrence isn't cause.", "kind": "technique", "source": "product-decision-agent"}, {"rule": "Judge the product's stage before choosing the move, and watch for that stage's trap.", "why": "Exploration risks building the full product; validation risks polishing first; finding fit risks widening early; growth risks spreading effort; crisis risks carrying on with the roadmap.", "kind": "technique", "source": "product-decision-agent"}, {"rule": "Move fast on two-way doors; consult and plan rollback for one-way doors.", "why": "State confidence as a probability and decide at about 70%. Before an irreversible call, ask for the riskiest assumption, the cheapest test and the last responsible moment to commit.", "kind": "principle", "source": "Uxcel; Frischoff"}, {"rule": "Sort pre-mortem findings into tigers, paper tigers and elephants.", "why": "Tigers are real threats, paper tigers are worries nobody believes, and elephants are what nobody discusses, the most valuable output. Sort tigers into launch-blocking, fast-follow and track.", "kind": "technique", "source": "Huryn"}, {"rule": "When a leader inserts an urgent request, accept the goal before the solution.", "why": "Offer three options (do it now and drop a named item, a short validation, or the next version) with the costs on one page. Never just say no, and never silently absorb the scope.", "kind": "technique", "source": "product-decision-agent"}, {"rule": "Count commitment, not survey interest, as the go signal for an idea.", "why": "Payment, pre-orders or a pilot count; stated interest is weak evidence. Paying competitors validate demand, and none may mean no market.", "kind": "caution", "source": ""}, {"rule": "Ban vague actions like 'improve the experience' unless they come with an action, metric and window.", "why": "A product call should give a one-line judgement, 2 to 4 reasons, 1 to 3 actions each with owner, metric and window, and what not to do now.", "kind": "caution", "source": "product-decision-agent"}], "sourcesDiffer": ["Brain shows 2 to 3 options for cross-functional votes; Lenny skills want one opinionated recommendation. Default: show the option space, recommend one, and name the decider beforehand.", "Brain imagines failure a year out in pre-mortems; Huryn imagines a launch in 14 days. Default: launch framing for a release, a year for strategy.", "Kashpur uses a per-feature ROI scorecard; Mironov says per-feature ROI figures are usually invented. Default: use a scorecard to compare and review, but trust only orders of magnitude agreed with sales."], "tryIt": "Pick a stuck problem on your current product. Write the core blocker, check it against the five tests, name the mechanism behind it and give one action with owner, metric and time window.", "quiz": [{"q": "A team names its core blocker as 'the experience is poor'. Why is this weak?", "options": ["It is too close to user behaviour", "It explains why earlier attempts failed", "It is vague and can't be checked against the five tests, unlike 'new users don't reach first value within 10 minutes'", "Blockers should always be about data quality"], "answer": 2, "explain": "A good core blocker is specific, close to behaviour or results, and within your power to change. 'The experience is poor' is given as a bad example."}, {"q": "A designer proposes adding a settings toggle for a niche preference. What is the strongest objection?", "options": ["Toggles are hard for engineers to build", "Each toggle roughly doubles the states QA, support and users handle", "It should be hidden under 'advanced' to remove its cost", "Toggles always fail usability tests"], "answer": 1, "explain": "Complexity cost is about how much more complicated the product becomes. Hiding it under 'advanced' doesn't remove the cost."}, {"q": "A decision can be easily rolled back via a feature flag. How should the team treat it?", "options": ["As a two-way door: move fast", "As a one-way door: consult widely and plan for months", "Wait for complete data before deciding", "Run a year-long pre-mortem first"], "answer": 0, "explain": "Reversible decisions are two-way doors. Over-testing a reversible call is as wrong as under-testing an irreversible one."}]}, {"id": "m13-l6", "title": "Customer journeys", "neuron": "journeys", "intro": "Screens can each pass testing while the journey they belong to fails. The core idea is to name the level a problem sits at, map journeys with one actor and real evidence, and give journeys owners who keep improving them across channels and teams.", "points": [{"rule": "Name the level, interaction, journey or relationship, before choosing the fix.", "why": "An interaction is one task on one channel; a journey runs across channels over time to one goal; the relationship is the lifetime. Many journey and relationship problems can't be fixed inside one product.", "kind": "principle", "source": "Flaherty, NN/g"}, {"rule": "Evaluate whole journeys, not screens, because touchpoint scores compound.", "why": "Four steps each at 85 to 90% give about 59% end to end (an arithmetic illustration). No level matters less: poor interface copy can still derail a whole journey.", "kind": "evidence", "source": "Merholz; Flaherty, NN/g"}, {"rule": "Use three questions to choose between a journey map and a flow.", "why": "Does it cross channels or products? Does it take days or months? Do thoughts and feelings around decisions matter? Any yes points to a journey; link the two views on purpose.", "kind": "technique", "source": "Kaplan, NN/g"}, {"rule": "Keep each map to one actor and one scenario, with evidence behind every step.", "why": "Maps fail when the scope is too broad, they aren't based on research, or they lose sight of user needs. A persona can have several scenarios, each its own map.", "kind": "principle", "source": "Kendrick and Kaplan; Gibbons, NN/g"}, {"rule": "Pick the mapping method by time and knowledge, and label unvalidated maps 'hypothesis'.", "why": "Research-first takes 3 to 12 weeks; hypothesis-first starts with a 1 to 2 day workshop that research then validates; quick-fire is 60 to 90 minutes for a well-understood, urgent problem.", "kind": "technique", "source": "Kendrick and Kaplan, NN/g"}, {"rule": "Add a lane for failure touchpoints, and expect people to join mid-journey.", "why": "Errors, lock-outs, outages and urgent support contacts test the experience most. Stress journeys for time, behaviour and network: returning next month, two tabs, a dropped connection mid-payment.", "kind": "technique", "source": "Friedman, Smashing"}, {"rule": "Look for omnichannel failures at handovers between teams.", "why": "The three types are not seamless, inconsistent and not orchestrated. Each sits at a handover, so no single team can fix it alone.", "kind": "principle", "source": "Flaherty, NN/g"}, {"rule": "Never ask on paper for what was already given online.", "why": "Design both ends of a handoff: set expectations and pass on what the next step needs, then deliver what was promised. In one study a patient who checked in online was handed the same form at the desk.", "kind": "caution", "source": "Flaherty and Katsarakes, NN/g"}, {"rule": "Treat a map as a start, and give each journey an owner who keeps improving it.", "why": "A one-off map changes little. A journey manager acts as product owner for one journey, so journeys must be ranked first, and the role needs seniority to influence siloed teams.", "kind": "principle", "source": "Flaherty, NN/g"}, {"rule": "Rank pain points at each level, and feed them into the roadmap ahead of feature requests.", "why": "Rank interaction pain by severity, journey pain by reach and feasibility, and relationship pain by churn and lost loyalty. Fixing all of it isn't affordable, so rank it.", "kind": "technique", "source": "Gibbons, NN/g"}], "sourcesDiffer": ["Flaherty (NN/g, 2025) argues mature products have used up most interface gains; her 2023 article says every level counts. Default: interface rules stand and journey work is added on top, not traded for them, because the 2025 claim is opinion without data."], "tryIt": "Pick one journey your product is part of and map one persona and one scenario end to end, including emails and handoffs. Add a failure lane and mark each pain point as interaction, journey or relationship.", "quiz": [{"q": "Customers get a letter with terms that differ from the website. Which kind of failure is this, and who can fix it?", "options": ["An interaction failure the web team can fix alone", "A relationship failure only marketing can fix", "A usability issue found through A/B testing", "An inconsistency failure at a handover, needing more than one team"], "answer": 3, "explain": "Inconsistent terms across channels are an omnichannel failure. Each such failure sits at a handover between teams, so no single team can fix it alone."}, {"q": "A team has a stakeholder workshop draft of a journey map and no research yet. How should they treat it?", "options": ["As final, since stakeholders know customers best", "As a hypothesis to validate with research, marked as such on the map", "As a quick-fire map ready to ship", "As a path report from analytics"], "answer": 1, "explain": "Hypothesis-first mapping starts with a workshop draft that research then validates. Until validated, the map says 'hypothesis' on it."}, {"q": "Four steps in a sign-up journey each score about 88% on their own. What should the team conclude?"
