orrow what is worth stealing, and let the firm defaults win where they disagree.", "points": [{"rule": "Study each system for its strength; treat the set as a comparison, not a rulebook.", "why": "GOV.UK for forms and evidence, Carbon for data tables and density, Atlassian for tokens and writing, Primer for loading thresholds and themes, Fluent for button vocabulary. Material is an emphasis model, not a model for text fields: its floating label conflicts with brain.", "kind": "principle", "source": ""}, {"rule": "Never ship a default density that fails the 24px minimum target.", "why": "Salt openly flags its High density as failing WCAG 2.2 AA. Brain's default is a global three-level setting with 40px default and 32px compact table rows.", "kind": "caution", "source": "Salt"}, {"rule": "Separate behaviour from styling with a headless layer.", "why": "Spectrum's React Aria is the clearest published split. Use a few enumerated props for size, density and variant, slots for structure, and layout primitives so teams don't invent spacing.", "kind": "technique", "source": "Spectrum"}, {"rule": "Follow a loading ladder: nothing under 1s, indeterminate to 3s, determinate beyond.", "why": "Primer gives the only hard numbers: 3 to 10s determinate if possible, over 10s determinate and moved to a background task. Brain adds a 200ms show-delay and a 500ms minimum once shown.", "kind": "evidence", "source": "Primer"}, {"rule": "Give unavailable actions a visible reason; never pre-disable submit.", "why": "Primer's inactive button stays focusable and a click explains why. Brain uses an inactive or soft-disabled state with a visible reason for actions other than submit.", "kind": "default", "source": "Primer"}, {"rule": "Borrow a precise vocabulary for dismiss and confirm labels.", "why": "Fluent: Cancel discards, Close leaves the task alone, Done only acknowledges, Finish commits, Dismiss stops reminders. Labels then name the outcome.", "kind": "technique", "source": "Fluent"}, {"rule": "Never put errors in toasts; toasts last at least 6s, paused on hover and focus.", "why": "Atlassian, Polaris and Fluent agree errors don't go in auto-dismiss toasts. A failed submit gets a focused error summary plus inline errors.", "kind": "default", "source": "Atlassian; Polaris; Fluent; GOV.UK"}, {"rule": "Keep the selected tab, filters, sort and page in the URL.", "why": "GOV.UK keeps the selected tab in the URL fragment so Back returns to it, and filtering resets to page 1. Primer puts the search query in the URL so it can be shared.", "kind": "default", "source": "GOV.UK; Primer"}, {"rule": "Use pagination for data, never infinite scroll.", "why": "GOV.UK rejects infinite scroll because of keyboard users. Brain's default page size is 25, with the total count shown and the controls hidden when there is one page.", "kind": "default", "source": "GOV.UK"}, {"rule": "Publish what was tested on every component page.", "why": "GOV.UK pages carry research notes; Carbon shows status labels and last-updated dates. Brain adds an evidence line and results for keyboard, one screen reader, zoom and reflow, and contrast.", "kind": "technique", "source": "GOV.UK; Carbon"}], "sourcesDiffer": ["Where the primary sits in a dialog: Atlassian and Primer right-align; Carbon splits two buttons at 50% each. Default: secondary left, primary rightmost.", "Validation timing: Carbon validates in real time, Polaris after the person finishes a field, GOV.UK on submit. Default: submit validation with summary and inline errors; once an error exists, revalidate on blur; never flag partial input.", "Side navigation depth: Primer allows 4 levels, Atlassian says minimal. Default: 3.", "Pagination slots: Atlassian allows 14 on large screens, GOV.UK about 7. Default: 7 on mobile and 11 on desktop."], "tryIt": "Pick one component your team is about to design, read how GOV.UK, Carbon and Primer handle it, and write down one thing worth stealing and one place where your defaults should win.", "quiz": [{"q": "Saving a record usually takes about 2 seconds. Which loading treatment fits?", "options": ["Show nothing at all", "A determinate bar moved to a background task", "An indeterminate indicator after a short show-delay", "A full-page interstitial"], "answer": 2, "explain": "Between 1 and 3 seconds an indeterminate indicator fits, shown after a short delay so quick saves don't flash."}, {"q": "A product manager wants the tightest density as the default for a data-heavy app. What is the main concern?", "options": ["The tightest level may fail the 24px minimum target, so it shouldn't be the default", "Tight density always improves usability, so there's no concern", "Density should only ever be a per-component prop", "Density only matters on mobile"], "answer": 0, "explain": "Salt flags its High density as failing WCAG 2.2 AA. Never ship a default level that fails the 24px target."}, {"q": "A form submit fails with two field errors. How should the feedback appear?", "options": ["In an auto-dismissing toast", "In a toast that lasts 6 seconds", "By disabling submit until the errors are fixed", "In place: a focused error summary plus inline errors"], "answer": 3, "explain": "Errors never go in toasts. A failed submit gets a summary with links plus inline errors at each field."}]}, {"id": "m07-l5", "title": "Specs, handoff and AI-readable systems", "neuron": "design-system-specs-and-ai", "intro": "Specs carry the judgement that code can't show. Good handoff and machine-readable docs stop developers and AI agents alike from guessing.", "points": [{"rule": "Write usage rules that can fail a check.", "why": "Each rule names an observable condition, a checkable token (a number with unit, a component or prop name), a reason and a check. Words like appropriate, consistent or as needed fail outright.", "kind": "technique", "source": "arla6ka"}, {"rule": "Set limits one step below a measured break.", "why": "At the narrowest supported width, grow content until it breaks and set the limit one step below. A segmented control broke at 5 options at 390px, so the rule became at most 4, then a select.", "kind": "technique", "source": "arla6ka"}, {"rule": "Hand off every state and edge case, and explain the why.", "why": "Specify layout in tokens, final copy with truncation rules, every state, keyboard behaviour, per-breakpoint changes, focus order, and minimum, maximum and translated content. The why lets developers make good calls.", "kind": "technique", "source": "Anthropic Design Handoff; Kasturika, IxDF"}, {"rule": "Bring developers in at ideation, and ask what's hard rather than can you build it.", "why": "At Digg a small-looking change to the vote button would have meant re-architecting servers. Asking what's hard surfaces risks; asking if it can be built forces early commitments.", "kind": "principle", "source": "Rocheleau, Cao, Zieba (UXPin)"}, {"rule": "Prefer flows, prototypes and short clips to redline documents.", "why": "Long redlines get ignored. Keep one living style guide as the single source of truth, and don't chase pixel-match at the expense of usability.", "kind": "principle", "source": "ustwo, Pixel Perfect Precision"}, {"rule": "Resolve design-to-code conflicts toward tokens.", "why": "Code uses the token and adjusts minimally, commenting any deliberate deviation. Stop and ask when rounding would visibly change the design; recurring conflicts mean the file or token needs fixing.", "kind": "technique", "source": "OpenAI; Krehel"}, {"rule": "Build only what the design draws, and list missing states.", "why": "Inventing empty, error or loading states, or changing code around the piece, is the commonest failure. Report undrawn states as missing instead.", "kind": "caution", "source": "Krehel"}, {"rule": "Give AI agents spec files, a closed token list and a merge-blocking audit.", "why": "Models invent plausible values and forget between sessions, so one prototype can look like three products. Specs act as memory; raw colours and spacing are errors reported with the token to use.", "kind": "technique", "source": "Pandya"}, {"rule": "Ship an AGENTS.md and an llms.txt before anything heavier.", "why": "Across 31 public systems most missing points were in agent access and readable docs; these two static files were estimated to lift the median from 5 to 7 out of 10 (vendor scoring, indicative).", "kind": "evidence", "source": "Mansour, Supernova"}, {"rule": "When reviewing AI output, read the code, not just the preview.", "why": "Typical failures are raw hex values, div controls, transition: all, generic padding and shadows, and missing empty, error, disabled and reduced-motion states.", "kind": "caution", "source": "Karl Koch"}], "sourcesDiffer": ["Raw durations in an audit: Pandya treats them as warnings; brain builds reduced motion into motion tokens, which a raw duration skips. Default: warnings during migration, errors once motion tokens exist."], "tryIt": "Take one component spec and rewrite every vague rule so it names a number, token or component and a check; then measure where it breaks at your narrowest width and set its limit.", "quiz": [{"q": "A component doc says: use an appropriate number of segments. What is wrong with it?", "options": ["Nothing, it is clear enough", "It can't fail a check; measure where it breaks and state a number, such as at most 4 then a select", "It should say a consistent number instead", "It belongs in the Figma file, not the docs"], "answer": 1, "explain": "Words like appropriate fail outright. A rule needs a checkable token, ideally a limit set one step below a measured break."}, {"q": "A design shows 18px padding, but the nearest spacing token is 16px and the difference isn't noticeable. What should the build do?", "options": ["Use the 16px token and note it as rounded", "Hard-code 18px to match the design exactly", "Create a new 18px token", "Ignore the design and pick any value"], "answer": 0, "explain": "Conflicts resolve toward tokens with minimal adjustment, listed as rounded. Stop and ask only if rounding would visibly change the design."}, {"q": "Across AI coding sessions your prototype has picked up two link blues and radii of 6 and 8px. What is the most effective fix?", "options": ["Ask the model to be more careful", "Review screenshots only", "Paste more examples into each prompt", "Add spec files, a closed token list and an audit that blocks merges"], "answer": 3, "explain": "Specs act as memory between sessions, a closed token list removes invented values, and a blocking audit catches slips."}]}, {"id": "m07-l6", "title": "Frontend practice for design leads", "neuron": "frontend-engineering", "intro": "Specs that don't name engineering decisions get filled with framework defaults. Knowing how components, state, data and rendering work lets a design lead specify the experience, not just the look.", "points": [{"rule": "Choose the element by behaviour: links navigate, buttons act.", "why": "Polymorphic components only keep styling consistent after that choice. Button styling on a link is kept for calls to action that navigate.", "kind": "default", "source": "design-system-starter; shadcn"}, {"rule": "Prefer composition over configuration props.", "why": "A Card with Card.Header, Card.Body and Card.Footer children beats one Card with hasHeader and footerContent props. Booleans that switch parts on and off are the warning sign.", "kind": "technique", "source": "design-system-starter"}, {"rule": "Mark what kind of state each piece is, above all what belongs in the URL.", "why": "Local UI, global client, server, URL and form state each have their own tools; mixing them causes most stale-data bugs. Never copy server data into local state or store what can be derived.", "kind": "technique", "source": "react-state-management"}, {"rule": "Spec every data view in order: error, loading, empty, then data.", "why": "This order implements the state inventory for lists, tables and cards. During a refetch with cached data, keep the data with a quiet updating cue rather than flashing a spinner.", "kind": "technique", "source": "react-ui-patterns"}, {"rule": "Decide how stale each type of data may be, and write it in the spec.", "why": "TanStack Query's default staleTime of 0 refetches on every remount, showing loaders or jumps. It also retries three times before showing an error, so design a still-trying moment. Library defaults change, so recheck them.", "kind": "technique", "source": "tanstack-query-expert"}, {"rule": "Design pages as independent regions, each with its own loading and error state.", "why": "Sequential request waterfalls are named the biggest performance problem. Independent regions let engineering fetch in parallel, and error boundaries contain a crash to its region.", "kind": "principle", "source": "react-best-practices"}, {"rule": "Know the Core Web Vitals bands.", "why": "Good is LCP at 2.5s or less, INP at 200ms or less and CLS at 0.1 or less, with a page passing when 75% of visits are good. INP replaced FID in March 2024.", "kind": "evidence", "source": "web.dev; Osmani"}, {"rule": "Specify image ratios, embed sizes and where late content appears.", "why": "Designers own most layout shift. Reserve space for images, embeds and banners, never insert content above visible content without a slot, and animate only transform and opacity.", "kind": "technique", "source": "web-quality-skills; Osmani"}, {"rule": "Keep field and lab evidence apart.", "why": "A Lighthouse run is one lab session; CrUX and your own RUM are field data. Never compare a lab value with a field p75, and test on real mid-range phones, since good desktop scores often hide poor mobile ones.", "kind": "caution", "source": "Osmani"}, {"rule": "Put no flash of the wrong theme in acceptance criteria.", "why": "Theme or density stored in the browser renders with the default first and flips after hydration. A small inline script that sets it before first paint avoids the flash.", "kind": "technique", "source": "react-best-practices"}], "sourcesDiffer": ["Where errors show: react-ui-patterns puts recoverable errors in toasts and shows raw error messages; brain never toasts errors. Default: in-place feedback at field, banner or full-screen level, with technical messages mapped to written ones.", "Core Web Vitals targets: building-blog targets LCP under 2.0s, INP under 150ms and CLS under 0.05. Default: Google's bands as the pass mark, the tighter set as the quality target for marketing and content pages.", "When to extract a component: tailwind-patterns extracts at three repeats; brain extracts on the second real use. Default: second use for anything with behaviour or a system role; three repeats is fine for static styling.", "Page weight: brain's example budget is 1MB for a landing page; Osmani starts at 1.5MB with JavaScript under 300KB. Default: 1MB for landing pages, Osmani's figures as a ceiling for heavier content and commerce pages."], "tryIt": "For one screen you're designing, annotate each piece of state by kind (local, global, server, URL, form), its loading, error and empty treatment, and how stale its data may be.", "quiz": [{"q": "People complain that a filtered table loses its filters when they share the link. What should the spec say?", "options": ["Store the filters in global client state", "Store the filters in local component state", "Put filter, sort and page in the URL", "Save the filters in browser storage"], "answer": 2, "explain": "Filters, sort and page are URL state, so links can be shared and the back button works."}, {"q": "A list refetches in the background while cached rows are already on screen. What should people see?", "options": ["The existing rows, with a quiet updating cue", "A spinner replacing the rows", "The empty state until new data arrives", "A skeleton replacing the rows"], "answer": 0, "explain": "Show a loader only when there is nothing to show. With cached data, keep it visible and add a quiet cue."}, {"q": "A desktop Lighthouse run shows LCP at 1.8s, but the field p75 is 3.6s. What do you report?", "options": ["The page passes, because the lab run is under 2.5s", "Average the two numbers", "Trust the lab result, since it is more controlled", "Keep them apart: real users' p75 is outside the good band, so investigate on mid-range phones"], "answer": 3, "explain": "Lab and field evidence are never compared directly. The field p75 reflects real visits and isn't in the good band of 2.5s or less."}]}, {"id": "m07-l7", "title": "Frontend quality and accessibility in code", "neuron": "frontend-quality", "intro": "Design rules only hold if the build carries them. Shared schemas, behaviour tests and code-level accessibility make sure what ships matches what was specified.", "points": [{"rule": "Use one validation schema for client and server.", "why": "One schema validates the form and the request and infers types, so rules and messages can't drift apart. Cross-field errors must name a field, or the inline message never appears.", "kind": "technique", "source": "zod-validation-expert"}, {"rule": "Treat an emptied optional field as no value.", "why": "Optional rules often accept an absent value but reject an empty string, so clearing an optional field raises an error.", "kind": "caution", "source": "zod-validation-expert"}, {"rule": "Never pre-disable submit; while a request is pending, use aria-disabled.", "why": "Native disabled on the focused button drops focus to the page body. Use aria-disabled and ignore repeat clicks, and never set both on one element.", "kind": "default", "source": "Krehel"}, {"rule": "Link inline errors with aria-describedby and move focus to the error summary.", "why": "Putting role=alert on every inline error stacks interrupting announcements when several fields fail at once.", "kind": "default", "source": ""}, {"rule": "Locate test elements by role, label and visible text.", "why": "Tests that find elements the way people do fail when names or roles are missing, so they double as accessibility checks. Test behaviour, not implementation.", "kind": "technique", "source": "playwright-e2e-builder"}, {"rule": "Run a manual accessibility pass before each release.", "why": "Tab through and activate with Enter and Space; use one screen reader per platform; check 200% and 400% zoom, forced colours and reduced motion; confirm focus order matches visual order; turn JavaScript off for core tasks.", "kind": "technique", "source": "web-quality-skills; accessibility-auditor"}, {"rule": "Keep the browser's focus ring, or check a custom ring against every colour it crosses.", "why": "The native ring adapts to platform and forced colours. An outline with no colour renders currentColor, which may fail contrast.", "kind": "default", "source": "Krehel"}, {"rule": "Pick the announcement mechanism in a fixed order.", "why": "If focus moves there, the move is the announcement; tied to a control, use aria-describedby; non-urgent, a polite status region; urgent, an alert. Never move focus to a toast.", "kind": "technique", "source": "Krehel"}, {"rule": "On single-page route changes, update the title and move focus to the new h1.", "why": "Write the title most specific first, focus the new view's h1 or main, restore scroll on Back and Forward, and scroll to top on new navigation.", "kind": "technique", "source": "Krehel"}, {"rule": "Map every API status code to a designed state.", "why": "401 means sign in again and keep the work; 403 a permission-denied state; 409 a field error with a way forward; 422 inline errors; 429 says when to try again. Ask for field-level error details.", "kind": "technique", "source": "api-design-principles"}], "sourcesDiffer": ["Pre-disabled submit: react-ui-patterns disables submit while the form is invalid; brain never pre-disables submit and disables only while the request is in flight. Default: brain.", "Announcing field errors: web-quality-skills and tailwind-design-system put role=alert on every inline error. Default: aria-describedby and aria-invalid, with focus moved to the error summary.", "Disabled controls in focus order: uSpec removes them; brain keeps aria-disabled controls focusable when people need to learn why. Default: brain's, for controls that need explaining.", "aria-busy: Krehel sets it on updating regions; Roselli finds it poorly supported. Default: announce loading and outcome text in a polite status region, with aria-busy only as an extra."], "tryIt": "Run the manual release checklist on one flow you own, and write down every API status code it can hit alongside the state the user sees for each.", "quiz": [{"q": "A Save button uses native disabled with a tooltip explaining why, but keyboard and touch users never see the explanation. What is the fix?", "options": ["Add a title attribute to the button", "Use aria-disabled so it stays focusable, block activation in the handler and explain nearby", "Set both disabled and aria-disabled", "Remove the explanation entirely"], "answer": 1, "explain": "Native disabled removes focus and pointer events, so the tooltip never opens. aria-disabled keeps it focusable while the handler blocks activation."}, {"q": "An autosave completes and you want screen-reader users to hear Saved. Which mechanism fits?", "options": ["Move focus to the confirmation", "An assertive alert", "A polite status region", "An aria-label on a plain div"], "answer": 2, "explain": "A non-urgent message not tied to a control goes in a polite status region. Focus never moves to a toast, and aria-label on a div does nothing."}, {"q": "A signed-in user opens a record and the API returns 403. Which state should the UI show?", "options": ["The sign-in screen", "A generic server error", "A not-found page", "A permission-denied state"], "answer": 3, "explain": "403 means signed in but not allowed, which maps to a permission-denied state. 401 is the one that asks people to sign in again."}]}]}, {"id": "m08", "title": "Motion and content", "summary": "How to decide when and how to animate, and how to write interface copy that is plain, consistent, localisable, on-voice and free of generated filler.", "neurons": ["motion", "motion-craft", "content-and-brand", "voice-and-tone", "writing-quality"], "lessons": [{"id": "m08-l1", "title": "When to animate", "neuron": "motion", "intro": "Decide whether to animate before deciding how. Motion should explain a change or mark a rare moment, and it must never get in the way of what people are trying to do. Reduced motion is planned from the start, not retrofitted.", "points": [{"rule": "Animate only with a stated purpose, and never block input while motion plays.", "why": "Every animation should orient, direct attention, show cause and effect, give feedback, demonstrate or express the brand. Input during an animation is never ignored: an interrupted transition reverses or retargets to the newest choice.", "kind": "default", "source": "Val Head"}, {"rule": "Scale motion to frequency: the more often something happens, the less it animates.", "why": "Actions used 100+ times a day and anything triggered from the keyboard get no animation; hover and list navigation get little or none; modals, drawers and toasts get standard motion; only rare or first-time moments carry delight.", "kind": "principle", "source": "Emil Kowalski"}, {"rule": "Honour reduced motion: show the end state by default and animate only under no-preference.", "why": "Swap bounces for fades rather than removing feedback. Remove vestibular triggers first: motion large relative to the viewport, movement that doesn't match input (parallax, scroll-jacking) and fast zooms through depth.", "kind": "default", "source": "Val Head; García, Smashing"}, {"rule": "Slow essential indicators under reduced motion instead of freezing them.", "why": "A frozen spinner reads as a broken page. Slow its rotation, drop pulsing scale and stop looping after about 5 seconds; opacity and colour changes need no adaptation at all.", "kind": "technique", "source": "García, Smashing"}, {"rule": "Start any feedback animation within about 0.1 seconds of the action.", "why": "An animation only feels caused by the user if it begins that quickly. Lag breaks the link between cause and effect.", "kind": "evidence", "source": "Harley, NN/g"}, {"rule": "Keep entrance motion for content that actually arrives.", "why": "Static headings and navigation have nothing to announce. Entrances on static headings, pulsing status dots and several identical staggered fade-ins in one view are flagged as generated-looking motion.", "kind": "caution", "source": "Volpe; kylezantos"}, {"rule": "Don't slide in non-urgent extras such as chat invitations or back-to-top links.", "why": "Movement in peripheral vision pulls the eye automatically, and a slide does it faster than a fade. For contextual features that shouldn't interrupt, use a subtle fade with no position change, or nothing.", "kind": "evidence", "source": "Harley, NN/g"}, {"rule": "Spend the craft on the completion moment of a core, repeated task.", "why": "A saved calendar event that shrinks onto its day confirms both that it saved and where. The flourish must communicate, not decorate.", "kind": "principle", "source": "Lichaw"}, {"rule": "No scroll-jacking or 3D parallax in product UI.", "why": "A whole page of scrolljacking disoriented every participant in NN/g's study; some thought their mouse was broken. Scroll-driven effects are for progress bars and reveals only, behind reduced-motion checks.", "kind": "caution", "source": "Paul, NN/g"}, {"rule": "Make sure content survives the animation not running.", "why": "Content that starts at opacity 0 and appears only through an entrance disappears for good when motion is off or code fails. Keep content visible by default and apply hide-then-reveal only when scripting is confirmed.", "kind": "caution", "source": "Soparat; Val Head"}], "sourcesDiffer": ["Kowalski allows deliberate delight on rare moments; Head says delight on its own doesn't count as a purpose; default: rare delight is fine if you can say what it does for the user or the brand."], "tryIt": "List every animation in one flow you own, tag each with its purpose and how often people see it, and cut or shorten any that are frequent and purposeless. Then check each one under reduced motion.", "quiz": [{"q": "A command palette opened by keyboard shortcut dozens of times a day currently scales and fades in over 250ms. What should you do?", "options": ["Slow it to 400ms so it feels more premium", "Keep it but add a spring bounce", "Remove the animation so it appears instantly", "Only animate it on the first open of the day"], "answer": 2, "explain": "High-frequency actions and anything triggered from the keyboard get no animation; motion there becomes an obstacle."}, {"q": "Under reduced motion, a team removes all animation, including the loading spinner. What is the problem?", "options": ["A frozen spinner reads as a broken page; slow it and stop looping after about 5 seconds instead", "Nothing; reduced motion means zero animation", "Spinners must keep their full speed for accessibility", "The spinner should be replaced by a progress toast"], "answer": 0, "explain": "Essential indicators are toned down, not removed: slow the rotation, drop pulsing and stop after about 5 seconds."}, {"q": "A marketing team wants the chat invitation to slide in from the side while people read an article. What is the better choice?", "options": ["Slide it in faster so it is over sooner", "Use a subtle fade with no position change, or no animation", "Bounce it to make it friendlier", "Slide it in only on mobile"], "answer": 1, "explain": "Slides grab peripheral attention faster than fades, so non-urgent extras should not slide in."}]}, {"id": "m08-l2", "title": "Motion craft and timing", "neuron": "motion-craft", "intro": "Once motion has a purpose, timing, easing and the choice of what to animate decide whether it feels right. Most product UI motion is short, eases out, and moves only transform and opacity.", "points": [{"rule": "Keep most product UI motion under 300ms, sized to the component.", "why": "Press 100–160ms, tooltips 125–200ms, dropdowns 150–250ms, modals and drawers 200–500ms. Bigger moves need more time: roughly 150ms under 100px, 300ms up to 500px, 500ms beyond.", "kind": "technique", "source": "Emil Kowalski; bencium"}, {"rule": "Make exits faster and smaller than entrances.", "why": "Exits run at about 60–75% of the entrance duration, or one speed tier quicker, because a close is a decision already made. Exit with a small fixed move, not the container's full height.", "kind": "principle", "source": "Kostenchuk; Krehel; fluid-functionalism"}, {"rule": "Never use ease-in for UI entrances; ease out to enter.", "why": "Use stronger curves than the CSS defaults. Linear is only for spinners, progress and representing time.", "kind": "technique", "source": "Emil Kowalski"}, {"rule": "Enter from scale 0.95 with opacity 0, never from scale 0.", "why": "Press feedback scales to about 0.97 and never below 0.95. Popovers grow from their trigger; modals from the centre.", "kind": "technique", "source": "Emil Kowalski"}, {"rule": "Animate only transform and opacity; never transition all, width, height or box-shadow.", "why": "Grow with scale and move with translate. Animating layout properties re-lays out the page every frame, and box-shadow repaints every frame. Add will-change only after measuring a problem.", "kind": "technique", "source": "Emil Kowalski"}, {"rule": "Use springs for user-driven gestures and easing for system-driven changes.", "why": "Drags and flicks need springs that keep release velocity; a toast on a spring feels restless. The default spring is critically damped with no bounce, and there is never bounce on menus, modals, toggles, settings or errors.", "kind": "principle", "source": "Salaja; Apple Design; Kowalski"}, {"rule": "Retrigger from the current position; never restart an animation.", "why": "Always animate from the current on-screen value. Drag and scroll-linked motion track input every frame rather than easing toward it.", "kind": "caution", "source": "arla6ka"}, {"rule": "Stagger lists 30–80ms per item, keeping the whole sequence under 500ms.", "why": "Stagger only when the order means something; otherwise items enter together. Dense UI may need a total nearer 300ms.", "kind": "default", "source": "Design brain; Dean; Antalik"}, {"rule": "When a sort or filter changes order, move items; don't re-enter them.", "why": "Animate items to their new positions so people can follow what changed, rather than exiting and entering them as if they were new. Reorders stay under 300ms.", "kind": "technique", "source": "Volpe"}, {"rule": "Define motion as a few duration tokens and named easings.", "why": "4–6 duration tokens and named easings (standard, decelerate for entry, accelerate for exit, spring, linear for loops) let reduced motion be applied once by overriding the tokens. Five near-identical hand-typed curves should be consolidated.", "kind": "technique", "source": "Dean; Kowalski"}], "sourcesDiffer": ["Val Head puts UI timing at 200–500ms; Kowalski and Vercel put most product UI at 150–300ms and press feedback at 100–160ms; default: feedback that only confirms a press can be under 200ms, while anything people must follow needs time to be seen.", "Kowalski and Krehel ease out on exit; others ease in for leaving; default: exits are fast, subtle and ease-out or ease-in-out, with ease-in only for an element leaving the screen entirely.", "Muthahhary ignores clicks during a layout morph; Head says never ignore input; default: Head's, retarget or reverse, and keep unreversible morphs to about 250–350ms or use a crossfade."], "tryIt": "Pick one dropdown and one modal in your product and write their enter and exit durations, scales and easings as tokens. Check exits are shorter and that nothing animates width, height or box-shadow.", "quiz": [{"q": "A modal opens in 300ms and closes in 300ms using the reversed opening curve. What would you change first?", "options": ["Lengthen the close to 400ms for symmetry", "Add a bounce on close", "Make the close shorter, about 60–75% of the opening, with its own curve", "Switch both to linear easing"], "answer": 2, "explain": "Exits should be faster than entrances, and a reversed ease-out plays as a sluggish ease-in, so close needs its own curve."}, {"q": "A drawer follows the finger during a drag, then is released mid-flick. What should drive the motion after release?", "options": ["A fixed 300ms ease-in-out tween from the start position", "A bouncy spring with high overshoot", "An instant cut to the closed state", "A spring that starts from the current position and keeps the release velocity"], "answer": 3, "explain": "User-driven gestures use springs that keep momentum and start from the current on-screen value."}, {"q": "A developer animates a sidebar's width and margin to collapse it. What is the better approach?", "options": ["Animate transform and opacity instead", "Add will-change to every element on the page", "Use transition: all for simplicity", "Animate box-shadow to suggest depth instead"], "answer": 0, "explain": "Animating width or margin re-lays out the page every frame; use scale and translate, and add will-change only after measuring a problem."}]}, {"id": "m08-l3", "title": "Content and microcopy rules", "neuron": "content-and-brand", "intro": "Interface copy is part of the interaction, not decoration added at the end. Plain, specific and consistent words carry people through a flow, and copy that is hard to write usually points to a design problem.", "points": [{"rule": "Write plain, specific copy in sentence case, with one term per concept.", "why": "Lead with the point, keep sentences around 20 words (GOV.UK caps at 25) and use common verbs such as Log in, Save, Delete. Users notice inconsistency first.", "kind": "default", "source": "GOV.UK; Nick DiLallo"}, {"rule": "If copy is hard to write, fix the flow before polishing the words.", "why": "Words that must explain the layout ('scroll right') mean the UI needs fixing. Fix the cause before writing a better error.", "kind": "principle", "source": "Adam Silver; Nick DiLallo"}, {"rule": "Name calls to action after what people can do, not the mechanism.", "why": "'Start training' converted where 'Follow friends' didn't, because it fitted people's story of the product. Nobody signs up as a life goal.", "kind": "default", "source": "Lichaw"}, {"rule": "Keep an action's name through the flow: Publish, Publishing, Published.", "why": "Not 'Success!'. Keep in-progress and done strings parallel, and use one vocabulary for moving through a flow: Continue or Next, never both.", "kind": "technique", "source": "Calvo; Krehel"}, {"rule": "Write status copy for partial and unavailable states, not just done and failed.", "why": "Partial results give both counts ('9 of 12 files uploaded. Retry 3 failed files'). Unavailable controls say why and what unlocks them, next to the control.", "kind": "technique", "source": "Krehel"}, {"rule": "In errors, name the field and the fix; don't suggest a retry that can't help.", "why": "Refer to a field by its name, never 'above' or 'in red'. Address the reader as 'you'; 'we' in errors reads as deflection.", "kind": "principle", "source": "Balise; Hall; Krehel"}, {"rule": "Make link text specific and meaningful out of context; never 'click here'.", "why": "Moran's 4 Ss: specific, sincere, substantial, then succinct. People mostly read the first two words, so front-load and avoid runs of 'Learn more'.", "kind": "principle", "source": "Moran, NN/g; Kalbag"}, {"rule": "Separate three empty states: nothing yet, no results, and failed to load.", "why": "Showing an empty state for a load error makes people think their data is gone. Name what is missing ('No projects yet') and offer a reset or broader search for no results.", "kind": "caution", "source": "Checklist Design"}, {"rule": "Drop 'your' and 'my' when ownership is obvious, and never mix them on one screen.", "why": "When needed, the system says 'your' and the user's own answers say 'my'. Most items need no pronoun ('Account', 'Photos').", "kind": "technique", "source": "Hall; Krehel"}, {"rule": "Audit copy by inventorying every string, including hidden states.", "why": "Errors, empty states, tooltips, confirmations and notifications are where the worst copy hides. Every finding comes with a rewrite, ranked Critical, Major or Minor.", "kind": "technique", "source": "Uxcel"}], "sourcesDiffer": ["Silyanova puts the reason before the request; Kendler puts the required action first; default: reason first when asking for information in a form, action first in alerts and instructions."], "tryIt": "Inventory every string in one flow, including errors, empty states and confirmations. Mark terms used inconsistently and rewrite the three worst strings.", "quiz": [{"q": "A file upload finishes with 3 of 12 files failing. Which message follows the lesson?", "options": ["Upload failed. Please try again.", "Success! Most files uploaded.", "Oops, something went wrong with a few files.", "9 of 12 files uploaded. Retry 3 failed files"], "answer": 3, "explain": "Partial states give counts for both outcomes and the next action."}, {"q": "A project list shows 'You have no projects yet' when the API times out. What is wrong?", "options": ["The message should use 'my' instead of 'you'", "A load error is shown as an empty state, so people may think their data is gone", "It needs an illustration", "It should be a toast"], "answer": 1, "explain": "Nothing yet, no results and failed to load are separate cases with separate copy."}, {"q": "A sign-up button reads 'Sign up'. Based on the lesson, what is the stronger rewrite for a fitness app?", "options": ["Start training", "Create account now", "Submit", "Join our community today!"], "answer": 0, "explain": "Calls to action name what people can do, not the mechanism."}]}, {"id": "m08-l4", "title": "Localisation and readability", "neuron": "content-and-brand", "intro": "Copy has to survive translation, other formats and readers who scan. Localisation is design work done early, and readability targets are set for the least confident reader, not the average one.", "points": [{"rule": "Allow 30–40% text expansion and never fix the width of text containers.", "why": "Expansion varies by language (German +30 to 40%, French and Spanish +15 to 20%, indicative), and short strings like buttons can need far more room. There is no universal figure; 30 to 40% is a useful test case.", "kind": "technique", "source": "Greer; Balise"}, {"rule": "Format dates, numbers, currency, lists and plurals with Intl; never concatenate strings.", "why": "Write each message whole with placeholders and ICU plural rules. Plurals need more than a count-of-one check.", "kind": "technique", "source": "Krehel"}, {"rule": "Test with a pseudo-locale and real plural cases: 0, 1, 2, the teens and decimals.", "why": "Accented, padded strings show clipping and concatenation early. Set copy length limits in the longest shipped locale.", "kind": "technique", "source": "Balise; Soparat"}, {"rule": "Label language switches in each language's own name, never with a flag.", "why": "Detect language from browser settings, never IP or GPS, and treat language, country and currency as separate settings.", "kind": "principle", "source": "Liu, NN/g"}, {"rule": "Bring localisation reviewers in after wireframes and before build.", "why": "They can flag text length, writing direction, date and currency formats and input differences. Support right-to-left by mirroring icons and navigation and testing both directions.", "kind": "technique", "source": "Maor, UX Magazine"}, {"rule": "Localise conventions beyond words: field labels, sign-in, trust and payment cues.", "why": "Unfamiliar address labels such as 'County' confused many Etsy members. Sign-in, preferred density, endorsements and payment methods all differ by market.", "kind": "principle", "source": "Liu, NN/g; Etsy; Maor"}, {"rule": "Write for a reading age of 9 for general audiences.", "why": "For high-stakes text, put the critical fact first and run a cloze test aiming for at least 60% correct.", "kind": "default", "source": "GOV.UK; Salminen"}, {"rule": "Write against the F-pattern: main points in the first two paragraphs.", "why": "Start headings with the two most informative words, bold key phrases and use lists. People skip list items that start with the same words, so vary the openings.", "kind": "evidence", "source": "Pernice, NN/g"}, {"rule": "Explain acronyms on first use, not just expand them.", "why": "Give the full phrase, what it means and why it matters, then the short form. Avoid jargon such as 'contrast ratio'; describe the effect instead ('Too faint').", "kind": "principle", "source": "Kaley, NN/g; Kalbag"}], "sourcesDiffer": ["Liu shows a flag beside each language name; brain says never a flag for language; default: language names in their own language, and flags only on a country or shipping selector beside the country name.", "Salminen aims for US grade 6–8; GOV.UK writes for a reading age of 9; default: GOV.UK's target, with grade 6–8 as an upper limit, not a goal."], "tryIt": "Run one screen through a padded pseudo-locale and the plural cases 0, 1, 2, 12 and 1.5. Fix every clipped label and hand-built string you find.", "quiz": [{"q": "A developer writes count + ' item' + (count === 1 ? '' : 's'). Why is this a problem?", "options": ["It is too verbose for English", "Plurals need more than a count-of-one check and strings shouldn't be concatenated; use ICU plural rules", "It should use a ternary for zero as well", "Numbers should be spelled out"], "answer": 1, "explain": "Write messages whole with placeholders and ICU plural rules, never hand-built plural strings."}, {"q": "Your site needs a language picker. Which design follows the lesson?", "options": ["A row of national flags", "Language chosen automatically from IP address with no switch", "One dropdown combining language, country and currency", "Each language named in its own language, with the default from browser settings"], "answer": 3, "explain": "Use language names in their own language, detect from browser settings, and keep language, country and currency separate."}, {"q": "A help article buries its key instruction in the fourth paragraph. What does the F-pattern guidance suggest?", "options": ["Put the main points in the first two paragraphs and front-load headings", "Add more paragraphs so readers scroll", "Make the whole article bold", "Move it into a tooltip"], "answer": 0, "explain": "Scanning readers focus on the start; main points go in the first two paragraphs and headings lead with informative words."}]}, {"id": "m08-l5", "title": "Voice and tone", "neuron": "voice-and-tone", "intro": "Voice is the constant personality; tone shifts with the moment. Good tone guidance is built from evidence, shown by example, and tested with people rather than assumed.", "points": [{"rule": "Keep the voice constant and shift tone by risk and system state.", "why": "Celebratory for success, calm for errors, serious for money. No humour in errors about money, health or security; playfulness belongs in low-risk moments like empty states.", "kind": "principle", "source": "Design brain; Uxcel"}, {"rule": "The more often a string appears, the plainer it should be.", "why": "Humour wears out with repetition, and frustrated people are irritated by a joke. Add frequency to the tone matrix.", "kind": "principle", "source": "Moran, NN/g"}, {"rule": "Place copy on four tone scales and move one at a time.", "why": "Formal to casual, serious to funny, respectful to irreverent, matter-of-fact to enthusiastic. Drafting variants one dimension at a time shows which shift changes the feel.", "kind": "technique", "source": "Moran, NN/g"}, {"rule": "Avoid the far ends of any tone scale for business content.", "why": "In a survey of 50 people, realistic tone changes moved friendliness and formality by only about 0.5–1 point on a 5-point scale. A playful tone lowered trust for an insurer in an A/B test.", "kind": "evidence", "source": "Moran, NN/g; Margolis"}, {"rule": "Write voice guidelines as a chart with 'we do', 'we don't' and an example.", "why": "Keep about five descriptors, each with a do-this-not-that example. The 'we don't' column does most of the work.", "kind": "technique", "source": "Katz; Haines"}, {"rule": "Build the voice from evidence, strongest first.", "why": "Copy that performed by the numbers, the founder's writing, how sales and support explain the product, customer reviews, and copy you'd never write. Treat a colleague's opinion as one data point, not a veto.", "kind": "technique", "source": "Haines; Katz"}, {"rule": "Blind-test the voice against a competitor's copy.", "why": "If someone who knows the brand can't tell which unlabelled draft is theirs, the attributes are too generic.", "kind": "technique", "source": "Haines"}, {"rule": "Keep a reason beside every word on the banned list.", "why": "A list without reasons gets ignored or over-applied. Each row says what to write instead, such as 'seamless', because we have edge cases and say so.", "kind": "technique", "source": "Haines; arla6ka"}, {"rule": "Test tone with people instead of assuming it lands.", "why": "Ask participants to pick words describing the copy and compare them to your target; 'snarky' when you aimed for 'humorous' means the copy is off.", "kind": "technique", "source": "Moran, NN/g"}, {"rule": "Use formatting sparingly, because it carries tone too.", "why": "Large text and uppercase read as louder, up to shouting; bold reads as stress. Heavy formatting leaves readers unsure what matters.", "kind": "caution", "source": "Shillcock"}], "sourcesDiffer": ["Brain's tone matrix plots risk against system state; Katz and Paavan plot fun to serious against concise to detailed; default: use risk and state to set how serious a moment is, then place it on the fun-serious and concise-detailed map so writers know how much to say.", "Coglode's Humor Effect says make it funny; brain and NN/g limit humour to low-risk, infrequent moments; default: humour in marketing and rare, low-stakes moments, never in errors or repeated strings."], "tryIt": "Take one error, one success and one empty-state message and place each on the four tone scales. Write a 'we do, we don't' row for the attribute that varies most.", "quiz": [{"q": "A banking app shows 'Whoops! Your payment bounced' on a declined card. What is the best fix?", "options": ["Add an emoji to soften it", "Keep it; humour reduces stress", "Use a calm, confident tone with no humour and say what to do next", "Make the error text uppercase so it is noticed"], "answer": 2, "explain": "Money errors are high-risk moments: no humour, calm and confident, with one clear action."}, {"q": "A playful loading line appears on every page load. Users find it irritating after a week. What principle explains this?", "options": ["Humour wears out with repetition; frequent strings should be plainer", "The joke was not funny enough", "Loading lines must always be serious", "Users dislike all personality in interfaces"], "answer": 0, "explain": "The more often a string appears, the plainer it should be."}, {"q": "A team's voice attributes are 'friendly, clear, helpful'. In a blind test, people can't tell your copy from a competitor's. What does this mean?", "options": ["The test was run wrongly", "The copy needs more exclamation marks", "Voice doesn't matter for product copy", "The attributes are too generic and need evidence-based, specific 'we don't' rules"], "answer": 3, "explain": "If people can't tell drafts apart, the attributes are too generic; the 'we don't' column defines the edges."}]}, {"id": "m08-l6", "title": "Writing quality and AI tells", "neuron": "writing-quality", "intro": "Good writing is specific, short where it can be and honest about what it knows. AI-writing tells are signals of generic, inflated prose; the fix is the concrete fact, and an editor subtracts and sharpens rather than inventing.", "points": [{"rule": "Draft real words before layout; never use LLM output or lorem ipsum as placeholder copy.", "why": "Placeholder text hides length, hierarchy and tone problems, and polished dummy copy gets reviewed as if real. Mark any placeholder clearly as not final.", "kind": "principle", "source": "Samsonov; Doshi; UX Myths"}, {"rule": "Omit needless words and turn nouns back into verbs.", "why": "'Owing to the fact that' becomes 'because'; 'make a decision' becomes 'decide'. Cut 'successfully', routine 'please' and weak intensifiers.", "kind": "technique", "source": "Strunk; Krehel"}, {"rule": "Treat AI tells as quality signals, never proof of authorship.", "why": "GPT detectors misclassified over half of essays by non-native English writers as AI-written. Autistic, ADHD and non-native writers are often wrongly flagged.", "kind": "evidence", "source": "Liang et al., Stanford"}, {"rule": "Act on clusters of tells, not single words.", "why": "Strong tells count once; weaker ones only when two or more share a paragraph or recur. A flagged word that is right in context stays.", "kind": "principle", "source": "avoid-ai-writing; humanizer-skill"}, {"rule": "Replace an inflated word with the fact, not a synonym.", "why": "'Robust' becomes '99.99% uptime over two years' if that is true. A thesaurus swap just creates the next tell.", "kind": "technique", "source": "Haines"}, {"rule": "State the positive claim instead of 'It's not X, it's Y'.", "why": "The binary contrast appears as countdowns, negation lists and clipped tails. Keep a contrast only when it corrects a belief the reader actually holds.", "kind": "caution", "source": "avoid-ai-writing; Haines"}, {"rule": "Delete empty significance clauses that the sentence survives without.", "why": "Trailing riders ('highlighting its commitment to') and meaning-telling ('this represents a broader shift') add nothing. If the sentence still works with the clause gone, delete it; otherwise name the consequence.", "kind": "caution", "source": "avoid-ai-writing; deslop"}, {"rule": "Run structure tests: shuffle, sentence load and competitor swap.", "why": "If paragraphs can swap with no loss, it's a list, not an argument. Every sentence must add a claim, number, name or decision. If a competitor could publish the line, it says nothing.", "kind": "technique", "source": "avoid-ai-writing; Haines"}, {"rule": "When editing, subtract and sharpen; never add facts the source lacks.", "why": "No invented anecdotes, numbers, names or quotes. Mark gaps as '[NEED: proof]' and ask; a fabricated specific is worse than an honest vague phrase.", "kind": "caution", "source": "avoid-ai-writing; slopbeth; Haines"}, {"rule": "In status reports, separate what changed from what was verified.", "why": "'Edited the token check; tests not run yet', never 'Fixed the bug'. Never report something as run or observed when it wasn't.", "kind": "principle", "source": "ehmo, slopgent"}], "sourcesDiffer": ["humanizer says remove patterns then add soul through opinion and first person; avoid-ai-writing forbids adding stance the author didn't write; default: voice comes from the author, and an editor subtracts and sharpens.", "stop-slop bans all adverbs, passive voice and three-item lists; Hall and Krehel keep passive where the actor doesn't matter and lists where content has that shape; default: signals to check, not bans.", "Hall spells out one to nine and limits contractions; GOV.UK uses numerals and encourages positive contractions; default: GOV.UK on both."], "tryIt": "Take one landing-page section or release note and run the competitor swap and sentence load tests. Replace every inflated adjective with a real fact, or mark it '[NEED: proof]'.", "quiz": [{"q": "A draft says 'Our robust, seamless platform empowers teams.' You know uptime was 99.99% over two years. What is the best edit?", "options": ["Swap 'robust' for 'sturdy' and 'seamless' for 'smooth'", "Replace the adjectives with the fact: 99.99% uptime over two years", "Add an invented customer quote for credibility", "Keep it; it reads professionally"], "answer": 1, "explain": "Swap the word for the fact, not a synonym, and never invent proof."}, {"q": "A tool flags a non-native colleague's report as likely AI-written. What should you conclude?", "options": ["The report must be rewritten from scratch", "The colleague should be asked to prove authorship", "Detectors are reliable once over 40 words", "Nothing about authorship; detectors misfire, especially for non-native writers"], "answer": 3, "explain": "Tells are quality signals, not proof; detectors misclassified over half of non-native writers' essays."}, {"q": "You are editing a case study that claims 'faster decisions' with no supporting data. What should you do?", "options": ["Ask what mechanism or metric supports it and mark the gap as needing proof", "Invent a plausible figure such as 47% faster", "Delete the whole case study", "Add 'now more than ever' to raise the stakes"], "answer": 0, "explain": "Editors subtract and sharpen: turn unsupported outcomes into questions and mark '[NEED: proof]' rather than fabricating."}]}]}, {"id": "m09", "title": "Brand and marketing design", "summary": "How to design honest marketing pages, positioning, landing and pricing pages, brand sites, logos and slide decks that build trust and convert.", "neurons": ["marketing-and-brand", "positioning", "landing-pages", "pricing", "brand-sites", "brand-surfaces", "logo-design", "presentations"], "lessons": [{"id": "m09-l1", "title": "Marketing pages and trust", "neuron": "marketing-and-brand", "intro": "Visitors decide in seconds whether a page is for them and whether the company is real. Clear value, real and attributed proof, and honest trust pages do more than polish or volume of claims.", "points": [{"rule": "Make the value proposition clear in five seconds, with one primary call to action and real proof beside it.", "why": "First impressions form almost instantly and people read only a small share of the copy. Proof next to the action answers doubt at the moment of decision; never fake it.", "kind": "principle", "source": "Uxcel"}, {"rule": "Run a five-second test: show the page, remove it, then ask what it does, who it is for and what to do next.", "why": "It shows quickly whether the first screen communicates at all, before any detailed review.", "kind": "technique", "source": "Klein"}, {"rule": "Pair every testimonial with a name, role and a face or logo, and link to the full case study.", "why": "Anonymous quotes read as fabricated. Specific, attributed proof beats generic praise, which matches credibility research.", "kind": "principle", "source": "SaaS Pages, NN/g"}, {"rule": "Show a rating as average plus count, with distribution, recency and filters by what matters.", "why": "A 5.0 from three reviews means little, and a few critical reviews make the rest more believable. Clickable distribution bars and a 'most helpful' default help people judge.", "kind": "technique", "source": ""}, {"rule": "Never suppress, invent or reward only positive reviews.", "why": "The UK DMCC Act 2024 bans fake reviews and concealed incentivised ones. An unbroken run of five-star reviews looks suspicious anyway.", "kind": "caution", "source": ""}, {"rule": "Answer questions where they arise; keep the FAQ for what is left, in users' own words.", "why": "A long FAQ is often a symptom. Draw questions from support tickets, search logs and sales calls, answer in the first sentence and give each its own anchor link.", "kind": "principle", "source": ""}, {"rule": "Back authority claims such as 'science-backed' or 'vetted' with a visible method or criteria.", "why": "Unexplained authority claims erode trust rather than build it.", "kind": "caution", "source": "McCarthy-Jones"}, {"rule": "Use a photo only when it shows something real; decorative stock gets ignored.", "why": "Eye-tracking work cited by UX Myths found people look at images that carry information and skip feel-good decoration, which can push key content out of sight.", "kind": "evidence", "source": "UX Myths, NN/g"}, {"rule": "Treat visual design as a credibility signal, not a substitute for a good product.", "why": "In the Stanford web credibility study, about 46% judged credibility partly on design (indicative). Poor looks lose people before they reach the content.", "kind": "evidence", "source": "Stanford, via UX Myths"}, {"rule": "Give B2B buyers a trust centre: certifications and what each covers, encryption in plain words, incident history and penetration test date.", "why": "Security buyers check these before buying; listing who can access customer data and how to report vulnerabilities answers their questions up front.", "kind": "technique", "source": "Checklist Design"}], "sourcesDiffer": ["Footers: SaaS Pages keeps the footer minimal; NN/g finds sitemap-style fat footers help people who reach the bottom without finding what they wanted. Default: choose by site size, not a blanket 'keep it simple'."], "tryIt": "Open your product's homepage in a private window as a first-time visitor. Run the five-second test on two outsiders, then list every proof element and mark whether it is real, attributed and placed next to a decision.", "quiz": [{"q": "A marketing page shows three quotes signed 'A happy customer'. What is the best fix?", "options": ["Add more quotes so volume compensates", "Add name, role and a face or company logo, linking to a case study", "Turn the quotes into a carousel to save space", "Replace them with a single five-star badge"], "answer": 1, "explain": "Anonymous quotes read as fabricated; attributed, specific proof is what builds credibility."}, {"q": "Your product page shows '5.0 stars' based on three reviews. What should you do?", "options": ["Hide the rating until it drops below 5.0", "Show only the stars without the count", "Show the average with the count, the distribution and recency", "Ask staff to add reviews to reach a credible count"], "answer": 2, "explain": "Average plus count and distribution lets people judge; a 5.0 from three reviews means little, and inventing reviews is banned."}, {"q": "The support team wants a 60-question FAQ. What does the lesson suggest first?", "options": ["Answer each question where it arises in the flow, and keep the FAQ for what is left", "Publish all 60 in the order they were written", "Put the FAQ behind a login so only customers see it", "Write the questions the company wishes people asked"], "answer": 0, "explain": "A long FAQ is often a symptom; answer in context and keep the FAQ for the remainder, in users' own words."}]}, {"id": "m09-l2", "title": "Positioning and messaging", "neuron": "positioning", "intro": "Positioning decides what you claim and who you are for; messaging says it so one buyer believes it. Weak claims at the top of the page seed every ad, email and deck downstream, so test them hard.", "points": [{"rule": "Run the swap test: a line still true with a competitor's name in it is a benefit, not a value proposition.", "why": "A real value proposition takes a position not everyone will agree with. When buyers can't tell options apart, they pick the familiar brand, then the cheaper one.", "kind": "technique", "source": "Reynolds, Demand Curve"}, {"rule": "Build the value proposition from the failures of the bad alternatives, not from taglines.", "why": "List competitors, spreadsheets, a junior hire or doing nothing, and what breaks in each. Keep the two or three claims that are true of you, hard to copy honestly and important to buyers.", "kind": "technique", "source": "Reynolds"}, {"rule": "Test whether a differentiator will last by asking what a competitor would need to answer it.", "why": "Proprietary data, earned trust, distribution, network effects and regulatory approval last; a feature or workflow doesn't. Build the brand on a moat and run campaigns on short-term edges.", "kind": "principle", "source": "Reynolds"}, {"rule": "Write for one role in one situation, and name the downstream consequence, not the surface annoyance.", "why": "If several roles could claim the copy, it speaks to none. Consequences such as missed launches carry urgency and budget.", "kind": "principle", "source": "Reynolds"}, {"rule": "Lead with functional benefits while the market doesn't yet understand what you sell.", "why": "Peloton's early line described the practical benefit; aspirational lines come once the product is understood.", "kind": "principle", "source": "Jackson, via Demand Curve"}, {"rule": "Position against a lasting problem, a 'monster', rather than a named competitor.", "why": "Rivals come and go; monsters last. Hinge's monster is endless swiping, Liquid Death's is plastic bottles.", "kind": "technique", "source": "Grenier and Morgan, via Demand Curve"}, {"rule": "Let category interest set how complex the message can be.", "why": "Interesting categories support nuance because buyers research them for fun. Boring ones (insurance, accounting, taxes) need a simple functional message, with personality as the differentiator.", "kind": "principle", "source": "Smith, via Demand Curve"}, {"rule": "Match the message to the buyer's awareness: problem, then category, then your solution, then why you.", "why": "Don't spend on people who don't have the problem. Name it for the unaware and send the product-aware straight to the product page.", "kind": "technique", "source": "Demand Curve"}, {"rule": "Keep taglines to about three to five words, one promise and an imperative verb.", "why": "Cut filler such as 'innovative'. Generate many, shortlist five to ten, test them in lock-ups and ads, and check outsiders can repeat it.", "kind": "technique", "source": "Templeton, Demand Curve"}, {"rule": "Use generic AI output as a map of clichés to avoid, and keep humans on positioning and voice.", "why": "AI-written positioning drifts to the category consensus. Covering the logos and reading only the copy shows whether you can tell competitors apart.", "kind": "caution", "source": "Roach; Setzer, Demand Curve"}], "sourcesDiffer": ["Positioning statements: Neumeier treats failing to complete his onlyness sentence truthfully as proof you haven't differentiated; Dunford calls fill-in-the-blank statements pointless and starts from best-fit customers and alternatives. Default: work through Dunford's steps, then use the onlyness sentence only as a final truth check.", "Identity calls to action: the source suggests testing 'Be a donor' against 'Donate now'. Default: buttons name the action or outcome; identity nouns suit headlines or a campaign test."], "tryIt": "Take your homepage headline and the closest competitor's, swap the names and see which claims still hold. Rewrite any that survive the swap from a specific failure of the bad alternative.", "quiz": [{"q": "Your headline reads 'Fast, secure, easy to use'. A competitor's homepage could say exactly the same. What does that tell you?", "options": ["It is a strong claim because it is widely accepted", "It is a category benefit, not a value proposition", "It should be shortened to a three-word tagline", "It needs an aspirational image beside it"], "answer": 1, "explain": "The swap test: a line still true with a rival's name in is true of the category, not a position."}, {"q": "You sell bookkeeping software, a category few people find interesting. Which message approach fits?", "options": ["A nuanced, values-led brand story", "Positioning as 'the Apple of accounting'", "Several messages for every role on one page", "A simple functional message with personality as the differentiator"], "answer": 3, "explain": "Boring categories need a simple functional message; lofty values and 'the Apple of X' don't work there."}, {"q": "Your main differentiator is a workflow feature. What does the durability test suggest?", "options": ["Use it for a campaign and start the next claim before competitors catch up", "Build the whole brand on it", "Hide it so competitors can't copy it", "Drop it because features never matter"], "answer": 0, "explain": "Features are easy to answer; run a campaign on a short-term edge and build the brand on a moat."}]}, {"id": "m09-l3", "title": "Landing pages that convert", "neuron": "landing-pages", "intro": "A landing page is judged against the traffic it gets and what those visitors already know. Match the page to the visitor's temperature, continue the ad's promise, and answer the questions buyers actually have.", "points": [{"rule": "Match the page to how warm the visitor is; never send cold traffic straight to a demo request.", "why": "First-touch traffic needs an overview page, shortlisters a comparison page, considerers a proof page, and only people who already know you a demo page.", "kind": "principle", "source": "Bober, via Unbounce"}, {"rule": "Continue the ad: the headline repeats the promise and wording that brought the visitor.", "why": "Message match keeps 'conversion scent'. An ad about one product lands on that product, not a general page. Poorly targeted ads cap conversion whatever the page does.", "kind": "principle", "source": "Unbounce"}, {"rule": "Read only the header: if you can't tell exactly what they sell, rewrite it.", "why": "No slogans. Name the bad alternative, say how you beat it, turn it into an action statement, then add one hook answering the biggest objection.", "kind": "technique", "source": "Shapiro, Demand Curve"}, {"rule": "Remove global navigation on a single-goal campaign page; keep in-page jump links and a small footer.", "why": "Every site link is an exit on a campaign page, but jump links and a footer with pricing, privacy and contact help without pulling people away.", "kind": "principle", "source": "Uxcel; Bober"}, {"rule": "Answer seven questions: what is it, is it for me, is it legit, who uses it, how much, where's help, what next.", "why": "Show the price early: expecting £50 a month and hearing £5,000 after a demo wastes everyone's time.", "kind": "technique", "source": "Demand Curve"}, {"rule": "Make every promise picturable, and only promise what you deliver.", "why": "'Inbox management' becomes 'an empty inbox before lunch'; 'best-in-class support' becomes 'a real person replies in under five minutes'.", "kind": "technique", "source": "Noble and Reynolds, Demand Curve"}, {"rule": "Show the inside of the product, and balance 'what is this?' visuals with 'what happens to me?' ones.", "why": "Teardowns marked decorative illustration down and real screenshots up. Most pages repeat mechanism shots and never show the outcome that creates desire.", "kind": "principle", "source": "Noble, Demand Curve"}, {"rule": "Offer a quieter, lower-commitment route beside a big ask such as a demo request.", "why": "A self-guided tour, recorded demo or guide serves people not ready to talk to sales, as a clearly secondary option.", "kind": "technique", "source": "Torrie, Unbounce"}, {"rule": "Write comparison pages as a guide: name your gaps and let the competitor win where it genuinely wins.", "why": "Buyers find gaps anyway, so naming them builds trust. Feature tables full of crosses read as cherry-picked; compare themes in words instead.", "kind": "principle", "source": "Bober"}, {"rule": "On mobile, cut rather than stack: incentive and form at the top, heavy video and scripts dropped.", "why": "Most landing-page visits are on phones (Unbounce: 83% in 2024; indicative), and too much copy becomes endless scrolling.", "kind": "caution", "source": "Unbounce"}], "sourcesDiffer": ["Navigation on campaign pages: Bober keeps anchor links and a slim footer, arguing dead ends hurt ad quality; Uxcel removes global navigation. Default: remove global site navigation on a single-goal page; in-page jump links and a small footer are fine.", "Multi-step forms: Unbounce says they typically beat one long form, but criticised a surprise second form. Default: start with the easiest, least sensitive question, show the number of steps, and label the first button as a step ('Continue'), never as if it finishes the job."], "tryIt": "Pick one paid campaign and put the ad beside its landing page. Check message match, then run the seven-questions check and note which questions the page fails to answer.", "quiz": [{"q": "A cold paid-social audience is being sent to a 'Book a demo' page and converting poorly. What should you change first?", "options": ["Shorten the demo form to one field", "Add a countdown timer", "Send them to an overview page and keep the demo page for warm visitors", "Add the full site navigation so they can explore"], "answer": 2, "explain": "Demo pages suit people who already know you; cold first-touch traffic needs an overview page."}, {"q": "Your headline is 'Supercharge your collaboration!'. What is wrong with it?", "options": ["It is too short", "It is a slogan; reading only the header, you can't tell what they sell", "It should be in all caps", "It names a bad alternative"], "answer": 1, "explain": "The header test asks whether the header alone says exactly what they sell; slogans fail it."}, {"q": "You are writing a page comparing your tool with a rival that has better reporting. What should the page do?", "options": ["Say where the rival's reporting is stronger and who it suits better", "Leave reporting out of the comparison", "Use a feature table with crosses against the rival", "Claim parity in every area"], "answer": 0, "explain": "Comparison pages work as a guide; naming your own gaps builds trust because buyers find them anyway."}]}, {"id": "m09-l4", "title": "Pricing pages", "neuron": "pricing", "intro": "A pricing page has to let someone pick a plan quickly and trust that the number is what they will pay. Honest totals, plans named for who they serve, and clear terms at limits and trial end matter more than clever anchoring.", "points": [{"rule": "Show the price people will actually pay, with tax and mandatory fees included, in the local currency.", "why": "Be exact about the unit ('per user per month'). For UK consumers, the CMA's guidance under the DMCC Act 2024 says the total must include mandatory fees, and drip pricing is banned.", "kind": "principle", "source": "CMA"}, {"rule": "Order plans cheapest to dearest, left to right; never preselect the dearest option without saying so.", "why": "Reversing the order to anchor high, hiding the monthly price or making cancelling harder than buying are dark patterns.", "kind": "default", "source": "Uxcel"}, {"rule": "Lead each plan with who it's for, named after that buyer, then the few features that differ.", "why": "Names such as 'Solo', 'Team' and 'Agency' help people choose faster than 'Standard' and 'Advanced'. Shared features belong in a grouped comparison table.", "kind": "technique", "source": "Uxcel"}, {"rule": "Write plan features as outcomes in the buyer's words, opening later plans with 'Everything in X, plus'.", "why": "'Manages 10,000+ customers' beats '10 GB storage'. Show about 4 to 6 features per plan, chosen by use case.", "kind": "technique", "source": "Figma RL"}, {"rule": "Say what happens at limits and when a trial ends: card needed or not, a reminder before charging.", "why": "Overages, throttling and upgrade prompts stated up front prevent surprise bills; usage pricing also needs running usage against the cap and a warning before the limit.", "kind": "principle", "source": ""}, {"rule": "Give enterprise plans a starting price or what drives the price, not only 'Contact sales'.", "why": "If every tier says 'Contact us', people and AI assistants can't shortlist you.", "kind": "principle", "source": "Haines"}, {"rule": "Test the number and order of plans rather than assuming three.", "why": "2 to 4 plans tend to work, but the plan-count and order tests seen were low-powered or insignificant (indicative).", "kind": "evidence", "source": "Uxcel; GoodUI"}, {"rule": "Price on a value metric: ask whether customers get more value as they use more of it.", "why": "Compare the usage of high-value and churned customers to find it. Cost to serve is a floor, not a basis.", "kind": "technique", "source": "Huryn; pricing-strategy skill"}, {"rule": "Never show different prices for the same thing at the same time.", "why": "Test price levels through sales conversations or separate landing pages instead of A/B testing one plan at two prices.", "kind": "caution", "source": ""}, {"rule": "Put prices in page text, not images, and run the paste test with a browsing AI assistant.", "why": "If the assistant gets the plans wrong, buyers who shortlist with AI will too. Prices in images also fail screen readers.", "kind": "technique", "source": "Haines"}], "sourcesDiffer": ["Price endings: Figma says whole numbers; Uxcel says charm prices suit value positioning. Default: round prices for B2B, premium and per-seat; charm prices only for consumer value products, one style per page.", "Annual discount size: Demand Curve suggests a large monthly-equivalent gap; Huryn says 15 to 20% is typical. Default: Huryn's range; a large gap only for low-retention products.", "Van Westendorp: it measures what people say, and 'how much would you pay?' is unreliable. Default: use it only to set a test range, then confirm with real commitment."], "tryIt": "Audit your pricing page in under 30 seconds as a new buyer: can you tell which plan is for you, the real total and what happens at the limit? Then paste the URL into an AI assistant and compare its answer with the page.", "quiz": [{"q": "Marketing wants to list plans dearest first, left to right, to anchor high. What should you say?", "options": ["Do it, anchoring is proven to work", "Do it only on mobile", "Do it but hide the monthly price", "Order cheapest to dearest; reversing to anchor high is a dark pattern"], "answer": 3, "explain": "The lesson orders plans cheapest to dearest and treats reverse anchoring as a dark pattern."}, {"q": "You want to know whether £20 or £25 per seat works better. Which approach fits the lesson?", "options": ["Show half of visitors £20 and half £25 for the same plan", "Test the levels through sales conversations or separate landing pages", "Ask users in a survey what they would pay and use the answer", "Pick the higher price and never revisit it"], "answer": 1, "explain": "Never show different prices for the same thing at once; stated willingness to pay only sets a test range."}, {"q": "Your enterprise column just says 'Contact sales'. What improves it most?", "options": ["Add a starting price or what drives the price", "Remove the column", "Make the button red", "Add a countdown to the end of the quarter"], "answer": 0, "explain": "Enterprise plans need a starting price or price drivers so buyers and AI assistants can shortlist."}]}, {"id": "m09-l5", "title": "Brand sites and surfaces", "neuron": "brand-sites", "intro": "Brand sites earn attention with one clear structural idea, media that shows the real subject, and decorative layers that never fight the content. Rich media and motifs need fallbacks, quiet text zones and accessible motion.", "points": [{"rule": "Name the page's structural concept as a noun phrase with a one-sentence reason, and don't mix in a second.", "why": "Options include an index manuscript, a staged object or the product's own interface as the hero. Pick from the client's central fact.", "kind": "technique", "source": "premium-web-design skill"}, {"rule": "Study at least five real sites, two from less famous editorial or cultural operators; borrow one move from each.", "why": "Note display face, body face, palette, structure and a signature move for each. Borrowing one thing from several avoids copying any one.", "kind": "technique", "source": ""}, {"rule": "Hero media must literally show the subject: a viewer names it in two seconds without a caption.", "why": "Poetic links fail, such as an Earth for a firm 'with global reach'. Choose the field and product first, then find media.", "kind": "principle", "source": ""}, {"rule": "Layer a fallback under rich media, and use a still image when it does the job.", "why": "A slow or failed load should still show something intentional. 3D earns its cost for product visualisation and configurators.", "kind": "technique", "source": ""}, {"rule": "Never fake proof in demo or concept sites; use visible placeholders or real data.", "why": "Fake customer logos 'marked as illustrative' and invented figures still read as proof.", "kind": "caution", "source": ""}, {"rule": "Stack decorative layers in a fixed order: ground, motif, pattern, content. Never apply them to product UI.", "why": "A layer never restyles the logo, cards, type or buttons. These values come from one brand review and are starting points, not tested standards.", "kind": "principle", "source": "brand-surfaces"}, {"rule": "Quieten motifs to about 10 to 25% under text, and measure contrast at the brightest frame.", "why": "Body text needs 4.5:1 and large display 3:1. Peak strength belongs behind the mark or empty space, and every motif fades towards the edges.", "kind": "default", "source": "brand-surfaces"}, {"rule": "Ship a dedicated dark artwork file instead of inverting with CSS filters.", "why": "Inversion turns accents muddy. Tinted imagery takes the palette's ground colour, not a fixed hue.", "kind": "caution", "source": "brand-surfaces"}, {"rule": "Keep marketing accents away from status colours: green, gold or amber, and red.", "why": "Otherwise decorative art can read as a success, warning or error state.", "kind": "caution", "source": "brand-surfaces"}, {"rule": "Keep brand motion slow and continuous, and off under reduced motion, showing a composed still frame.", "why": "No stepped jumps or animated grain. Cache static layers and redraw only what moves.", "kind": "default", "source": "brand-surfaces"}], "sourcesDiffer": ["Editorial form fields: the premium-web-design skill styles brand-site inputs as bottom-border-only with small monospace labels; brain keeps fields with a full visible boundary, since Google dropped underline-only fields after testing. Default: brain's."], "tryIt": "Take a brand hero you own and write its structural concept in one noun phrase. Then check the motif strength under the headline, the contrast at the brightest frame and what shows under reduced motion.", "quiz": [{"q": "A consultancy's hero shows a slowly spinning Earth to suggest 'global reach'. What is the issue?", "options": ["It should spin faster to feel energetic", "It needs a caption explaining the metaphor", "It is fine as long as it loads quickly", "Hero media must literally show the subject; a poetic link fails"], "answer": 3, "explain": "Viewers should name the subject in two seconds without a caption; an Earth for 'global reach' is a poetic link."}, {"q": "For a dark mode version of a hero illustration, a developer applies a CSS invert filter. What should you ask for?", "options": ["A dedicated dark file with a transparent ground and light linework", "A stronger invert value", "A grayscale filter as well", "Removing the illustration in dark mode"], "answer": 0, "explain": "Inverting with filters turns accents muddy; ship a dedicated dark file."}, {"q": "A designer wants the animated wave background used behind the settings screen of the product. What does the lesson say?", "options": ["Use it at full strength to strengthen the brand", "Use it only in dark mode", "Brand surface layers are for marketing and brand surfaces, never product UI", "Use it if it is tiled rather than stretched"], "answer": 2, "explain": "The layering rules apply to heroes, decks and campaign pages, and never to product UI."}]}, {"id": "m09-l6", "title": "Logo design craft", "neuron": "logo-design", "intro": "A logo identifi
